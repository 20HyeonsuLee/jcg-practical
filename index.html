표준 SQL에서 식별자(컬럼명)를 감싸는 기호다\n- 다른 형태도 정답 가능: 컬럼 목록을 쓴 형태와 생략한 형태 모두 정답. 두 형태 모두 sqlite에서 같은 행이 들어가는 것을 확인했다\n\nINSERT 묶음\n- 일부 컬럼만 넣으면 나머지는 DEFAULT 값, 없으면 NULL. NOT NULL 컬럼을 빠뜨리면 오류\n- 다른 테이블에서 가져올 때는 VALUES 대신 SELECT: `INSERT INTO 졸업생(학번, 이름) SELECT 학번, 이름 FROM 학생 WHERE 학년 = 4;` (sql-021)"},{"id":"sql-018","subject":"sql","topic":"JOIN","sub":"LEFT OUTER JOIN·GROUP BY·COUNT(컬럼)","type":"sql","level":3,"q":"다음 [부서], [직원] 테이블에서 부서명과 부서별 직원 수를 조회하는 SQL문을 \u003c조건>에 맞게 작성하시오.","box":"**부서**\n| 부서번호 | 부서명 |\n|---|---|\n| 1 | 영업 |\n| 2 | 개발 |\n| 3 | 인사 |\n| 4 | 총무 |\n\n**직원**\n| 직원번호 | 이름 | 부서번호 |\n|---|---|---|\n| 11 | 가온 | 2 |\n| 12 | 나린 | 1 |\n| 13 | 다인 | 2 |\n| 14 | 라온 | NULL |\n| 15 | 마노 | 1 |\n| 16 | 바름 | 2 |\n\n**결과**\n| 부서명 | 직원수 |\n|---|---|\n| 개발 | 3 |\n| 영업 | 2 |\n| 인사 | 0 |\n| 총무 | 0 |\n\n**조건**\n- 직원이 없는 부서도 직원수 0으로 나와야 한다\n- 부서는 D, 직원은 E로 별칭을 붙이고 `LEFT OUTER JOIN … ON`을 쓴다\n- 직원 수는 E.직원번호를 세고, `AS 직원수`로 별칭을 붙인다\n- GROUP BY는 D.부서명으로 한다 (부서명은 서로 다르다)\n- 직원 수가 많은 순, 같으면 부서명 오름차순으로 정렬한다","answers":[{"label":"답","accept":["SELECT D.부서명, COUNT(E.직원번호) AS 직원수 FROM 부서 D LEFT OUTER JOIN 직원 E ON D.부서번호 = E.부서번호 GROUP BY D.부서명 ORDER BY 직원수 DESC, D.부서명 ASC;","SELECT D.부서명, COUNT(E.직원번호) AS 직원수 FROM 부서 D LEFT OUTER JOIN 직원 E ON D.부서번호 = E.부서번호 GROUP BY D.부서명 ORDER BY 직원수 DESC, D.부서명;","SELECT D.부서명, COUNT(E.직원번호) AS 직원수 FROM 부서 D LEFT OUTER JOIN 직원 E ON E.부서번호 = D.부서번호 GROUP BY D.부서명 ORDER BY 직원수 DESC, D.부서명 ASC;","SELECT D.부서명, COUNT(E.직원번호) AS 직원수 FROM 부서 D LEFT OUTER JOIN 직원 E ON E.부서번호 = D.부서번호 GROUP BY D.부서명 ORDER BY 직원수 DESC, D.부서명;","SELECT D.부서명, COUNT(E.직원번호) AS 직원수 FROM 부서 D LEFT OUTER JOIN 직원 E ON D.부서번호 = E.부서번호 GROUP BY D.부서명 ORDER BY COUNT(E.직원번호) DESC, D.부서명 ASC;","SELECT D.부서명, COUNT(E.직원번호) AS 직원수 FROM 부서 D LEFT OUTER JOIN 직원 E ON D.부서번호 = E.부서번호 GROUP BY D.부서명 ORDER BY COUNT(E.직원번호) DESC, D.부서명;"]}],"hint":"직원이 없는 부서 행에서는 E 쪽 컬럼이 모두 NULL이다. 무엇을 세야 0이 나오는가","explain":"1. FROM 부서 D LEFT OUTER JOIN 직원 E: 부서 4행은 모두 남는다\n| 부서명 | 붙은 직원 |\n|---|---|\n| 영업 | 나린, 마노 |\n| 개발 | 가온, 다인, 바름 |\n| 인사 | (E 컬럼 NULL인 1행) |\n| 총무 | (E 컬럼 NULL인 1행) |\n- 라온(부서번호 NULL)은 어느 부서와도 짝이 없어 빠진다\n2. GROUP BY D.부서명 → COUNT(E.직원번호): 인사·총무는 NULL 한 행뿐이라 0\n3. ORDER BY 직원수 DESC, D.부서명 ASC → 개발 3, 영업 2, 인사 0, 총무 0\n- `COUNT(*)`를 쓰면 인사·총무가 1로 나온다 (NULL로 채워진 행도 한 행)\n- INNER JOIN을 쓰면 인사·총무가 아예 사라진다\n- **함정 요약**: 외부 조인 뒤 개수는 반대쪽 테이블의 NULL이 될 수 없는 컬럼(보통 PK)으로 센다\n- 다른 형태도 정답 가능: ON 조건의 좌우를 바꾼 것, ASC 생략, ORDER BY에 별칭 대신 `COUNT(E.직원번호)`나 위치 번호(`ORDER BY 2 DESC, 1`)를 쓴 것\n- sqlite에서 정답 형태들, COUNT(*) 형태, INNER JOIN 형태를 모두 실행해 비교했다\n\nORDER BY 묶음\n- 다중 정렬: 첫 키로 정렬하고, 같은 값끼리만 둘째 키로 정렬한다\n- ASC는 기본값이라 생략할 수 있다. 컬럼 위치 번호(`ORDER BY 2 DESC`)도 된다\n- SELECT 별칭(직원수)은 ORDER BY에서만 쓸 수 있다. WHERE·GROUP BY·HAVING은 SELECT보다 먼저 실행되므로 못 쓴다(표준 기준. MySQL·sqlite·Oracle 23ai처럼 GROUP BY·HAVING에서 별칭을 받아 주는 DBMS도 있지만 답안은 표준대로 쓴다)\n- 같은 조건의 작성형이 2020-4에 나왔다 (학과별 COUNT, GROUP BY·AS 필수)"},{"id":"sql-019","subject":"sql","topic":"JOIN","sub":"SELF JOIN","type":"sql","level":2,"q":"다음 [사원] 테이블에서 자기 관리자보다 급여가 많은 사원의 이름을 조회하는 SQL문을 \u003c조건>에 맞게 작성하시오.","box":"**사원**\n| 사번 | 이름 | 급여 | 관리자사번 |\n|---|---|---|---|\n| 1 | 한결 | 500 | NULL |\n| 2 | 보람 | 420 | 1 |\n| 3 | 새봄 | 450 | 2 |\n| 4 | 이슬 | 380 | 2 |\n| 5 | 다솜 | 520 | 1 |\n\n**결과**\n| 이름 |\n|---|\n| 새봄 |\n| 다솜 |\n\n**조건**\n- 관리자사번은 그 사원의 관리자 사번이다\n- 사원 쪽 별칭은 A, 관리자 쪽 별칭은 B로 한다\n- `JOIN … ON`으로 조인하고 급여 비교는 WHERE에 쓴다\n- 이름만 출력한다\n- 결과 행의 순서는 상관없다","answers":[{"label":"답","accept":["SELECT A.이름 FROM 사원 A JOIN 사원 B ON A.관리자사번 = B.사번 WHERE A.급여 > B.급여;","SELECT A.이름 FROM 사원 A INNER JOIN 사원 B ON A.관리자사번 = B.사번 WHERE A.급여 > B.급여;","SELECT A.이름 FROM 사원 A JOIN 사원 B ON B.사번 = A.관리자사번 WHERE A.급여 > B.급여;","SELECT A.이름 FROM 사원 A INNER JOIN 사원 B ON B.사번 = A.관리자사번 WHERE A.급여 > B.급여;","SELECT A.이름 FROM 사원 A JOIN 사원 B ON A.관리자사번 = B.사번 WHERE B.급여 \u003c A.급여;"]}],"hint":"같은 테이블을 FROM에 두 번 놓고 한쪽을 관리자로 본다","explain":"- `A.관리자사번 = B.사번`으로 붙이면 사원 A 옆에 그 관리자 B가 붙는다\n| A(사원) | A.급여 | B(관리자) | B.급여 | A.급여 > B.급여 |\n|---|---|---|---|---|\n| 보람 | 420 | 한결 | 500 | X |\n| 새봄 | 450 | 보람 | 420 | O |\n| 이슬 | 380 | 보람 | 420 | X |\n| 다솜 | 520 | 한결 | 500 | O |\n- 한결은 관리자사번이 NULL이라 짝이 없어 빠진다 (LEFT JOIN이면 B 쪽이 NULL로 남는다)\n- 조인 방향을 `A.사번 = B.관리자사번`으로 뒤집으면 A가 관리자 쪽이 되어 뜻이 바뀐다\n- **함정 요약**: 셀프 조인은 별칭으로 역할을 나누고, ON 조건의 방향으로 누가 누구의 관리자인지 정한다\n- 다른 형태도 정답 가능: INNER를 붙인 `INNER JOIN`, ON 조건의 좌우를 바꾼 `B.사번 = A.관리자사번`, 비교를 뒤집은 `B.급여 \u003c A.급여`\n- 결과는 같지만 \u003c조건>에 어긋나는 형태: `FROM 사원 A, 사원 B WHERE …`(JOIN … ON 미사용), 급여 비교를 `ON … AND A.급여 > B.급여`로 ON에 붙인 것 (sqlite로 모두 실행해 결과가 같음을 확인)\n- 셀프 조인은 계층 구조(사원-관리자, 카테고리-상위 카테고리)를 한 테이블에 둘 때 쓴다"},{"id":"sql-020","subject":"sql","topic":"서브쿼리","sub":"NOT EXISTS·NOT IN과 NULL","type":"sql","level":2,"q":"다음 [고객], [주문] 테이블에서 주문이 한 건도 없는 고객의 이름을 조회하는 SQL문을 \u003c조건>에 맞게 작성하시오.","box":"**고객**\n| 고객번호 | 이름 |\n|---|---|\n| 1 | 하나 |\n| 2 | 두리 |\n| 3 | 세나 |\n| 4 | 네오 |\n\n**주문**\n| 주문번호 | 고객번호 | 금액 |\n|---|---|---|\n| 101 | 1 | 3000 |\n| 102 | 3 | 5000 |\n| 103 | 1 | 2000 |\n| 104 | NULL | 1000 |\n\n**결과**\n| 이름 |\n|---|\n| 두리 |\n| 네오 |\n\n**조건**\n- 고객은 C, 주문은 O로 별칭을 붙인다\n- NOT EXISTS와 상관 서브쿼리를 쓴다. 서브쿼리의 SELECT 목록은 `*`로 한다","answers":[{"label":"답","accept":["SELECT C.이름 FROM 고객 C WHERE NOT EXISTS (SELECT * FROM 주문 O WHERE O.고객번호 = C.고객번호);","SELECT C.이름 FROM 고객 C WHERE NOT EXISTS (SELECT * FROM 주문 O WHERE C.고객번호 = O.고객번호);","SELECT 이름 FROM 고객 C WHERE NOT EXISTS (SELECT * FROM 주문 O WHERE O.고객번호 = C.고객번호);","SELECT 이름 FROM 고객 C WHERE NOT EXISTS (SELECT * FROM 주문 O WHERE C.고객번호 = O.고객번호);"]}],"hint":"고객 행마다 그 고객번호로 된 주문이 있는지를 안쪽에서 확인한다","explain":"고객 행마다 서브쿼리를 실행한다.\n| 고객 | 같은 고객번호의 주문 | EXISTS | NOT EXISTS |\n|---|---|---|---|\n| 1 하나 | 101, 103 | T | F |\n| 2 두리 | 없음 | F | **T** |\n| 3 세나 | 102 | T | F |\n| 4 네오 | 없음 | F | **T** |\n- 결과: 두리, 네오\n- 다른 형태도 정답 가능: 서브쿼리 비교식의 좌우를 바꾼 것, 바깥 SELECT의 `C.`를 뺀 것\n\nNOT IN으로 쓰면 생기는 함정\n- `SELECT 이름 FROM 고객 WHERE 고객번호 NOT IN (SELECT 고객번호 FROM 주문);` → **0행**\n- 주문 104의 고객번호가 NULL이다. NOT IN은 `\u003c> 1 AND \u003c> 3 AND \u003c> 1 AND \u003c> NULL`이라 마지막 비교가 UNKNOWN이 되어 어떤 행도 참이 되지 못한다\n- 서브쿼리에 `WHERE 고객번호 IS NOT NULL`을 붙이면 두리, 네오가 나온다\n- LEFT JOIN으로도 된다: `SELECT C.이름 FROM 고객 C LEFT OUTER JOIN 주문 O ON C.고객번호 = O.고객번호 WHERE O.주문번호 IS NULL;`\n- **함정 요약**: EXISTS는 행이 있는지만 본다(SELECT 목록 무관, NULL 영향 없음). NOT IN은 목록에 NULL이 하나라도 있으면 결과가 비게 된다\n- sqlite로 NOT EXISTS, NOT IN, NOT IN + IS NOT NULL 세 형태를 실행해 확인했다"},{"id":"sql-021","subject":"sql","topic":"DML","sub":"INSERT·INSERT SELECT·UPDATE 키워드","type":"blank","past":"2024-2","level":3,"q":"다음은 [사원] 테이블에 행을 넣고, 그 행을 [동아리] 테이블에 복사하고, 사원 전체를 조회한 뒤 부서를 '퇴사'로 바꾸는 SQL이다. ①~④에 들어갈 키워드를 쓰시오.","box":"- 사원(사번 PK, 이름, 지역, 부서)\n- 동아리(사번 PK, 이름, 지역, 나이)","code":{"lang":"sql","src":"INSERT INTO 사원 (사번, 이름, 지역, 부서) ( ① ) (52107, '나실기', '부산', '기획');\n\nINSERT INTO 동아리 (사번, 이름, 지역, 나이)\n( ② ) 사번, 이름, 지역, 27 FROM 사원 WHERE 이름 = '나실기';\n\nSELECT * ( ③ ) 사원;\n\nUPDATE 사원 ( ④ ) 부서 = '퇴사' WHERE 사번 = 52107;"},"answers":[{"label":"①","accept":["VALUES"]},{"label":"②","accept":["SELECT"]},{"label":"③","accept":["FROM"]},{"label":"④","accept":["SET"]}],"hint":"두 번째 문장은 값을 직접 쓰지 않고 다른 테이블의 조회 결과를 넣는다","explain":"- ① VALUES: 값을 직접 넣는다\n- ② SELECT: INSERT … SELECT. VALUES 없이 조회 결과 행을 그대로 넣는다. 27처럼 상수를 섞어도 되고, 컬럼 수와 순서가 INSERT 컬럼 목록과 맞아야 한다\n- ③ FROM\n- ④ SET: `UPDATE 테이블 SET 컬럼 = 값 [, 컬럼 = 값] WHERE 조건`\n- **함정 요약**: INSERT … SELECT에는 VALUES를 쓰지 않고 SELECT를 바로 붙인다. SELECT를 괄호로 감싸면 오류를 내는 DBMS가 있다(sqlite는 오류, Oracle은 허용)\n- 빈칸을 채워 sqlite로 실행: 사원 (52107, 나실기, 부산, 퇴사), 동아리 (52107, 나실기, 부산, 27)\n\nDML 키워드 짝: INSERT INTO – VALUES, UPDATE – SET, DELETE FROM – WHERE, SELECT – FROM"},{"id":"sql-022","subject":"sql","topic":"DDL","sub":"외래키 제약 정의","type":"blank","past":"2026-1","level":3,"q":"다음은 MEMBER 테이블을 만드는 SQL이다. \u003c조건>에 맞게 ①~⑤에 들어갈 내용을 쓰시오.","box":"**조건**\n- 외래키 제약의 이름은 CLUB_FK이다\n- MEMBER의 CLUB_CODE가 CLUB 테이블의 CLUB_NO를 참조한다","code":{"lang":"sql","src":"CREATE TABLE MEMBER (\n    MEMBER_ID   CHAR(8)      NOT NULL,\n    MEMBER_NAME VARCHAR2(20) NOT NULL,\n    CLUB_CODE   CHAR(4)      NOT NULL,\n    PRIMARY KEY (MEMBER_ID),\n    ( ① ) CLUB_FK ( ② ) KEY ( ③ )\n    ( ④ ) CLUB ( ⑤ )\n);"},"answers":[{"label":"①","accept":["CONSTRAINT"]},{"label":"②","accept":["FOREIGN"]},{"label":"③","accept":["CLUB_CODE"]},{"label":"④","accept":["REFERENCES"]},{"label":"⑤","accept":["CLUB_NO"]}],"hint":"제약에 이름을 붙이는 키워드로 시작하고, 참조 대상 앞 키워드는 복수형이다","explain":"- 형식: `[CONSTRAINT 제약명] FOREIGN KEY (자식 컬럼) REFERENCES 부모테이블 (부모 컬럼) [ON DELETE 옵션] [ON UPDATE 옵션]`\n- 참조되는 CLUB_NO는 CLUB의 PRIMARY KEY나 UNIQUE여야 한다\n- 컬럼 옆에 바로 쓰는 형태도 있다: `CLUB_CODE CHAR(4) REFERENCES CLUB(CLUB_NO)`\n- **함정 요약**: ③은 자기 테이블 컬럼(CLUB_CODE), ⑤는 부모 테이블 컬럼(CLUB_NO)이다. REFERENCES 끝의 S를 빠뜨리지 않는다\n- 빈칸을 채워 sqlite로 만들고, CLUB에 없는 코드를 넣으면 `FOREIGN KEY constraint failed`가 나는 것을 확인했다\n\n제약조건 묶음\n| 제약 | 뜻 |\n|---|---|\n| PRIMARY KEY | NOT NULL + UNIQUE, 테이블에 하나 (개체 무결성) |\n| FOREIGN KEY | 부모 테이블에 있는 값이나 NULL만 허용 (참조 무결성) |\n| UNIQUE | 중복 불가, NULL 허용 |\n| NOT NULL | NULL 불가 |\n| CHECK | 조건식을 만족하는 값만 허용 (도메인 무결성) |\n| DEFAULT | 값을 안 주면 넣는 기본값 |"},{"id":"sql-023","subject":"sql","topic":"SELECT 기본","sub":"LIKE·ORDER BY DESC","type":"blank","past":"2026-2","level":3,"q":"다음 [직원] 테이블에서 이름이 '김'으로 시작하는 직원을 이름 내림차순으로 조회해 \u003c결과>를 얻으려 한다. ①, ②에 들어갈 내용을 쓰시오.","box":"**직원**\n| 이름 | 부서 | 연봉 |\n|---|---|---|\n| 김하준 | 영업 | 4200 |\n| 이도윤 | 개발 | 5100 |\n| 김서아 | 개발 | 4800 |\n| 박지민 | 인사 | 3900 |\n| 김민서 | 영업 | 4500 |\n\n**결과**\n| 이름 | 부서 | 연봉 |\n|---|---|---|\n| 김하준 | 영업 | 4200 |\n| 김서아 | 개발 | 4800 |\n| 김민서 | 영업 | 4500 |","code":{"lang":"sql","src":"SELECT *\nFROM 직원\nWHERE 이름 LIKE '( ① )'\nORDER BY 이름 ( ② );"},"answers":[{"label":"①","accept":["김%"]},{"label":"②","accept":["DESC"]}],"hint":"글자 수와 상관없이 뒤를 받아 주는 와일드카드, 그리고 오름차순의 반대","explain":"- ① `'김%'`: 김으로 시작하고 뒤는 0글자 이상. `'김_'`는 두 글자 이름만, `'%김%'`는 김이 중간에 있어도 걸린다\n- ② DESC: 내림차순. ASC(오름차순)는 기본값\n- 한글은 가나다순: 김민서 \u003c 김서아 \u003c 김하준 → DESC면 김하준, 김서아, 김민서 (sqlite 확인)\n- **함정 요약**: 패턴은 LIKE와 써야 동작한다. `이름 = '김%'`은 글자 그대로 '김%'인 값만 찾는다\n- 같은 형태가 2021-2에도 나왔다 ('이%', DESC)\n\n정렬 묶음\n- `ORDER BY 컬럼 [ASC | DESC], …`\n- NULL 위치: Oracle은 ASC에서 맨 뒤(가장 큰 값 취급), sqlite·MySQL은 맨 앞"},{"id":"sql-024","subject":"sql","topic":"서브쿼리","sub":"다중행 비교 ALL·ANY","type":"blank","past":"2022-2","level":3,"q":"다음 [제품] 테이블에서 \u003c조건>에 맞는 제품명을 조회하려 한다. ①, ②에 들어갈 키워드를 쓰시오.","box":"**제품**\n| 제조사 | 제품명 | 단가 |\n|---|---|---|\n| A | 쿠키 | 1500 |\n| B | 젤리 | 4500 |\n| H | 캔디 | 2000 |\n| C | 케이크 | 7000 |\n| H | 푸딩 | 3500 |\n| D | 라떼 | 3000 |\n\n**조건**\n- ①: 제조사 'H'의 모든 제품보다 단가가 높은 제품 → 결과: 젤리, 케이크\n- ②: 제조사 'H'의 제품 중 어느 하나보다라도 단가가 높은 제품 → 결과: 젤리, 케이크, 푸딩, 라떼","code":{"lang":"sql","src":"-- ①\nSELECT 제품명 FROM 제품\nWHERE 단가 > ( ① ) (SELECT 단가 FROM 제품 WHERE 제조사 = 'H');\n\n-- ②\nSELECT 제품명 FROM 제품\nWHERE 단가 > ( ② ) (SELECT 단가 FROM 제품 WHERE 제조사 = 'H');"},"answers":[{"label":"①","accept":["ALL"]},{"label":"②","accept":["ANY","SOME"]}],"hint":"서브쿼리 결과는 2000, 3500 두 값이다. 둘 다 넘어야 하는가, 하나만 넘으면 되는가","explain":"- 서브쿼리: H 제품 단가 → 2000, 3500\n- ① `> ALL (2000, 3500)` = 둘 다보다 큼 = `> MAX` = 3500 초과 → 젤리 4500, 케이크 7000\n- ② `> ANY (2000, 3500)` = 하나보다라도 큼 = `> MIN` = 2000 초과 → 젤리, 케이크, 푸딩 3500, 라떼 3000. 캔디 2000은 같아서 탈락\n- **함정 요약**: 여러 행이 나오는 서브쿼리 앞에 `>`만 쓰면 오류다. ALL은 MAX, ANY는 MIN과 비교한다고 바꿔 생각한다\n- 2022-2 기출은 ① ALL 하나만 물었다\n- sqlite는 ALL·ANY를 지원하지 않아 `> (SELECT MAX…)`, `> (SELECT MIN…)`과 EXISTS 형태로 바꿔 결과를 확인했다\n\n| 표현 | 같은 뜻 |\n|---|---|\n| > ALL | > MAX |\n| \u003c ALL | \u003c MIN |\n| > ANY | > MIN |\n| \u003c ANY | \u003c MAX |\n| = ANY | IN |\n| \u003c> ALL | NOT IN |\n- SOME은 ANY와 같다"},{"id":"sql-025","subject":"sql","topic":"DDL","sub":"DROP CASCADE·RESTRICT·뷰","type":"blank","past":"2023-2","level":3,"q":"다음 \u003c조건>에 맞게 뷰를 삭제하는 SQL문의 ①, ②에 들어갈 옵션을 쓰시오.","box":"**조건**\n- ① 우수생 뷰를 삭제하면서, 이 뷰를 참조하는 다른 뷰나 제약 조건도 함께 삭제한다\n- ② 장학생 뷰를 다른 객체가 참조하고 있으면 삭제를 거부한다","code":{"lang":"sql","src":"DROP VIEW 우수생 ( ① );\nDROP VIEW 장학생 ( ② );"},"answers":[{"label":"①","accept":["CASCADE"]},{"label":"②","accept":["RESTRICT"]}],"hint":"폭포처럼 연쇄되는 쪽과 제한하는 쪽","explain":"- CASCADE: 삭제 대상을 참조하는 객체까지 연쇄 삭제\n- RESTRICT: 참조하는 객체가 있으면 거부, 없을 때만 삭제\n- 같은 옵션을 DROP TABLE, DROP SCHEMA, DROP DOMAIN, REVOKE에도 쓴다\n- Oracle은 `DROP TABLE 학생 CASCADE CONSTRAINTS;` 형태다. 시험은 표준 SQL 기준\n- **함정 요약**: 외래키의 `ON DELETE CASCADE`(부모 행 삭제 → 자식 행 삭제)와 `DROP … CASCADE`(객체 삭제 → 참조 객체 삭제)는 대상이 다르다\n- 2023-2 기출은 ① CASCADE 하나만 물었다\n- sqlite는 DROP VIEW에 CASCADE·RESTRICT가 없어 실행 검증은 하지 않았다\n\n뷰(VIEW) 특징\n- 기본 테이블에서 유도한 가상 테이블. 정의만 저장되고 데이터는 따로 저장하지 않는다\n- ALTER VIEW로 정의를 바꿀 수 없다 → DROP 후 다시 CREATE (Oracle은 `CREATE OR REPLACE VIEW`)\n- 뷰에는 인덱스를 만들 수 없다\n- 기본 테이블이나 바탕이 된 뷰를 지우면 그 위에 정의한 뷰도 쓸 수 없게 된다\n- 장점: 논리적 독립성, 보안(필요한 컬럼만 노출), 복잡한 쿼리 단순화. 단점: 삽입·삭제·갱신에 제약이 있다"},{"id":"sql-026","subject":"sql","topic":"DDL","sub":"CREATE DOMAIN","type":"blank","past":"2026-2","level":3,"q":"다음은 성적 등급 값의 범위를 정하는 도메인을 만드는 SQL이다. \u003c조건>에 맞게 ①, ②에 들어갈 키워드를 쓰시오.","box":"**조건**\n- 값을 주지 않으면 'C'가 들어간다\n- 값은 'A', 'B', 'C', 'D', 'F' 중 하나만 허용한다","code":{"lang":"sql","src":"CREATE DOMAIN GRADE AS CHAR(1)\n    ( ① ) 'C'\n    CONSTRAINT VALID_GRADE ( ② ) (VALUE IN ('A', 'B', 'C', 'D', 'F'));"},"answers":[{"label":"①","accept":["DEFAULT"]},{"label":"②","accept":["CHECK"]}],"hint":"기본값을 정하는 키워드, 그리고 조건식을 검사하는 제약 키워드","explain":"- 형식: `CREATE DOMAIN 도메인명 [AS] 데이터타입 [DEFAULT 기본값] [CONSTRAINT 제약명 CHECK (조건)];`\n- VALUE는 이 도메인에 들어오는 값을 가리킨다\n- 만든 도메인은 컬럼 타입처럼 쓴다: `등급 GRADE`\n- 도메인: 한 속성이 가질 수 있는 원자값들의 집합\n- **함정 요약**: 값의 범위를 막는 것은 CHECK다. DEFAULT는 값을 안 줬을 때만 동작하고 잘못된 값을 막지 않는다\n- 2026-2 기출은 계절(SEASON) 도메인에 CHECK 하나를 물었다. 여기서는 DEFAULT를 더했다\n- 삭제: `DROP DOMAIN GRADE [CASCADE | RESTRICT];`\n- 시험은 표준 SQL 문법 기준이다. sqlite·MySQL에는 CREATE DOMAIN이 없다(PostgreSQL은 있고, Oracle은 23ai부터 자체 확장 문법으로 지원). sqlite에서는 같은 DEFAULT·CHECK를 컬럼 제약으로 옮겨, 값을 생략하면 'C'가 들어가고 'E'는 거부되는 것만 확인했다"},{"id":"sql-027","subject":"sql","topic":"DDL","sub":"CREATE TABLE 제약조건","type":"blank","level":3,"q":"다음은 [수강] 테이블을 만드는 SQL이다. \u003c조건>에 맞게 ①~⑤에 들어갈 내용을 쓰시오.","box":"**조건**\n- ① 점수는 0 이상 100 이하만 허용한다\n- ② 등록일을 넣지 않으면 오늘 날짜가 들어간다\n- ③ 좌석번호는 다른 행과 겹칠 수 없지만 비워 둘 수는 있다\n- ④ 학생이 삭제되면 그 학생의 수강 행도 함께 삭제된다\n- ⑤ 교수가 삭제되면 수강 행은 남기고 교수번호만 비운다","code":{"lang":"sql","src":"CREATE TABLE 수강 (\n    학번     CHAR(8),\n    과목코드 CHAR(5),\n    점수     INT  ( ① ) (점수 BETWEEN 0 AND 100),\n    등록일   DATE ( ② ) CURRENT_DATE,\n    좌석번호 INT  ( ③ ),\n    교수번호 INT,\n    PRIMARY KEY (학번, 과목코드),\n    FOREIGN KEY (학번) REFERENCES 학생(학번) ON DELETE ( ④ ),\n    FOREIGN KEY (교수번호) REFERENCES 교수(교수번호) ON DELETE ( ⑤ )\n);"},"answers":[{"label":"①","accept":["CHECK"]},{"label":"②","accept":["DEFAULT"]},{"label":"③","accept":["UNIQUE"]},{"label":"④","accept":["CASCADE"]},{"label":"⑤","accept":["SET NULL"]}],"hint":"③은 PRIMARY KEY와 달리 NULL을 허용하는 제약이다","explain":"- ① CHECK: 조건식이 거짓인 값은 거부한다\n- ② DEFAULT: 값을 생략했을 때 넣을 값. Oracle에서는 SYSDATE를 자주 쓴다\n- ③ UNIQUE: 중복 불가, NULL은 여러 개 허용. PRIMARY KEY는 NULL도 불가\n- ④ CASCADE, ⑤ SET NULL: 참조 동작 (sql-012 표)\n- `PRIMARY KEY (학번, 과목코드)`: 두 컬럼 조합이 기본키(복합키)다. 두 컬럼 모두 NOT NULL이 된다\n- **함정 요약**: ⑤는 두 단어 `SET NULL`이다. NULL만 쓰면 틀린다\n- 빈칸을 채워 sqlite로 확인: 점수 101 거부, 좌석번호 중복 거부, 등록일 자동 입력, 학생 S1 삭제 → 수강 2행 삭제, 교수 7 삭제 → 교수번호 NULL\n\n제약 쓰는 위치\n- 컬럼 제약: 컬럼 정의 바로 뒤. `점수 INT CHECK (…)`, `이름 VARCHAR(20) NOT NULL`\n- 테이블 제약: 컬럼을 다 쓴 뒤. 복합키, 이름 붙인 제약(`CONSTRAINT 이름 …`)은 이쪽\n- NOT NULL은 컬럼 제약으로만 쓴다\n- 나중에 추가: `ALTER TABLE 수강 ADD CONSTRAINT 점수_CK CHECK (점수 >= 0);`"},{"id":"sql-028","subject":"sql","topic":"DCL","sub":"GRANT·REVOKE","type":"blank","level":2,"q":"다음 \u003c조건>에 맞게 권한을 주고 회수하는 SQL의 ①~⑤에 들어갈 키워드를 쓰시오.","box":"**조건**\n- 사용자 kim에게 학생 테이블의 SELECT, UPDATE 권한을 주고, kim이 이 권한을 다른 사용자에게 다시 줄 수 있게 한다\n- 그 뒤 kim에게서 UPDATE 권한을 회수하면서, kim이 다른 사용자에게 준 UPDATE 권한도 함께 회수한다","code":{"lang":"sql","src":"GRANT SELECT, UPDATE ( ① ) 학생 ( ② ) kim ( ③ );\n\nREVOKE UPDATE ON 학생 ( ④ ) kim ( ⑤ );"},"answers":[{"label":"①","accept":["ON"]},{"label":"②","accept":["TO"]},{"label":"③","accept":["WITH GRANT OPTION"]},{"label":"④","accept":["FROM"]},{"label":"⑤","accept":["CASCADE"]}],"hint":"GRANT와 REVOKE는 사용자 이름 앞에 오는 전치사가 서로 다르다. ③은 세 단어","explain":"- `GRANT 권한 ON 객체 TO 사용자 [WITH GRANT OPTION];`\n- `REVOKE [GRANT OPTION FOR] 권한 ON 객체 FROM 사용자 [CASCADE | RESTRICT];`\n- WITH GRANT OPTION: 받은 권한을 남에게 다시 줄 수 있다\n- REVOKE … CASCADE: 그 사용자가 남에게 준 권한까지 연쇄 회수. RESTRICT는 그런 권한이 있으면 회수를 거부\n- GRANT OPTION FOR: 권한은 남기고 다시 줄 수 있는 권리만 회수\n- **함정 요약**: GRANT는 TO, REVOKE는 FROM. 둘을 바꿔 쓰면 틀린다\n\n- 권한 종류: SELECT, INSERT, UPDATE, DELETE, ALTER, INDEX, REFERENCES, ALL. 모든 사용자에게 줄 때는 `TO PUBLIC`\n- 역할(ROLE): `CREATE ROLE 조교; GRANT SELECT ON 학생 TO 조교; GRANT 조교 TO kim;`\n- 시스템 권한(Oracle)은 `WITH ADMIN OPTION`, 객체 권한은 `WITH GRANT OPTION`\n- Oracle은 객체 권한을 REVOKE하면 남에게 준 권한도 자동으로 연쇄 회수되고 CASCADE를 쓰지 않는다(CASCADE CONSTRAINTS는 REFERENCES 권한용). 시험은 표준 SQL 기준\n- sqlite에는 권한 기능이 없어 실행 검증은 하지 않았다"},{"id":"sql-029","subject":"sql","topic":"DDL","sub":"ALTER TABLE·INDEX·VIEW·TRIGGER","type":"blank","past":"2020-3","level":2,"q":"다음 \u003c조건>에 맞게 ①~⑥에 들어갈 키워드를 쓰시오.","box":"**조건**\n- ① 학생 테이블에 주소 컬럼을 추가한다\n- ② 주소 컬럼의 길이를 80으로 바꾼다 (Oracle 문법)\n- ③ 주소 컬럼을 삭제한다\n- ④ 이름 컬럼에 IDX_NAME 인덱스를 만든다\n- ⑤ 평점 4.0 이상인 학생만 보여 주는 뷰를 만든다\n- ⑥ 학생 테이블에 행이 들어올 때마다 로그 테이블에 자동으로 기록을 남기는 객체를 만든다","code":{"lang":"sql","src":"ALTER TABLE 학생 ( ① ) 주소 VARCHAR(40);\nALTER TABLE 학생 ( ② ) 주소 VARCHAR(80);\nALTER TABLE 학생 ( ③ ) COLUMN 주소;\n\nCREATE ( ④ ) IDX_NAME ON 학생(이름);\n\nCREATE VIEW 우수학생 ( ⑤ )\nSELECT 학번, 이름 FROM 학생 WHERE 평점 >= 4.0;\n\nCREATE ( ⑥ ) 학생_입력로그\nAFTER INSERT ON 학생\nFOR EACH ROW\nBEGIN\n    INSERT INTO 로그 VALUES (:NEW.학번, SYSDATE);\nEND;"},"answers":[{"label":"①","accept":["ADD","ADD COLUMN"]},{"label":"②","accept":["MODIFY"]},{"label":"③","accept":["DROP"]},{"label":"④","accept":["INDEX"]},{"label":"⑤","accept":["AS"]},{"label":"⑥","accept":["TRIGGER"]}],"hint":"ALTER TABLE 뒤에 붙는 추가·변경·삭제 동사, CREATE 뒤에 오는 객체 종류","explain":"ALTER TABLE\n| 동작 | 문법 |\n|---|---|\n| 추가 | `ALTER TABLE 학생 ADD 주소 VARCHAR(40);` |\n| 변경 | `ALTER TABLE 학생 MODIFY 주소 VARCHAR(80);` (Oracle·MySQL). 표준·SQL Server는 `ALTER COLUMN` |\n| 삭제 | `ALTER TABLE 학생 DROP COLUMN 주소;` |\n| 이름 변경 | `ALTER TABLE 학생 RENAME COLUMN 주소 TO 거주지;` |\n- ④ `CREATE [UNIQUE] INDEX 인덱스명 ON 테이블(컬럼);` 삭제는 `DROP INDEX 인덱스명;`\n- ⑤ `CREATE VIEW 뷰명 [(컬럼, …)] AS SELECT …;` 뷰 특징은 sql-025 해설\n- ⑥ 트리거: INSERT·UPDATE·DELETE 이벤트가 생기면 자동으로 실행되는 절차. BEFORE·AFTER로 시점을, FOR EACH ROW로 행 단위를 정한다. 트리거 안에서는 COMMIT·ROLLBACK 같은 트랜잭션 제어를 쓸 수 없다(Oracle)\n- **함정 요약**: 컬럼 삭제는 DROP COLUMN, 추가는 ADD. 표준·MySQL·PostgreSQL은 ADD COLUMN도 되지만 Oracle은 ADD만 된다. MODIFY는 Oracle·MySQL 문법이다\n- 2020-3에 ①(ALTER·ADD 빈칸), 2020-2에 ④(CREATE INDEX 작성)가 나왔다\n- sqlite로 ADD, DROP COLUMN, CREATE INDEX, CREATE VIEW, CREATE TRIGGER를 실행해 확인했다(트리거는 sqlite 문법 `NEW.학번`으로). MODIFY는 sqlite에 없어 확인하지 못했다"},{"id":"sql-030","subject":"sql","topic":"SQL 분류","sub":"DDL·DML·DCL·TCL·DELETE와 TRUNCATE","type":"choice","level":2,"q":"\u003c보기>의 SQL 명령어를 분류에 맞게 골라 기호로 쓰시오. (여러 개를 고르는 칸은 기호를 보기 순서대로 쓴다)","box":"- ① DDL(데이터 정의어)에 해당하는 것을 모두\n- ② DML(데이터 조작어)에 해당하는 것을 모두\n- ③ DCL(데이터 제어어)에 해당하는 것을 모두\n- ④ 트랜잭션을 확정하거나 취소하는 명령어를 모두\n- ⑤ 테이블 구조는 남기고 모든 행을 한 번에 지우며, ROLLBACK으로 되돌릴 수 없는 명령어 하나","options":["ㄱ. CREATE","ㄴ. SELECT","ㄷ. GRANT","ㄹ. TRUNCATE","ㅁ. COMMIT","ㅂ. UPDATE","ㅅ. REVOKE","ㅇ. ROLLBACK","ㅈ. ALTER","ㅊ. DELETE"],"answers":[{"label":"①","accept":["ㄱ, ㄹ, ㅈ","ㄱ, ㅈ, ㄹ","ㄹ, ㄱ, ㅈ","ㄹ, ㅈ, ㄱ","ㅈ, ㄱ, ㄹ","ㅈ, ㄹ, ㄱ","CREATE, TRUNCATE, ALTER","CREATE, ALTER, TRUNCATE","TRUNCATE, CREATE, ALTER","TRUNCATE, ALTER, CREATE","ALTER, CREATE, TRUNCATE","ALTER, TRUNCATE, CREATE"]},{"label":"②","accept":["ㄴ, ㅂ, ㅊ","ㄴ, ㅊ, ㅂ","ㅂ, ㄴ, ㅊ","ㅂ, ㅊ, ㄴ","ㅊ, ㄴ, ㅂ","ㅊ, ㅂ, ㄴ","SELECT, UPDATE, DELETE","SELECT, DELETE, UPDATE","UPDATE, SELECT, DELETE","UPDATE, DELETE, SELECT","DELETE, SELECT, UPDATE","DELETE, UPDATE, SELECT"]},{"label":"③","accept":["ㄷ, ㅁ, ㅅ, ㅇ","ㄷ, ㅅ, ㅁ, ㅇ","ㅁ, ㅇ, ㄷ, ㅅ","GRANT, COMMIT, REVOKE, ROLLBACK","GRANT, REVOKE, COMMIT, ROLLBACK","COMMIT, ROLLBACK, GRANT, REVOKE","ㄷ, ㅅ","ㅅ, ㄷ","GRANT, REVOKE","REVOKE, GRANT"]},{"label":"④","accept":["ㅁ, ㅇ","ㅇ, ㅁ","COMMIT, ROLLBACK","ROLLBACK, COMMIT"]},{"label":"⑤","accept":["ㄹ","TRUNCATE"]}],"hint":"행을 지운다고 모두 DML은 아니다","explain":"| 분류 | 명령어 |\n|---|---|\n| DDL | CREATE, ALTER, DROP, TRUNCATE, RENAME |\n| DML | SELECT, INSERT, UPDATE, DELETE (SELECT만 DQL로 떼기도 한다) |\n| DCL | GRANT, REVOKE + COMMIT, ROLLBACK (수험서 다수) |\n| TCL | COMMIT, ROLLBACK, SAVEPOINT (TCL을 따로 두는 교재, SQLD) |\n- ③은 교재마다 범위가 달라 두 답을 모두 인정한다. 대표 답은 수험서 다수 기준(ㄷ, ㅁ, ㅅ, ㅇ)\n- 시나공 등 수험서 다수는 TCL을 따로 두지 않고 DCL을 COMMIT, ROLLBACK, GRANT, REVOKE로 정리한다. 2020-2 실기 ROLLBACK 약술 문항도 복원본 여럿이 \"SQL 제어어(DCL)에는 COMMIT, ROLLBACK, GRANT, REVOKE가 있다\"로 시작한다\n- TCL을 따로 두는 교재와 SQLD는 DCL을 GRANT, REVOKE만으로 본다\n- 답안 요령: 문제에 TCL이 따로 나오면 COMMIT·ROLLBACK은 TCL로, DDL·DML·DCL 셋만 나오면 DCL에 넣는다\n- ④는 교재와 상관없이 COMMIT, ROLLBACK. GRANT·REVOKE는 권한을 다루고 트랜잭션과는 무관하다\n\nDELETE · TRUNCATE · DROP\n| | DELETE | TRUNCATE | DROP |\n|---|---|---|---|\n| 분류 | DML | DDL | DDL |\n| 지우는 것 | WHERE에 맞는 행 | 모든 행 | 테이블 구조와 데이터 전부 |\n| WHERE | 가능 | 불가 | 불가 |\n| ROLLBACK | 가능 | 불가 (Oracle은 자동 COMMIT) | 불가 |\n| 삭제 트리거 | 동작 | 동작 안 함 | 동작 안 함 |\n| 테이블 정의 | 남음 | 남음 | 사라짐 |\n- **함정 요약**: TRUNCATE는 행을 지우지만 DDL이라 되돌릴 수 없다. DELETE는 WHERE 없이 써도 DML이라 ROLLBACK된다"},{"id":"sql-031","subject":"sql","topic":"집합 연산","sub":"UNION·UNION ALL·INTERSECT·EXCEPT 행 수","type":"blank","level":3,"q":"다음 두 테이블에 ①~④ SQL을 각각 실행했을 때 결과 행의 수를 쓰시오.","box":"**A**\n| x |\n|---|\n| 1 |\n| 2 |\n| 2 |\n| 3 |\n| 5 |\n| 6 |\n\n**B**\n| x |\n|---|\n| 2 |\n| 3 |\n| 3 |\n| 4 |","code":{"lang":"sql","src":"-- ①\nSELECT x FROM A UNION ALL SELECT x FROM B;\n\n-- ②\nSELECT x FROM A UNION SELECT x FROM B;\n\n-- ③\nSELECT x FROM A INTERSECT SELECT x FROM B;\n\n-- ④\nSELECT x FROM A EXCEPT SELECT x FROM B;"},"answers":[{"label":"①","accept":["10"]},{"label":"②","accept":["6"]},{"label":"③","accept":["2"]},{"label":"④","accept":["3"]}],"hint":"ALL이 붙은 연산만 중복을 남긴다","explain":"- ① UNION ALL: 6 + 4 = 10. 중복을 그대로 둔다\n- ② UNION: {1, 2, 3, 4, 5, 6} → 6\n- ③ INTERSECT: 양쪽에 모두 있는 값 {2, 3} → 2. A의 2가 두 개, B의 3이 두 개여도 한 번씩만 나온다\n- ④ EXCEPT: A에만 있는 값 {1, 5, 6} → 3. B에만 있는 4는 들어가지 않는다\n- **함정 요약**: UNION ALL만 중복을 남기고 나머지 셋은 결과의 중복을 지운다. EXCEPT는 순서가 있다(A EXCEPT B ≠ B EXCEPT A)\n- Oracle은 차집합을 MINUS로 쓴다(21c부터 EXCEPT도 동의어로 지원). 시험에 MINUS가 나오면 EXCEPT와 같다\n- 관계대수 대응: ∪ 합집합, ∩ 교집합, − 차집합, × 카티션 곱\n- sqlite로 네 쿼리의 행 수를 세어 확인했다"},{"id":"sql-032","subject":"sql","topic":"JOIN","sub":"JOIN 종류별 결과 행·열 수","type":"blank","level":3,"q":"다음 두 테이블에 (가)~(라) SQL을 실행했을 때 ①~⑤를 쓰시오.","box":"**R**\n| k | name |\n|---|---|\n| 1 | 가 |\n| 2 | 나 |\n| 2 | 다 |\n| 3 | 라 |\n\n**S**\n| k | v |\n|---|---|\n| 2 | a |\n| 3 | b |\n| 3 | c |\n| 4 | d |\n\n- ① (가)의 결과 행 수\n- ② (가)의 결과 열 수\n- ③ (나)의 결과 행 수\n- ④ (다)의 결과 행 수\n- ⑤ (라)의 결과 행 수","code":{"lang":"sql","src":"-- (가)\nSELECT * FROM R CROSS JOIN S;\n\n-- (나)\nSELECT * FROM R NATURAL JOIN S;\n\n-- (다)\nSELECT * FROM R LEFT OUTER JOIN S ON R.k = S.k;\n\n-- (라)\nSELECT * FROM R FULL OUTER JOIN S ON R.k = S.k;"},"answers":[{"label":"①","accept":["16"]},{"label":"②","accept":["4"]},{"label":"③","accept":["4"]},{"label":"④","accept":["5"]},{"label":"⑤","accept":["6"]}],"hint":"같은 키 값끼리는 (왼쪽 개수 × 오른쪽 개수)만큼 행이 생긴다","explain":"키별 개수: k=1 (R 1, S 0), k=2 (R 2, S 1), k=3 (R 1, S 2), k=4 (R 0, S 1)\n- ① CROSS JOIN: 4 × 4 = 16 (카디널리티는 곱)\n- ② 열 수: 2 + 2 = 4 (차수는 합). k가 R.k, S.k로 두 번 나온다\n- ③ NATURAL JOIN: 이름이 같은 컬럼 k로 등가 조인. k=2: 2 × 1 = 2, k=3: 1 × 2 = 2 → 4. 결과 열은 k가 한 번만 나와 3개(k, name, v)\n- ④ LEFT: 조인된 4행 + R에서 짝 없는 k=1 한 행 → 5\n- ⑤ FULL: 조인된 4행 + R의 k=1 + S의 k=4 → 6\n- **함정 요약**: 조인 행 수는 키 값마다 (왼쪽 개수 × 오른쪽 개수)를 더한 값이다. OUTER JOIN은 여기에 짝 없는 행을 하나씩 더한다\n\nJOIN 묶음\n| 종류 | 결과 |\n|---|---|\n| CROSS | 모든 조합 (m × n행) |\n| INNER … ON | 조건이 맞는 조합 |\n| NATURAL | 이름이 같은 모든 컬럼으로 등가 조인, 공통 컬럼은 한 번만 표시 |\n| JOIN … USING (k) | 지정한 같은 이름 컬럼으로 등가 조인 |\n| LEFT / RIGHT / FULL OUTER | INNER 결과 + 왼쪽 / 오른쪽 / 양쪽의 짝 없는 행 (반대쪽 NULL) |\n| SELF | 같은 테이블을 별칭 둘로 조인 (sql-019) |\n- sqlite 3.51에서 FULL OUTER JOIN까지 그대로 실행해 확인했다"},{"id":"netos-201","subject":"netos","topic":"OSI·프로토콜","sub":"OSI 7계층","type":"blank","level":2,"q":"다음은 OSI 7계층에 대한 설명이다. ①~③에 해당하는 계층을 쓰시오.","box":"① 송수신 측 사이의 대화(연결)를 설정·유지·종료한다. 전송 중간에 동기점(체크포인트)을 두어 오류가 나면 그 지점부터 다시 보낼 수 있게 한다.\n② 종단 간(End-to-End) 신뢰성 있는 전송을 맡는다. 포트 번호로 프로세스를 구분하고 흐름 제어·오류 제어·순서 제어를 한다. TCP와 UDP가 이 계층 프로토콜이다.\n③ 사용자가 네트워크에 접근하는 창구로, HTTP·FTP·SMTP·DNS 같은 서비스를 제공한다.","answers":[{"label":"①","accept":["세션 계층(Session Layer)","세션"]},{"label":"②","accept":["전송 계층(Transport Layer)","전송"]},{"label":"③","accept":["응용 계층(Application Layer)","응용","애플리케이션 계층"]}],"hint":"① 대화 ② 끝과 끝 ③ 사용자 창구","explain":"정답: ① 세션 계층 ② 전송 계층 ③ 응용 계층\n\n| 계층 | 핵심 | 프로토콜·장비 | PDU |\n|---|---|---|---|\n| 7 응용 | 사용자 서비스 | HTTP, FTP, SMTP, DNS | 데이터 |\n| 6 표현 | 암호화·압축·코드 변환 | JPEG, MPEG | 데이터 |\n| 5 세션 | 대화 제어, 동기점 | RPC, NetBIOS | 데이터 |\n| 4 전송 | 종단 간 신뢰성, 포트 | TCP, UDP | 세그먼트 |\n| 3 네트워크 | 경로 설정(라우팅) | IP, ICMP, ARP, 라우터 | 패킷 |\n| 2 데이터 링크 | 인접 노드 간 프레임 전송 | HDLC, PPP, 스위치·브리지 | 프레임 |\n| 1 물리 | 전기 신호 | 리피터, 허브 | 비트 |\n- 헷갈리는 쌍: 동기점은 세션, 종단 간 흐름·오류 제어는 전송, 인접 노드 간 흐름·오류 제어는 데이터 링크"},{"id":"netos-202","subject":"netos","topic":"OSI·프로토콜","sub":"응용 계층 프로토콜","type":"short","level":2,"q":"다음 설명에 해당하는 프로토콜을 영문 약어로 쓰시오.","box":"- 네트워크에 접속한 호스트에 IP 주소, 서브넷 마스크, 기본 게이트웨이, DNS 서버 주소를 자동으로 할당한다.\n- UDP 67번(서버)과 68번(클라이언트) 포트를 쓴다.\n- 주소는 정해진 기간 동안 빌려 주고(임대), 기간이 끝나기 전에 갱신한다.","answers":[{"label":"답","accept":["DHCP","Dynamic Host Configuration Protocol"]}],"hint":"주소를 '빌려' 주는 프로토콜, 4단계 교환","explain":"정답: DHCP(Dynamic Host Configuration Protocol)\n- 할당 순서 DORA: Discover → Offer → Request → Ack\n\n| 프로토콜 | 하는 일 | 포트 |\n|---|---|---|\n| DHCP | IP 주소 등 네트워크 설정 자동 할당 | UDP 67/68 |\n| DNS | 도메인 이름 → IP 주소 | 53 |\n| ARP | IP 주소 → MAC 주소 | - |\n| RARP | MAC 주소 → IP 주소 | - |\n| NAT | 사설 IP ↔ 공인 IP 변환 | - |"},{"id":"netos-203","subject":"netos","topic":"메모리","sub":"배치 전략","type":"blank","level":2,"q":"다음은 주기억장치 배치(Placement) 전략에 대한 설명이다. ①~③에 알맞은 전략을 쓰시오.","box":"① 프로그램이 들어갈 수 있는 빈 영역 중 **처음 만나는** 곳에 넣는다.\n② 프로그램이 들어갈 수 있는 빈 영역 중 넣고 나서 **남는 공간이 가장 작은** 곳에 넣는다.\n③ 프로그램이 들어갈 수 있는 빈 영역 중 넣고 나서 **남는 공간이 가장 큰** 곳에 넣는다.","answers":[{"label":"①","accept":["최초 적합(First Fit)","최초 적합 전략"]},{"label":"②","accept":["최적 적합(Best Fit)","최적 적합 전략"]},{"label":"③","accept":["최악 적합(Worst Fit)","최악 적합 전략"]}],"hint":"처음 / 딱 맞게 / 가장 크게","explain":"정답: ① 최초 적합 ② 최적 적합 ③ 최악 적합\n- 예: 빈 영역이 차례로 10K, 4K, 20K, 18K, 7K일 때 12K 요청 → 최초 20K, 최적 18K, 최악 20K\n- 메모리 관리 전략 묶음: 반입(요구 반입·예상 반입) / 배치(최초·최적·최악 적합) / 교체(FIFO, LRU, LFU, OPT, NUR)\n- 단편화: 내부(할당한 영역이 프로그램보다 커서 안에 남는 공간) / 외부(빈 영역이 프로그램보다 작아서 못 쓰는 공간)"},{"id":"netos-001","subject":"netos","topic":"OSI·프로토콜","sub":"프로토콜 기본 요소","type":"blank","past":"2020-1","level":3,"q":"다음은 통신 프로토콜의 기본 요소 3가지를 설명한 것이다. ( ① )~( ③ )에 들어갈 요소를 쓰시오.","box":"- ( ① ): 전송할 데이터의 형식, 부호화 방법, 신호 레벨을 정한다.\n- ( ② ): 전송 제어와 오류 관리에 필요한 제어 정보를 정한다.\n- ( ③ ): 두 개체 사이의 통신 속도를 맞추고 메시지 순서를 제어한다.","answers":[{"label":"①","accept":["구문(Syntax)"]},{"label":"②","accept":["의미(Semantics)","Semantic"]},{"label":"③","accept":["타이밍(Timing)"]}],"hint":"모양 → 뜻 → 때","explain":"- ① 구문(Syntax): 무엇을 어떤 모양으로 보내나 (형식, 부호화, 신호 레벨)\n- ② 의미(Semantics): 그 비트가 무슨 뜻인가 (제어 정보, 오류 처리)\n- ③ 타이밍(Timing): 언제, 얼마나 빨리 (속도 조절, 순서 제어)\n- 2020-1 기출은 설명 없이 3요소를 쓰게 했다. 세 단어(구문, 의미, 타이밍)를 다 쓰면 된다\n\n프로토콜 묶음\n- 프로토콜: 통신하는 개체끼리 정한 약속. 톰 마릴이 처음 이 말을 썼다(2020-3 기출, netos-002)\n- 프로토콜 기능: 단편화·재조립, 캡슐화, 흐름 제어, 오류 제어, 동기화, 순서 제어, 주소 지정, 다중화, 경로 제어"},{"id":"netos-002","subject":"netos","topic":"OSI·프로토콜","sub":"프로토콜 정의","type":"short","past":"2020-3","level":2,"q":"다음 설명에 해당하는 용어를 쓰시오.","box":"- 서로 다른 시스템에 있는 두 개체가 데이터를 주고받으려고 미리 정해 둔 통신 규약이다.\n- 톰 마릴(Tom Marill)은 컴퓨터가 메시지를 전달하고, 메시지가 제대로 도착했는지 확인하며, 도착하지 않았으면 다시 보내는 일련의 방법을 '기술적 은어(Technical Jargon)'라는 뜻의 이 용어로 불렀다.","answers":[{"label":"답","accept":["프로토콜(Protocol)","통신 프로토콜"]}],"hint":"원래는 외교 의전에서 쓰던 말","explain":"프로토콜(Protocol)\n- 단서: 통신 규약, 톰 마릴, 기술적 은어\n- 원래 뜻은 외교 의례. 통신에서는 누가, 무엇을, 어떻게, 언제 주고받을지 정한 약속\n- 3요소: 구문(형식), 의미(제어 정보), 타이밍(속도·순서) → netos-001\n- 계층별 대표: 응용 HTTP·FTP·SMTP·DNS / 전송 TCP·UDP / 네트워크 IP·ICMP·ARP / 데이터 링크 HDLC·PPP·Ethernet"},{"id":"netos-003","subject":"netos","topic":"OSI·프로토콜","sub":"OSI 7계층","type":"short","past":"2020-1","level":3,"q":"OSI 7계층 중 다음 설명에 해당하는 계층을 쓰시오.","box":"- 전송 매체로 비트를 전기 신호나 광 신호로 바꿔 보낸다.\n- 전송에 필요한 전기적, 기계적, 기능적, 절차적 특성을 정한다.\n- 대표 장비는 리피터와 허브다.","answers":[{"label":"답","accept":["물리 계층(Physical Layer)","물리층","물리"]}],"hint":"데이터 단위가 비트인 계층","explain":"물리 계층(1계층)\n- 단서: 비트, 전기적·기계적 특성, 리피터·허브\n- 데이터 링크 계층(2계층)과 구분: 2계층은 비트를 프레임으로 묶고 MAC 주소와 오류 검사를 붙인다\n- 아래부터 외우기: 물-데-네-전-세-표-응\n\n| 계층 | 하는 일 | PDU | 장비·프로토콜 |\n|---|---|---|---|\n| 7 응용 | 사용자 서비스 | 데이터 | HTTP, FTP, SMTP, DNS |\n| 6 표현 | 코드 변환, 압축, 암호화 | 데이터 | JPEG, MPEG, ASCII |\n| 5 세션 | 대화 제어, 동기점 | 데이터 | RPC, NetBIOS |\n| 4 전송 | 종단 간 신뢰성, 흐름 제어 | 세그먼트 | TCP, UDP |\n| 3 네트워크 | 경로 설정, 논리 주소 | 패킷 | IP, ICMP, 라우터 |\n| 2 데이터 링크 | 인접 노드 전송, 오류·흐름 제어 | 프레임 | HDLC, PPP, 스위치·브리지 |\n| 1 물리 | 비트 전송 | 비트 | 리피터, 허브 |"},{"id":"netos-004","subject":"netos","topic":"OSI·프로토콜","sub":"OSI 7계층","type":"blank","past":"2021-3","level":3,"q":"다음은 OSI 7계층에 대한 설명이다. ( ① )~( ③ )에 들어갈 계층을 쓰시오.","box":"- ( ① ): 물리 계층으로 오가는 정보의 신뢰성을 높이려고 인접한 노드 사이의 흐름 제어와 오류 제어를 맡는다.\n- ( ② ): 데이터를 목적지까지 가장 알맞은 경로로 보내는 경로 설정(라우팅)과 논리 주소 지정을 맡는다.\n- ( ③ ): 수신 측이 해석할 수 있는 형식으로 코드를 바꾸고, 데이터를 압축하거나 암호화한다.","answers":[{"label":"①","accept":["데이터 링크 계층(Data Link Layer)","데이터링크 계층","데이터 링크","데이터 링크층"]},{"label":"②","accept":["네트워크 계층(Network Layer)","네트워크","망 계층","네트워크층"]},{"label":"③","accept":["표현 계층(Presentation Layer)","표현","표현층"]}],"hint":"② 라우터가 일하는 층, ③ JPEG·MPEG","explain":"- ① 데이터 링크(2): 인접 노드, 흐름·오류 제어, 프레임\n- ② 네트워크(3): 경로 설정, IP 주소, 패킷\n- ③ 표현(6): 코드 변환, 압축, 암호화\n- 헷갈리는 점: 흐름·오류 제어는 2계층(인접 노드 사이)과 4계층(종단 간) 둘 다 한다. '인접', '물리 계층으로 오가는'이면 2계층, '종단 간', '포트'면 4계층\n- 세션(5)은 대화 제어와 동기점, 응용(7)은 사용자 서비스"},{"id":"netos-005","subject":"netos","topic":"OSI·프로토콜","sub":"PDU·네트워크 장비","type":"blank","level":3,"q":"다음은 OSI 계층별 데이터 단위(PDU)와 대표 장비를 정리한 것이다. ( ① )~( ⑥ )에 들어갈 알맞은 용어를 \u003c보기>에서 골라 쓰시오.","box":"| 계층 | PDU | 대표 장비 |\n|---|---|---|\n| 전송 | ( ① ) | - |\n| 네트워크 | ( ② ) | ( ③ ) |\n| 데이터 링크 | ( ④ ) | 스위치, ( ⑤ ) |\n| 물리 | 비트 | 리피터, 허브 |\n\n- ( ⑥ ): 프로토콜이 서로 다른 네트워크를 연결하면서 프로토콜을 변환해 주는 장비로, 주로 전송 계층 이상에서 동작한다.","options":["ㄱ. 패킷","ㄴ. 프레임","ㄷ. 세그먼트","ㄹ. 메시지","ㅁ. 라우터","ㅂ. 브리지","ㅅ. 게이트웨이","ㅇ. 모뎀"],"answers":[{"label":"①","accept":["ㄷ","세그먼트","Segment"]},{"label":"②","accept":["ㄱ","패킷","Packet"]},{"label":"③","accept":["ㅁ","라우터","Router"]},{"label":"④","accept":["ㄴ","프레임","Frame"]},{"label":"⑤","accept":["ㅂ","브리지","브릿지","Bridge"]},{"label":"⑥","accept":["ㅅ","게이트웨이","Gateway"]}],"hint":"위에서 아래로 헤더가 하나씩 붙는다: 데이터 → ? → ? → ? → 비트","explain":"- 캡슐화(위 → 아래): 데이터(5~7) → 세그먼트(4) → 패킷(3) → 프레임(2) → 비트(1)\n- 장비: 리피터·허브(1) / 브리지·스위치(2, MAC 주소) / 라우터(3, IP 주소) / 게이트웨이(서로 다른 프로토콜 변환)\n- 허브 vs 스위치: 허브는 받은 신호를 모든 포트로 내보내고, 스위치는 MAC 주소를 보고 해당 포트로만 보낸다\n- UDP의 4계층 단위는 데이터그램이라고도 부른다\n- 오답 보기: 모뎀은 디지털 ↔ 아날로그 신호 변환 장치\n\n| 계층 | 하는 일 | PDU | 장비·프로토콜 |\n|---|---|---|---|\n| 7 응용 | 사용자 서비스 | 데이터 | HTTP, FTP, SMTP, DNS |\n| 6 표현 | 코드 변환, 압축, 암호화 | 데이터 | JPEG, MPEG, ASCII |\n| 5 세션 | 대화 제어, 동기점 | 데이터 | RPC, NetBIOS |\n| 4 전송 | 종단 간 신뢰성, 흐름 제어 | 세그먼트 | TCP, UDP |\n| 3 네트워크 | 경로 설정, 논리 주소 | 패킷 | IP, ICMP, 라우터 |\n| 2 데이터 링크 | 인접 노드 전송, 오류·흐름 제어 | 프레임 | HDLC, PPP, 스위치·브리지 |\n| 1 물리 | 비트 전송 | 비트 | 리피터, 허브 |"},{"id":"netos-006","subject":"netos","topic":"OSI·프로토콜","sub":"TCP/IP 4계층","type":"blank","level":2,"q":"다음은 TCP/IP 4계층 모델을 아래 계층부터 설명한 것이다. ( ① )~( ④ )에 들어갈 계층 이름을 쓰시오.","box":"- ( ① ): OSI의 물리 계층과 데이터 링크 계층에 해당한다. Ethernet, HDLC, PPP\n- ( ② ): OSI의 네트워크 계층에 해당한다. IP, ICMP, IGMP, ARP, RARP\n- ( ③ ): OSI의 전송 계층에 해당한다. TCP, UDP\n- ( ④ ): OSI의 세션·표현·응용 계층에 해당한다. HTTP, FTP, SMTP, DNS, SNMP","answers":[{"label":"①","accept":["네트워크 액세스 계층(Network Access Layer)","네트워크 인터페이스 계층","Network Interface Layer","네트워크 접근 계층","링크 계층","Link Layer"]},{"label":"②","accept":["인터넷 계층(Internet Layer)","인터넷"]},{"label":"③","accept":["전송 계층(Transport Layer)","트랜스포트 계층","전송"]},{"label":"④","accept":["응용 계층(Application Layer)","애플리케이션 계층","응용"]}],"hint":"OSI 7개를 아래부터 2·1·1·3개씩 묶는다","explain":"| TCP/IP | OSI | 프로토콜 |\n|---|---|---|\n| 응용 | 응용·표현·세션 | HTTP, FTP, SMTP, DNS, SNMP, Telnet |\n| 전송 | 전송 | TCP, UDP |\n| 인터넷 | 네트워크 | IP, ICMP, IGMP, ARP, RARP |\n| 네트워크 액세스 | 데이터 링크·물리 | Ethernet, HDLC, PPP |\n- 함정: OSI 3계층 이름은 '네트워크'지만 TCP/IP에서는 '인터넷 계층'이다\n- 정처기 교재는 ARP·RARP를 인터넷(네트워크) 계층으로 분류한다"},{"id":"netos-007","subject":"netos","topic":"OSI·프로토콜","sub":"응용 계층 프로토콜·포트","type":"blank","level":3,"q":"다음은 응용 계층 프로토콜과 기본 포트 번호를 정리한 표다. ( ① )~( ⑥ )에 들어갈 프로토콜 이름이나 포트 번호를 쓰시오.","box":"| 프로토콜 | 포트 | 설명 |\n|---|---|---|\n| HTTP | ( ① ) | 웹 문서 전송 |\n| ( ② ) | 53 | 도메인 이름을 IP 주소로 변환 |\n| ( ③ ) | 23 | 암호화하지 않는 원격 접속 |\n| SSH | ( ④ ) | 암호화한 원격 접속 |\n| ( ⑤ ) | 110 | 메일 서버에서 메일을 내려받는 수신 프로토콜 |\n| ( ⑥ ) | 161 | 네트워크 장비의 상태 정보를 모으고 관리 |","answers":[{"label":"①","accept":["80"]},{"label":"②","accept":["DNS","Domain Name System"]},{"label":"③","accept":["Telnet","텔넷"]},{"label":"④","accept":["22"]},{"label":"⑤","accept":["POP3","POP"]},{"label":"⑥","accept":["SNMP","Simple Network Management Protocol"]}],"hint":"② 이름 풀이, ⑤ 우체국(Post Office), ⑥ 망 관리","explain":"- ① 80(HTTPS는 443) ② DNS 53 ③ Telnet 23 ④ SSH 22 ⑤ POP3 110 ⑥ SNMP 161(트랩 162)\n- POP3 vs IMAP(143): POP3는 메일을 단말로 내려받는다(서버에서 지우는 게 기본). IMAP은 서버에 두고 여러 기기에서 상태를 동기화\n- SMTP(25)는 메일 보내기, POP3·IMAP은 받기\n\n| 포트 | 프로토콜 |\n|---|---|\n| 20/21 | FTP(20 데이터, 21 제어) |\n| 22 | SSH |\n| 23 | Telnet |\n| 25 | SMTP |\n| 53 | DNS |\n| 67/68 | DHCP(67 서버, 68 클라이언트) |\n| 80 | HTTP |\n| 110 | POP3 |\n| 143 | IMAP |\n| 161/162 | SNMP |\n| 443 | HTTPS |"},{"id":"netos-008","subject":"netos","topic":"OSI·프로토콜","sub":"3-way handshake·흐름·혼잡 제어","type":"blank","level":2,"q":"다음은 TCP의 연결 설정과 전송 제어에 대한 설명이다. ( ① )~( ⑥ )에 들어갈 알맞은 용어를 \u003c보기>에서 골라 쓰시오.","box":"- 연결 설정(3-way handshake): 클라이언트가 ( ① ) → 서버가 ( ② ) → 클라이언트가 ( ③ )을 보낸다.\n- 연결 종료(4-way handshake)는 종료하려는 쪽이 ( ④ ) 플래그를 보내며 시작한다.\n- ( ⑤ ): 수신 측이 알려 준 윈도우 크기만큼은 확인 응답(ACK)을 기다리지 않고 여러 세그먼트를 연속으로 보내는 흐름 제어 방식이다.\n- ( ⑥ ): 혼잡 윈도우를 1 MSS에서 시작해 ACK를 받을 때마다 키워, 왕복 시간마다 두 배씩 늘리는 혼잡 제어 기법이다.","options":["ㄱ. SYN","ㄴ. ACK","ㄷ. SYN+ACK","ㄹ. FIN","ㅁ. RST","ㅂ. 정지-대기(Stop-and-Wait)","ㅅ. 슬라이딩 윈도우(Sliding Window)","ㅇ. 슬로 스타트(Slow Start)","ㅈ. 혼잡 회피(Congestion Avoidance)"],"answers":[{"label":"①","accept":["ㄱ","SYN"]},{"label":"②","accept":["ㄷ","SYN+ACK","SYN/ACK","SYNACK"]},{"label":"③","accept":["ㄴ","ACK"]},{"label":"④","accept":["ㄹ","FIN"]},{"label":"⑤","accept":["ㅅ","슬라이딩 윈도우(Sliding Window)"]},{"label":"⑥","accept":["ㅇ","슬로 스타트(Slow Start)"]}],"hint":"⑥ 임계값(ssthresh)에 닿기 전까지의 지수 증가 구간","explain":"- 3-way: SYN → SYN+ACK → ACK. 서로의 초기 순서 번호를 확인한다\n- 4-way 종료: FIN → ACK → FIN → ACK\n- 그 밖의 플래그: RST(연결 강제 종료), PSH(버퍼에 모으지 않고 바로 올려 보냄), URG(긴급 데이터)\n- 흐름 제어(받는 쪽 보호): 정지-대기(1개 보내고 ACK 대기) / 슬라이딩 윈도우(윈도우 크기만큼 연속 전송)\n- 혼잡 제어(망 보호): 슬로 스타트(지수 증가) → 임계값(ssthresh)을 넘으면 혼잡 회피(1씩 선형 증가, AIMD) → 중복 ACK 3개면 빠른 재전송(Fast Retransmit)과 빠른 회복(Fast Recovery)\n- 흐름 제어는 수신 측 처리 속도에, 혼잡 제어는 네트워크 상태에 맞춘다"},{"id":"netos-009","subject":"netos","topic":"OSI·프로토콜","sub":"TCP·UDP","type":"essay","level":2,"q":"TCP와 UDP의 차이를 연결 방식과 신뢰성 측면에서 약술하고, 각각에 알맞은 응용 예를 하나씩 쓰시오.","answers":[{"label":"답","accept":[],"model":"TCP는 3-way handshake로 연결을 먼저 맺는 연결형 프로토콜로, 순서 번호, 확인 응답, 재전송, 흐름 제어, 혼잡 제어로 데이터가 빠짐없이 순서대로 도착하도록 보장한다(예: 파일 전송, 웹, 메일). UDP는 연결 설정 없이 데이터그램을 바로 보내는 비연결형 프로토콜로, 신뢰성을 보장하지 않는 대신 헤더가 8바이트로 작고 지연이 적다(예: 실시간 스트리밍, 음성 통화, DNS 질의)."}],"hint":"전화(연결 후 대화) vs 엽서(그냥 보냄)","explain":"채점 포인트: ① 연결형 / 비연결형 ② 신뢰성 보장(순서·재전송·흐름 제어) 여부 ③ 속도·오버헤드 ④ 예\n\n| 구분 | TCP | UDP |\n|---|---|---|\n| 연결 | 연결형(3-way handshake) | 비연결형 |\n| 신뢰성 | 순서 보장, 재전송, 흐름·혼잡 제어 | 보장 안 함 |\n| 단위 | 세그먼트 | 데이터그램 |\n| 헤더 | 20~60바이트 | 8바이트 |\n| 대상 | 1:1 | 1:1, 1:N(브로드캐스트·멀티캐스트) |\n| 예 | HTTP, FTP, SMTP, SSH | DNS 질의, DHCP, SNMP, 실시간 스트리밍 |\n- UDP 헤더 필드 4개: 출발지 포트(Source Port), 목적지 포트(Destination Port), 길이(Length), 체크섬(Checksum)\n- 출제기준 문장: '응용의 특성에 따라 TCP와 UDP를 구별하여 적용할 수 있다'"},{"id":"netos-010","subject":"netos","topic":"OSI·프로토콜","sub":"네트워크 계층 프로토콜","type":"short","past":"2020-3","level":3,"q":"다음 설명에 해당하는 프로토콜을 영문 약어로 쓰시오.","box":"TCP/IP 네트워크에서 IP 패킷을 처리하다 오류가 생기면 오류가 났다는 사실을 송신 측에 알리는 메시지를 보내는 프로토콜이다. IP에는 오류를 보고하는 기능이 없어서 이 프로토콜이 그 역할을 맡는다.","answers":[{"label":"답","accept":["ICMP","Internet Control Message Protocol"]}],"hint":"ping 명령이 쓰는 프로토콜","explain":"ICMP(Internet Control Message Protocol)\n- 단서: IP 오류 사실을 알림, 제어 메시지\n- 네트워크(인터넷) 계층에서 IP 패킷에 담겨 전달된다\n- 주요 메시지: Echo Request·Reply(ping), Destination Unreachable(목적지 도달 불가), Time Exceeded(TTL 만료, traceroute가 이용), Redirect(더 나은 경로 안내)\n\n| 프로토콜 | 하는 일 |\n|---|---|\n| ARP | IP 주소 → MAC 주소 |\n| RARP | MAC 주소 → IP 주소 |\n| ICMP | 오류 보고, 상태 진단 |\n| IGMP | 멀티캐스트 그룹 가입·탈퇴 관리 |"},{"id":"netos-011","subject":"netos","topic":"OSI·프로토콜","sub":"네트워크 계층 프로토콜","type":"blank","past":"2023-1","level":3,"q":"다음 ( ① )~( ③ )에 들어갈 알맞은 용어를 \u003c보기>에서 골라 쓰시오.","box":"- ( ① ): IP 패킷을 처리하는 중에 생긴 오류를 알리고, ping 명령으로 연결 상태를 확인할 때 쓰는 프로토콜이다. 이 프로토콜의 메시지를 대량으로 보내 대상을 마비시키는 Flooding 공격도 있다.\n- ( ② ): 호스트가 멀티캐스트 그룹에 가입하거나 탈퇴했음을 인접 라우터에 알리는 프로토콜이다.\n- ( ③ ): ①의 메시지 유형 중 하나다. 패킷의 TTL 값이 0이 되어 라우터가 패킷을 버렸을 때 송신 측에 보낸다. traceroute가 이 메시지로 경로를 알아낸다.","options":["ㄱ. ARP","ㄴ. RARP","ㄷ. ICMP","ㄹ. IGMP","ㅁ. SNMP","ㅂ. Echo Reply","ㅅ. Destination Unreachable","ㅇ. Time Exceeded"],"answers":[{"label":"①","accept":["ㄷ","ICMP"]},{"label":"②","accept":["ㄹ","IGMP"]},{"label":"③","accept":["ㅇ","Time Exceeded","시간 초과"]}],"hint":"② Group, ③ 수명이 다했다","explain":"- ① ICMP: 2023-1 기출은 이 설명 하나로 ICMP를 쓰게 한 단답이었다. ②③은 IGMP와 ICMP 메시지까지 외우라고 더했다\n- ICMP를 악용한 공격: ICMP Flooding(Ping Flood), Smurf(브로드캐스트로 증폭), Ping of Death\n- ② IGMP: Group → 멀티캐스트 그룹 관리\n- ③ Time Exceeded: TTL이 0 → 폐기 → 송신자에게 통보. traceroute는 TTL을 1, 2, 3 …으로 늘려 각 라우터의 응답을 받는다\n- Destination Unreachable: 목적지나 포트에 갈 수 없음 / Echo Request·Reply: ping\n- SNMP는 응용 계층 망 관리 프로토콜(UDP 161)이라 IP 보조 프로토콜이 아니다"},{"id":"netos-012","subject":"netos","topic":"OSI·프로토콜","sub":"네트워크 계층 프로토콜","type":"short","past":"2021-1","level":3,"q":"다음 설명에 해당하는 프로토콜을 쓰시오.","box":"- 물리 주소(MAC 주소)를 가지고 그에 대응하는 IP 주소를 알아내는 프로토콜이다.\n- 자기 IP 주소를 모르는 디스크 없는 단말이 부팅할 때 서버에 IP 주소를 요청하는 데 썼다.","answers":[{"label":"답","accept":["RARP","Reverse Address Resolution Protocol","역순 주소 결정 프로토콜"]}],"hint":"IP → MAC 프로토콜과 방향만 반대","explain":"RARP(Reverse ARP)\n- 단서: MAC → IP\n- ARP는 반대로 IP → MAC. 같은 LAN에 'IP가 x인 장비의 MAC은?'을 브로드캐스트하고, 주인이 유니캐스트로 답한다. 결과는 ARP 캐시에 저장\n- RARP의 역할은 지금은 BOOTP와 DHCP가 맡는다\n- 외우는 법: R(Reverse)이 붙으면 물리 주소에서 출발"},{"id":"netos-013","subject":"netos","topic":"OSI·프로토콜","sub":"네트워크 계층 프로토콜","type":"blank","past":"2025-1","level":3,"q":"다음 ( ① ), ( ② )에 들어갈 프로토콜을 영문 약어로 쓰시오.","box":"- ( ① ): IP 주소를 물리 주소(MAC 주소)로 바꿔 주는 프로토콜이다. 같은 네트워크에 요청을 브로드캐스트하면, 해당 IP를 가진 장비가 자기 MAC 주소로 응답한다.\n- ( ② ): 물리 주소(MAC 주소)를 IP 주소로 바꿔 주는 프로토콜이다.","answers":[{"label":"①","accept":["ARP"]},{"label":"②","accept":["RARP"]}],"hint":"② ①의 역방향","explain":"- ① ARP(Address Resolution Protocol): IP → MAC\n- ② RARP(Reverse ARP): MAC → IP\n- 2021-1에는 RARP만 단답으로 나왔다(netos-012)\n- ARP 스푸핑: 가짜 ARP 응답으로 ARP 캐시를 오염시켜 남의 트래픽을 가로채는 공격(보안 과목)\n- 둘 다 정처기 교재에서 네트워크(인터넷) 계층 프로토콜로 분류한다"},{"id":"netos-014","subject":"netos","topic":"OSI·프로토콜","sub":"웹 기본 용어","type":"blank","past":"2022-2","level":2,"q":"다음은 웹(WWW)의 기본 구성 요소에 대한 설명이다. ( ① )~( ③ )에 들어갈 용어를 쓰시오.","box":"- ( ① ): 웹 서버와 클라이언트(브라우저)가 하이퍼텍스트 문서를 주고받을 때 쓰는 통신 규약이다. 요청과 응답으로 동작하며 기본 포트는 80번이다.\n- ( ② ): 문서 안의 단어나 그림을 누르면 관련된 다른 문서로 바로 이동하도록 링크로 연결한 문서 형식이다. 순서와 관계없이 정보를 오갈 수 있다.\n- ( ③ ): 웹 문서의 구조를 태그로 표현하는 마크업 언어다.","answers":[{"label":"①","accept":["HTTP","HyperText Transfer Protocol"]},{"label":"②","accept":["Hypertext","하이퍼텍스트"]},{"label":"③","accept":["HTML","HyperText Markup Language"]}],"hint":"세 답이 모두 같은 단어로 시작한다","explain":"- ① HTTP: 전송 규약(Transfer Protocol). 상태를 저장하지 않는다(Stateless). 메서드 GET·POST·PUT·DELETE\n- ② Hypertext: 링크로 이어진 문서 형식 자체\n- ③ HTML: 문서를 쓰는 언어(Markup Language)\n- 헷갈리는 이웃: XML(데이터를 담는 확장형 마크업 언어), HTTPS(HTTP + SSL/TLS, 443), URL(자원 위치 표기, netos-015)\n- 일부 복원본은 ③을 XML로 적었지만 설명이 HTML이라 오기로 본다"},{"id":"netos-015","subject":"netos","topic":"OSI·프로토콜","sub":"URL 구조","type":"choice","past":"2024-3","level":2,"q":"다음 URL을 (1)~(5)로 나누었다. \u003c보기>의 ㄱ~ㅁ 순서대로 각 구성 요소에 해당하는 번호를 쓰시오. (예: 1 2 3 4 5)","box":"`foo://localhost:8080/over/there?name=ferret#nose`\n\n| 번호 | 부분 |\n|---|---|\n| (1) | `foo` |\n| (2) | `localhost:8080` |\n| (3) | `/over/there` |\n| (4) | `name=ferret` |\n| (5) | `nose` |","options":["ㄱ. query","ㄴ. path","ㄷ. scheme","ㄹ. authority","ㅁ. fragment"],"answers":[{"label":"답","accept":["4 3 1 2 5","43125","(4)(3)(1)(2)(5)"]}],"hint":"? 뒤는 질의, # 뒤는 문서 안 위치","explain":"답 4 3 1 2 5\n- scheme(1) `foo`: 접근 방식(http, https, ftp). `://` 앞\n- authority(2) `localhost:8080`: 호스트와 포트. 사용자 정보 `user@`가 붙기도 한다\n- path(3) `/over/there`: 서버 안 자원 경로\n- query(4) `name=ferret`: `?` 뒤. 이름=값 쌍을 `&`로 잇는다\n- fragment(5) `nose`: `#` 뒤. 문서 안 특정 위치이고 서버로 보내지 않는다\n- 전체 구조: `scheme://authority/path?query#fragment` (RFC 3986 예시 `foo://example.com:8042/over/there?name=ferret#nose`)"},{"id":"netos-016","subject":"netos","topic":"OSI·프로토콜","sub":"DHCP","type":"order","level":2,"q":"다음은 DHCP로 IP 주소를 자동으로 할당받을 때 오가는 메시지다. 오가는 순서대로 기호를 나열하시오.","box":"- 클라이언트는 아직 IP 주소가 없다.\n- 같은 네트워크에 DHCP 서버가 하나 있다.","options":["ㄱ. DHCP Request","ㄴ. DHCP Offer","ㄷ. DHCP Ack","ㄹ. DHCP Discover"],"answers":[{"label":"답","accept":["ㄹ-ㄴ-ㄱ-ㄷ","Discover-Offer-Request-Ack"]}],"hint":"앞 글자를 이으면 네 글자 이름","explain":"ㄹ → ㄴ → ㄱ → ㄷ (DORA)\n1. Discover(클라이언트 → 브로드캐스트): DHCP 서버를 찾는다\n2. Offer(서버 → 클라이언트): 쓸 수 있는 IP를 제안\n3. Request(클라이언트 → 브로드캐스트): 그 IP를 쓰겠다고 요청. 서버가 여럿이면 하나를 골라 확정\n4. Ack(서버 → 클라이언트): 승인, 임대(Lease) 시작\n- DHCP: UDP, 서버 67 / 클라이언트 68. IP, 서브넷 마스크, 게이트웨이, DNS 서버 주소를 빌려준다\n- 헷갈리는 이웃: DNS(이름 → IP, 53), RARP(MAC → IP, DHCP 이전 방식), NAT(사설 ↔ 공인 IP 변환)"},{"id":"netos-017","subject":"netos","topic":"IP·서브넷","sub":"IPv6","type":"short","past":"2020-4","level":3,"q":"다음 설명에 해당하는 인터넷 프로토콜을 쓰시오.","box":"- 현재 쓰는 IP 주소 체계의 주소 부족 문제를 해결하려고 만들었다.\n- 주소 길이가 128비트이고, 16비트씩 8부분으로 나누어 16진수로 표기한다.\n- 인증과 암호화 기능을 갖추고 헤더 구조를 단순하게 바꾸어 보안성과 이동성을 높였다.","answers":[{"label":"답","accept":["IPv6","Internet Protocol version 6","IP 버전 6","IPng"]}],"hint":"주소를 콜론(:)으로 구분해 적는다","explain":"IPv6\n| 구분 | IPv4 | IPv6 |\n|---|---|---|\n| 길이 | 32비트 | 128비트 |\n| 표기 | 8비트 × 4, 10진수, 점(.) | 16비트 × 8, 16진수, 콜론(:) |\n| 전송 방식 | 유니·멀티·브로드캐스트 | 유니·멀티·애니캐스트(브로드캐스트 없음) |\n| 헤더 | 가변 길이 | 40바이트 고정 기본 헤더 + 확장 헤더 |\n| 보안 | 선택 | IPSec 지원 |\n- IPv4와 함께 쓰기 위한 전환 기술: 듀얼 스택, 터널링, 주소(헤더) 변환 → netos-019\n- IPv5는 실험용(ST)으로 끝나 쓰이지 않았다"},{"id":"netos-018","subject":"netos","topic":"IP·서브넷","sub":"IPv4·IPv6 주소 길이","type":"blank","past":"2021-1","level":3,"q":"다음 ( ① ), ( ② )에 들어갈 알맞은 숫자를 쓰시오.","box":"- IPv6는 ( ① )비트 길이의 주소를 쓴다.\n- IPv4는 32비트 주소를 ( ② )비트씩 4부분으로 나누어 점(.)으로 구분하고 10진수로 표기한다.","answers":[{"label":"①","accept":["128"]},{"label":"②","accept":["8"]}],"hint":"IPv4 한 칸의 최댓값이 255","explain":"- ① 128: 16비트 × 8부분, 16진수, 콜론 구분\n- ② 8: 한 옥텟은 0~255\n- 주소 개수: IPv4 2^32(약 43억), IPv6 2^128\n- IPv6 줄여 쓰기: 각 필드 앞의 0은 생략, 연속된 0 필드는 `::`로 한 번만 줄인다. 2001:0db8:0000:0000:0000:0000:0000:0001 → 2001:db8::1"},{"id":"netos-019","subject":"netos","topic":"IP·서브넷","sub":"IPv6 주소 유형·전환 기술","type":"blank","level":2,"q":"다음은 IPv6의 전송 방식과 IPv4/IPv6 전환 기술에 대한 설명이다. ( ① )~( ⑤ )에 들어갈 용어를 \u003c보기>에서 골라 쓰시오.","box":"- ( ① ): 같은 주소를 가진 여러 인터페이스 가운데 경로상 가장 가까운 한 곳으로만 보내는 전송 방식이다.\n- IPv4에는 있지만 IPv6에서 없어진 전송 방식은 ( ② )이다. IPv6는 이 역할을 멀티캐스트로 대신한다.\n- ( ③ ): 한 장비에 IPv4와 IPv6 프로토콜을 모두 탑재해 통신 상대에 따라 골라 쓴다.\n- ( ④ ): IPv6 패킷을 IPv4 패킷 안에 캡슐화해 IPv4 망을 통과시킨다.\n- ( ⑤ ): 중간 장비가 IPv4 헤더와 IPv6 헤더를 서로 바꿔 주어 IPv4 전용 장비와 IPv6 전용 장비가 통신하게 한다.","options":["ㄱ. 유니캐스트","ㄴ. 멀티캐스트","ㄷ. 브로드캐스트","ㄹ. 애니캐스트","ㅁ. 듀얼 스택","ㅂ. 터널링","ㅅ. 주소 변환(헤더 변환)","ㅇ. 서브네팅"],"answers":[{"label":"①","accept":["ㄹ","애니캐스트(Anycast)"]},{"label":"②","accept":["ㄷ","브로드캐스트(Broadcast)"]},{"label":"③","accept":["ㅁ","듀얼 스택(Dual Stack)","이중 스택"]},{"label":"④","accept":["ㅂ","터널링(Tunneling)"]},{"label":"⑤","accept":["ㅅ","주소 변환","헤더 변환","변환","Translation","IPv4/IPv6 변환","NAT-PT","주소 변환(헤더 변환)","주소·헤더 변환","Address Translation","Header Translation"]}],"hint":"④ 굴을 뚫어 지나간다","explain":"- 전송 방식: 유니캐스트(1:1), 멀티캐스트(1:그룹), 브로드캐스트(1:같은 망 전체), 애니캐스트(1:그룹 중 가장 가까운 하나)\n- IPv4 = 유니·멀티·브로드캐스트 / IPv6 = 유니·멀티·애니캐스트. 브로드캐스트가 빠졌다\n\n| 전환 기술 | 핵심 |\n|---|---|\n| 듀얼 스택 | 두 프로토콜을 모두 탑재 |\n| 터널링 | IPv6를 IPv4로 감싸서 통과 |\n| 주소(헤더) 변환 | 중간에서 헤더를 바꿈(NAT-PT 등) |\n- 교재마다 ⑤를 '주소·헤더 변환(Address/Header Translation)', 'IPv4/IPv6 변환'으로 다르게 부른다. NAT-PT, NAT64가 이 방식의 대표 기술"},{"id":"netos-020","subject":"netos","topic":"IP·서브넷","sub":"IPv4 클래스·사설 IP","type":"blank","level":2,"q":"다음 ( ① )~( ④ )에 들어갈 알맞은 답을 쓰시오.","box":"- 150.20.3.4는 ( ① ) 클래스 주소다.\n- 223.1.2.3은 ( ② ) 클래스 주소다.\n- 첫 옥텟이 224~239인 ( ③ ) 클래스는 멀티캐스트용이다.\n- \u003c보기> 중 사설(Private) IP 주소를 모두 골라 기호로 쓰면 ( ④ )이다.","options":["ㄱ. 172.32.1.1","ㄴ. 192.169.0.1","ㄷ. 10.255.0.1","ㄹ. 172.15.0.1","ㅁ. 192.168.100.1"],"answers":[{"label":"①","accept":["B","B 클래스"]},{"label":"②","accept":["C","C 클래스"]},{"label":"③","accept":["D","D 클래스"]},{"label":"④","accept":["ㄷ, ㅁ","10.255.0.1, 192.168.100.1"]}],"hint":"첫 옥텟 경계 128·192·224 / 사설 대역은 10, 172.16~172.31, 192.168","explain":"| 클래스 | 첫 옥텟 | 맨 앞 비트 | 기본 마스크 | 용도 |\n|---|---|---|---|---|\n| A | 0~127 | 0 | /8 | 대규모(0, 127은 예약. 127은 루프백) |\n| B | 128~191 | 10 | /16 | 중규모 |\n| C | 192~223 | 110 | /24 | 소규모 |\n| D | 224~239 | 1110 | - | 멀티캐스트 |\n| E | 240~255 | 1111 | - | 연구용 예약 |\n- 사설 IP: 10.0.0.0/8(10.0.0.0~10.255.255.255), 172.16.0.0/12(172.16.0.0~172.31.255.255), 192.168.0.0/16\n- ④ 함정: 172.32.x, 172.15.x, 192.169.x는 사설 대역 바로 밖이라 공인 주소\n- 사설 IP로 인터넷에 나갈 때는 NAT가 공인 IP로 바꿔 준다(netos-021)"},{"id":"netos-021","subject":"netos","topic":"IP·서브넷","sub":"NAT","type":"short","past":"2020-4","level":3,"q":"다음 설명에 해당하는 기술을 영문 약어로 쓰시오.","box":"패킷이 라우터를 지날 때 IP 헤더의 사설 IP 주소(와 포트 번호)를 공인 IP 주소(와 포트 번호)로 바꿔 기록하고, 돌아오는 패킷은 다시 원래 사설 주소로 바꿔 내부 호스트에 전달하는 기술이다. 공인 IP 주소를 아끼고 내부 망 구조를 외부에 숨긴다.","answers":[{"label":"답","accept":["NAT","Network Address Translation"]}],"hint":"주소를 '번역'한다","explain":"NAT(Network Address Translation)\n- 단서: 사설 IP ↔ 공인 IP 재기록, 라우터\n- 종류: 정적 NAT(1:1 고정), 동적 NAT(공인 IP 풀에서 할당), PAT·NAPT(포트까지 바꿔 공인 IP 하나를 여럿이 공유)\n- 헷갈리는 이웃: DHCP(IP 자동 할당), ARP(IP → MAC), 프록시(응용 계층에서 요청을 대신 전달)\n- 2020-4, 2023-3 두 번 나왔다"},{"id":"netos-022","subject":"netos","topic":"IP·서브넷","sub":"NAT","type":"blank","past":"2023-3","level":3,"q":"다음 ( ① ), ( ② )에 들어갈 알맞은 용어를 영문 약어로 쓰시오.","box":"- ( ① ): 내부 네트워크의 사설 IP 주소와 외부 네트워크의 공인 IP 주소를 서로 바꿔 기록해, 사설 IP를 쓰는 호스트가 라우터를 거쳐 인터넷과 통신하게 하는 기술이다.\n- ( ② ): ①의 한 방식으로, IP 주소뿐 아니라 포트 번호까지 바꿔 공인 IP 주소 하나를 내부 호스트 여러 대가 함께 쓰게 한다. 가정용 공유기가 이 방식을 쓴다.","answers":[{"label":"①","accept":["NAT","Network Address Translation"]},{"label":"②","accept":["PAT","NAPT","Port Address Translation"]}],"hint":"② Port","explain":"- ① NAT: 2023-3 기출은 이 설명으로 NAT 하나를 쓰게 한 단답이었다\n- ② PAT(NAPT): (사설 IP, 포트) ↔ (공인 IP, 새 포트) 표를 유지해 구분한다\n\n| 방식 | 대응 |\n|---|---|\n| 정적 NAT | 사설 1 : 공인 1 고정 |\n| 동적 NAT | 공인 IP 풀에서 그때그때 1:1 |\n| PAT(NAPT) | 공인 1 : 사설 N, 포트로 구분 |\n- 효과: 공인 IP 절약, 내부 주소 은닉. 단점: 외부에서 먼저 접속하기 어렵다(포트 포워딩 필요)"},{"id":"netos-023","subject":"netos","topic":"IP·서브넷","sub":"네트워크 주소·호스트 수","type":"calc","past":"2025-2","level":3,"q":"IP 주소가 223.13.234.132이고 서브넷 마스크가 255.255.255.192일 때, ( ① ), ( ② )에 알맞은 값을 쓰시오.","box":"- 이 IP가 속한 네트워크 주소: 223.13.234.( ① )\n- 이 네트워크에서 네트워크 주소와 브로드캐스트 주소를 뺀, 호스트에 할당할 수 있는 주소의 개수: ( ② )개","answers":[{"label":"①","accept":["128","223.13.234.128"]},{"label":"②","accept":["62","62개"]}],"hint":"블록 크기 = 256 − 마스크 끝자리","explain":"1. 마스크 끝자리 192 = 11000000 → 호스트 비트 6개, /26\n2. 블록 크기 = 256 − 192 = 64 → 블록 시작 0, 64, 128, 192\n3. 132는 128~191 블록 → 네트워크 주소 223.13.234.128, 브로드캐스트 223.13.234.191\n4. 호스트 수 = 2^6 − 2 = 62 (129~190)\n- 비트로 확인: 132 = 10000100, AND 11000000 = 10000000 = 128\n- 2022-2에는 139.127.19.132, 2025-2에는 223.13.234.132로 나왔다. 마스크가 같아 답도 같다(128, 62)\n\n| /n | 마스크 끝자리 | 블록 | 호스트 |\n|---|---|---|---|\n| /25 | 128 | 128 | 126 |\n| /26 | 192 | 64 | 62 |\n| /27 | 224 | 32 | 30 |\n| /28 | 240 | 16 | 14 |\n| /29 | 248 | 8 | 6 |\n| /30 | 252 | 4 | 2 |"},{"id":"netos-024","subject":"netos","topic":"IP·서브넷","sub":"네트워크 주소·호스트 수","type":"calc","level":3,"q":"호스트 IP 주소가 172.16.45.200이고 서브넷 마스크가 255.255.255.240이다. ( ① )~( ③ )에 알맞은 값을 쓰시오.","box":"- ① 네트워크 주소\n- ② 브로드캐스트 주소\n- ③ 호스트에 할당할 수 있는 주소의 개수","answers":[{"label":"①","accept":["172.16.45.192"]},{"label":"②","accept":["172.16.45.207"]},{"label":"③","accept":["14","14개"]}],"hint":"블록 16씩 끊어 200이 들어가는 구간을 찾는다","explain":"1. 256 − 240 = 16 → /28, 블록 16\n2. 200 ÷ 16 = 12.5 → 몫 12 → 시작 12 × 16 = 192, 끝 192 + 15 = 207\n3. 네트워크 172.16.45.192, 브로드캐스트 172.16.45.207, 할당 범위 .193~.206\n4. 호스트 수 = 16 − 2 = 14\n- 172.16.x.x가 B클래스 사설 대역이어도 계산은 주어진 마스크로만 한다\n- 브로드캐스트 = 네트워크 주소 OR (마스크를 뒤집은 값)\n- 2025-2(/26) 문제의 변형"},{"id":"netos-025","subject":"netos","topic":"IP·서브넷","sub":"FLSM","type":"calc","past":"2022-3","level":3,"q":"192.168.1.0/24 네트워크를 FLSM(고정 길이 서브넷 마스크) 방식으로 3개의 서브넷으로 나누었다. 두 번째 서브넷의 브로드캐스트 주소를 쓰시오. (192.168.1.0으로 시작하는 서브넷을 첫 번째로 센다)","answers":[{"label":"답","accept":["192.168.1.127"]}],"hint":"서브넷 3개를 만들려면 빌려 올 비트가 몇 개인가","explain":"1. 서브넷 3개 → 2^n ≥ 3 → n = 2비트 → 실제로는 4개로 나뉜다(/24 + 2 = /26)\n2. FLSM은 모두 같은 크기: 256 ÷ 4 = 64\n3. 서브넷: 0~63, 64~127, 128~191, 192~255\n4. 두 번째 = 192.168.1.64/26 → 브로드캐스트 192.168.1.127\n- 0번 서브넷(192.168.1.0/26)도 첫 번째로 센다(서브넷 제로 사용). 2022-3 기출 정답 192.168.1.127도 이 기준\n- 함정: 256 ÷ 3으로 나누지 않는다. 서브넷 개수는 2의 거듭제곱 단위로만 늘어난다\n- FLSM vs VLSM: FLSM은 모든 서브넷 크기가 같아 관리가 쉽지만 주소가 남는다. VLSM은 서브넷마다 마스크 길이를 달리해 필요한 만큼만 준다(netos-033)"},{"id":"netos-026","subject":"netos","topic":"IP·서브넷","sub":"FLSM·게이트웨이","type":"calc","level":3,"q":"200.1.1.0/24 네트워크를 FLSM 방식으로 서브넷이 5개 이상 나오도록 최소한으로 나누었다. ( ① )~( ④ )에 알맞은 값을 쓰시오. (200.1.1.0으로 시작하는 서브넷을 첫 번째로 센다)","box":"- ① 나눈 뒤 서브넷의 프리픽스 길이(/n의 n)\n- ② 세 번째 서브넷의 네트워크 주소\n- ③ 세 번째 서브넷의 브로드캐스트 주소\n- ④ 세 번째 서브넷의 첫 번째 사용 가능 주소를 기본 게이트웨이(라우터 인터페이스)에 줄 때 그 주소","answers":[{"label":"①","accept":["27","/27"]},{"label":"②","accept":["200.1.1.64"]},{"label":"③","accept":["200.1.1.95"]},{"label":"④","accept":["200.1.1.65"]}],"hint":"5개 이상 → 2의 몇 제곱?","explain":"1. 2^2 = 4 \u003c 5 ≤ 2^3 = 8 → 서브넷 비트 3개 → /27, 블록 32\n2. 서브넷 시작: 0, 32, 64, 96, 128, 160, 192, 224 (8개 중 5개 이상 사용)\n3. 세 번째 = 200.1.1.64/27 → 브로드캐스트 64 + 31 = 95, 사용 가능 .65~.94(30개)\n4. 게이트웨이(첫 사용 가능 주소) = 200.1.1.65\n- 서브넷 비트 n개 → 서브넷 2^n개, 블록 크기 2^(32 − 프리픽스)\n- 라우터 IP 문제는 '첫 사용 가능 주소'인지 '마지막 사용 가능 주소'인지 조건부터 읽는다\n- 2022-3 FLSM 문제의 변형"},{"id":"netos-027","subject":"netos","topic":"IP·서브넷","sub":"같은 네트워크 판별","type":"calc","past":"2025-1","level":3,"q":"IP 주소가 192.168.35.10이고 서브넷 마스크가 255.255.252.0인 PC가 있다. 이 PC가 보낸 브로드캐스트를 받을 수 있는(같은 네트워크에 속한) IP 주소를 \u003c보기>에서 모두 골라 기호로 쓰시오.","options":["ㄱ. 192.168.34.1","ㄴ. 192.168.32.19","ㄷ. 192.168.35.200","ㄹ. 192.168.33.138","ㅁ. 192.168.35.50"],"answers":[{"label":"답","accept":["ㄱ, ㄴ, ㄷ, ㄹ, ㅁ","모두","전부","보기 모두"]}],"hint":"/22면 셋째 옥텟이 몇 단위로 묶이나","explain":"답: 보기 5개 모두\n1. 255.255.252.0 = /22 → 셋째 옥텟 블록 = 256 − 252 = 4\n2. 35 ÷ 4 = 8.75 → 시작 8 × 4 = 32 → 네트워크 192.168.32.0 ~ 브로드캐스트 192.168.35.255\n3. 보기의 셋째 옥텟 34, 32, 35, 33, 35 → 모두 32~35 안 → 전부 같은 네트워크\n- 함정: /24처럼 넷째 옥텟만 보면 35.x만 고르게 된다. 마스크가 셋째 옥텟에서 끊기면 셋째 옥텟부터 본다\n- 같은 네트워크 판별 = (IP AND 마스크)가 같은가"},{"id":"netos-028","subject":"netos","topic":"IP·서브넷","sub":"라우터 인터페이스 IP","type":"calc","past":"2024-1","level":3,"q":"다음과 같이 라우터로 연결된 네트워크에서, 같은 연결선 양 끝의 인터페이스는 같은 네트워크에 속한다. ②, ④, ⑤번 인터페이스에 할당할 수 있는 IP 주소를 \u003c보기>에서 하나씩 골라 기호로 쓰시오.","box":"| 연결 | 주어진 인터페이스 | 빈 인터페이스 |\n|---|---|---|\n| 네트워크 1 | ① 192.168.35.3/24 | ② |\n| 네트워크 2 | ③ 129.200.10.16/22 | ④ |\n| 네트워크 3 | ⑥ 192.168.36.24/24 | ⑤ |\n\n- 실제 시험에는 PC와 라우터 그림으로 나왔다. ①-②, ③-④, ⑤-⑥이 각각 같은 선으로 이어져 있다.","options":["ㄱ. 192.168.35.0","ㄴ. 192.168.35.72","ㄷ. 192.168.36.0","ㄹ. 192.168.36.249","ㅁ. 129.200.8.0","ㅂ. 129.200.8.249"],"answers":[{"label":"②","accept":["ㄴ","192.168.35.72"]},{"label":"④","accept":["ㅂ","129.200.8.249"]},{"label":"⑤","accept":["ㄹ","192.168.36.249"]}],"hint":"/22의 범위를 먼저 구하고, 호스트 부분이 모두 0인 주소는 뺀다","explain":"- ② 192.168.35.0/24: 35.0은 네트워크 주소라 불가 → ㄴ 192.168.35.72\n- ④ 129.200.10.16/22: 셋째 옥텟 블록 4 → 8~11 → 129.200.8.0 ~ 129.200.11.255. 8.0은 네트워크 주소 → ㅂ 129.200.8.249 (셋째 옥텟이 10이 아니어도 같은 대역)\n- ⑤ 192.168.36.0/24: 36.0 불가 → ㄹ 192.168.36.249\n- 할당 불가: 네트워크 주소(호스트 비트 모두 0), 브로드캐스트 주소(모두 1), 이미 쓰는 주소\n- 2026-2에 그림과 보기까지 같은 문제가 다시 나왔다"},{"id":"netos-029","subject":"netos","topic":"IP·서브넷","sub":"같은 네트워크 판별","type":"calc","level":3,"q":"IP 주소가 10.20.37.100이고 서브넷 마스크가 255.255.248.0인 PC가 있다. 이 PC와 같은 네트워크에 속하면서 다른 호스트에 할당할 수 있는 IP 주소를 \u003c보기>에서 모두 골라 기호로 쓰시오.","options":["ㄱ. 10.20.32.0","ㄴ. 10.20.33.255","ㄷ. 10.20.39.255","ㄹ. 10.20.40.1","ㅁ. 10.20.36.0","ㅂ. 10.20.31.254"],"answers":[{"label":"답","accept":["ㄴ, ㅁ","10.20.33.255, 10.20.36.0"]}],"hint":"248이면 셋째 옥텟 8 단위. 끝자리가 .0이나 .255라고 다 못 쓰는 것은 아니다","explain":"답 ㄴ, ㅁ\n1. 255.255.248.0 = /21 → 셋째 옥텟 블록 8 → 37은 32~39 → 네트워크 10.20.32.0, 브로드캐스트 10.20.39.255\n\n| 보기 | 판정 |\n|---|---|\n| ㄱ 10.20.32.0 | 네트워크 주소 → 불가 |\n| ㄴ 10.20.33.255 | 범위 안, 호스트 비트가 모두 1은 아님 → 가능 |\n| ㄷ 10.20.39.255 | 브로드캐스트 → 불가 |\n| ㄹ 10.20.40.1 | 다른 네트워크(40~47) |\n| ㅁ 10.20.36.0 | 범위 안, 호스트 비트가 모두 0은 아님 → 가능 |\n| ㅂ 10.20.31.254 | 다른 네트워크(24~31) |\n- 함정: 마스크가 셋째 옥텟에서 끊기면 넷째 옥텟 .0, .255도 중간 주소일 수 있다. 쓸 수 없는 주소는 블록 전체의 처음과 끝 하나씩뿐\n- 2024-1·2026-2(라우터 IP), 2025-1(/22 같은 망)의 변형"},{"id":"netos-030","subject":"netos","topic":"IP·서브넷","sub":"CIDR 표기","type":"calc","past":"2026-1","level":3,"q":"서브넷 마스크가 255.255.254.0일 때, 다음 두 호스트가 속한 네트워크 주소를 CIDR 표기(예: 10.0.0.0/8)로 쓰시오.","box":"- a: 192.168.11.20\n- b: 192.168.12.200","answers":[{"label":"a","accept":["192.168.10.0/23"]},{"label":"b","accept":["192.168.12.0/23"]}],"hint":"/23이면 셋째 옥텟이 2 단위로 묶인다","explain":"1. 255.255.254.0 → 1의 개수 8 + 8 + 7 = 23 → /23, 셋째 옥텟 블록 = 256 − 254 = 2\n2. a: 11은 10~11 블록 → 192.168.10.0/23 (범위 192.168.10.0 ~ 192.168.11.255)\n3. b: 12는 12~13 블록 → 192.168.12.0/23\n- 함정: a를 192.168.11.0/23으로 쓰면 틀린다. /23 블록의 셋째 옥텟은 짝수에서 시작한다\n- 비트로: 11 = 00001011, AND 11111110 = 00001010 = 10"},{"id":"netos-031","subject":"netos","topic":"IP·서브넷","sub":"슈퍼네팅","type":"calc","level":3,"q":"여러 네트워크를 라우팅 테이블 한 줄로 묶는 슈퍼네팅(경로 요약)에 대한 물음이다. ( ① )~( ③ )에 답하시오.","box":"- ① 192.168.4.0/24와 192.168.5.0/24를 하나로 묶은 네트워크를 CIDR 표기로 쓰시오.\n- ② 172.16.8.0/24, 172.16.9.0/24, 172.16.10.0/24, 172.16.11.0/24 네 개를 하나로 묶은 네트워크를 CIDR 표기로 쓰시오.\n- ③ 192.168.5.0/24와 192.168.6.0/24 두 개만 정확히 담는 /23 네트워크가 있으면 O, 없으면 X를 쓰시오.","answers":[{"label":"①","accept":["192.168.4.0/23"]},{"label":"②","accept":["172.16.8.0/22"]},{"label":"③","accept":["X","없음","없다"]}],"hint":"묶는 개수가 2^n이고, 시작 번호가 2^n의 배수여야 한 줄로 묶인다","explain":"1. ① 2개 = 2^1 → 프리픽스 1 감소 → /23. 시작 4가 2의 배수 → 192.168.4.0/23 (4.0~5.255)\n2. ② 4개 = 2^2 → /22. 시작 8이 4의 배수 → 172.16.8.0/22 (8.0~11.255)\n3. ③ /23 블록은 4~5, 6~7로 끊기므로 5와 6은 서로 다른 블록 → X. 둘을 함께 담으려면 192.168.4.0/22까지 넓혀야 하고 4·7번 대역도 들어간다\n- 서브네팅은 프리픽스를 늘려 쪼개고, 슈퍼네팅은 프리픽스를 줄여 합친다\n- 2026-1(/23 CIDR) 문제의 변형"},{"id":"netos-032","subject":"netos","topic":"IP·서브넷","sub":"프리픽스 길이","type":"calc","past":"2026-2","level":3,"q":"10.0.0.0/27 네트워크를 10.0.0.0~10.0.0.15와 10.0.0.16~10.0.0.31 두 서브넷으로 나누었다. 10.0.0.1이 속한 서브넷의 프리픽스 길이를 쓰시오.","answers":[{"label":"답","accept":["28","/28"]}],"hint":"서브넷 하나에 주소가 몇 개인가","explain":"1. 10.0.0.1은 0~15 서브넷\n2. 주소 16개 = 2^4 → 호스트 비트 4개\n3. 프리픽스 = 32 − 4 = 28 → 10.0.0.0/28\n- 다른 풀이: /27을 2개로 나눔 = 서브넷 비트 1개 추가 → 27 + 1 = 28\n- 마스크로 쓰면 255.255.255.240\n- 프리픽스 길이 = CIDR의 /n = 서브넷 마스크에서 1의 개수. 2026-2에 '프리픽스'라는 말이 처음 나와 어려웠다는 평이 많았다"},{"id":"netos-033","subject":"netos","topic":"IP·서브넷","sub":"VLSM·프리픽스 길이","type":"calc","level":3,"q":"192.168.0.0/24를 VLSM으로 다음 네 서브넷으로 나누었다. ( ① )~( ③ )에 답하시오.","box":"| 서브넷 | 주소 범위 |\n|---|---|\n| S1 | 192.168.0.0 ~ 192.168.0.127 |\n| S2 | 192.168.0.128 ~ 192.168.0.191 |\n| S3 | 192.168.0.192 ~ 192.168.0.223 |\n| S4 | 192.168.0.224 ~ 192.168.0.255 |\n\n- ① 192.168.0.200이 속한 서브넷의 프리픽스 길이\n- ② 192.168.0.100이 속한 서브넷의 프리픽스 길이\n- ③ S2에서 호스트에 할당할 수 있는 주소의 개수","answers":[{"label":"①","accept":["27","/27"]},{"label":"②","accept":["25","/25"]},{"label":"③","accept":["62","62개"]}],"hint":"범위의 주소 개수 → 2의 몇 제곱 → 32에서 뺀다","explain":"- ① 200은 S3(192~223, 32개 = 2^5) → 32 − 5 = /27\n- ② 100은 S1(0~127, 128개 = 2^7) → /25\n- ③ S2(128~191, 64개) → 64 − 2 = 62 (/26)\n- VLSM: 서브넷마다 마스크 길이가 다르다. 큰 블록부터 배치해야 겹치지 않는다\n- 2026-2(10.0.0.0/27 → /28) 문제의 변형"},{"id":"netos-034","subject":"netos","topic":"라우팅·교환","sub":"라우팅 프로토콜","type":"short","past":"2020-3","level":3,"q":"다음 설명에 해당하는 라우팅 프로토콜을 쓰시오.","box":"- RIP의 단점을 보완해 대규모 네트워크에서 쓰는 내부 라우팅 프로토콜(IGP)이다.\n- 링크 상태(Link State) 정보를 주고받고 다익스트라(Dijkstra) 알고리즘으로 최단 경로를 계산한다.\n- 네트워크에 변화가 생기면 바로 반영해 수렴이 빠르다.","answers":[{"label":"답","accept":["OSPF","Open Shortest Path First"]}],"hint":"RIP의 한계를 넘으려고 나온 네 글자 약어","explain":"OSPF(Open Shortest Path First)\n- 단서: 링크 상태, 다익스트라, 대규모, RIP 보완\n- RIP과 구분: RIP은 거리 벡터, 벨만-포드, 홉 수(최대 15), 소규모, 30초마다 테이블 전체 교환\n- OSPF 특징: 비용(Cost) 기준, AS를 영역(Area)으로 나눔(백본 Area 0), 변화가 있을 때만 정보를 전파\n\n| 구분 | 프로토콜 | 알고리즘 | 경로 기준 |\n|---|---|---|---|\n| IGP(AS 내부) | RIP | 거리 벡터(벨만-포드) | 홉 수, 최대 15 |\n| IGP(AS 내부) | OSPF | 링크 상태(다익스트라) | 비용 |\n| EGP(AS 사이) | BGP | 경로 벡터 | AS 경로, 정책 |"},{"id":"netos-035","subject":"netos","topic":"라우팅·교환","sub":"라우팅 프로토콜","type":"blank","past":"2024-1","level":3,"q":"다음은 라우팅 프로토콜을 비교한 표다. ( ① )~( ⑥ )에 들어갈 알맞은 용어나 숫자를 쓰시오.","box":"| 프로토콜 | 라우팅 방식 | 경로 계산 알고리즘 | 특징 |\n|---|---|---|---|\n| RIP | ( ① ) | 벨만-포드 | 홉 수 기준, 최대 ( ② )홉 |\n| ( ③ ) | 링크 상태 | ( ④ ) | 비용 기준, 영역(Area) 단위, AS 내부의 대규모 망 |\n| BGP | ( ⑤ ) | - | 서로 다른 ( ⑥ ) 사이의 경로 교환 |","answers":[{"label":"①","accept":["거리 벡터(Distance Vector)"]},{"label":"②","accept":["15"]},{"label":"③","accept":["OSPF"]},{"label":"④","accept":["다익스트라(Dijkstra)","데이크스트라"]},{"label":"⑤","accept":["경로 벡터(Path Vector)"]},{"label":"⑥","accept":["AS","자율 시스템","Autonomous System"]}],"hint":"① 이웃이 알려 준 거리만 믿는다, ④ 출발점에서 가까운 노드부터 확정한다","explain":"- 2024-1 기출은 '링크 상태, AS 내부, 다익스트라'를 주고 ③ OSPF를 영문 약어로 쓰게 했다. 표 전체로 넓혔다\n- ② RIP은 16홉을 '도달 불가(무한대)'로 본다 → 최대 15홉\n- 거리 벡터: 이웃에게서 받은 거리로 테이블 갱신 / 링크 상태: 망 전체 토폴로지를 알고 직접 계산 / 경로 벡터: 거쳐 갈 AS 목록을 교환\n- 쓰는 전송 프로토콜: RIP은 UDP 520, BGP는 TCP 179\n- 정적 라우팅(관리자가 경로를 직접 입력) vs 동적 라우팅(RIP·OSPF·BGP처럼 자동 갱신)"},{"id":"netos-036","subject":"netos","topic":"라우팅·교환","sub":"라우팅 프로토콜","type":"choice","past":"2026-2","level":3,"q":"다음 설명에 해당하는 라우팅 프로토콜을 \u003c보기>에서 골라 쓰시오.","box":"- 하나의 자율 시스템(AS) 안에서 쓰는 내부 게이트웨이 프로토콜(IGP)이다.\n- 각 라우터가 링크 상태 정보를 영역(Area) 안의 모든 라우터에 알리고, 모은 정보로 다익스트라 알고리즘을 돌려 최단 경로 트리를 만든다.\n- 홉 수 대신 링크 비용(Cost)을 기준으로 경로를 고른다.","options":["ㄱ. RIP","ㄴ. BGP","ㄷ. OSPF","ㄹ. EGP","ㅁ. IGRP","ㅂ. HDLC"],"answers":[{"label":"답","accept":["ㄷ","OSPF"]}],"hint":"링크 상태 + 다익스트라 + Area","explain":"OSPF\n- 2026-2 기출은 보기 없이 영문 약어로 쓰는 단답이었다. 문어CBT 해설은 지문만 보면 IS-IS(역시 링크 상태·다익스트라)도 해당할 수 있다고 적었다. 정처기 범위의 답은 OSPF\n- 오답 보기: RIP(거리 벡터, 홉 수), IGRP(시스코의 거리 벡터 IGP), BGP(AS 사이 경로 벡터), EGP(AS 사이 프로토콜의 분류 이름이자 옛 프로토콜), HDLC(데이터 링크 프로토콜)\n- OSPF 기출: 2020-3, 2024-1, 2026-2"},{"id":"netos-037","subject":"netos","topic":"라우팅·교환","sub":"라우팅 프로토콜","type":"short","past":"2023-3","level":3,"q":"다음 설명에 해당하는 라우팅 프로토콜을 영문 약어로 쓰시오.","box":"- 거리 벡터 방식의 동적 라우팅 프로토콜로, 벨만-포드 알고리즘을 쓴다.\n- 목적지까지 거치는 라우터 수(홉 수)가 가장 적은 경로를 고른다.\n- 최대 홉 수가 15로 제한되어 소규모 네트워크의 내부 라우팅 프로토콜(IGP)로 쓴다.","answers":[{"label":"답","accept":["RIP","Routing Information Protocol"]}],"hint":"홉 수만 센다","explain":"RIP(Routing Information Protocol)\n- 단서: 거리 벡터, 벨만-포드, 홉 수, 최대 15홉, 소규모\n- 30초마다 이웃에게 라우팅 테이블 전체를 보낸다. 수렴이 느리고 라우팅 루프(무한 카운트) 문제가 있다\n- 경로 계산 문제(2024-2)는 간선에 비용이 적혀 있어도 RIP이면 홉 수로 푼다 → netos-039\n- 정적 라우팅: 관리자가 경로를 직접 입력해 고정. 동적 라우팅: RIP·OSPF·BGP처럼 라우터끼리 정보를 주고받아 자동 갱신"},{"id":"netos-038","subject":"netos","topic":"라우팅·교환","sub":"IGP·EGP","type":"blank","past":"2022-2","level":3,"q":"다음은 라우팅 프로토콜에 대한 설명이다. ( ① )~( ④ )에 들어갈 알맞은 용어를 \u003c보기>에서 골라 쓰시오.","box":"- ( ① ): 하나의 자율 시스템(AS) 안에서 라우팅 정보를 교환하는 프로토콜을 통틀어 이른다. RIP과 OSPF가 여기에 속한다.\n- ( ② ): 서로 다른 자율 시스템(AS) 사이에서 라우팅 정보를 교환하는 프로토콜을 통틀어 이른다.\n- ( ③ ): RIP의 단점을 개선해 대규모 네트워크에서 쓰는 링크 상태 방식의 ①이다.\n- ( ④ ): ②의 대표 프로토콜로, ISP처럼 서로 다른 AS의 라우터끼리 경로 정보를 주고받는다.","options":["ㄱ. BGP","ㄴ. AS","ㄷ. HOP","ㄹ. OSPF","ㅁ. NAT","ㅂ. ISP","ㅅ. EGP","ㅇ. IGP"],"answers":[{"label":"①","accept":["ㅇ","IGP","Interior Gateway Protocol"]},{"label":"②","accept":["ㅅ","EGP","Exterior Gateway Protocol"]},{"label":"③","accept":["ㄹ","OSPF"]},{"label":"④","accept":["ㄱ","BGP","Border Gateway Protocol"]}],"hint":"Interior / Exterior / Border","explain":"- ① IGP(Interior): AS 안. RIP, OSPF, IGRP, EIGRP, IS-IS\n- ② EGP(Exterior): AS 사이. 대표가 BGP\n- ③ OSPF, ④ BGP(Border = AS의 경계)\n- AS(자율 시스템): 한 기관이 하나의 정책으로 관리하는 라우터 집합. 예: 통신사 하나, 대학 하나\n- 오답 보기: HOP(RIP의 거리 단위), NAT(주소 변환), ISP(인터넷 서비스 제공자)\n\n| 구분 | 프로토콜 | 알고리즘 | 경로 기준 |\n|---|---|---|---|\n| IGP(AS 내부) | RIP | 거리 벡터(벨만-포드) | 홉 수, 최대 15 |\n| IGP(AS 내부) | OSPF | 링크 상태(다익스트라) | 비용 |\n| EGP(AS 사이) | BGP | 경로 벡터 | AS 경로, 정책 |"},{"id":"netos-039","subject":"netos","topic":"라우팅·교환","sub":"RIP 경로 계산","type":"calc","past":"2024-2","level":3,"q":"라우터 A~F가 다음과 같이 연결되어 있고, 각 링크의 비용은 표와 같다. RIP을 쓸 때 라우터 A에서 F까지 패킷이 지나가는 경로를 쓰시오. (예: A → B → F)","box":"| 링크 | 비용 |\n|---|---|\n| A – B | 2 |\n| B – D | 2 |\n| A – D | 1 |\n| D – C | 2 |\n| C – E | 1 |\n| C – F | 5 |\n| E – F | 2 |\n\n- 시험에는 그래프 그림으로 나왔다. 표의 한 줄이 선 하나다.","answers":[{"label":"답","accept":["A → D → C → F","A-D-C-F","ADCF"]}],"hint":"RIP이 보는 값은 링크 비용이 아니다","explain":"답 A → D → C → F (3홉)\n1. RIP은 홉 수(거치는 링크 수)만 센다. 비용 숫자는 쓰지 않는다\n2. A에서 F까지 경로별 비교\n\n| 경로 | 홉 | 비용 합 |\n|---|---|---|\n| A-D-C-F | 3 | 8 |\n| A-D-C-E-F | 4 | 6 |\n| A-B-D-C-F | 4 | 11 |\n| A-B-D-C-E-F | 5 | 9 |\n3. 홉이 가장 적은 경로는 A-D-C-F 하나\n- 함정: 비용 합으로 풀면 A-D-C-E-F(6)가 나온다. 그건 OSPF(다익스트라)의 답이다. 실제 시험에서 이 오답을 쓴 수험생이 많았다"},{"id":"netos-040","subject":"netos","topic":"라우팅·교환","sub":"RIP·OSPF 경로 계산","type":"calc","level":3,"q":"라우터 S, A, B, C, D, T가 다음과 같이 연결되어 있다. ( ① ) RIP을 쓸 때와 ( ② ) OSPF를 쓸 때 S에서 T까지의 경로를 쓰고(예: S → A → T), ( ③ ) 라우터끼리 경로 정보를 주고받지 않고 관리자가 경로를 직접 입력해 고정하는 라우팅 방식의 이름을 쓰시오.","box":"| 링크 | 비용 |\n|---|---|\n| S – A | 1 |\n| A – B | 2 |\n| B – T | 1 |\n| S – C | 7 |\n| C – T | 2 |\n| A – D | 3 |\n| D – T | 5 |\n\n- OSPF는 표의 비용을 링크 비용으로 쓴다.","answers":[{"label":"①","accept":["S → C → T","S-C-T","SCT"]},{"label":"②","accept":["S → A → B → T","S-A-B-T","SABT"]},{"label":"③","accept":["정적 라우팅(Static Routing)","정적","스태틱 라우팅"]}],"hint":"RIP은 링크 수, OSPF는 비용 합","explain":"- ① RIP = 최소 홉: S-C-T(2홉). 나머지 경로는 모두 3홉 이상\n- ② OSPF = 최소 비용: S-A-B-T = 1 + 2 + 1 = 4. S-C-T는 7 + 2 = 9, S-A-D-T는 1 + 3 + 5 = 9\n- ③ 정적 라우팅: 경로를 손으로 고정하므로 장애가 나도 스스로 바꾸지 못한다. 반대는 동적 라우팅(RIP, OSPF, BGP)\n- 다익스트라: 출발점에서 거리가 가장 작은 노드부터 하나씩 확정하며 이웃 거리를 갱신한다\n- 2024-2 RIP 경로 문제의 변형"},{"id":"netos-041","subject":"netos","topic":"라우팅·교환","sub":"교환 방식","type":"blank","past":"2021-2","level":3,"q":"다음은 패킷 교환 방식에 대한 설명이다. ( ① ), ( ② )에 들어갈 방식을 쓰시오.","box":"- ( ① ): 패킷을 보내기 전에 목적지까지 논리적인 연결(경로)을 먼저 설정하는 연결형 방식이다. 모든 패킷이 같은 경로로 가므로 보낸 순서대로 도착한다.\n- ( ② ): 연결 설정 없이 각 패킷에 헤더(목적지 주소)를 붙여 독립적으로 보내는 비연결형 방식이다. 패킷마다 경로가 달라질 수 있어 받는 쪽에서 순서를 다시 맞춰야 한다.","answers":[{"label":"①","accept":["가상 회선 방식","가상 회선","Virtual Circuit"]},{"label":"②","accept":["데이터그램 방식","데이터그램","Datagram"]}],"hint":"① 진짜 전용선은 아니지만 선이 있는 것처럼","explain":"- ① 가상 회선: 연결형, 경로 고정, 순서 보장. 예: X.25, ATM\n- ② 데이터그램: 비연결형, 패킷마다 경로 선택, 순서가 뒤바뀔 수 있음. 예: IP\n- 같은 개념이 2021-2, 2023-1, 2024-2 세 번 나왔다\n\n| 구분 | 가상 회선 | 데이터그램 |\n|---|---|---|\n| 연결 설정 | 필요 | 불필요 |\n| 경로 | 처음 정한 경로로 고정 | 패킷마다 다름 |\n| 순서 | 보장 | 보장 안 함 |\n| 장애 | 경로가 끊기면 연결 재설정 | 다른 경로로 우회 |"},{"id":"netos-042","subject":"netos","topic":"라우팅·교환","sub":"교환 방식","type":"choice","past":"2023-1","level":3,"q":"다음 ( ① ), ( ② )에 해당하는 교환 방식을 \u003c보기>에서 골라 쓰시오.","box":"- ( ① ): 첫 패킷이 지나가며 경로를 정하면, 이후 패킷은 모두 그 경로를 따라 연속으로 전송된다. 대표 기술로 ATM이 있다.\n- ( ② ): 정해진 경로 없이 패킷마다 독립적으로 전달되며, 도착한 패킷을 목적지에서 다시 순서대로 맞춘다.","options":["ㄱ. 회선 교환","ㄴ. 패킷 교환","ㄷ. 메시지 교환","ㄹ. 가상 회선","ㅁ. 데이터그램"],"answers":[{"label":"①","accept":["ㄹ","가상 회선","가상 회선 방식","Virtual Circuit"]},{"label":"②","accept":["ㅁ","데이터그램","데이터그램 방식","Datagram"]}],"hint":"둘 다 패킷 교환을 다시 나눈 방식","explain":"- ① ㄹ 가상 회선 ② ㅁ 데이터그램. 둘 다 '패킷 교환'의 하위 방식이라 ㄴ(패킷 교환)을 쓰면 틀린다\n- 회선 교환: 통신 전에 물리적 전용 경로를 잡고 끝날 때까지 독점(전화망). 대역폭 보장, 회선 낭비\n- 메시지 교환: 메시지 전체를 교환기에 저장했다가 전달(Store and Forward). 지연이 크다\n- 패킷 교환: 메시지를 일정 크기 패킷으로 쪼개 저장 후 전달, 회선 공유 → 가상 회선 / 데이터그램"},{"id":"netos-043","subject":"netos","topic":"라우팅·교환","sub":"교환 방식","type":"blank","past":"2024-2","level":3,"q":"다음은 교환 방식을 분류한 표다. ( ① )~( ④ )에 들어갈 알맞은 용어를 쓰시오.","box":"| 대분류 | 방식 | 설명 |\n|---|---|---|\n| ( ① ) 교환 | - | 통신 전에 물리적인 전용 경로를 설정해 통신이 끝날 때까지 독점 |\n| 축적 교환 | ( ② ) 교환 | 메시지 전체를 교환기에 저장했다가 전달 |\n| 축적 교환 | 패킷 교환 중 ( ③ ) 방식 | 연결형. 논리적 경로를 먼저 설정 |\n| 축적 교환 | 패킷 교환 중 ( ④ ) 방식 | 비연결형. 패킷마다 독립 전송 |","answers":[{"label":"①","accept":["회선","회선 교환","서킷","Circuit Switching"]},{"label":"②","accept":["메시지","메시지 교환","Message Switching"]},{"label":"③","accept":["가상 회선","가상 회선 방식","Virtual Circuit"]},{"label":"④","accept":["데이터그램","데이터그램 방식","Datagram"]}],"hint":"① 전화, ② 편지를 통째로 맡긴다","explain":"- 2024-2 기출은 ③ 가상 회선, ④ 데이터그램만 물었다. 교환 방식 전체 분류로 넓혔다\n\n| 방식 | 경로 | 장점 | 단점 |\n|---|---|---|---|\n| 회선 교환 | 전용 경로 독점 | 대역폭·지연 일정, 실시간 | 회선 낭비, 설정 시간 |\n| 메시지 교환 | 통째로 저장 후 전달 | 회선 공유 | 지연 큼, 실시간 불가 |\n| 패킷 교환 | 패킷 단위 저장 후 전달 | 회선 이용률 높음 | 패킷 지연·손실 가능 |\n- 회선 교환은 다시 공간 분할 교환(SDS)과 시분할 교환(TDS)으로 나눈다"},{"id":"netos-044","subject":"netos","topic":"라우팅·교환","sub":"ATM","type":"short","past":"2023-3","level":2,"q":"다음 설명에 해당하는 전송 방식을 영문 약어로 쓰시오.","box":"- 53바이트 크기의 고정 길이 셀(Cell) 단위로 데이터를 전송한다.\n- 가상 채널을 설정하는 연결 지향 방식이며, 통계적 다중화로 음성·영상·데이터를 하나의 망에서 고속으로 처리한다.\n- B-ISDN의 핵심 전송 기술이다.","answers":[{"label":"답","accept":["ATM","Asynchronous Transfer Mode","비동기 전송 모드"]}],"hint":"Asynchronous …로 시작하는 세 글자","explain":"ATM(Asynchronous Transfer Mode, 비동기 전송 모드)\n- 단서: 53바이트 셀(헤더 5 + 페이로드 48), 고정 길이, 가상 채널·가상 경로\n- 셀 길이가 고정이라 하드웨어로 빠르게 교환한다\n- 헷갈리는 이웃: 프레임 릴레이(가변 길이 프레임, X.25를 간소화), X.25(패킷 교환망 표준, 가상 회선), HDLC(비트 중심 데이터 링크 프로토콜)\n- 가상 회선 방식의 대표 예로도 나온다(2023-1)"},{"id":"netos-045","subject":"netos","topic":"라우팅·교환","sub":"교환 방식","type":"essay","level":2,"q":"회선 교환 방식과 패킷 교환 방식의 차이를 경로 설정과 회선 이용 측면에서 약술하시오.","answers":[{"label":"답","accept":[],"model":"회선 교환은 통신 전에 송수신 사이에 물리적인 전용 경로를 설정하고 통신이 끝날 때까지 그 경로를 독점한다. 대역폭과 지연이 일정해 실시간 통신에 맞지만 보낼 데이터가 없을 때도 회선을 차지해 낭비가 생긴다. 패킷 교환은 데이터를 패킷으로 나누어 각 노드에서 저장 후 전달하며 여러 사용자가 회선을 함께 쓴다. 회선 이용률이 높고 장애가 나면 다른 경로로 돌아갈 수 있지만, 패킷마다 지연이 달라지거나 손실이 생길 수 있다."}],"hint":"전용 vs 공유","explain":"채점 포인트: ① 회선 교환 = 전용 경로 독점, 일정한 지연, 회선 낭비 ② 패킷 교환 = 패킷 단위 저장 후 전달, 회선 공유, 이용률 높음, 지연 변동\n- 출제기준 원문 키워드 '패킷 스위칭'\n- 패킷 교환의 두 방식: 가상 회선(연결형), 데이터그램(비연결형) → netos-041"},{"id":"netos-046","subject":"netos","topic":"데이터 링크·전송","sub":"HDLC","type":"choice","past":"2023-2","level":3,"q":"다음은 HDLC에 대한 설명이다. ( ① )~( ⑤ )에 들어갈 알맞은 용어를 \u003c보기>에서 골라 기호로 쓰시오.","box":"- ( ① ) 프레임: 제어부 첫 비트가 0이다. 사용자 데이터를 전달하며 확인 응답을 함께 실을 수 있다.\n- ( ② ) 프레임: 제어부가 10으로 시작한다. 데이터 없이 흐름 제어와 오류 제어 정보만 전달한다.\n- ( ③ ) 프레임: 제어부가 11로 시작한다. 순서 번호 없이 링크 설정·해제 같은 동작 모드 제어에 쓴다.\n- ( ④ ) 모드: 양쪽이 모두 혼합국이 되어 허가 없이 대등하게 명령과 응답을 주고받는다.\n- ( ⑤ ) 모드: 종국이 주국의 허가 없이도 전송을 시작할 수 있다. 링크 설정과 오류 복구는 주국이 맡는다.","options":["ㄱ. 연결제어","ㄴ. 감독","ㄷ. 정보","ㄹ. 양방향 응답","ㅁ. 익명","ㅂ. 비번호","ㅅ. 릴레이","ㅇ. 동기 균형","ㅈ. 동기 응답","ㅊ. 비동기 균형","ㅋ. 비동기 응답"],"answers":[{"label":"①","accept":["ㄷ","정보","Information","I","정보 프레임","I 프레임"]},{"label":"②","accept":["ㄴ","감독","감시","Supervisory","S","감독 프레임","S 프레임"]},{"label":"③","accept":["ㅂ","비번호","Unnumbered","U","비번호 프레임","U 프레임"]},{"label":"④","accept":["ㅊ","비동기 균형","ABM","Asynchronous Balanced Mode","비동기 균형 모드"]},{"label":"⑤","accept":["ㅋ","비동기 응답","ARM","Asynchronous Response Mode","비동기 응답 모드"]}],"hint":"프레임은 I·S·U, 모드는 '균형'이면 대등","explain":"답 ① ㄷ 정보(I) ② ㄴ 감독(S) ③ ㅂ 비번호(U) ④ ㅊ 비동기 균형(ABM) ⑤ ㅋ 비동기 응답(ARM)\n\n| 프레임 | 제어부 시작 | 역할 |\n|---|---|---|\n| I 정보 | 0 | 사용자 데이터 + 피기백 ACK |\n| S 감독 | 10 | 흐름·오류 제어 |\n| U 비번호 | 11 | 링크 설정·해제, 모드 설정 |\n\n| 모드 | 구성 | 전송 권한 |\n|---|---|---|\n| NRM 정규 응답 | 불균형(주국 1 + 종국 N) | 종국은 주국의 폴링(허가)을 받아야 전송 |\n| ARM 비동기 응답 | 불균형 점대점 | 종국이 허가 없이 전송, 링크 제어는 주국 |\n| ABM 비동기 균형 | 균형 점대점, 혼합국 | 누구나 허가 없이 전송 |\n- 2026-1에 보기 없이 같은 정의로 다시 나왔다(netos-047)\n- HDLC 프레임 구조: 플래그(01111110) – 주소부 – 제어부 – 정보부 – FCS – 플래그. 비트 중심 프로토콜이고, 1이 5개 이어지면 0을 끼워 넣는 비트 스터핑으로 데이터 투명성을 지킨다"},{"id":"netos-047","subject":"netos","topic":"데이터 링크·전송","sub":"HDLC","type":"blank","past":"2026-1","level":3,"q":"다음은 HDLC의 프레임 종류와 데이터 전송 모드에 대한 설명이다. ( ① )~( ⑥ )에 들어갈 용어를 쓰시오.","box":"- ( ① ) 프레임: 사용자 데이터를 실어 나르는 프레임\n- ( ② ) 프레임: 데이터 없이 흐름 제어와 오류 제어에 쓰는 프레임\n- ( ③ ) 프레임: 순서 번호를 쓰지 않고 링크의 설정·해제와 동작 모드 지정을 맡는 프레임\n- ( ④ ) 모드: 두 국이 대등한 혼합국이 되어 상대의 허가 없이 명령과 응답을 보낸다.\n- ( ⑤ ) 모드: 종국이 주국의 허가 없이 응답(전송)할 수 있다.\n- ( ⑥ ) 모드: 종국은 주국에게서 폴(Poll) 메시지를 받아 허가를 얻은 뒤에만 전송할 수 있다.","answers":[{"label":"①","accept":["정보(I)","Information","I 프레임","정보 프레임"]},{"label":"②","accept":["감독(S)","감시","Supervisory","S 프레임","감독 프레임","감시 프레임"]},{"label":"③","accept":["비번호(U)","Unnumbered","U 프레임","비번호 프레임"]},{"label":"④","accept":["비동기 균형 모드(ABM)","비동기 균형","Asynchronous Balanced Mode"]},{"label":"⑤","accept":["비동기 응답 모드(ARM)","비동기 응답","Asynchronous Response Mode"]},{"label":"⑥","accept":["정규 응답 모드(NRM)","정규 응답","Normal Response Mode"]}],"hint":"⑥ 주국이 묻기 전에는 말하지 못한다","explain":"- 2026-1 기출은 ①~⑤ 5칸이었다(2023-2와 같은 정의, 보기 없음). ⑥ NRM은 세 모드를 함께 외우라고 더했다\n- 모드 구분: '균형'이면 혼합국끼리 대등(ABM). '응답'이면 주국·종국이 나뉜 불균형 → 허가가 필요하면 정규(NRM), 필요 없으면 비동기(ARM)\n- 프레임 구분: I(Information) · S(Supervisory) · U(Unnumbered) / 제어부 0 · 10 · 11\n\n| 프레임 | 제어부 시작 | 역할 |\n|---|---|---|\n| I 정보 | 0 | 사용자 데이터 + 피기백 ACK |\n| S 감독 | 10 | 흐름·오류 제어 |\n| U 비번호 | 11 | 링크 설정·해제, 모드 설정 |\n\n| 모드 | 구성 | 전송 권한 |\n|---|---|---|\n| NRM 정규 응답 | 불균형(주국 1 + 종국 N) | 종국은 주국의 폴링(허가)을 받아야 전송 |\n| ARM 비동기 응답 | 불균형 점대점 | 종국이 허가 없이 전송, 링크 제어는 주국 |\n| ABM 비동기 균형 | 균형 점대점, 혼합국 | 누구나 허가 없이 전송 |\n- 다른 데이터 링크 프로토콜: PPP(문자 중심, 인증 PAP·CHAP), 프레임 릴레이(X.25를 간소화한 고속 방식), X.25(패킷 교환망 표준), ATM(53바이트 셀)"},{"id":"netos-048","subject":"netos","topic":"데이터 링크·전송","sub":"오류 제어","type":"choice","past":"2023-2","level":3,"q":"다음은 오류 제어에 대한 설명이다. ( ① )~( ⑤ )에 들어갈 알맞은 용어를 \u003c보기>에서 골라 쓰시오.","box":"- ( ① ): 벨 연구소에서 만든 부호로, 여러 개의 패리티 비트를 넣어 1비트 오류를 검출하고 위치를 찾아 정정한다.\n- ( ② ): 데이터와 함께 부가 정보를 보내 수신 측이 재전송 요청 없이 스스로 오류를 검출하고 정정하는 방식이다.\n- ( ③ ): 수신 측이 오류를 검출하면 송신 측에 재전송을 요청하는 방식이다.\n- ( ④ ): 데이터 끝에 1비트를 더해 1의 개수를 짝수나 홀수로 맞추고, 데이터가 손상되었는지 점검한다.\n- ( ⑤ ): 미리 정한 생성 다항식으로 나눈 나머지를 검사값으로 붙여 보내고, 받는 쪽이 같은 계산으로 오류를 확인한다.","options":["ㄱ. EAC","ㄴ. FEC","ㄷ. hamming","ㄹ. CRC","ㅁ. PDS","ㅂ. parity","ㅅ. BEC"],"answers":[{"label":"①","accept":["ㄷ","hamming","해밍 코드","Hamming Code"]},{"label":"②","accept":["ㄴ","FEC","Forward Error Correction","전진 오류 수정","전진 오류 정정","순방향 오류 정정"]},{"label":"③","accept":["ㅅ","BEC","Backward Error Correction","후진 오류 수정","후진 오류 정정","역방향 오류 정정"]},{"label":"④","accept":["ㅂ","parity","패리티 검사","패리티"]},{"label":"⑤","accept":["ㄹ","CRC","순환 중복 검사"]}],"hint":"② 앞으로(Forward), ③ 뒤로(Backward)","explain":"답 ① ㄷ hamming ② ㄴ FEC ③ ㅅ BEC ④ ㅂ parity ⑤ ㄹ CRC\n\n| 구분 | 방식 | 재전송 | 예 |\n|---|---|---|---|\n| 전진 오류 수정(FEC) | 수신 측이 직접 정정 | 없음 | 해밍 코드, 상승 코드 |\n| 후진 오류 수정(BEC) | 검출 후 재전송 요청 | 있음(ARQ) | 패리티, CRC, 체크섬으로 검출 |\n- 패리티: 1비트 오류만 검출. 짝수 개 비트가 바뀌면 못 잡고, 정정도 못 한다\n- 해밍 코드: 2^n 위치(1, 2, 4, 8 …)에 패리티 비트. 1비트 오류 정정\n- CRC: 다항식 나눗셈. 집단(버스트) 오류에 강하다. HDLC의 FCS가 CRC\n- 체크섬: 데이터를 더한 값(1의 보수 합)으로 검사\n- 오답 보기 EAC, PDS는 오류 제어 용어가 아니다\n- 2025-3에 같은 정의가 보기만 바뀌어 다시 나왔다(netos-049)"},{"id":"netos-049","subject":"netos","topic":"데이터 링크·전송","sub":"오류 제어","type":"choice","past":"2025-3","level":3,"q":"다음 ( ① )~( ⑤ )에 해당하는 오류 제어 기법을 \u003c보기>에서 골라 쓰시오.","box":"- ( ① ): 송신 측과 수신 측이 같은 생성 다항식을 쓰는 오류 검출 방식\n- ( ② ): 데이터 블록 끝에 검사 비트 1개를 더해 오류를 검출하는 방식\n- ( ③ ): 오류가 생기면 수신 측이 송신 측에 재전송을 요구하는 방식\n- ( ④ ): 재전송 없이 수신 측이 오류를 고치는 방식\n- ( ⑤ ): 검사 비트 여러 개를 써서 오류 검출은 물론 수정까지 하는 코드","options":["ㄱ. CRC","ㄴ. FEC","ㄷ. BEC","ㄹ. NAK","ㅁ. Parity","ㅂ. MD5","ㅅ. BCD","ㅇ. Hamming"],"answers":[{"label":"①","accept":["ㄱ","CRC","Cyclic Redundancy Check","순환 중복 검사"]},{"label":"②","accept":["ㅁ","Parity","패리티","Parity Check","패리티 검사"]},{"label":"③","accept":["ㄷ","BEC","Backward Error Correction","후진 오류 수정"]},{"label":"④","accept":["ㄴ","FEC","Forward Error Correction","전진 오류 수정"]},{"label":"⑤","accept":["ㅇ","Hamming","해밍 코드","Hamming Code"]}],"hint":"④·⑤는 고치고, ①·②는 찾기만 한다","explain":"- 2025-3 기출은 ① Hamming ② FEC ③ BEC ④ Parity ⑤ CRC 순서였다. 2023-2와 보기만 다르고 정의와 답이 같아 여기서는 순서를 섞었다\n- 함정 보기: NAK(오류가 났다고 알리는 부정 응답 신호. 방식 이름이 아님, ARQ에서 쓰임), MD5(해시 함수, 보안), BCD(10진수 한 자리를 4비트로 쓰는 코드)\n- 검출만: 패리티, CRC, 체크섬 / 검출 + 정정: 해밍 코드\n- ARQ 3종 → netos-051\n\n| 구분 | 방식 | 재전송 | 예 |\n|---|---|---|---|\n| 전진 오류 수정(FEC) | 수신 측이 직접 정정 | 없음 | 해밍 코드, 상승 코드 |\n| 후진 오류 수정(BEC) | 검출 후 재전송 요청 | 있음(ARQ) | 패리티, CRC, 체크섬으로 검출 |"},{"id":"netos-050","subject":"netos","topic":"데이터 링크·전송","sub":"오류 제어","type":"short","past":"2025-1","level":3,"q":"다음 설명에 해당하는 오류 검출 방식을 영문 약어 3글자로 쓰시오.","box":"- 송신 측은 데이터를 미리 정한 생성 다항식(예: x³ + x + 1)으로 2진 나눗셈하고, 그 나머지를 검사값으로 데이터 뒤에 붙여 보낸다.\n- 수신 측은 받은 데이터를 같은 다항식으로 나누어 나머지가 0인지 보고 변경 여부를 판단한다.\n- 여러 비트가 연달아 깨지는 집단 오류를 잘 검출한다.","answers":[{"label":"답","accept":["CRC","Cyclic Redundancy Check"]}],"hint":"이더넷·HDLC 프레임 끝 FCS에 들어가는 값","explain":"CRC(Cyclic Redundancy Check, 순환 중복 검사)\n- 단서: 생성 다항식, 나머지, 집단(버스트) 오류\n- 덧붙이는 나머지를 FCS(Frame Check Sequence)라 부른다. HDLC·이더넷 프레임 끝의 FCS가 CRC\n- 검출만 하고 정정은 못 한다 → 오류가 나면 재전송(BEC, ARQ)\n- 이웃: 패리티(1비트 추가, 단일 비트 오류만), 체크섬(합계로 검사), 해밍 코드(정정까지, FEC)"},{"id":"netos-051","subject":"netos","topic":"데이터 링크·전송","sub":"ARQ","type":"blank","level":2,"q":"다음은 ARQ(Automatic Repeat reQuest) 방식에 대한 설명이다. ( ① )~( ④ )에 들어갈 방식을 \u003c보기>에서 골라 쓰시오.","box":"- ( ① ): 프레임을 하나 보내고 수신 측의 ACK나 NAK를 받을 때까지 기다린다. 구현이 단순하지만 기다리는 시간이 길다.\n- ( ② ): 여러 프레임을 연속으로 보내다가 NAK를 받으면, 오류가 난 프레임부터 그 뒤에 보낸 프레임까지 모두 다시 보낸다.\n- ( ③ ): 여러 프레임을 연속으로 보내고, 오류가 난 프레임만 골라 다시 보낸다. 수신 측에 순서를 맞출 버퍼가 필요하다.\n- ( ④ ): 채널 상태에 따라 보낼 프레임(블록)의 길이를 바꿔 가며 전송한다.","options":["ㄱ. Go-Back-N ARQ","ㄴ. Selective Repeat ARQ","ㄷ. Stop-and-Wait ARQ","ㄹ. Adaptive ARQ","ㅁ. Sliding Window","ㅂ. FEC"],"answers":[{"label":"①","accept":["ㄷ","Stop-and-Wait ARQ","Stop-and-Wait","정지-대기 ARQ","정지-대기"]},{"label":"②","accept":["ㄱ","Go-Back-N ARQ","Go-Back-N","GBN"]},{"label":"③","accept":["ㄴ","Selective Repeat ARQ","Selective Repeat","선택적 재전송 ARQ","선택적 재전송"]},{"label":"④","accept":["ㄹ","Adaptive ARQ","적응적 ARQ"]}],"hint":"② N개 뒤로 돌아간다","explain":"- ARQ = 후진 오류 수정(BEC)에서 재전송을 요청하는 절차\n\n| 방식 | 보내는 방법 | 다시 보내는 범위 |\n|---|---|---|\n| 정지-대기 | 1개 보내고 대기 | 그 1개 |\n| Go-Back-N | 연속 전송 | 오류 프레임부터 그 뒤 전부 |\n| 선택적 재전송 | 연속 전송 | 오류 프레임만 |\n| 적응적 | 블록 길이를 채널 상태에 맞춤 | - |\n- Go-Back-N vs 선택적 재전송: GBN은 순서가 어긋난 프레임을 버려 수신 버퍼가 단순하고, 선택적 재전송은 받아 두었다가 재정렬하므로 버퍼가 필요하다\n- 연속 ARQ = Go-Back-N + 선택적 재전송\n- 슬라이딩 윈도우는 연속 전송의 흐름 제어 기법이고 ARQ 방식 이름은 아니다"},{"id":"netos-052","subject":"netos","topic":"데이터 링크·전송","sub":"오류 제어","type":"essay","level":2,"q":"오류 제어 방식 중 전진 오류 수정(FEC)과 후진 오류 수정(BEC)의 차이를 약술하고, 각각의 대표 기법을 하나씩 쓰시오.","answers":[{"label":"답","accept":[],"model":"FEC는 송신 측이 오류 정정용 부가 비트를 함께 보내 수신 측이 재전송 요청 없이 오류를 검출하고 직접 정정하는 방식으로, 역채널이 필요 없어 실시간이나 단방향 전송에 맞다(해밍 코드). BEC는 수신 측이 오류를 검출만 하고 송신 측에 재전송을 요청하는 방식으로, 부가 비트는 적지만 역채널과 재전송 지연이 필요하다(패리티·CRC로 검출하고 ARQ로 재전송)."}],"hint":"누가 고치나","explain":"채점 포인트: ① FEC = 수신 측 직접 정정, 재전송 없음, 역채널 불필요 ② BEC = 검출 후 재전송 요청(ARQ) ③ 예\n- FEC 예: 해밍 코드, 상승 코드 / BEC 검출: 패리티, CRC, 체크섬 / ARQ: 정지-대기, Go-Back-N, 선택적 재전송, 적응적\n- FEC가 맞는 곳: 위성·방송처럼 재전송이 어렵거나 실시간인 전송"},{"id":"netos-053","subject":"netos","topic":"데이터 링크·전송","sub":"다중화","type":"blank","level":2,"q":"다음은 다중화(Multiplexing) 방식에 대한 설명이다. ( ① )~( ④ )에 들어갈 방식을 영문 약어로 쓰시오.","box":"- ( ① ): 전송 매체의 주파수 대역을 여러 채널로 나누어 동시에 보낸다. 채널 사이의 간섭을 막는 보호 대역이 필요하다.\n- ( ② ): 전송 시간을 짧은 타임 슬롯으로 나누어 각 채널에 차례로 배정한다. 데이터가 있는 채널에만 슬롯을 주면 통계적 방식이다.\n- ( ③ ): 사용자마다 서로 다른 고유 코드를 주어 같은 시간, 같은 주파수에서 동시에 보낸다.\n- ( ④ ): 광섬유 하나에 서로 다른 파장의 빛을 실어 여러 신호를 동시에 보낸다.","answers":[{"label":"①","accept":["FDM","Frequency Division Multiplexing","주파수 분할 다중화"]},{"label":"②","accept":["TDM","Time Division Multiplexing","시분할 다중화"]},{"label":"③","accept":["CDM","Code Division Multiplexing","코드 분할 다중화"]},{"label":"④","accept":["WDM","Wavelength Division Multiplexing","파장 분할 다중화"]}],"hint":"주파수 · 시간 · 코드 · 파장","explain":"| 방식 | 나누는 것 | 특징 |\n|---|---|---|\n| FDM | 주파수 | 보호 대역(Guard Band), 아날로그 |\n| TDM | 시간 | 동기식(슬롯 고정) / 통계적·비동기식(필요한 채널에만) |\n| CDM | 코드 | 이동통신 CDMA |\n| WDM | 빛의 파장 | 광섬유 |\n- 다중화: 회선 하나로 여러 신호를 동시에 보내는 기술. 받는 쪽에서 다시 나누는 것은 역다중화"},{"id":"netos-054","subject":"netos","topic":"데이터 링크·전송","sub":"토폴로지·매체 접근·PPP","type":"blank","level":2,"q":"다음은 LAN의 토폴로지, 매체 접근 방식, 데이터 링크 프로토콜에 대한 설명이다. ( ① )~( ⑦ )에 들어갈 답을 \u003c보기>에서 고르거나 숫자로 쓰시오.","box":"- ( ① )형: 중앙 노드(허브·스위치)에 모든 단말이 1:1로 연결된다. 중앙 노드가 고장 나면 전체가 멈춘다.\n- ( ② )형: 이웃 노드끼리 원형으로 이어져 데이터가 한 방향으로 돈다. 노드 하나의 고장이 전체에 영향을 준다.\n- ( ③ )형: 케이블 하나에 모든 노드가 연결된다. 노드를 붙이고 떼기 쉽지만 트래픽이 늘면 충돌이 잦다.\n- ( ④ )형: 모든 노드가 서로 직접 연결된다. 노드가 10개면 필요한 회선 수는 ( ⑤ )개다.\n- ( ⑥ ): IEEE 802.11 무선 LAN의 매체 접근 방식이다. 전송 중 충돌을 감지하기 어려워, 보내기 전에 일정 시간 기다리거나 RTS/CTS를 주고받아 충돌을 미리 피한다.\n- ( ⑦ ): 두 노드를 직렬 회선으로 직접 잇는 문자(바이트) 중심 데이터 링크 프로토콜로, PAP·CHAP 인증과 IP 주소 협상을 지원한다.","options":["ㄱ. 성(Star)","ㄴ. 링(Ring)","ㄷ. 버스(Bus)","ㄹ. 망(Mesh)","ㅁ. 계층(Tree)","ㅂ. CSMA/CD","ㅅ. CSMA/CA","ㅇ. 토큰 링","ㅈ. PPP","ㅊ. HDLC"],"answers":[{"label":"①","accept":["ㄱ","성","성형","Star","스타"]},{"label":"②","accept":["ㄴ","링","링형","Ring","환형"]},{"label":"③","accept":["ㄷ","버스","버스형","Bus"]},{"label":"④","accept":["ㄹ","망","망형","Mesh","메시","메쉬"]},{"label":"⑤","accept":["45","45개"]},{"label":"⑥","accept":["ㅅ","CSMA/CA"]},{"label":"⑦","accept":["ㅈ","PPP","Point-to-Point Protocol"]}],"hint":"⑤ n(n−1)/2, ⑥ 피한다(Avoidance)","explain":"- ⑤ 망형 회선 수 = n(n−1)/2 = 10 × 9 ÷ 2 = 45. 노드 하나의 포트 수 = n − 1 = 9\n- 토폴로지: 성형(중앙 집중), 링형(원형), 버스형(한 줄), 계층형(트리), 망형(그물, 신뢰성과 비용 모두 최고)\n- CSMA/CD(IEEE 802.3 유선 이더넷): 전송 중 충돌을 감지(Detection)하면 멈추고 임의 시간 뒤 다시 보낸다\n- CSMA/CA(IEEE 802.11 무선 LAN): 충돌을 회피(Avoidance). 무선은 보내는 중에 충돌을 감지하기 어렵다\n- 토큰 링(IEEE 802.5): 토큰을 가진 노드만 전송\n- ⑦ PPP: 점대점 직렬 링크, 문자(바이트) 중심, 오류 검출만 하고 복구는 상위 계층에 맡김. 인증 PAP(평문)·CHAP(챌린지-응답). HDLC는 비트 중심이라 다르다"},{"id":"netos-055","subject":"netos","topic":"무선·네트워크 신기술","sub":"애드혹 네트워크","type":"short","past":"2021-2","level":3,"q":"다음 설명에 해당하는 네트워크를 쓰시오.","box":"- 기지국이나 AP(액세스 포인트) 같은 기반 시설 없이 노드(단말)끼리 무선으로 망을 구성한다.\n- 노드가 움직이므로 네트워크 토폴로지가 수시로 바뀐다.\n- 긴급 구조, 긴급 회의, 전쟁터의 군사 통신처럼 기반 시설을 쓸 수 없는 곳에 쓴다.","answers":[{"label":"답","accept":["애드혹 네트워크(Ad-hoc Network)","애드혹","Ad hoc Network","Ad-hoc"]}],"hint":"라틴어로 '이것을 위해', 곧 임시로","explain":"애드혹 네트워크(Ad-hoc Network)\n- 단서: 기지국·AP 없음, 노드끼리, 토폴로지가 바뀜, 긴급·군사\n\n| 용어 | 핵심 |\n|---|---|\n| MANET | 이동 노드로 구성한 애드혹 망(Mobile Ad-hoc Network) |\n| 메시 네트워크 | 노드가 그물처럼 서로 중계, 대규모 디바이스 망·공공 안전 |\n| 인프라스트럭처 모드 | AP를 거쳐 통신하는 일반 무선 LAN |\n| WSN | 센서 노드로 환경 정보를 모으는 무선 센서 망(USN) |\n- 2024-3에 보기 고르기로 다시 나왔다(netos-056)"},{"id":"netos-056","subject":"netos","topic":"무선·네트워크 신기술","sub":"애드혹 네트워크","type":"choice","past":"2024-3","level":3,"q":"다음 설명에 해당하는 네트워크를 \u003c보기>에서 골라 기호로 쓰시오.","box":"중앙 관리 장치나 고정된 기반 시설 없이 무선 노드들이 스스로 임시 네트워크를 구성한다. 각 노드가 라우터 역할을 함께 맡아 패킷을 중계하며, 재난 현장의 긴급 구조나 군사 작전처럼 기반 시설을 기대할 수 없는 환경에서 쓴다.","options":["ㄱ. Infrastructure Network","ㄴ. Firmware","ㄷ. Peer-to-Peer Network","ㄹ. Ad-hoc Network","ㅁ. Mesh Network","ㅂ. Sensor Network","ㅅ. Virtual Private Network"],"answers":[{"label":"답","accept":["ㄹ","Ad-hoc Network","애드혹 네트워크","애드혹"]}],"hint":"'임시'가 열쇠","explain":"답 ㄹ Ad-hoc Network\n- Mesh Network: 노드끼리 그물처럼 서로 중계하는 망. 교재 정의는 '차세대 이동통신, 홈 네트워킹, 공공 안전 같은 특수 목적에 쓰고 대규모 디바이스 망을 만드는 데 알맞은 네트워크'\n- 노드가 중계한다는 점은 메시도 같다. '임시', '기반 시설 없음', '긴급 구조·군사'가 애드혹을 가르는 단서\n- Peer-to-Peer: 서버 없이 단말끼리 자원을 나누는 응용 구조(파일 공유). 무선 망 구성 방식이 아니다\n- Infrastructure: AP·기지국을 거치는 방식(애드혹의 반대)\n- Sensor Network: 센서 노드가 데이터를 모은다\n- VPN: 공중망 위에 암호화한 사설망(보안) / Firmware: 하드웨어에 내장된 소프트웨어\n- 애드혹 기출: 2021-2(단답), 2024-3(보기)"},{"id":"netos-057","subject":"netos","topic":"무선·네트워크 신기술","sub":"무선망·SDN·NFV","type":"blank","level":1,"q":"다음 ( ① )~( ⑤ )에 들어갈 알맞은 용어를 \u003c보기>에서 골라 쓰시오.","box":"- ( ① ): 차세대 이동통신, 홈 네트워킹, 공공 안전 같은 특수 목적에 쓰는 네트워크로, 노드들이 그물처럼 연결되어 서로의 데이터를 중계한다. 대규모 디바이스 망을 만드는 데 알맞다.\n- ( ② ): 블루투스나 UWB 기기 여러 대가 마스터 1대와 슬레이브(동시에 최대 7대 동작)로 구성하는 소규모 무선 망이다.\n- ( ③ ): 이동 노드로만 구성되어 기반 시설 없이 동작하는 애드혹 망이다.\n- ( ④ ): 네트워크의 제어 기능(컨트롤 플레인)을 데이터 전달 기능(데이터 플레인)에서 떼어 내, 중앙 컨트롤러의 소프트웨어로 망 전체를 프로그래밍하듯 제어한다.\n- ( ⑤ ): 라우터, 방화벽, 로드 밸런서 같은 네트워크 장비의 기능을 전용 하드웨어 대신 범용 서버 위의 가상화된 소프트웨어로 구현한다.","options":["ㄱ. 피코넷(Piconet)","ㄴ. 메시 네트워크(Mesh Network)","ㄷ. MANET","ㄹ. WSN","ㅁ. SDN","ㅂ. NFV","ㅅ. VPN","ㅇ. 스캐터넷(Scatternet)"],"answers":[{"label":"①","accept":["ㄴ","메시 네트워크","Mesh Network"]},{"label":"②","accept":["ㄱ","피코넷","Piconet"]},{"label":"③","accept":["ㄷ"
