 값은 서로 달라야 한다 | UNIQUE |"},{"id":"db-025","subject":"db","topic":"관계 모델","sub":"무결성","type":"short","past":"2023-3","level":3,"q":"다음 설명에 해당하는 무결성 제약 조건을 쓰시오.","box":"- 두 릴레이션 사이의 일관성을 유지하기 위한 제약 조건이다.\n- 외래키 값은 NULL이거나, 참조되는 릴레이션의 기본키 값 중 하나와 같아야 한다.\n- 예를 들어 \u003c수강> 테이블의 학번에는 \u003c학생> 테이블에 없는 학번을 넣을 수 없고, 수강 기록이 남아 있는 학생을 \u003c학생> 테이블에서 마음대로 지울 수도 없다.","answers":[{"label":"답","accept":["참조 무결성","Referential Integrity","참조"]}],"hint":"외래키","explain":"정답: 참조 무결성\n- 단서: 두 릴레이션 사이, 외래키, 참조되는 릴레이션의 기본키 값 또는 NULL\n- 부모 행 삭제·수정 시 처리 옵션: CASCADE(같이 삭제·수정), SET NULL, SET DEFAULT, RESTRICT·NO ACTION(거부)\n- 개체 무결성과 구분: 개체 = 한 릴레이션 안의 기본키, 참조 = 두 릴레이션 사이의 외래키\n\n| 무결성 | 규칙 | SQL 구현 |\n|---|---|---|\n| 개체 | 기본키는 NULL·중복 불가 | PRIMARY KEY |\n| 참조 | 외래키는 참조 대상 기본키 값이거나 NULL | FOREIGN KEY |\n| 도메인 | 속성 값은 정의된 도메인(타입·범위) 안 | CHECK, DOMAIN, DEFAULT |\n| 사용자 정의 | 업무 규칙(사용자가 정한 제약)을 지킨다 | 트리거, CHECK |\n| 키 | 한 릴레이션에 키가 적어도 하나 있어야 하고, 같은 키 값을 가진 튜플은 허용하지 않는다 | UNIQUE |\n| NULL | 특정 속성은 NULL 불가 | NOT NULL |\n| 고유 | 특정 속성 값은 서로 달라야 한다 | UNIQUE |"},{"id":"db-026","subject":"db","topic":"관계 모델","sub":"무결성","type":"blank","past":"2025-1","level":3,"q":"다음은 무결성 제약 조건을 비교한 표이다. ①~③에 들어갈 무결성을 \u003c보기>에서 골라 쓰시오.","box":"| 구분 | 대상 | 내용 |\n|---|---|---|\n| ( ① ) 무결성 | 속성 | 속성 값은 정의된 도메인에 속해야 한다. 값의 타입·범위·형식을 제한한다 |\n| ( ② ) 무결성 | 튜플 | 기본키는 NULL이나 중복 값을 가질 수 없다. 릴레이션마다 기본키 하나로 보장한다 |\n| ( ③ ) 무결성 | 속성과 튜플 | 외래키 값은 참조하는 테이블의 기본키 값이거나 NULL이어야 한다. 부모 테이블과의 일관성을 지킨다 |","options":["ㄱ. 개체","ㄴ. 참조","ㄷ. 도메인"],"answers":[{"label":"①","accept":["도메인","ㄷ","도메인 무결성","Domain Integrity"]},{"label":"②","accept":["개체","ㄱ","개체 무결성","Entity Integrity"]},{"label":"③","accept":["참조","ㄴ","참조 무결성","Referential Integrity"]}],"hint":"값의 범위 / 기본키 / 외래키","explain":"정답: ① 도메인 ② 개체 ③ 참조\n- '대상' 칸이 단서다. 속성 하나의 값 → 도메인, 튜플 식별(기본키) → 개체, 두 테이블에 걸침(외래키) → 참조\n- 2023년 3회(참조), 2024년 3회(개체), 2025년 1회(셋 비교)로 3회 나왔다\n\n| 무결성 | 규칙 | SQL 구현 |\n|---|---|---|\n| 개체 | 기본키는 NULL·중복 불가 | PRIMARY KEY |\n| 참조 | 외래키는 참조 대상 기본키 값이거나 NULL | FOREIGN KEY |\n| 도메인 | 속성 값은 정의된 도메인(타입·범위) 안 | CHECK, DOMAIN, DEFAULT |\n| 사용자 정의 | 업무 규칙(사용자가 정한 제약)을 지킨다 | 트리거, CHECK |\n| 키 | 한 릴레이션에 키가 적어도 하나 있어야 하고, 같은 키 값을 가진 튜플은 허용하지 않는다 | UNIQUE |\n| NULL | 특정 속성은 NULL 불가 | NOT NULL |\n| 고유 | 특정 속성 값은 서로 달라야 한다 | UNIQUE |"},{"id":"db-027","subject":"db","topic":"관계 모델","sub":"무결성","type":"blank","level":2,"q":"다음 상황과 관련된 무결성 제약 조건을 \u003c보기>에서 골라 쓰시오.","box":"① \u003c학생> 테이블의 학년 속성에는 1~4만 허용되는데 5를 입력하려 하자 거부되었다.\n② '주문 수량은 그 상품의 재고 수량보다 클 수 없다'는 회사 업무 규칙을 어긴 주문이 거부되었다.\n③ 한 릴레이션에는 튜플을 구별할 키가 적어도 하나 존재해야 하고, 같은 키 값을 가진 튜플이 둘 이상 있으면 안 된다.","options":["ㄱ. 개체 무결성","ㄴ. 참조 무결성","ㄷ. 도메인 무결성","ㄹ. 사용자 정의 무결성","ㅁ. 키 무결성","ㅂ. NULL 무결성"],"answers":[{"label":"①","accept":["도메인 무결성","ㄷ","도메인"]},{"label":"②","accept":["사용자 정의 무결성","ㄹ","사용자 정의","사용자 무결성"]},{"label":"③","accept":["키 무결성","ㅁ","키"]}],"hint":"값의 범위 / 업무 규칙 / 튜플 식별 수단","explain":"정답: ① 도메인 ② 사용자 정의 ③ 키\n- ① 학년의 허용 범위(1~4) → 도메인(값의 범위). 기본키나 외래키와 무관하다\n- ② DBMS가 원래 아는 규칙이 아니라 **회사가 정한 업무 규칙** → 사용자 정의 무결성. 주로 트리거나 CHECK로 구현한다\n- ③ 키가 적어도 하나 있고 같은 키 값이 중복되면 안 된다 → 키 무결성\n- 키 무결성 정의는 교재마다 문장이 다르다. 수제비·감자: '하나의 릴레이션에 적어도 하나의 키가 존재해야 한다'. 시나공: '한 릴레이션에 같은 키 값을 가진 튜플들은 허용되지 않는다'. 둘 다 키 무결성으로 답한다\n- 헷갈리는 쌍: 개체 무결성은 '기본키'의 NULL·중복 금지, 키 무결성은 '키가 있어야 하고 키 값이 유일해야 한다'는 더 넓은 규칙\n\n| 무결성 | 규칙 | SQL 구현 |\n|---|---|---|\n| 개체 | 기본키는 NULL·중복 불가 | PRIMARY KEY |\n| 참조 | 외래키는 참조 대상 기본키 값이거나 NULL | FOREIGN KEY |\n| 도메인 | 속성 값은 정의된 도메인(타입·범위) 안 | CHECK, DOMAIN, DEFAULT |\n| 사용자 정의 | 업무 규칙(사용자가 정한 제약)을 지킨다 | 트리거, CHECK |\n| 키 | 한 릴레이션에 키가 적어도 하나 있어야 하고, 같은 키 값을 가진 튜플은 허용하지 않는다 | UNIQUE |\n| NULL | 특정 속성은 NULL 불가 | NOT NULL |\n| 고유 | 특정 속성 값은 서로 달라야 한다 | UNIQUE |"},{"id":"db-028","subject":"db","topic":"관계대수","sub":"연산 기호","type":"blank","past":"2022-3","level":3,"q":"다음은 관계대수 연산의 이름이다. 각 연산의 기호를 \u003c보기>에서 골라 쓰시오.","box":"① 합집합(Union)\n② 차집합(Difference)\n③ 카티션 프로덕트(Cartesian Product)\n④ 프로젝트(Project)\n⑤ 조인(Join)","options":["ㄱ. σ","ㄴ. π","ㄷ. ∪","ㄹ. ∩","ㅁ. −","ㅂ. ×","ㅅ. ÷","ㅇ. ⋈","ㅈ. ρ"],"answers":[{"label":"①","accept":["ㄷ","∪"]},{"label":"②","accept":["ㅁ","−","-"]},{"label":"③","accept":["ㅂ","×"]},{"label":"④","accept":["ㄴ","π"]},{"label":"⑤","accept":["ㅇ","⋈"]}],"hint":"집합 연산 셋과 관계 연산 둘","explain":"정답: ① ∪ ② − ③ × ④ π ⑤ ⋈\n- 함정: σ(셀렉트, 행)와 π(프로젝트, 열)를 바꿔 쓰는 실수가 가장 많다. **σ = Sigma = Select = 행**, **π = Pi = Project = 열**\n- ρ는 Rename이라 보기에만 있는 함정이다\n\n| 구분 | 연산 | 기호 | 뜻 |\n|---|---|---|---|\n| 순수 관계 | 셀렉트(Select) | σ | 조건에 맞는 **행** (수평 부분집합) |\n| 순수 관계 | 프로젝트(Project) | π | 지정한 **열** (수직 부분집합, 중복 제거) |\n| 순수 관계 | 조인(Join) | ⋈ | 공통 속성으로 두 릴레이션 결합 |\n| 순수 관계 | 디비전(Division) | ÷ | S의 **모든** 값과 짝을 이루는 R의 튜플 |\n| 일반 집합 | 합집합 | ∪ | 둘 중 하나에 있는 튜플 |\n| 일반 집합 | 교집합 | ∩ | 둘 다 있는 튜플 |\n| 일반 집합 | 차집합 | − | 앞에만 있는 튜플 |\n| 일반 집합 | 카티션 프로덕트 | × | 모든 조합. 차수는 더하고 카디널리티는 곱한다 |\n- ∪ ∩ −는 두 릴레이션의 속성 수와 도메인이 같아야 한다(합병 가능). ×는 조건 없음\n- ρ(rho)는 이름 바꾸기(Rename)"},{"id":"db-029","subject":"db","topic":"관계대수","sub":"연산 기호","type":"blank","past":"2023-3","level":3,"q":"다음은 순수 관계 연산자에 대한 설명이다. ①~④에 해당하는 기호를 \u003c보기>에서 골라 기호로 쓰시오.","box":"① 두 릴레이션에서 공통 속성의 값이 같은 튜플끼리 결합해 하나의 릴레이션을 만든다.\n② 릴레이션에서 지정한 속성(열)만 뽑아 수직적 부분집합을 만든다.\n③ 릴레이션에서 조건을 만족하는 튜플(행)만 뽑아 수평적 부분집합을 만든다.\n④ 릴레이션 R의 튜플 중 릴레이션 S의 모든 튜플과 관계가 있는 것만 골라, S의 속성을 뺀 나머지 속성을 돌려준다.","options":["ㄱ. σ","ㄴ. π","ㄷ. ⋈","ㄹ. ÷"],"answers":[{"label":"①","accept":["ㄷ","⋈"]},{"label":"②","accept":["ㄴ","π"]},{"label":"③","accept":["ㄱ","σ"]},{"label":"④","accept":["ㄹ","÷"]}],"hint":"수평 = 행, 수직 = 열","explain":"정답: ① ⋈ (Join) ② π (Project) ③ σ (Select) ④ ÷ (Division)\n- 수평(행) 부분집합 = σ, 수직(열) 부분집합 = π. '수평·수직'이라는 말이 나오면 이 둘이다\n- 2022년 3회는 이름 → 기호, 2023년 3회는 이 네 연산의 기호 고르기로 나왔다\n\n| 구분 | 연산 | 기호 | 뜻 |\n|---|---|---|---|\n| 순수 관계 | 셀렉트(Select) | σ | 조건에 맞는 **행** (수평 부분집합) |\n| 순수 관계 | 프로젝트(Project) | π | 지정한 **열** (수직 부분집합, 중복 제거) |\n| 순수 관계 | 조인(Join) | ⋈ | 공통 속성으로 두 릴레이션 결합 |\n| 순수 관계 | 디비전(Division) | ÷ | S의 **모든** 값과 짝을 이루는 R의 튜플 |\n| 일반 집합 | 합집합 | ∪ | 둘 중 하나에 있는 튜플 |\n| 일반 집합 | 교집합 | ∩ | 둘 다 있는 튜플 |\n| 일반 집합 | 차집합 | − | 앞에만 있는 튜플 |\n| 일반 집합 | 카티션 프로덕트 | × | 모든 조합. 차수는 더하고 카디널리티는 곱한다 |\n- ∪ ∩ −는 두 릴레이션의 속성 수와 도메인이 같아야 한다(합병 가능). ×는 조건 없음\n- ρ(rho)는 이름 바꾸기(Rename)"},{"id":"db-030","subject":"db","topic":"관계대수","sub":"디비전","type":"short","past":"2020-3","level":3,"q":"다음 설명에 해당하는 관계대수 연산의 기호를 쓰시오.","box":"릴레이션 R(X, Y)와 S(Y)가 있을 때, R에서 S의 모든 튜플과 관계가 있는 튜플만 골라낸 뒤 S의 속성(Y)을 제외한 나머지 속성(X)만 돌려준다.\n예를 들어 '필수 과목을 하나도 빠짐없이 모두 수강한 학생'을 구할 때 쓴다.","answers":[{"label":"답","accept":["÷","Division","디비전"]}],"hint":"'모두'가 핵심어. 사칙연산 기호 하나","explain":"정답: ÷ (디비전, Division)\n- 실제 답안은 기호 ÷로 쓴다. 이름은 앱 채점 편의로만 함께 인정\n- 핵심어: '**모든** 튜플과 관계가 있는' → 디비전. 하나라도 빠지면 결과에서 빠진다\n- 결과 속성 = R의 속성 − S의 속성\n- 헷갈리는 것: 조인은 '공통 속성 값이 같은 것끼리 결합', 디비전은 '전부 갖춘 것만 남김'\n\n| 구분 | 연산 | 기호 | 뜻 |\n|---|---|---|---|\n| 순수 관계 | 셀렉트(Select) | σ | 조건에 맞는 **행** (수평 부분집합) |\n| 순수 관계 | 프로젝트(Project) | π | 지정한 **열** (수직 부분집합, 중복 제거) |\n| 순수 관계 | 조인(Join) | ⋈ | 공통 속성으로 두 릴레이션 결합 |\n| 순수 관계 | 디비전(Division) | ÷ | S의 **모든** 값과 짝을 이루는 R의 튜플 |\n| 일반 집합 | 합집합 | ∪ | 둘 중 하나에 있는 튜플 |\n| 일반 집합 | 교집합 | ∩ | 둘 다 있는 튜플 |\n| 일반 집합 | 차집합 | − | 앞에만 있는 튜플 |\n| 일반 집합 | 카티션 프로덕트 | × | 모든 조합. 차수는 더하고 카디널리티는 곱한다 |\n- ∪ ∩ −는 두 릴레이션의 속성 수와 도메인이 같아야 한다(합병 가능). ×는 조건 없음\n- ρ(rho)는 이름 바꾸기(Rename)"},{"id":"db-031","subject":"db","topic":"관계대수","sub":"결과 계산(π)","type":"calc","past":"2022-2","level":3,"q":"다음 \u003cemployee> 릴레이션에 관계대수식 π_TTL(employee)를 적용한 결과 릴레이션이다. ①~⑤에 들어갈 값을 쓰시오. (①은 속성명, ②~⑤는 원래 튜플 순서대로 쓴다)","box":"**employee**\n\n| INDEX | AGE | TTL |\n|---|---|---|\n| 1 | 55 | 부장 |\n| 2 | 35 | 대리 |\n| 3 | 42 | 과장 |\n| 4 | 45 | 차장 |\n\n**결과**\n\n| ( ① ) |\n|---|\n| ( ② ) |\n| ( ③ ) |\n| ( ④ ) |\n| ( ⑤ ) |","answers":[{"label":"①","accept":["TTL"]},{"label":"②","accept":["부장"]},{"label":"③","accept":["대리"]},{"label":"④","accept":["과장"]},{"label":"⑤","accept":["차장"]}],"hint":"π는 열만 남긴다. 결과도 릴레이션이다","explain":"정답: ① TTL ② 부장 ③ 대리 ④ 과장 ⑤ 차장\n- π_TTL = TTL 열만 남기는 프로젝트. 행은 그대로 4개\n- 채점 포인트: 결과도 릴레이션이므로 **속성명(TTL)을 머리글로 쓴다**. 값만 쓰면 감점된다\n- 헷갈리는 것: σ였다면 조건에 맞는 행 전체(INDEX, AGE, TTL 세 열)가 남는다\n- 2022년 2회, 2025년 2회에 같은 표로 나왔다"},{"id":"db-032","subject":"db","topic":"관계대수","sub":"결과 계산(π)","type":"calc","past":"2025-2","level":3,"q":"다음 \u003cemployee> 릴레이션에 π_TTL(employee)를 적용했을 때, 결과 릴레이션의 ① 카디널리티와 ② 차수를 쓰시오.","box":"**employee**\n\n| INDEX | AGE | TTL |\n|---|---|---|\n| 1 | 55 | 부장 |\n| 2 | 35 | 대리 |\n| 3 | 42 | 과장 |\n| 4 | 33 | 대리 |\n| 5 | 47 | 차장 |","answers":[{"label":"①","accept":["4","4개"]},{"label":"②","accept":["1","1개"]}],"hint":"릴레이션은 집합이다","explain":"정답: ① 4 ② 1\n- 결과: TTL = 부장, 대리, 과장, 차장 → 대리가 두 번 나와도 **한 번만** 남는다\n- 관계대수의 π는 결과에서 **중복 튜플을 제거**한다(릴레이션은 튜플의 집합이라 같은 튜플이 둘일 수 없다)\n- 헷갈리는 것: SQL의 SELECT TTL FROM employee는 중복을 그대로 둔다(5행). 지우려면 SELECT DISTINCT\n- 차수 = 남은 속성 수 = 1\n\n| TTL |\n|---|\n| 부장 |\n| 대리 |\n| 과장 |\n| 차장 |"},{"id":"db-033","subject":"db","topic":"관계대수","sub":"결과 계산(÷)","type":"calc","past":"2025-3","level":3,"q":"다음 릴레이션 R과 S에 대해 R ÷ S를 수행한 결과 릴레이션을 쓰시오. ①에는 속성명, ②에는 값을 쓴다.","box":"**R**\n\n| A | B |\n|---|---|\n| a1 | b1 |\n| a2 | b2 |\n| a1 | b3 |\n\n**S**\n\n| B |\n|---|\n| b1 |\n| b3 |\n\n**R ÷ S**\n\n| ( ① ) |\n|---|\n| ( ② ) |","answers":[{"label":"①","accept":["A"]},{"label":"②","accept":["a1"]}],"hint":"S의 값을 하나도 빠짐없이 가진 것만 남는다","explain":"정답: ① A ② a1\n1. 결과 속성 = R의 속성(A, B) − S의 속성(B) = **A**\n2. S의 B 값 = {b1, b3}\n3. a1이 가진 B = {b1, b3} → S를 모두 포함 → 남는다\n4. a2가 가진 B = {b2} → b1, b3이 없다 → 빠진다\n\n| A |\n|---|\n| a1 |\n- 함정: b1이나 b3 하나만 가져도 된다고 보면 틀린다. 디비전은 **전부**다"},{"id":"db-034","subject":"db","topic":"관계대수","sub":"결과 계산(σ)","type":"calc","level":3,"q":"다음 \u003c사원> 릴레이션에 대해 ①~④에 답하시오. (결과 튜플은 원래 순서를 유지한다)","box":"**사원**\n\n| 사번 | 이름 | 부서 | 급여 |\n|---|---|---|---|\n| 101 | 김민수 | 개발 | 450 |\n| 102 | 이지은 | 영업 | 380 |\n| 103 | 박서준 | 개발 | 320 |\n| 104 | 최유진 | 개발 | 510 |\n| 105 | 정하늘 | 인사 | 400 |\n\n① σ_(부서='개발' ∧ 급여≥400)(사원) 결과의 카디널리티\n② 같은 결과의 차수\n③, ④ π_이름(σ_(부서='개발' ∧ 급여≥400)(사원)) 결과의 첫 번째, 두 번째 값","answers":[{"label":"①","accept":["2","2개"]},{"label":"②","accept":["4","4개"]},{"label":"③","accept":["김민수"]},{"label":"④","accept":["최유진"]}],"hint":"σ는 행을 거르고 열은 그대로 둔다","explain":"정답: ① 2 ② 4 ③ 김민수 ④ 최유진\n1. 조건 부서 = '개발' ∧ 급여 ≥ 400 을 행마다 검사\n   - 101 김민수: 개발, 450 → O\n   - 103 박서준: 개발, 320 → X (급여 미달)\n   - 104 최유진: 개발, 510 → O\n   - 105 정하늘: 인사, 400 → X (부서 다름)\n2. σ 결과 = 2행, 열은 그대로 4개(사번, 이름, 부서, 급여)\n3. 그 결과에 π_이름 → 김민수, 최유진\n- 정리: σ는 카디널리티만 줄이고 차수는 그대로, π는 차수를 줄이고 중복이 생기면 카디널리티도 줄어든다"},{"id":"db-035","subject":"db","topic":"관계대수","sub":"결과 계산(⋈)","type":"calc","level":3,"q":"다음 \u003c학생>, \u003c학과> 릴레이션에 대해 ①~④에 답하시오.","box":"**학생**\n\n| 학번 | 이름 | 학과코드 |\n|---|---|---|\n| 1 | 가람 | C |\n| 2 | 나래 | E |\n| 3 | 다솜 | C |\n| 4 | 라온 | M |\n\n**학과**\n\n| 학과코드 | 학과명 |\n|---|---|\n| C | 컴퓨터 |\n| E | 전자 |\n| B | 경영 |\n\n① 학생 ⋈ 학과(자연 조인) 결과의 카디널리티\n② 자연 조인 결과의 차수\n③ 학과코드로 동등 조인(Equi Join)한 결과의 차수\n④ 학생을 왼쪽에 둔 왼쪽 외부 조인(Left Outer Join) 결과의 카디널리티","answers":[{"label":"①","accept":["3","3개"]},{"label":"②","accept":["4","4개"]},{"label":"③","accept":["5","5개"]},{"label":"④","accept":["4","4개"]}],"hint":"자연 조인은 공통 속성을 한 번만, 외부 조인은 짝 없는 행도 남긴다","explain":"정답: ① 3 ② 4 ③ 5 ④ 4\n- ① 학과코드가 양쪽에 있는 행: 가람(C), 나래(E), 다솜(C) → 3행. 라온(M)은 학과에 M이 없어 빠진다\n- ② 자연 조인 속성: 학번, 이름, 학과코드, 학과명 → 4 (공통 속성 학과코드는 **한 번만**)\n- ③ 동등 조인은 학생.학과코드와 학과.학과코드를 **둘 다** 남긴다 → 5\n- ④ 왼쪽 외부 조인: 자연 조인 3행 + 짝 없는 라온 1행(학과명 NULL) → 4행\n- 참고: 완전 외부 조인이면 학과 B(경영)까지 붙어 5행, 카티션 프로덕트(×)면 4 × 3 = 12행·차수 3 + 2 = 5\n\n| 조인 | 공통 속성 | 짝 없는 행 |\n|---|---|---|\n| 동등 조인 | 두 번 나옴 | 버림 |\n| 자연 조인 | 한 번만 | 버림 |\n| 왼쪽 외부 조인 | - | 왼쪽 행은 NULL을 채워 남김 |"},{"id":"db-036","subject":"db","topic":"관계대수","sub":"조인 종류","type":"blank","past":"2024-1","level":3,"q":"다음은 조인(Join)에 대한 설명이다. ①~③에 들어갈 조인의 종류를 쓰시오.","box":"- ( ① ): 조인 조건에 =, ≠, \u003c, ≤, >, ≥ 같은 비교 연산자를 써서 조건을 만족하는 튜플을 반환한다.\n- ( ② ): ①에서 = 연산자만 쓰는 조인이다. 조인에 쓴 공통 속성이 결과에 두 번 나타난다.\n- ( ③ ): ②의 결과에서 중복된 공통 속성을 하나만 남기는 조인이다.","answers":[{"label":"①","accept":["세타 조인","Theta Join","θ 조인","θ-Join"]},{"label":"②","accept":["동등 조인","Equi Join","동일 조인","등가 조인"]},{"label":"③","accept":["자연 조인","Natural Join"]}],"hint":"비교 연산자 전체 → = 만 → 중복 속성 제거","explain":"정답: ① 세타 조인 ② 동등 조인 ③ 자연 조인\n- 포함 관계: 세타 조인 ⊃ 동등 조인(= 만) → 자연 조인(동등 조인 + 중복 속성 제거)\n- 헷갈리는 쌍: 동등 조인은 공통 속성이 **두 번**, 자연 조인은 **한 번** 나온다\n\n| 조인 | 뜻 |\n|---|---|\n| 세타 조인(θ) | =, ≠, \u003c, ≤, >, ≥ 비교 조건으로 결합 |\n| 동등 조인 | = 조건만 쓰는 세타 조인 |\n| 자연 조인(⋈) | 동등 조인에서 중복 공통 속성을 하나로 |\n| 외부 조인 | 짝이 없는 튜플도 NULL을 채워 남김(왼쪽·오른쪽·완전) |\n| 세미 조인(⋉) | 자연 조인 후 한쪽 릴레이션 속성만 남김 |"},{"id":"db-037","subject":"db","topic":"관계대수","sub":"관계해석","type":"short","past":"2022-2","level":3,"q":"다음 설명에 해당하는 용어를 쓰시오.","box":"- 관계 데이터 모델의 제안자인 코드(E. F. Codd)가 수학의 술어 해석(Predicate Calculus)에 기반해 관계 데이터베이스에 맞게 제안했다.\n- 원하는 정보를 어떻게 얻을지가 아니라 무엇인지만 정의하는 비절차적 특성을 가진다.\n- 변수로 튜플을 쓰는 방식과 도메인을 쓰는 방식으로 나뉜다.","answers":[{"label":"답","accept":["관계해석","Relational Calculus"]}],"hint":"관계대수의 짝. '무엇'만 말한다","explain":"정답: 관계해석(Relational Calculus)\n- 단서: 코드(Codd), 술어 해석(Predicate Calculus), 비절차적, 튜플·도메인\n- 짝 개념: 관계대수 = 절차적(How, 연산 순서를 기술), 관계해석 = 비절차적(What, 원하는 것만 기술)\n- 종류: 튜플 관계해석(변수가 튜플), 도메인 관계해석(변수가 속성 값)\n- 정량자: ∀ 전칭(모든), ∃ 존재(하나라도)\n- 관계대수와 관계해석의 표현 능력은 같다. SQL은 관계대수와 관계해석을 기초로 한 혼합 데이터 언어다"},{"id":"db-038","subject":"db","topic":"관계대수","sub":"관계해석","type":"blank","level":3,"q":"다음은 관계대수와 관계해석을 비교한 것이다. ①~④에 들어갈 알맞은 용어를 쓰시오.","box":"- 관계대수는 원하는 정보를 얻기 위해 어떤 연산을 어떤 순서로 할지(How)를 기술하는 ( ① ) 언어이다.\n- 관계해석은 원하는 정보가 무엇(What)인지만 기술하는 ( ② ) 언어이다.\n- 관계해석에서 ∀는 '모든 것에 대하여'를 뜻하는 ( ③ ) 정량자, ∃는 '어느 것 하나라도 존재한다'를 뜻하는 ( ④ ) 정량자이다.","answers":[{"label":"①","accept":["절차적","절차"]},{"label":"②","accept":["비절차적","비절차"]},{"label":"③","accept":["전칭","전칭 정량자","Universal Quantifier","Universal"]},{"label":"④","accept":["존재","존재 정량자","Existential Quantifier","Existential"]}],"hint":"How vs What, All vs Exists","explain":"정답: ① 절차적 ② 비절차적 ③ 전칭 ④ 존재\n- 관계대수 = 어떻게(How) = 절차적 / 관계해석 = 무엇(What) = 비절차적\n- ∀ = For **A**ll = 전칭 정량자 / ∃ = **E**xists = 존재 정량자\n- 관계해석 논리 기호: ∨ OR, ∧ AND, ¬ NOT\n- SQL은 어느 한쪽이 아니라 관계대수와 관계해석을 기초로 한 혼합 데이터 언어다"},{"id":"db-039","subject":"db","topic":"정규화","sub":"이상 현상","type":"blank","past":"2020-4","level":3,"q":"다음 \u003c수강> 테이블(기본키: 학번 + 과목코드)에서 ①~③에 해당하는 이상(Anomaly) 현상의 종류를 쓰시오.","box":"| 학번 | 학생명 | 과목코드 | 과목명 | 담당교수 |\n|---|---|---|---|---|\n| 2001 | 김하나 | C01 | 자료구조 | 박교수 |\n| 2001 | 김하나 | D01 | 데이터베이스 | 최교수 |\n| 2002 | 이두리 | C01 | 자료구조 | 박교수 |\n| 2002 | 이두리 | N01 | 네트워크 | 정교수 |\n\n① 아직 수강생이 없는 새 과목 S01을 등록하려 했지만, 기본키의 일부인 학번 값이 없어 넣을 수 없다.\n② 이두리가 N01 수강을 취소해 그 행을 지웠더니, N01 과목의 과목명과 담당교수 정보까지 사라졌다.\n③ C01의 담당교수를 바꾸면서 두 행 중 한 행만 고쳐, 같은 과목의 담당교수가 서로 달라졌다.","answers":[{"label":"①","accept":["삽입 이상","Insertion Anomaly"]},{"label":"②","accept":["삭제 이상","Deletion Anomaly"]},{"label":"③","accept":["갱신 이상","수정 이상","Update Anomaly","Modification Anomaly"]}],"hint":"넣을 때 / 지울 때 / 고칠 때","explain":"정답: ① 삽입 이상 ② 삭제 이상 ③ 갱신 이상\n- 원인: 학생 정보와 과목 정보를 한 테이블에 섞었다. 과목명·담당교수는 과목코드에만 종속(부분 함수 종속)된다\n- 해결: 학생(학번, 학생명), 과목(과목코드, 과목명, 담당교수), 수강(학번, 과목코드)으로 분해(2NF)\n\n| 이상 | 뜻 |\n|---|---|\n| 삽입 이상 | 원하지 않는 값까지 함께 넣어야 하거나, 값이 없어 삽입을 못 함 |\n| 삭제 이상 | 한 튜플을 지우면 함께 저장된 다른 정보까지 지워짐 |\n| 갱신 이상 | 중복 저장된 값 중 일부만 고쳐 데이터가 서로 달라짐 |\n- 원인: 한 테이블에 여러 사실을 섞어 중복 저장. 해결: 정규화(테이블 분해)"},{"id":"db-040","subject":"db","topic":"정규화","sub":"이상 현상","type":"essay","past":"2022-1","level":3,"q":"데이터베이스 이상(Anomaly) 현상 중 삭제 이상이 무엇인지 서술하시오.","answers":[{"label":"답","accept":[],"model":"릴레이션에서 한 튜플을 삭제할 때, 삭제하려던 정보뿐 아니라 함께 저장된 다른 유용한 정보까지 연쇄적으로 삭제되는 현상이다."}],"hint":"지우려던 것보다 더 많이 지워진다","explain":"- 채점 핵심어: **튜플 삭제** 시 **원하지 않는 다른 정보까지 함께 삭제**\n- 예: 어떤 과목을 듣는 유일한 학생의 수강 행을 지우면 그 과목의 과목명·교수 정보도 사라진다\n\n| 이상 | 뜻 |\n|---|---|\n| 삽입 이상 | 원하지 않는 값까지 함께 넣어야 하거나, 값이 없어 삽입을 못 함 |\n| 삭제 이상 | 한 튜플을 지우면 함께 저장된 다른 정보까지 지워짐 |\n| 갱신 이상 | 중복 저장된 값 중 일부만 고쳐 데이터가 서로 달라짐 |\n- 원인: 한 테이블에 여러 사실을 섞어 중복 저장. 해결: 정규화(테이블 분해)"},{"id":"db-041","subject":"db","topic":"정규화","sub":"함수적 종속","type":"blank","past":"2022-2","level":2,"q":"다음은 함수적 종속에 대한 설명이다. ①~③에 해당하는 종속을 \u003c보기>에서 골라 쓰시오.","box":"릴레이션 R의 기본키는 (A, B)이다.\n\n① 속성 C는 (A, B) 전체에 종속되며, A나 B 하나만으로는 결정되지 않는다.\n② 속성 D는 기본키의 일부인 A만 알아도 결정된다.\n③ X → Y이고 Y → Z이므로 X → Z가 성립한다. (Y는 키가 아니다)","options":["ㄱ. Full Functional Dependency","ㄴ. Partial Functional Dependency","ㄷ. Transitive Functional Dependency","ㄹ. Multi-valued Dependency","ㅁ. Join Dependency"],"answers":[{"label":"①","accept":["Full","ㄱ","완전 함수 종속","Full Functional Dependency","완전"]},{"label":"②","accept":["Partial","ㄴ","부분 함수 종속","Partial Functional Dependency","부분"]},{"label":"③","accept":["Transitive","ㄷ","이행 함수 종속","Transitive Functional Dependency","이행"]}],"hint":"전체 / 일부 / 건너서","explain":"정답: ① Full(완전) ② Partial(부분) ③ Transitive(이행)\n- 완전 함수 종속: 기본키 **전체**가 있어야 결정된다 → 2NF가 요구하는 상태\n- 부분 함수 종속: 복합 기본키의 **일부**로도 결정된다 → 2NF에서 제거\n- 이행 함수 종속: X → Y, Y → Z 이므로 X → Z → 3NF에서 제거\n- 영어·한글 둘 다 외운다(2022년 2회는 영어 보기)\n- 함정 보기: 다치 종속은 4NF, 조인 종속은 5NF에서 다룬다"},{"id":"db-042","subject":"db","topic":"정규화","sub":"함수적 종속","type":"blank","level":2,"q":"\u003c학생> 릴레이션(기본키: 학번)에 다음 함수적 종속이 있다. ①~④에 답하시오.","box":"학번 → 이름, 학번 → 학과코드, 학과코드 → 학과명\n\n① 학과코드 → 학과명에서 학과코드를 무엇이라 하는가\n② 같은 종속에서 학과명을 무엇이라 하는가\n③ 학번 → 학과코드 → 학과명처럼 성립하는 학번 → 학과명은 어떤 함수적 종속인가\n④ ③을 제거하면 만족하게 되는 정규형","answers":[{"label":"①","accept":["결정자","Determinant"]},{"label":"②","accept":["종속자","Dependent"]},{"label":"③","accept":["이행 함수 종속","이행","Transitive Functional Dependency","이행 종속"]},{"label":"④","accept":["제3정규형","3NF","3정규형"]}],"hint":"화살표 왼쪽과 오른쪽","explain":"정답: ① 결정자 ② 종속자 ③ 이행 함수 종속 ④ 제3정규형\n- X → Y에서 X = **결정자**(Determinant), Y = **종속자**(Dependent)\n- 학번 → 학과코드 → 학과명: 키가 아닌 학과코드가 또 다른 키 아닌 속성 학과명을 결정한다 → 이행 함수 종속\n- 제거: 학과(학과코드, 학과명)를 떼어 내면 3NF\n- 헷갈리는 것: BCNF는 '모든 **결정자**가 후보키'라는 조건이다. 여기서 학과코드는 결정자인데 후보키가 아니다\n\n| 정규형 | 이전 단계에서 제거하는 것 | 두음 |\n|---|---|---|\n| 1NF | 반복 그룹·다중값 → 모든 값을 **원자값**으로 | 도 |\n| 2NF | **부분** 함수 종속 (기본키 일부에만 종속) | 부 |\n| 3NF | **이행** 함수 종속 (A → B → C) | 이 |\n| BCNF | 후보키가 아닌 **결정자** | 결 |\n| 4NF | **다치** 종속 | 다 |\n| 5NF | **조인** 종속 | 조 |\n- 두음: **도부이결다조**"},{"id":"db-043","subject":"db","topic":"정규화","sub":"정규형 단계","type":"blank","level":3,"q":"다음은 정규화 단계별로 제거하는 대상이다. ①~⑥에 들어갈 알맞은 말을 쓰시오.","box":"| 정규형 | 이전 단계에서 제거하는 것 |\n|---|---|\n| 1NF | 반복 그룹을 없애 모든 속성 값을 ( ① )으로 만든다 |\n| 2NF | ( ② ) 함수 종속 제거 |\n| 3NF | ( ③ ) 함수 종속 제거 |\n| BCNF | 후보키가 아닌 ( ④ ) 제거 |\n| 4NF | ( ⑤ ) 종속 제거 |\n| 5NF | ( ⑥ ) 종속 제거 |","answers":[{"label":"①","accept":["원자값","원자 값","Atomic Value","원자"]},{"label":"②","accept":["부분","Partial"]},{"label":"③","accept":["이행","Transitive"]},{"label":"④","accept":["결정자","Determinant"]},{"label":"⑤","accept":["다치","다중값","다중 값","Multi-valued","MVD"]},{"label":"⑥","accept":["조인","Join","JD"]}],"hint":"1NF부터 5NF까지, 정규형 두음 여섯 글자를 먼저 떠올린다","explain":"정답: ① 원자값 ② 부분 ③ 이행 ④ 결정자 ⑤ 다치 ⑥ 조인\n\n| 정규형 | 이전 단계에서 제거하는 것 | 두음 |\n|---|---|---|\n| 1NF | 반복 그룹·다중값 → 모든 값을 **원자값**으로 | 도 |\n| 2NF | **부분** 함수 종속 (기본키 일부에만 종속) | 부 |\n| 3NF | **이행** 함수 종속 (A → B → C) | 이 |\n| BCNF | 후보키가 아닌 **결정자** | 결 |\n| 4NF | **다치** 종속 | 다 |\n| 5NF | **조인** 종속 | 조 |\n- 두음: **도부이결다조**\n- 3NF와 BCNF 구분: 3NF는 키가 아닌 속성끼리의 이행 종속만 없애면 된다. BCNF는 **결정자 전부**가 후보키여야 한다. 키 속성이 키 아닌 속성에 종속되는 경우가 3NF에는 남아도 BCNF에는 남지 않는다\n- 정규화는 무손실 분해여야 한다(분해한 테이블을 조인하면 원래대로 돌아와야 한다)"},{"id":"db-044","subject":"db","topic":"정규화","sub":"정규형 판정","type":"short","past":"2021-2","level":2,"q":"다음과 같이 \u003c주문목록> 릴레이션을 두 릴레이션으로 분해했다. 분해한 뒤의 릴레이션들이 만족하게 된 정규형을 쓰시오. (분해 전 릴레이션은 제1정규형을 만족한다)","box":"**분해 전: 주문목록** (기본키: 주문번호 + 제품번호)\n\n| 주문번호 | 제품번호 | 고객번호 | 주소 | 수량 |\n|---|---|---|---|---|\n| O1 | P1 | C1 | 서울 | 2 |\n| O1 | P2 | C1 | 서울 | 1 |\n| O2 | P1 | C2 | 부산 | 5 |\n\n**분해 후**\n- 주문상세(**주문번호, 제품번호**, 수량)\n- 주문(**주문번호**, 고객번호, 주소)","answers":[{"label":"답","accept":["제2정규형","2NF","2정규형","Second Normal Form"]}],"hint":"기본키 일부에만 매달린 속성을 떼어 냈다","explain":"정답: 제2정규형(2NF)\n- 분해 전: 고객번호·주소는 (주문번호, 제품번호) 중 **주문번호만으로** 결정된다 → 부분 함수 종속\n- 분해 후: 주문상세의 수량은 기본키 전체에, 주문의 고객번호·주소는 기본키 주문번호 전체에 종속 → 완전 함수 종속 → 2NF\n- 아직 3NF는 아니다: 주문에는 주문번호 → 고객번호 → 주소 이행 종속이 남아 있다. 고객(고객번호, 주소)을 떼어야 3NF\n\n| 정규형 | 이전 단계에서 제거하는 것 | 두음 |\n|---|---|---|\n| 1NF | 반복 그룹·다중값 → 모든 값을 **원자값**으로 | 도 |\n| 2NF | **부분** 함수 종속 (기본키 일부에만 종속) | 부 |\n| 3NF | **이행** 함수 종속 (A → B → C) | 이 |\n| BCNF | 후보키가 아닌 **결정자** | 결 |\n| 4NF | **다치** 종속 | 다 |\n| 5NF | **조인** 종속 | 조 |\n- 두음: **도부이결다조**"},{"id":"db-045","subject":"db","topic":"정규화","sub":"정규형 판정","type":"short","past":"2024-1","level":3,"q":"다음 \u003c수강> 릴레이션의 기본키는 (고객아이디, 강좌명)이다. 이 릴레이션이 제1정규형~제3정규형 중 최대 몇 정규형까지 만족하는지 쓰시오.","box":"| 고객아이디 | 강좌명 | 강사번호 |\n|---|---|---|\n| apple | 영어회화 | P001 |\n| apple | 기초토익 | P002 |\n| banana | 영어회화 | P001 |\n| banana | 기초토익 | P003 |\n| cherry | 영어회화 | P004 |\n| cherry | 중급토익 | P005 |","answers":[{"label":"답","accept":["제3정규형","3NF","3정규형","Third Normal Form"]}],"hint":"1NF → 부분 종속 → 이행 종속 순서로 하나씩 지운다","explain":"정답: 제3정규형\n1. 1NF: 모든 값이 하나씩(원자값) → 만족\n2. 2NF: 키가 아닌 속성은 강사번호 하나. apple은 강사 P001·P002, 영어회화는 강사 P001·P004 → 고객아이디만으로도, 강좌명만으로도 강사번호가 정해지지 않는다 → 부분 종속 없음 → 만족\n3. 3NF: 키가 아닌 속성이 하나뿐이라 키 아닌 속성끼리의 이행 종속이 생길 수 없다 → 만족\n- 더 나아가: 강사 한 명이 한 강좌만 맡는다면(강사번호 → 강좌명) 결정자 강사번호가 후보키가 아니라 **BCNF는 위반**한다. 2026년 2회는 이 종속이 보이는 표를 주고 BCNF까지 든 보기에서 정규형을 고르게 했다(답 제3정규형)\n- 2024년 1회, 2026년 2회 거의 같은 표로 출제\n\n| 정규형 | 이전 단계에서 제거하는 것 | 두음 |\n|---|---|---|\n| 1NF | 반복 그룹·다중값 → 모든 값을 **원자값**으로 | 도 |\n| 2NF | **부분** 함수 종속 (기본키 일부에만 종속) | 부 |\n| 3NF | **이행** 함수 종속 (A → B → C) | 이 |\n| BCNF | 후보키가 아닌 **결정자** | 결 |\n| 4NF | **다치** 종속 | 다 |\n| 5NF | **조인** 종속 | 조 |\n- 두음: **도부이결다조**"},{"id":"db-046","subject":"db","topic":"정규화","sub":"정규형 판정","type":"blank","past":"2026-2","level":3,"q":"다음 \u003c수강> 릴레이션과 함수적 종속을 보고 ①, ②에 답하시오.","box":"- 후보키: (고객아이디, 과정명), (고객아이디, 강사번호)\n- 함수적 종속: (고객아이디, 과정명) → 강사번호, 강사번호 → 과정명 (강사는 한 과정만 맡는다)\n\n| 고객아이디 | 과정명 | 강사번호 |\n|---|---|---|\n| kim | 파이썬 | T1 |\n| kim | 자바 | T3 |\n| lee | 파이썬 | T2 |\n| park | 파이썬 | T1 |\n| park | 자바 | T3 |\n\n① 이 릴레이션이 만족하는 가장 높은 정규형을 \u003c보기>에서 골라 쓰시오.\n② ①보다 한 단계 높은 정규형을 만족하지 못하게 만드는 결정자(속성 이름)를 쓰시오.","options":["ㄱ. 제1정규형","ㄴ. 제2정규형","ㄷ. 제3정규형","ㄹ. 보이스-코드 정규형(BCNF)","ㅁ. 제4정규형","ㅂ. 제5정규형"],"answers":[{"label":"①","accept":["제3정규형","ㄷ","3NF","3정규형"]},{"label":"②","accept":["강사번호"]}],"hint":"이행 종속인지 보려면 B와 C가 키에 속하는지부터 본다","explain":"정답: ① 제3정규형 ② 강사번호\n- 2NF: 키 아닌 속성(비주요 속성)이 없어 부분 종속이 문제 되지 않는다\n- 3NF: 강사번호 → 과정명이 있지만 과정명·강사번호 모두 후보키의 구성원(주요 속성)이다. 이행 종속은 **키가 아닌 속성끼리**일 때만 문제다 → 3NF 만족\n- BCNF: 결정자 강사번호가 후보키가 아니다 → **BCNF 위반**\n- BCNF로 분해: 강사(강사번호, 과정명) + 수강(고객아이디, 강사번호)\n- 함정: '표에 X → Y가 있으니 3NF 위반'이라고 바로 판단하면 틀린다. 종속자가 키 속성이면 3NF는 지킨다\n\n| 정규형 | 이전 단계에서 제거하는 것 | 두음 |\n|---|---|---|\n| 1NF | 반복 그룹·다중값 → 모든 값을 **원자값**으로 | 도 |\n| 2NF | **부분** 함수 종속 (기본키 일부에만 종속) | 부 |\n| 3NF | **이행** 함수 종속 (A → B → C) | 이 |\n| BCNF | 후보키가 아닌 **결정자** | 결 |\n| 4NF | **다치** 종속 | 다 |\n| 5NF | **조인** 종속 | 조 |\n- 두음: **도부이결다조**"},{"id":"db-047","subject":"db","topic":"정규화","sub":"반정규화","type":"essay","past":"2020-1","level":3,"q":"반정규화(De-Normalization)의 개념을 서술하시오.","answers":[{"label":"답","accept":[],"model":"정규화된 엔티티, 속성, 관계를 시스템의 성능 향상과 개발·운영의 단순화를 위해 중복, 통합, 분리하는 데이터 모델링 기법이다. 의도적으로 정규화 원칙을 위배하므로 데이터 일관성·무결성이 떨어질 수 있다."}],"hint":"정규화의 반대 방향, 목적은 성능","explain":"- 채점 핵심어: **정규화된** 구조를 **성능 향상**을 위해 **중복·통합·분리**\n- 장점: 조인이 줄어 조회가 빨라진다. 단점: 중복 때문에 무결성이 깨질 수 있고 입력·수정이 복잡해진다\n- 용어: 반정규화 = 역정규화 = 비정규화(교재마다 번역이 다르다. 답은 반정규화로 쓰는 것이 안전)\n\n| 분류 | 기법 | 예 |\n|---|---|---|\n| 테이블 | 테이블 병합 | 1:1·1:N 관계, 슈퍼/서브타입 테이블을 합침 |\n| 테이블 | 테이블 분할 | 수평 분할(행 단위), 수직 분할(열 단위) |\n| 테이블 | 중복 테이블 추가 | 집계 테이블, 진행 테이블, 특정 부분만 담은 테이블 |\n| 컬럼 | 컬럼 중복화 | 중복 컬럼, 파생 컬럼, 이력 컬럼 추가 |\n| 관계 | 관계 중복화 | 조인 경로를 줄이는 중복 관계 추가 |"},{"id":"db-048","subject":"db","topic":"정규화","sub":"반정규화","type":"short","past":"2021-1","level":3,"q":"다음 설명에 해당하는 데이터 모델링 기법을 쓰시오.","box":"- 정규화된 엔티티, 속성, 관계에 대해 시스템의 성능 향상과 개발·운영의 단순화를 위해 중복, 통합, 분리 등을 수행한다.\n- 조인이 지나치게 많아 조회가 느릴 때 쓰며, 의도적으로 정규화 원칙을 위배한다.","answers":[{"label":"답","accept":["반정규화","역정규화","비정규화","De-Normalization","Denormalization"]}],"hint":"정규화를 일부러 되돌린다","explain":"정답: 반정규화(역정규화, 비정규화)\n- 단서: '정규화된' 것을 '성능 향상'을 위해 '중복·통합·분리', 정규화 원칙을 '의도적으로 위배'\n- 정규화와 비교: 정규화 = 중복 제거·무결성 우선, 반정규화 = 조회 성능 우선\n- 수행 시점: 물리적 설계 쪽에서 성능을 검토하며 한다\n\n| 분류 | 기법 | 예 |\n|---|---|---|\n| 테이블 | 테이블 병합 | 1:1·1:N 관계, 슈퍼/서브타입 테이블을 합침 |\n| 테이블 | 테이블 분할 | 수평 분할(행 단위), 수직 분할(열 단위) |\n| 테이블 | 중복 테이블 추가 | 집계 테이블, 진행 테이블, 특정 부분만 담은 테이블 |\n| 컬럼 | 컬럼 중복화 | 중복 컬럼, 파생 컬럼, 이력 컬럼 추가 |\n| 관계 | 관계 중복화 | 조인 경로를 줄이는 중복 관계 추가 |"},{"id":"db-049","subject":"db","topic":"정규화","sub":"반정규화","type":"choice","past":"2024-2","level":3,"q":"다음 설명에 해당하는 용어를 \u003c보기>에서 골라 쓰시오.","box":"조회 성능을 높이려고 자주 함께 읽는 테이블을 하나로 합치거나, 다른 테이블에 있는 값을 컬럼으로 중복 저장해 조인을 줄이는 기법이다. 읽기는 빨라지지만 같은 값을 여러 곳에서 고쳐야 하므로 데이터 무결성이 깨질 위험이 커진다.","options":["ㄱ. 정규화","ㄴ. 반정규화","ㄷ. 파티셔닝","ㄹ. 클러스터링","ㅁ. 인덱싱","ㅂ. 이상 현상"],"answers":[{"label":"답","accept":["반정규화","ㄴ","역정규화","비정규화","Denormalization"]}],"hint":"읽기 성능과 무결성을 맞바꾼다","explain":"정답: 반정규화\n- 단서: 테이블을 '합치거나' 값을 '중복 저장'해 조인을 줄임 + 무결성 위험\n- 함정 보기: 파티셔닝은 큰 테이블을 나눠 **저장**하는 물리 기법이고 중복을 만들지 않는다. 클러스터링은 같이 쓰는 행을 같은 블록에 모으는 것. 인덱싱은 검색용 별도 구조\n- 2020년 1회, 2021년 1회, 2024년 2회로 3회 나왔다\n\n| 분류 | 기법 | 예 |\n|---|---|---|\n| 테이블 | 테이블 병합 | 1:1·1:N 관계, 슈퍼/서브타입 테이블을 합침 |\n| 테이블 | 테이블 분할 | 수평 분할(행 단위), 수직 분할(열 단위) |\n| 테이블 | 중복 테이블 추가 | 집계 테이블, 진행 테이블, 특정 부분만 담은 테이블 |\n| 컬럼 | 컬럼 중복화 | 중복 컬럼, 파생 컬럼, 이력 컬럼 추가 |\n| 관계 | 관계 중복화 | 조인 경로를 줄이는 중복 관계 추가 |"},{"id":"db-050","subject":"db","topic":"정규화","sub":"반정규화 기법","type":"blank","level":1,"q":"다음은 반정규화 기법에 대한 설명이다. ①~⑤에 해당하는 기법을 \u003c보기>에서 골라 쓰시오.","box":"① 1:1 관계이면서 항상 함께 조회되는 두 테이블을 하나로 합친다.\n② 접근 빈도가 다른 컬럼이 섞인 큰 테이블을, 자주 쓰는 컬럼과 드물게 쓰는 컬럼으로 나눠 두 테이블로 만든다.\n③ 행이 계속 쌓이는 주문 테이블을 2025년 주문 행과 2026년 주문 행으로 나눠 각각 다른 테이블에 저장한다.\n④ 조회할 때마다 SUM으로 계산하던 월별 매출 합계를 따로 집계 테이블로 만들어 둔다.\n⑤ 주문 테이블에 고객 테이블의 고객명을 컬럼으로 하나 더 넣어, 조인 없이 고객명을 조회한다.","options":["ㄱ. 테이블 병합","ㄴ. 수평 분할","ㄷ. 수직 분할","ㄹ. 중복 테이블 추가","ㅁ. 컬럼 중복화","ㅂ. 관계 중복화"],"answers":[{"label":"①","accept":["테이블 병합","ㄱ"]},{"label":"②","accept":["수직 분할","ㄷ"]},{"label":"③","accept":["수평 분할","ㄴ"]},{"label":"④","accept":["중복 테이블 추가","ㄹ","집계 테이블 추가"]},{"label":"⑤","accept":["컬럼 중복화","ㅁ","중복 컬럼 추가","컬럼 중복"]}],"hint":"행으로 자르면 수평, 열로 자르면 수직","explain":"정답: ① 테이블 병합 ② 수직 분할 ③ 수평 분할 ④ 중복 테이블 추가 ⑤ 컬럼 중복화\n- 헷갈리는 쌍: **수평 분할 = 행(레코드) 단위**로 나눔(연도별, 지역별). **수직 분할 = 열(컬럼) 단위**로 나눔(자주 쓰는 컬럼과 드문 컬럼)\n- ④ 계산 결과를 담는 테이블(집계 테이블)을 새로 만드는 것은 중복 테이블 추가에 속한다\n\n| 분류 | 기법 | 예 |\n|---|---|---|\n| 테이블 | 테이블 병합 | 1:1·1:N 관계, 슈퍼/서브타입 테이블을 합침 |\n| 테이블 | 테이블 분할 | 수평 분할(행 단위), 수직 분할(열 단위) |\n| 테이블 | 중복 테이블 추가 | 집계 테이블, 진행 테이블, 특정 부분만 담은 테이블 |\n| 컬럼 | 컬럼 중복화 | 중복 컬럼, 파생 컬럼, 이력 컬럼 추가 |\n| 관계 | 관계 중복화 | 조인 경로를 줄이는 중복 관계 추가 |"},{"id":"db-051","subject":"db","topic":"트랜잭션","sub":"ACID","type":"blank","past":"2020-1","level":3,"q":"다음은 트랜잭션의 특성(ACID)이다. 일관성과 지속성을 제외한 ①, ②에 해당하는 특성을 쓰시오.","box":"- ( ① ): 트랜잭션의 연산은 데이터베이스에 모두 반영되든지 아니면 전혀 반영되지 않아야 한다.\n- 일관성(Consistency): 트랜잭션이 성공적으로 끝나면 데이터베이스는 언제나 일관된 상태를 유지한다.\n- ( ② ): 둘 이상의 트랜잭션이 동시에 실행될 때, 한 트랜잭션이 실행 중이면 다른 트랜잭션이 그 연산에 끼어들 수 없다.\n- 지속성(Durability): 성공적으로 완료된 트랜잭션의 결과는 시스템이 고장 나도 영구히 반영되어야 한다.","answers":[{"label":"①","accept":["원자성","Atomicity"]},{"label":"②","accept":["독립성","격리성","고립성","Isolation"]}],"hint":"A와 I","explain":"정답: ① 원자성(Atomicity) ② 독립성(격리성, Isolation)\n- ① 단서: All or Nothing\n- ② 단서: 동시에 실행될 때 끼어들 수 없다\n- 표기: 독립성 = 격리성 = 고립성, 지속성 = 영속성. 어느 것을 써도 인정된다\n\n| 특성 | 뜻 | 주로 관련된 기능 |\n|---|---|---|\n| 원자성(Atomicity) | 모두 반영되거나 전혀 반영되지 않음(All or Nothing) | COMMIT·ROLLBACK, 회복 |\n| 일관성(Consistency) | 실행 전후 DB가 일관된 상태(제약 조건 만족) | 무결성 제약, 병행 제어 |\n| 독립성(Isolation) | 실행 중 다른 트랜잭션이 끼어들 수 없음. 격리성·고립성 | 병행 제어(로킹) |\n| 지속성(Durability) | 완료된 결과는 고장이 나도 영구 반영. 영속성 | 회복(로그) |"},{"id":"db-052","subject":"db","topic":"트랜잭션","sub":"ACID","type":"essay","past":"2021-2","level":3,"q":"트랜잭션의 특성 중 원자성(Atomicity)에 대해 서술하시오.","answers":[{"label":"답","accept":[],"model":"트랜잭션의 연산은 데이터베이스에 모두 반영되거나 전혀 반영되지 않아야 한다는 특성(All or Nothing)이다. 일부만 실행된 채 끝나면 안 되므로, 정상 종료하면 COMMIT으로 모두 반영하고 오류가 나면 ROLLBACK으로 모두 취소한다."}],"hint":"All or Nothing","explain":"- 채점 핵심어: **모두 반영 또는 전혀 반영 안 됨**(All or Nothing). COMMIT·ROLLBACK까지 쓰면 더 좋다\n- 예: 계좌 이체에서 출금만 되고 입금이 안 된 상태로 끝나면 원자성 위반\n\n| 특성 | 뜻 | 주로 관련된 기능 |\n|---|---|---|\n| 원자성(Atomicity) | 모두 반영되거나 전혀 반영되지 않음(All or Nothing) | COMMIT·ROLLBACK, 회복 |\n| 일관성(Consistency) | 실행 전후 DB가 일관된 상태(제약 조건 만족) | 무결성 제약, 병행 제어 |\n| 독립성(Isolation) | 실행 중 다른 트랜잭션이 끼어들 수 없음. 격리성·고립성 | 병행 제어(로킹) |\n| 지속성(Durability) | 완료된 결과는 고장이 나도 영구 반영. 영속성 | 회복(로그) |"},{"id":"db-053","subject":"db","topic":"트랜잭션","sub":"ACID","type":"blank","level":2,"q":"계좌 A에서 B로 10만 원을 이체하는 트랜잭션이 있다. 다음 ①~④가 설명하는 트랜잭션 특성을 \u003c보기>에서 골라 쓰시오.","box":"① 출금은 처리됐는데 입금 직전에 장애가 났다면, 출금도 취소되어야 한다.\n② 이체 전과 후에 두 계좌 잔액의 합은 같아야 하고, 잔액이 음수가 되면 안 된다는 제약도 지켜야 한다.\n③ 이체가 진행되는 도중에 다른 트랜잭션이 A의 잔액을 조회해도, 출금만 반영된 중간 상태를 볼 수 없어야 한다.\n④ 이체가 COMMIT된 직후 서버 전원이 꺼져도, 다시 켜면 이체 결과가 남아 있어야 한다.","options":["ㄱ. 원자성(Atomicity)","ㄴ. 일관성(Consistency)","ㄷ. 독립성(Isolation)","ㄹ. 지속성(Durability)"],"answers":[{"label":"①","accept":["원자성","ㄱ","Atomicity"]},{"label":"②","accept":["일관성","ㄴ","Consistency"]},{"label":"③","accept":["독립성","ㄷ","격리성","고립성","Isolation"]},{"label":"④","accept":["지속성","ㄹ","영속성","Durability"]}],"hint":"장애 중 반쪽 / 규칙 / 중간 상태 / 커밋 뒤 정전","explain":"정답: ① 원자성 ② 일관성 ③ 독립성 ④ 지속성\n- ① '반쪽만 반영 금지' → 원자성. ④ '커밋 **뒤** 장애에도 남음' → 지속성. 장애가 나는 시점(커밋 전/후)으로 둘을 가른다\n- ③ 다른 트랜잭션이 중간 결과를 못 본다 → 독립성\n- ② 합계 보존·제약 조건 → 일관성\n\n| 특성 | 뜻 | 주로 관련된 기능 |\n|---|---|---|\n| 원자성(Atomicity) | 모두 반영되거나 전혀 반영되지 않음(All or Nothing) | COMMIT·ROLLBACK, 회복 |\n| 일관성(Consistency) | 실행 전후 DB가 일관된 상태(제약 조건 만족) | 무결성 제약, 병행 제어 |\n| 독립성(Isolation) | 실행 중 다른 트랜잭션이 끼어들 수 없음. 격리성·고립성 | 병행 제어(로킹) |\n| 지속성(Durability) | 완료된 결과는 고장이 나도 영구 반영. 영속성 | 회복(로그) |"},{"id":"db-054","subject":"db","topic":"트랜잭션","sub":"트랜잭션 상태","type":"blank","level":1,"q":"다음은 트랜잭션의 상태에 대한 설명이다. ①~⑤에 해당하는 상태를 \u003c보기>에서 골라 쓰시오.","box":"① 트랜잭션이 실행을 시작했거나 실행 중인 상태\n② 마지막 연산까지 실행했지만, 아직 COMMIT 연산을 실행하기 직전인 상태\n③ 트랜잭션이 성공적으로 끝나 COMMIT 연산을 실행한 뒤의 상태\n④ 실행 중 오류가 발생해 더 이상 정상적으로 진행할 수 없는 상태\n⑤ 트랜잭션이 비정상적으로 끝나 ROLLBACK 연산을 실행한 상태","options":["ㄱ. 활동(Active)","ㄴ. 부분 완료(Partially Committed)","ㄷ. 완료(Committed)","ㄹ. 실패(Failed)","ㅁ. 철회(Aborted)"],"answers":[{"label":"①","accept":["활동","ㄱ","Active"]},{"label":"②","accept":["부분 완료","ㄴ","Partially Committed"]},{"label":"③","accept":["완료","ㄷ","Committed"]},{"label":"④","accept":["실패","ㄹ","Failed"]},{"label":"⑤","accept":["철회","ㅁ","Aborted"]}],"hint":"COMMIT 직전과 직후, ROLLBACK 직전과 직후","explain":"정답: ① 활동 ② 부분 완료 ③ 완료 ④ 실패 ⑤ 철회\n- 정상 흐름: 활동 → 부분 완료 → 완료\n- 비정상 흐름: 활동 또는 부분 완료 → 실패 → 철회\n- 헷갈리는 쌍: 부분 완료 = 마지막 연산까지 했지만 **COMMIT 전**. 완료 = **COMMIT 후**\n- 헷갈리는 쌍: 실패 = 오류로 멈춘 상태, 철회 = **ROLLBACK을 실행한** 상태\n\n| 상태 | 영문 | 뜻 |\n|---|---|---|\n| 활동 | Active | 실행 중 |\n| 부분 완료 | Partially Committed | 마지막 연산 실행 직후, COMMIT 직전 |\n| 완료 | Committed | COMMIT 완료 |\n| 실패 | Failed | 오류로 실행 중단 |\n| 철회 | Aborted | ROLLBACK 완료 |"},{"id":"db-055","subject":"db","topic":"트랜잭션","sub":"TCL","type":"essay","past":"2020-2","level":2,"q":"트랜잭션 제어 명령어 ROLLBACK에 대해 서술하시오.","answers":[{"label":"답","accept":[],"model":"트랜잭션 처리 중 오류가 발생하거나 사용자가 취소할 때, 그 트랜잭션이 변경한 내용을 모두 취소하고 트랜잭션 시작 이전(또는 지정한 SAVEPOINT)의 상태로 되돌리는 명령어이다."}],"hint":"변경 취소 + 이전 상태로","explain":"- 채점 핵심어: 트랜잭션의 **변경 내용 취소**, **이전 상태로 복구**\n- 헷갈리는 쌍: ROLLBACK = 정상 운영 중 사용자가 실행하는 **명령어(TCL)**. UNDO = 장애 뒤 시스템이 로그로 미완료 트랜잭션을 취소하는 **회복 기법**\n\n| 명령어 | 기능 |\n|---|---|\n| COMMIT | 변경 내용을 DB에 영구 반영하고 트랜잭션 종료 |\n| ROLLBACK | 변경 내용을 모두 취소하고 이전 상태로 되돌림 |\n| SAVEPOINT | 트랜잭션 중간에 저장점을 만들어, ROLLBACK TO로 그 지점까지만 되돌릴 수 있게 함 |\n- 교재에 따라 COMMIT·ROLLBACK을 DCL로 분류하기도 한다(TCL을 따로 두지 않는 경우)"},{"id":"db-056","subject":"db","topic":"트랜잭션","sub":"회복 기법","type":"blank","past":"2022-1","level":3,"q":"다음은 로그를 이용한 회복 기법에 대한 설명이다. ①, ②에 들어갈 알맞은 용어를 쓰시오.","box":"- ( ① ): 장애가 나기 전에 COMMIT까지 마친 트랜잭션은, 로그에 기록된 변경 후 값으로 연산을 다시 실행해 결과를 데이터베이스에 반영한다.\n- ( ② ): 장애 시점에 COMMIT하지 못한 트랜잭션은, 로그에 기록된 변경 전 값으로 그 트랜잭션이 바꾼 내용을 모두 취소한다.","answers":[{"label":"①","accept":["REDO","재실행","재수행"]},{"label":"②","accept":["UNDO","취소"]}],"hint":"다시 할 것과 되돌릴 것","explain":"정답: ① REDO(재실행) ② UNDO(취소)\n- 판단 기준(로그): \u003cT start>와 \u003cT commit>이 **둘 다** 있으면 REDO, \u003cT start>만 있으면 UNDO\n- REDO는 변경 후 값, UNDO는 변경 전 값을 쓴다\n- 헷갈리는 쌍: UNDO(장애 후 시스템의 회복) vs ROLLBACK(사용자 명령)\n\n| 회복 기법 | 특징 | Redo | Undo |\n|---|---|---|---|\n| 즉시(즉각) 갱신 | 실행 중 변경을 바로 DB에 반영, 로그 기록 | O | O |\n| 지연(연기) 갱신 | COMMIT까지 DB 반영을 미룸, 로그에만 기록 | O | X |\n| 체크포인트(검사점) | 일정 시점마다 검사점을 기록, 장애 시 마지막 검사점부터 회복 | O | O |\n| 그림자 페이징 | 로그 없이 그림자 페이지 테이블로 교체 | X | X |\n- 앞의 셋은 로그 기반 회복이다. 디스크가 망가지면 덤프(백업)와 로그로 복구하는 미디어 회복을 쓴다\n- 그림자 페이징은 로그를 쓰지 않아 Undo·Redo가 **둘 다** 필요 없다(Elmasri 교재 분류: NO-UNDO/NO-REDO). 요약본에 'Undo 불필요'만 적힌 경우가 많지만 Redo도 하지 않는다. 지연 갱신(Undo만 불필요, Redo는 필요)과 구분한다"},{"id":"db-057","subject":"db","topic":"트랜잭션","sub":"회복 기법","type":"short","past":"2020-4","level":3,"q":"다음 설명에 해당하는 회복 기법을 쓰시오.","box":"- 트랜잭션이 실행되는 도중에 생긴 변경 내용을, COMMIT 전이라도 즉시 데이터베이스에 반영한다.\n- 모든 변경 내용을 로그에 기록해 두고, 장애가 나면 로그를 이용해 회복한다.\n- 장애가 나면 COMMIT된 트랜잭션은 Redo, COMMIT되지 않은 트랜잭션은 Undo를 수행한다.","answers":[{"label":"답","accept":["즉시 갱신 회복 기법","즉시 갱신","즉각 갱신","즉각 갱신 회복 기법","Immediate Update","즉시 갱신 기법","즉각 갱신 기법"]}],"hint":"COMMIT을 기다리지 않는다","explain":"정답: 즉시(즉각) 갱신 회복 기법\n- 단서: COMMIT **전에도 즉시** DB에 반영 → 실패하면 되돌려야 하므로 Undo까지 필요\n- 짝: 지연 갱신은 COMMIT까지 반영을 미루므로 Undo가 필요 없다\n- 출처마다 정답 표기가 다름: 다수 출처는 '즉각(즉시) 갱신 회복 기법', 한 출처는 상위 분류인 '로그 기반 회복 기법'으로 적었다. '바로 반영' 조건이 있으므로 즉시 갱신으로 쓴다\n\n| 회복 기법 | 특징 | Redo | Undo |\n|---|---|---|---|\n| 즉시(즉각) 갱신 | 실행 중 변경을 바로 DB에 반영, 로그 기록 | O | O |\n| 지연(연기) 갱신 | COMMIT까지 DB 반영을 미룸, 로그에만 기록 | O | X |\n| 체크포인트(검사점) | 일정 시점마다 검사점을 기록, 장애 시 마지막 검사점부터 회복 | O | O |\n| 그림자 페이징 | 로그 없이 그림자 페이지 테이블로 교체 | X | X |\n- 앞의 셋은 로그 기반 회복이다. 디스크가 망가지면 덤프(백업)와 로그로 복구하는 미디어 회복을 쓴다\n- 그림자 페이징은 로그를 쓰지 않아 Undo·Redo가 **둘 다** 필요 없다(Elmasri 교재 분류: NO-UNDO/NO-REDO). 요약본에 'Undo 불필요'만 적힌 경우가 많지만 Redo도 하지 않는다. 지연 갱신(Undo만 불필요, Redo는 필요)과 구분한다"},{"id":"db-058","subject":"db","topic":"트랜잭션","sub":"회복 기법","type":"short","level":1,"q":"다음 설명에 해당하는 회복 기법을 쓰시오.","box":"- 트랜잭션이 부분 완료 상태에 이를 때까지 데이터베이스 변경 내용을 로그에만 기록하고, 실제 데이터베이스 반영은 미룬다.\n- COMMIT한 뒤에 로그를 이용해 한꺼번에 데이터베이스에 반영한다.\n- 장애가 나도 데이터베이스는 아직 바뀌지 않았으므로 Undo는 필요 없고 Redo만 수행한다.","answers":[{"label":"답","accept":["지연 갱신 회복 기법","지연 갱신","연기 갱신","Deferred Update","Deferred Modification","지연 갱신 기법","연기 갱신 기법","연기 갱신 회복 기법"]}],"hint":"COMMIT 전에는 DB를 건드리지 않는다","explain":"정답: 지연(연기) 갱신 회복 기법\n- 단서: 부분 완료까지 로그에만 기록, DB 반영을 미룸 → Undo 불필요, **Redo만**\n- 짝: 즉시 갱신은 실행 중 바로 반영 → Redo + Undo 둘 다\n\n| 회복 기법 | 특징 | Redo | Undo |\n|---|---|---|---|\n| 즉시(즉각) 갱신 | 실행 중 변경을 바로 DB에 반영, 로그 기록 | O | O |\n| 지연(연기) 갱신 | COMMIT까지 DB 반영을 미룸, 로그에만 기록 | O | X |\n| 체크포인트(검사점) | 일정 시점마다 검사점을 기록, 장애 시 마지막 검사점부터 회복 | O | O |\n| 그림자 페이징 | 로그 없이 그림자 페이지 테이블로 교체 | X | X |\n- 앞의 셋은 로그 기반 회복이다. 디스크가 망가지면 덤프(백업)와 로그로 복구하는 미디어 회복을 쓴다\n- 그림자 페이징은 로그를 쓰지 않아 Undo·Redo가 **둘 다** 필요 없다(Elmasri 교재 분류: NO-UNDO/NO-REDO). 요약본에 'Undo 불필요'만 적힌 경우가 많지만 Redo도 하지 않는다. 지연 갱신(Undo만 불필요, Redo는 필요)과 구분한다"},{"id":"db-059","subject":"db","topic":"트랜잭션","sub":"회복 기법","type":"blank","level":1,"q":"다음은 회복 기법에 대한 설명이다. ①, ②에 해당하는 기법을 \u003c보기>에서 골라 쓰시오.","box":"① 트랜잭션을 실행하는 도중 일정한 시점마다 그 시점의 정보를 로그에 기록해 둔다. 장애가 나면 로그 전체를 처음부터 보지 않고 가장 최근에 기록한 지점 이후만 Redo·Undo하므로 회복 시간이 줄어든다.\n② 로그를 쓰지 않고, 트랜잭션을 시작할 때 현재 페이지 테이블의 복사본을 하나 더 만들어 보관한다. 실행 중에는 현재 페이지 테이블만 바꾸고, 장애가 나면 보관한 복사본으로 교체하면 되므로 로그를 이용한 Undo·Redo가 필요 없다.","options":["ㄱ. 즉시 갱신","ㄴ. 지연 갱신","ㄷ. 체크포인트","ㄹ. 그림자 페이징","ㅁ. 미디어 회복"],"answers":[{"label":"①","accept":["체크포인트","ㄷ","검사점","Checkpoint","체크포인트 회복 기법","검사점 기법"]},{"label":"②","accept":["그림자 페이징","ㄹ","그림자 페이지 대체","Shadow Paging","섀도 페이징","그림자 페이지 대체 기법","그림자 페이징 회복 기법","그림자 페이징 기법"]}],"hint":"로그를 어디서부터 볼까 / 로그를 아예 안 쓴다","explain":"정답: ① 체크포인트(검사점) ② 그림자 페이징\n- ① 단서: 로그 처음부터 보지 않고 **마지막 검사점**부터 → 회복 시간 단축\n- ② 단서: 로그 없이 **페이지 테이블 복사본**으로 교체 → Undo·Redo 모두 불필요\n- 그림자 페이징 단점: 페이지가 흩어져 저장되고, 동시 트랜잭션 환경에서는 결국 로그와 체크포인트가 함께 필요하다\n\n| 회복 기법 | 특징 | Redo | Undo |\n|---|---|---|---|\n| 즉시(즉각) 갱신 | 실행 중 변경을 바로 DB에 반영, 로그 기록 | O | O |\n| 지연(연기) 갱신 | COMMIT까지 DB 반영을 미룸, 로그에만 기록 | O | X |\n| 체크포인트(검사점) | 일정 시점마다 검사점을 기록, 장애 시 마지막 검사점부터 회복 | O | O |\n| 그림자 페이징 | 로그 없이 그림자 페이지 테이블로 교체 | X | X |\n- 앞의 셋은 로그 기반 회복이다. 디스크가 망가지면 덤프(백업)와 로그로 복구하는 미디어 회복을 쓴다\n- 그림자 페이징은 로그를 쓰지 않아 Undo·Redo가 **둘 다** 필요 없다(Elmasri 교재 분류: NO-UNDO/NO-REDO). 요약본에 'Undo 불필요'만 적힌 경우가 많지만 Redo도 하지 않는다. 지연 갱신(Undo만 불필요, Redo는 필요)과 구분한다"},{"id":"db-060","subject":"db","topic":"트랜잭션","sub":"로킹","type":"blank","past":"2021-2","level":2,"q":"다음은 병행 제어 기법에 대한 설명이다. ①~③에 들어갈 알맞은 말을 쓰시오.","box":"( ① )은 트랜잭션이 접근하려는 데이터에 잠금을 걸어, 그 데이터에 대한 연산을 모두 마칠 때까지 다른 트랜잭션이 접근하지 못하도록 상호 배제하는 병행 제어 기법이다. 잠금 단위가 데이터베이스·테이블처럼 커지면 병행성 수준은 ( ② ), 로킹 오버헤드는 ( ③ ).","answers":[{"label":"①","accept":["로킹","Locking","잠금"]},{"label":"②","accept":["낮아진다","감소","감소한다","낮아짐","낮다"]},{"label":"③","accept":["줄어든다","감소","감소한다","적어진다","낮아진다"]}],"hint":"큰 자물쇠 하나는 관리가 쉽지만 다 같이 기다린다","explain":"정답: ① 로킹 ② 낮아진다(감소) ③ 줄어든다(감소)\n- 로킹 단위 = 필드, 레코드, 테이블(파일), 데이터베이스 모두 가능\n\n| 로킹 단위 | 로크 수 | 병행성 | 오버헤드 | 관리 |\n|---|---|---|---|---|\n| 크다(DB, 테이블) | 적다 | 낮다 | 적다 | 쉽다 |\n| 작다(레코드, 필드) | 많다 | 높다 | 크다 | 어렵다 |\n- 함정: 단위가 커지면 오버헤드도 커진다고 착각하기 쉽다. 잠글 대상이 적어지니 **오버헤드는 줄고 병행성도 줄어든다**\n- 로크 종류: 공유 로크(S, 읽기끼리 공존), 배타 로크(X, 혼자만 접근)"},{"id":"db-061","subject":"db","topic":"트랜잭션","sub":"2단계 로킹","type":"essay","level":1,"q":"병행 제어 기법인 2단계 로킹 규약(2PL, Two-Phase Locking Protocol)에 대해 서술하시오.","answers":[{"label":"답","accept":[],"model":"모든 트랜잭션이 Lock과 Unlock 요청을 확장 단계와 축소 단계로 나눠 수행하는 규약이다. 확장 단계에서는 Lock만 할 수 있고 Unlock은 할 수 없으며, 축소 단계에서는 Unlock만 할 수 있고 새로운 Lock은 할 수 없다. 직렬 가능성을 보장하지만 교착상태가 생길 수 있다."}],"hint":"확장 단계와 축소 단계","explain":"- 채점 핵심어: **확장 단계(Growing Phase) = Lock만**, **축소 단계(Shrinking Phase) = Unlock만**, 직렬 가능성 보장\n- 한 번이라도 Unlock하면 그 뒤로는 Lock을 못 건다\n- 약점: 교착상태(Deadlock)는 막지 못한다\n\n| 병행 제어 기법 | 핵심 | 비고 |\n|---|---|---|\n| 로킹 | 데이터에 잠금, 상호 배제 | 교착상태 가능 |\n| 2단계 로킹(2PL) | 확장(Lock만) → 축소(Unlock만) | 직렬성 보장, 교착상태 가능 |\n| 타임스탬프 순서 | 시작 시각 순서대로 접근 | 잠금 없음 → 교착상태 없음, 순서 어기면 복귀 |\n| 낙관적 검증 | 실행 중 검사 없이 끝날 때 일괄 검증 | 충돌이 드물 때 유리 |\n| 다중 버전(MVCC) | 데이터 여러 버전 유지, 타임스탬프로 버전 선택 | 읽기가 쓰기를 기다리지 않음 |"},{"id":"db-062","subject":"db","topic":"트랜잭션","sub":"병행 제어 기법","type":"blank","level":1,"q":"다음은 병행 제어 기법에 대한 설명이다. ①~③에 해당하는 기법을 \u003c보기>에서 골라 쓰시오.","box":"① 트랜잭션이 시작될 때 시스템이 고유한 시간 표시를 부여하고, 그 순서대로 데이터에 접근하게 해 직렬 가능성을 보장한다. 잠금을 쓰지 않으므로 교착상태가 생기지 않는다.\n② 트랜잭션을 실행하는 동안에는 어떤 검사도 하지 않고 지역 사본에만 반영한 뒤, 트랜잭션이 끝날 때 한꺼번에 검사해 직렬 가능성이 확인되면 데이터베이스에 반영한다.\n③ 데이터 항목마다 여러 버전을 유지하고, 트랜잭션의 타임스탬프와 비교해 알맞은 버전을 읽게 한다. 읽기 연산이 쓰기 연산을 기다리지 않는다.","options":["ㄱ. 로킹(Locking)","ㄴ. 2단계 로킹(2PL)","ㄷ. 타임스탬프 순서(Timestamp Ordering)","ㄹ. 낙관적 검증(Optimistic Validation)","ㅁ. 다중 버전 병행 제어(MVCC)"],"answers":[{"label":"①","accept":["타임스탬프 순서","ㄷ","타임스탬프","Timestamp Ordering","타임 스탬프 순서"]},{"label":"②","accept":["낙관적 검증","ㄹ","검증 기법","최적 병행 수행","Optimistic Validation","낙관적 병행 제어","Optimistic Concurrency Control","OCC","확인 기법","낙관적 기법","검증"]},{"label":"③","accept":["다중 버전 병행 제어","ㅁ","다중 버전","MVCC","Multi-Version Concurrency Control","다중 버전 기법"]}],"hint":"시간표 / 끝나고 한 번에 / 여러 버전","explain":"정답: ① 타임스탬프 순서 ② 낙관적 검증 ③ 다중 버전 병행 제어(MVCC)\n- ① 잠금을 안 쓰므로 교착상태가 없다. 대신 순서를 어긴 트랜잭션은 복귀(Rollback)된다\n- ② 단계: 판독(읽기) → 검증(확인) → 기록(쓰기). 충돌이 드물 때 유리하다\n- ③ 읽기가 쓰기를 기다리지 않는다. 오늘날 Oracle, PostgreSQL, MySQL InnoDB가 쓰는 방식\n- 함정 보기: 로킹·2PL은 잠금을 쓰는 기법이다\n\n| 기법 | 한 줄 |\n|---|---|\n| 로킹 | 데이터에 잠금, 상호 배제 |\n| 2PL | 확장(Lock만) → 축소(Unlock만), 직렬성 보장, 교착상태 가능 |\n| 타임스탬프 순서 | 시작 시각 순서대로 처리, 교착상태 없음 |\n| 낙관적 검증 | 실행 중엔 검사 안 함, 끝날 때 일괄 검증 |\n| 다중 버전(MVCC) | 버전 여러 개, 타임스탬프로 맞는 버전 선택 |"},{"id":"db-063","subject":"db","topic":"트랜잭션","sub":"병행 제어 실패 현상","type":"blank","level":1,"q":"병행 제어를 하지 않고 트랜잭션을 동시에 실행할 때 생기는 문제이다. ①~④에 해당하는 문제를 \u003c보기>에서 골라 쓰시오.","box":"① T1과 T2가 같은 잔액 100을 읽고 각각 +10, +20을 한 뒤 저장했더니, 나중에 저장한 T2의 결과(120)만 남고 T1의 갱신은 사라졌다.\n② T2가 아직 COMMIT하지 않은 값을 T1이 읽어 계산에 썼는데, 그 뒤 T2가 ROLLBACK되어 T1은 존재한 적 없는 값으로 일을 처리했다.\n③ T1이 여러 계좌 잔액의 합계를 구하는 도중 T2가 일부 계좌 값을 바꿔, T1이 얻은 합계가 어느 시점의 실제 상태와도 맞지 않게 되었다.\n④ T1이 ROLLBACK되자, T1이 바꾼 값을 읽어 간 T2와 T3까지 줄줄이 ROLLBACK해야 했다.","options":["ㄱ. 갱신 분실(Lost Update)","ㄴ. 비완료 의존성(Dirty Read)","ㄷ. 모순성(Inconsistency)","ㄹ. 연쇄 복귀(Cascading Rollback)","ㅁ. 교착상태(Deadlock)"],"answers":[{"label":"①","accept":["갱신 분실","ㄱ","갱신 손실","Lost Update"]},{"label":"②","accept":["비완료 의존성","ㄴ","현황 파악 오류","Dirty Read","Uncommitted Dependency"]},{"label":"③","accept":["모순성","ㄷ","Inconsistency","불일치"]},{"label":"④","accept":["연쇄 복귀","ㄹ","Cascading Rollback","Cascade Rollback","연쇄 철회"]}],"hint":"덮어쓰기 / 커밋 전 값 읽기 / 앞뒤 안 맞는 결과 / 줄줄이 취소","explain":"정답: ① 갱신 분실 ② 비완료 의존성(Dirty Read) ③ 모순성 ④ 연쇄 복귀\n- 교재마다 이름이 다르다. 시나공 계열: 갱신 분실, **비완료 의존성**(Uncommitted Dependency), 모순성, 연쇄 복귀. 수제비 계열: 갱신 손실, **현황 파악 오류**(Dirty Read), 모순성, 연쇄 복귀(두음 '갱현모연'). ②는 둘 중 어느 이름으로 써도 된다\n- '현행 파악 오류'라는 표기는 주요 수험서에서 확인되지 않는다. 현황 파악 오류로 쓴다\n\n| 문제 | 영문 | 상황 |\n|---|---|---|\n| 갱신 분실(갱신 손실) | Lost Update | 두 트랜잭션이 같은 값을 갱신해 한쪽 결과가 덮어써져 사라짐 |\n| 비완료 의존성(현황 파악 오류) | Uncommitted Dependency(Dirty Read) | COMMIT 안 된 중간 값을 다른 트랜잭션이 읽음 |\n| 모순성 | Inconsistency | 다른 트랜잭션이 끼어들어 값이 바뀌어 결과가 앞뒤 안 맞음 |\n| 연쇄 복귀 | Cascading Rollback | 한 트랜잭션의 ROLLBACK으로 그 값을 읽은 트랜잭션들도 줄줄이 ROLLBACK |\n- 함정 보기: 교착상태는 서로의 자원을 기다리며 멈추는 것으로, 병행 제어(로킹)를 **해서** 생길 수 있는 문제다"},{"id":"db-064","subject":"db","topic":"물리 설계·기타","sub":"인덱스","type":"short","past":"2021-3","level":3,"q":"다음 설명에 해당하는 파일 편성(접근) 방식을 쓰시오.","box":"- 데이터베이스 파일의 레코드 접근 방식은 순차 접근, ( ), 해싱 접근으로 나눌 수 있다.\n- 레코드의 키 항목만 모아 \u003c키 값, 주소(포인터)> 쌍으로 만든 별도의 구조를 두고, 이 구조가 가리키는 주소로 레코드를 직접 참조한다.\n- 책 뒤쪽의 '찾아보기'처럼 동작하며, 순차 처리와 임의 접근을 함께 지원한다.","answers":[{"label":"답","accept":["인덱스","색인","Index","인덱스 접근","색인 접근"]}],"hint":"책 뒤의 찾아보기","explain":"정답: 인덱스(색인)\n- 단서: 키 항목만 모은 구조 + 주소(포인터)로 직접 참조\n- 인덱스 순차 접근(ISAM)은 인덱스로 임의 접근, 정렬된 데이터로 순차 접근을 함께 지원한다. 오늘날 DBMS는 B-트리(B+트리)를 주로 쓴다\n\n| 접근 방식 | 원리 | 장점 | 단점 |\n|---|---|---|---|\n| 순차 | 저장 순서대로 처음부터 읽음 | 일괄 처리, 공간 효율 | 특정 레코드 검색 느림 |\n| 인덱스(색인) | \u003c키 값, 포인터> 구조로 주소를 찾아 직접 접근 | 순차·임의 접근 모두 가능 | 인덱스 공간, 갱신 비용 |\n| 해싱 | 해시 함수로 키를 주소로 변환 | 평균 O(1) 임의 접근 | 순차 접근 어려움, 충돌 |"},{"id":"db-065","subject":"db","topic":"물리 설계·기타","sub":"인덱스","type":"choice","past":"2025-2","level":3,"q":"다음은 데이터베이스 물리 설계에서 레코드 접근 방법에 대한 설명이다. ( )에 공통으로 들어갈 용어를 \u003c보기>에서 골라 쓰시오.","box":"레코드 접근 방법에는 순차, ( ), 해싱이 있다. ( ) 방법은 \u003c키 값, 포인터> 쌍을 별도로 저장해 두고 키로 빠르게 찾는다. 대부분의 DBMS는 이를 B-트리 계열 구조로 만들며, 조회는 빨라지지만 INSERT·UPDATE·DELETE가 일어날 때마다 ( )도 함께 고쳐야 해서 쓰기 비용이 늘어난다.","options":["ㄱ. 인덱스","ㄴ. 뷰","ㄷ. 클러스터","ㄹ. 파티션","ㅁ. 트리거"],"answers":[{"label":"답","accept":["인덱스","ㄱ","색인","Index"]}],"hint":"\u003c키 값, 포인터>","explain":"정답: 인덱스\n- 쓰기 비용: 행이 바뀌면 인덱스도 고쳐야 하므로 입력·수정·삭제가 잦은 컬럼에는 부담이 된다\n- 함정 보기: 뷰 = 가상 테이블, 클러스터 = 같이 쓰는 행을 같은 블록에 모음, 파티션 = 큰 테이블을 나눠 저장, 트리거 = 이벤트 때 자동 실행\n\n| 인덱스 종류 | 뜻 |\n|---|---|\n| 클러스터드 | 인덱스 순서와 데이터의 물리적 저장 순서가 같다. 테이블당 하나 |\n| 넌클러스터드 | 인덱스와 데이터 저장 순서가 무관, 여러 개 가능 |\n| 밀집(Dense) | 모든 레코드마다 인덱스 항목 |\n| 희소(Sparse) | 블록마다 인덱스 항목 하나 |\n| B-트리 | 균형 트리. 가장 널리 쓰임 |\n| 비트맵 | 값 종류가 적은 컬럼(성별 등)에 유리 |\n| 함수 기반 | 컬럼에 함수를 적용한 값으로 만든 인덱스 |"},{"id":"db-066","subject":"db","topic":"물리 설계·기타","sub":"해싱","type":"short","past":"2023-2","level":2,"q":"다음 설명에 해당하는 검색 기법을 쓰시오.","box":"- 임의 길이의 키 값을 함수에 넣어 고정된 크기의 값으로 바꾸고, 그 값을 레코드의 저장 위치(버킷 주소)로 쓴다.\n- 키 값만 알면 계산 한 번으로 위치를 구하므로 평균 O(1)에 레코드를 찾는다.\n- 서로 다른 키가 같은 주소로 바뀌는 충돌이 생길 수 있어 체이닝이나 개방 주소법으로 해결한다.","answers":[{"label":"답","accept":["해싱","해시","Hashing","Hash","해시 함수"]}],"hint":"키를 계산해서 바로 주소로","explain":"정답: 해싱(Hashing)\n- 단서: 키 → 함수 → 고정 크기 주소, 평균 O(1), 충돌\n- 충돌 해결: 체이닝(같은 주소끼리 연결 리스트), 개방 주소법(다른 빈 곳을 찾아 저장)\n- 약점: 해시 값이 흩어져 있어 범위 검색·순차 처리가 어렵다\n\n| 접근 방식 | 원리 | 장점 | 단점 |\n|---|---|---|---|\n| 순차 | 저장 순서대로 처음부터 읽음 | 일괄 처리, 공간 효율 | 특정 레코드 검색 느림 |\n| 인덱스(색인) | \u003c키 값, 포인터> 구조로 주소를 찾아 직접 접근 | 순차·임의 접근 모두 가능 | 인덱스 공간, 갱신 비용 |\n| 해싱 | 해시 함수로 키를 주소로 변환 | 평균 O(1) 임의 접근 | 순차 접근 어려움, 충돌 |"},{"id":"db-067","subject":"db","topic":"물리 설계·기타","sub":"RAID","type":"blank","past":"2022-1","level":2,"q":"다음은 RAID 레벨에 대한 설명이다. ①~④에 해당하는 RAID 레벨을 숫자로 쓰시오.","box":"① 데이터를 블록 단위로 나눠 여러 디스크에 분산 저장(스트라이핑)한다. 입출력이 빠르지만 중복 저장이나 패리티가 없어 디스크 하나만 고장 나도 데이터를 잃는다.\n② 같은 데이터를 두 디스크에 똑같이 기록(미러링)한다. 디스크 하나가 고장 나도 복구할 수 있지만 전체 용량의 절반만 쓸 수 있다.\n③ 스트라이핑에 패리티를 더하되, 패리티를 모든 디스크에 분산 저장한다. 최소 3개 디스크가 필요하고 디스크 1개 고장까지 복구한다.\n④ 패리티를 두 종류 계산해 분산 저장한다. 최소 4개 디스크가 필요하고 디스크 2개가 동시에 고장 나도 복구한다.","answers":[{"label":"①","accept":["0","RAID 0","RAID-0"]},{"label":"②","accept":["1","RAID 1","RAID-1"]},{"label":"③","accept":["5","RAID 5","RAID-5"]},{"label":"④","accept":["6","RAID 6","RAID-6"]}],"hint":"스트라이핑 / 미러링 / 패리티 하나 분산 / 패리티 둘","explain":"정답: ① 0 ② 1 ③ 5 ④ 6\n- 원 기출(2022년 1회, 분류는 네트워크/OS)은 ①만 묻는 단답이었다. 답은 숫자 0\n\n| 레벨 | 방식 | 최소 디스크 | 견디는 고장 | 용량 효율 |\n|---|---|---|---|---|\n| 0 | 스트라이핑 | 2 | 0개 | 100% |\n| 1 | 미러링 | 2 | 1개 | 50% |\n| 5 | 스트라이핑 + 분산 패리티 | 3 | 1개 | (N−1)/N |\n| 6 | 스트라이핑 + 이중 분산 패리티 | 4 | 2개 | (N−2)/N |\n| 10(1+0) | 미러링 후 스트라이핑 | 4 | 쌍마다 1개 | 50% |\n- 헷갈리는 쌍: RAID 4는 패리티를 **전용 디스크 하나**에, RAID 5는 **모든 디스크에 분산**\n- 스토리지 연결 방식: DAS(서버에 직접 연결), NAS(네트워크로 파일 단위 공유), SAN(전용 고속망으로 블록 단위 공유)"},{"id":"db-068","subject":"db","topic":"물리 설계·기타","sub":"백업·이중화","type":"blank","level":1,"q":"다음은 데이터베이스 백업 방식에 대한 설명이다. ①~③에 해당하는 방식을 \u003c보기>에서 골라 쓰시오.","box":"① 데이터베이스 전체를 백업한다. 복구는 가장 간단하지만 시간과 저장 공간이 가장 많이 든다.\n② 마지막 전체 백업 이후 바뀐 데이터를 모두 백업한다. 복구할 때는 전체 백업과 가장 최근의 이 백업 하나만 있으면 된다.\n③ 바로 직전 백업(전체든 아니든) 이후 바뀐 데이터만 백업한다. 백업은 가장 빠르지만, 복구할 때는 전체 백업 뒤의 이 백업들을 모두 순서대로 적용해야 한다.","options":["ㄱ. 전체 백업(Full)","ㄴ. 차등 백업(Differential)","ㄷ. 증분 백업(Incremental)","ㄹ. 실시간 백업","ㅁ. 트랜잭션 로그 백업"],"answers":[{"label":"①","accept":["전체 백업","ㄱ","전체","Full Backup","Full","풀 백업"]},{"label":"②","accept":["차등 백업","ㄴ","차등","Differential Backup","Differential"]},{"label":"③","accept":["증분 백업","ㄷ","증분","Incremental Backup","Incremental"]}],"hint":"변경분을 세는 기준점이 서로 다르다","explain":"정답: ① 전체 ② 차등 ③ 증분\n- 헷갈리는 쌍: **차등** = 마지막 **전체** 백업 이후 변경분(날마다 커짐, 복구는 전체 + 최신 차등 1개) / **증분** = **직전 백업** 이후 변경분(작고 빠름, 복구는 전체 + 증분 전부를 순서대로)\n\n| 백업 | 백업 대상 | 백업 시간 | 복구에 필요한 것 |\n|---|---|---|---|\n| 전체 | 전부 | 가장 김 | 전체 1개 |\n| 차등 | 마지막 전체 이후 변경 | 중간 | 전체 + 마지막 차등 |\n| 증분 | 직전 백업 이후 변경 | 가장 짧음 | 전체 + 모든 증분 |\n- 그 밖에: 실시간 백업(즉시 복사), 트랜잭션 로그 백업(로그로 특정 시점까지 복구)\n- 복구 목표: RTO(목표 복구 **시간**, 얼마나 빨리) / RPO(목표 복구 **시점**, 어느 시점 데이터까지)\n- DB 이중화: Eager(변경 즉시 모든 복제 DB에 전달) / Lazy(트랜잭션이 끝난 뒤 새 트랜잭션으로 전달). 구성은 Active-Active(둘 다 서비스) / Active-Standby(대기 서버가 장애 때 넘겨받음, Hot·Warm·Cold Standby)"},{"id":"db-069","subject":"db","topic":"물리 설계·기타","sub":"DB 암호화","type":"blank","level":1,"q":"다음은 데이터베이스 암호화 방식에 대한 설명이다. ①~③에 해당하는 방식을 \u003c보기>에서 골라 쓰시오.","box":"① 애플리케이션 서버에 암호 모듈을 두고, 응용 프로그램이 암호화·복호화 함수를 직접 호출한다. 응용 프로그램을 고쳐야 하고 애플리케이션 서버에 부하가 생긴다.\n② DB 서버에 암·복호화 모듈을 설치해 DBMS 안에서 암호화한다. 응용 프로그램 수정은 적지만 DB 서버에 부하가 생긴다.\n③ DBMS 커널 수준에서 데이터를 파일에 쓸 때 암호화하고 읽을 때 복호화한다. 응용 프로그램을 전혀 고치지 않아도 되며 사용자에게 투명하다.","options":["ㄱ. API 방식","ㄴ. Plug-in 방식","ㄷ. TDE 방식","ㄹ. 하이브리드 방식","ㅁ. 파일 암호화 방식"],"answers":[{"label":"①","accept":["API 방식","ㄱ","API"]},{"label":"②","accept":["Plug-in 방식","ㄴ","Plug-in","플러그인 방식","플러그인"]},{"label":"③","accept":["TDE 방식","ㄷ","TDE","Transparent Data Encryption"]}],"hint":"암·복호화를 어디서 하느냐: 앱 서버 / DB 서버 모듈 / DBMS 커널","explain":"정답: ① API ② Plug-in ③ TDE\n\n| 방식 | 암·복호화 위치 | 응용 프로그램 수정 | 부하 |\n|---|---|---|---|\n| API | 애플리케이션 서버 | 많음 | 애플리케이션 서버 |\n| Plug-in | DB 서버(플러그인 모듈) | 적음 | DB 서버 |\n| TDE | DBMS 커널(저장·읽기 시점) | 없음 | DB 서버(적음) |\n| 하이브리드 | API + Plug-in 결합 | 중간 | 분산 |\n- TDE = Transparent Data Encryption. '투명'은 사용자·응용이 암호화를 의식하지 않는다는 뜻\n- API·Plug-in은 주로 컬럼 단위로 암호화한다. TDE는 데이터 파일에 쓰고 읽는 시점(블록·테이블스페이스)에서 암호화하고, 컬럼 단위도 지원하는 DBMS가 있다"},{"id":"db-070","subject":"db","topic":"물리 설계·기타","sub":"DCL","type":"essay","past":"2021-3","level":2,"q":"DCL 명령어 GRANT의 기능을 서술하시오.","answers":[{"label":"답","accept":[],"model":"데이터베이스 관리자(DBA)가 사용자에게 데이터베이스 접속, 테이블 생성 같은 시스템 권한이나 특정 객체에 대한 SELECT·INSERT·UPDATE·DELETE 같은 객체 권한을 부여하는 명령어이다. 예: GRANT SELECT ON 학생 TO user1;"}],"hint":"권한 부여","explain":"- 채점 핵심어: 사용자에게 **권한을 부여**하는 **DCL** 명령어\n- 짝: REVOKE = 부여한 권한을 **회수**\n- 형식: GRANT 권한 ON 객체 TO 사용자 [WITH GRANT OPTION] / REVOKE 권한 ON 객체 FROM 사용자 [CASCADE]\n- WITH GRANT OPTION: 받은 권한을 다른 사용자에게 다시 줄 수 있게 함. 회수할 때 CASCADE면 그 사용자가 넘겨준 권한까지 함께 회수\n\n| 분류 | 명령어 |\n|---|---|\n| DDL | CREATE, ALTER, DROP, TRUNCATE |\n| DML | SELECT, INSERT, UPDATE, DELETE |\n| DCL | GRANT, REVOKE |\n| TCL | COMMIT, ROLLBACK, SAVEPOINT |"},{"id":"db-071","subject":"db","topic":"물리 설계·기타","sub":"뷰","type":"short","level":1,"q":"다음 설명에 해당하는 데이터베이스 객체를 쓰시오.","box":"- 하나 이상의 기본 테이블에서 유도된, 이름을 가진 가상 테이블이다. 데이터를 물리적으로 저장하지 않고 정의만 시스템 카탈로그에 저장된다.\n- 사용자에게 필요한 데이터만 보여 주므로 보안에 유리하고 논리적 데이터 독립성을 제공한다.\n- 한 번 정의하면 ALTER문으로 바꿀 수 없어 삭제한 뒤 다시 만들어야 하고, 기반이 되는 테이블을 삭제하면 함께 삭제된다.","answers":[{"label":"답","accept":["뷰","View"]}],"hint":"가상 테이블","explain":"정답: 뷰(View)\n- 단서: 가상 테이블, 정의만 카탈로그에 저장, ALTER 불가\n\n| 장점 | 단점 |\n|---|---|\n| 논리적 데이터 독립성 제공 | 독립적인 인덱스를 만들 수 없음 |\n| 필요한 데이터만 보여 줘 보안(접근 제어)에 유리 | ALTER로 정의 변경 불가, DROP 후 재생성 |\n| 복잡한 질의를 단순하게 | 삽입·삭제·갱신에 제약(집계·GROUP BY·DISTINCT·조인 뷰 등) |\n- 뷰 위에 또 뷰를 만들 수 있다. 기본 테이블이나 상위 뷰를 지우면 그 위의 뷰도 함께 삭제된다(DROP … CASCADE)"},{"id":"db-072","subject":"db","topic":"물리 설계·기타","sub":"클러스터","type":"short","level":1,"q":"다음 설명에 해당하는 물리 저장 기법을 쓰시오.","box":"- 자주 함께 조회되는 데이터, 또는 지정한 컬럼 값이 같은 행들을 디스크의 같은 데이터 블록(물리적으로 인접한 공간)에 모아 저장한다.\n- 자주 조인하는 두 테이블의 행을 조인 키 기준으로 한곳에 모아 두면 조인과 범위 조회가 빨라진다.\n- 조회 성능은 좋아지지만 입력·수정·삭제가 잦은 테이블에 쓰면 오히려 느려진다.","answers":[{"label":"답","accept":["클러스터","클러스터링","Cluster","Clustering","레코드 집중"]}],"hint":"같이 쓰는 것끼리 같은 블록에","explain":"정답: 클러스터(클러스터링)\n- 단서: 같은 값·자주 같이 쓰는 행을 **같은 블록에 모아** 저장, 조인·범위 조회에 유리, 잦은 갱신에 불리\n- 물리 설계의 '레코드 집중(Record Clustering) 분석·설계'가 이것이다\n- 헷갈리는 것\n  - 클러스터드 인덱스: 인덱스 순서대로 데이터를 정렬해 저장하는 **인덱스**\n  - 파티셔닝: 큰 테이블을 기준에 따라 **여러 조각으로 나눠** 저장\n  - 반정규화: 성능을 위해 **중복을 허용**하는 모델 변경"},{"id":"db-073","subject":"db","topic":"물리 설계·기타","sub":"파티션","type":"blank","level":1,"q":"다음은 테이블 파티셔닝(Partitioning) 방식에 대한 설명이다. ①~④에 해당하는 방식을 \u003c보기>에서 골라 쓰시오.","box":"① 주문일자처럼 연속된 값의 구간을 기준으로 나눈다. 예: 2025년 1~6월 주문, 7~12월 주문.\n② 파티션 키에 함수를 적용한 결과값으로 나눠 데이터를 고르게 흩어 놓는다. 어느 파티션에 들어갈지 사용자가 예측하기 어렵다.\n③ 지역 코드처럼 값 목록을 직접 지정해 나눈다. 예: '서울','경기'는 파티션 1, '부산','울산'은 파티션 2.\n④ 먼저 날짜 구간으로 나누고, 각 구간을 다시 해시로 나누는 것처럼 두 방식을 결합한다.","options":["ㄱ. 범위 분할(Range)","ㄴ. 해시 분할(Hash)","ㄷ. 목록 분할(List)","ㄹ. 조합 분할(Composite)","ㅁ. 라운드 로빈(Round Robin)"],"answers":[{"label":"①","accept":["범위 분할","ㄱ","Range","범위","Range Partitioning"]},{"label":"②","accept":["해시 분할","ㄴ","Hash","해시","Hash Partitioning"]},{"label":"③","accept":["목록 분할","ㄷ","List","리스트 분할","목록","List Partitioning"]},{"label":"④","accept":["조합 분할","ㄹ","Composite","합성 분할","조합","Composite Partitioning"]}],"hint":"연속 구간 / 함수 결과 / 직접 지정한 값 / 결합","explain":"정답: ① 범위 ② 해시 ③ 목록(리스트) ④ 조합(합성)\n\n| 방식 | 기준 | 예 |\n|---|---|---|\n| 범위(Range) | 연속된 값의 구간 | 날짜, 월별 |\n| 해시(Hash) | 해시 함수 결과 | 고르게 분산, 위치 예측 어려움 |\n| 목록(List) | 지정한 값 목록 | 지역, 상태 코드 |\n| 조합(Composite) | 두 방식 결합 | 범위-해시, 범위-목록 |\n| 라운드 로빈 | 순서대로 돌아가며 | 균등 분배 |\n- 장점: 큰 테이블 조회 시 필요한 파티션만 읽음, 파티션 단위 백업·관리, 장애 범위 축소\n- 헷갈리는 것: 파티셔닝은 행 단위 분리라 반정규화의 '수평 분할'과 모양이 비슷하다. 파티셔닝은 논리적으로 한 테이블을 유지하고 저장만 나눈다"},{"id":"db-074","subject":"db","topic":"물리 설계·기타","sub":"분산 DB 투명성","type":"blank","level":1,"q":"다음은 분산 데이터베이스가 갖춰야 할 투명성(Transparency)에 대한 설명이다. ①~④에 해당하는 투명성을 \u003c보기>에서 골라 쓰시오.","box":"① 사용자는 데이터가 어느 사이트에 저장되어 있는지 몰라도 논리적인 이름만으로 접근할 수 있다.\n② 같은 데이터가 여러 사이트에 복제되어 있어도 사용자는 하나만 있는 것처럼 사용한다.\n③ 여러 사이트의 트랜잭션이 동시에 실행되어도 결과의 일관성이 유지된다.\n④ 일부 사이트나 통신망에 장애가 생겨도 트랜잭션은 원자성을 유지하며 정확히 처리된다.","options":["ㄱ. 위치 투명성","ㄴ. 중복 투명성","ㄷ. 병행 투명성","ㄹ. 장애 투명성","ㅁ. 분할 투명성","ㅂ. 지역사상 투명성"],"answers":[{"label":"①","accept":["위치 투명성","ㄱ","위치","Location Transparency"]},{"label":"②","accept":["중복 투명성","ㄴ","중복","복제 투명성","Replication Transparency"]},{"label":"③","accept":["병행 투명성","ㄷ","병행","Concurrency Transparency"]},{"label":"④","accept":["장애 투명성","ㄹ","장애","Failure Transparency"]}],"hint":"어디 있나 / 몇 개 있나 / 동시에 / 고장 나도","explain":"정답: ① 위치 ② 중복(복제) ③ 병행 ④ 장애\n- 교재별 개수: 시나공은 분산 DB의 목표로 **위치·중복·병행·장애** 4가지를 든다. 수제비 등은 여기에 **분할·지역사상**을 더해 6가지로 정리한다. 4가지를 쓰라고 하면 위치·중복·병행·장애\n\n| 투명성 | 사용자가 몰라도 되는 것 |\n|---|---|\n| 위치(Location) | 데이터가 저장된 사이트 |\n| 중복(Replication) | 데이터가 여러 사이트에 복제되어 있는지 |\n| 병행(Concurrency) | 여러 트랜잭션이 동시에 실행되는지(결과는 일관됨) |\n| 장애(Failure) | 사이트·통신망 장애(트랜잭션 원자성 유지) |\n| 분할(Fragmentation) | 한 릴레이션이 여러 조각으로 나뉘어 저장되었는지 |\n| 지역사상(Local Mapping) | 지역 DBMS와 물리적 DB 사이의 대응 |\n- 분산 DB 구성 요소: 분산 처리기, 분산 데이터베이스, 통신 네트워크\n- CAP 이론: 분산 시스템은 일관성(Consistency)·가용성(Availability)·분단 허용성(Partition Tolerance)을 동시에 모두 만족할 수 없다"},{"id":"db-075","subject":"db","topic":"물리 설계·기타","sub":"데이터 웨어하우스·OLAP","type":"blank","level":1,"q":"다음은 데이터 웨어하우스와 OLAP에 대한 설명이다. ①~⑤에 해당하는 용어를 \u003c보기>에서 골라 쓰시오.","box":"① 여러 운영 시스템의 데이터를 주제별로 통합하고 시간 흐름에 따라 쌓아 두는 의사결정 지원용 데이터베이스다. 한번 적재한 데이터는 수정하지 않는다.\n② 일별 매출을 월별·연도별로 묶어 더 요약된 수준으로 올라가며 본다.\n③ 연도별 매출에서 분기별·월별로 내려가며 더 상세한 데이터를 본다.\n④ 다차원 큐브에서 한 차원의 값을 하나로 고정해 단면을 잘라 본다. 예: 2026년 데이터만 본다.\n⑤ 두 개 이상의 차원에 범위를 지정해 작은 부분 큐브를 잘라 본다. 예: 2025~2026년, 서울·부산, 가전·의류만 본다.","options":["ㄱ. 데이터 웨어하우스","ㄴ. 데이터 마트","ㄷ. 데이터 마이닝","ㄹ. Roll-up","ㅁ. Drill-down","ㅂ. Slicing","ㅅ. Dicing","ㅇ. Pivot"],"answers":[{"label":"①","accept":["데이터 웨어하우스","ㄱ","Data Warehouse","DW"]},{"label":"②","accept":["Roll-up","ㄹ","롤업","Rollup"]},{"label":"③","accept":["Drill-down","ㅁ","드릴다운","Drilldown"]},{"label":"④","accept":["Slicing","ㅂ","슬라이스","Slice","슬라이싱"]},{"label":"⑤","accept":["Dicing","ㅅ","다이스","Dice","다이싱"]}],"hint":"위로 요약, 아래로 상세, 한 칼 자르기, 깍둑썰기","explain":"정답: ① 데이터 웨어하우스 ② Roll-up ③ Drill-down ④ Slicing ⑤ Dicing\n- 데이터 웨어하우스 특징: 주제 지향, 통합, 시계열(시간에 따라 쌓임), 비휘발성(적재 뒤 수정 안 함)\n\n| OLAP 연산 | 뜻 |\n|---|---|\n| Roll-up | 상위 수준으로 요약(일 → 월 → 연) |\n| Drill-down | 하위 수준으로 상세화(연 → 월 → 일). Roll-up의 반대 |\n| Slicing | 한 차원의 값을 고정해 단면을 봄 |\n| Dicing | 두 개 이상 차원에 범위를 줘 부분 큐브를 봄 |\n| Pivot | 축(차원)을 회전해 다른 관점으로 봄 |\n- 함정 보기: 데이터 마트 = 특정 부서·주제용 소규모 웨어하우스. 데이터 마이닝 = 대량 데이터에서 패턴·규칙을 찾는 분석 기법\n- OLAP(분석, 다차원·대량 조회) vs OLTP(업무 처리, 짧은 트랜잭션 다수)"},{"id":"db-076","subject":"db","topic":"물리 설계·기타","sub":"옵티마이저","type":"short","level":1,"q":"다음 설명에 해당하는 옵티마이저(Optimizer)의 종류를 쓰시오.","box":"- SQL 실행 계획을 세울 때 테이블의 행 수, 컬럼 값의 분포, 인덱스 정보 같은 통계 정보를 이용한다.\n- 가능한 실행 계획마다 예상 처리 비용(디스크 I/O, CPU 사용량)을 계산해 가장 적은 계획을 고른다.\n- 통계 정보가 오래되면 잘못된 실행 계획을 고를 수 있다.","answers":[{"label":"답","accept":["비용 기반 옵티마이저","비용 기반","CBO","Cost Based Optimizer","Cost-Based Optimizer"]}],"hint":"정해진 순위표가 아니라 계산으로 고른다","explain":"정답: 비용 기반 옵티마이저(CBO, Cost Based Optimizer)\n- 단서: 통계 정보, 예상 비용 계산\n- 짝: 규칙 기반 옵티마이저(RBO) = 미리 정한 우선순위 규칙(예: 인덱스 스캔이 전체 테이블 스캔보다 우선)으로 계획을 고른다\n\n| 구분 | 규칙 기반(RBO) | 비용 기반(CBO) |\n|---|---|---|\n| 기준 | 미리 정한 우선순위 규칙 | 통계 정보로 계산한 예상 비용 |\n| 장점 | 예측이 쉽다 | 데이터 상황에 맞는 계획 |\n| 단점 | 데이터 분포를 반영 못 함 | 통계가 낡으면 잘못 고름 |\n- 오늘날 대부분의 DBMS는 비용 기반을 쓴다. Oracle은 힌트로 실행 계획을 유도할 수 있다\n- SQL 처리 흐름: 구문 분석(파싱) → 최적화(실행 계획 수립) → 실행 → 인출(SELECT일 때)"},{"id":"db-077","subject":"db","topic":"물리 설계·기타","sub":"절차형 SQL","type":"blank","level":1,"q":"다음은 절차형 SQL에 대한 설명이다. ①~③에 해당하는 것을 \u003c보기>에서 골라 쓰시오.","box":"① 자주 쓰는 여러 SQL 문을 하나로 묶어 DBMS에 저장해 둔 것이다. CALL이나 EXECUTE로 호출하며, 반환값이 없거나 OUT 매개변수로 여러 값을 돌려줄 수 있다.\n② 일련의 연산 결과를 RETURN으로 단일 값 하나만 돌려준다. SELECT 문 안에서 내장 함수처럼 호출할 수 있다.\n③ 특정 테이블에 INSERT·UPDATE·DELETE 같은 이벤트가 발생하면 DBMS가 자동으로 실행한다. 사용자가 직접 호출할 수 없다.","options":["ㄱ. 저장 프로시저(Stored Procedure)","ㄴ. 사용자 정의 함수(User Defined Function)","ㄷ. 트리거(Trigger)","ㄹ. 뷰(View)","ㅁ. 커서(Cursor)"],"answers":[{"label":"①","accept":["저장 프로시저","ㄱ","프로시저","Stored Procedure","Procedure"]},{"label":"②","accept":["사용자 정의 함수","ㄴ","User Defined Function","UDF","함수"]},{"label":"③","accept":["트리거","ㄷ","Trigger"]}],"hint":"호출해서 실행 / 값 하나 반환 / 이벤트에 자동 실행","explain":"정답: ① 저장 프로시저 ② 사용자 정의 함수 ③ 트리거\n\n| 구분 | 호출 | 반환 | 특징 |\n|---|---|---|---|\n| 저장 프로시저 | CALL·EXECUTE로 직접 호출 | 없거나 OUT 매개변수로 여러 값 | 여러 SQL을 묶어 DB에 저장 |\n| 사용자 정의 함수 | SQL 문 안에서 호출 | RETURN으로 **단일 값** | SELECT·WHERE 절에서 내장 함수처럼 사용 |\n| 트리거 | 직접 호출 불가, **이벤트 발생 시 자동** | 없음 | INSERT·UPDATE·DELETE 전후에 실행. 시나공 기준 트리거 구문에는 DCL을 쓸 수 없다(이 교재는 COMMIT·ROLLBACK도 DCL로 분류) |\n- 함정 보기: 뷰 = 가상 테이블, 커서 = 질의 결과의 행을 하나씩 가리키며 처리하는 포인터\n- 트리거의 대표 쓰임: 사용자 정의 무결성 구현, 변경 이력(로그) 자동 기록"},{"id":"db-078","subject":"db","topic":"물리 설계·기타","sub":"DB 접속 기술","type":"blank","level":1,"q":"다음은 응용 프로그램에서 데이터베이스에 접속하는 기술에 대한 설명이다. ①~④에 해당하는 것을 \u003c보기>에서 골라 쓰시오.","box":"① 자바 프로그램이 DBMS에 접속해 SQL을 실행할 수 있게 해 주는 자바 표준 API다. 1997년 썬 마이크로시스템즈가 발표했다.\n② 마이크로소프트가 만든 표준 인터페이스로, 개발 언어에 관계없이 여러 DBMS에 같은 방식으로 접근하게 해 준다.\n③ SQL을 XML 파일이나 어노테이션에 따로 적고, 자바 객체와 SQL 실행 결과를 매핑해 주는 SQL Mapping 프레임워크다. JDBC 코드를 단순하게 만든다.\n④ 객체와 관계형 테이블을 직접 대응시켜, SQL을 직접 쓰지 않고 객체를 다루듯 데이터를 조작하게 해 주는 기술이다. JPA, Hibernate가 대표적이다.","options":["ㄱ. JDBC","ㄴ. ODBC","ㄷ. MyBatis","ㄹ. ORM","ㅁ. JSON","ㅂ. AJAX"],"answers":[{"label":"①","accept":["JDBC","ㄱ","Java Database Connectivity"]},{"label":"②","accept":["ODBC","ㄴ","Open Database Connectivity"]},{"label":"③","accept":["MyBatis","ㄷ","마이바티스"]},{"label":"④","accept":["ORM","ㄹ","Object Relational Mapping","객체 관계 매핑"]}],"hint":"자바 표준 / 언어 무관 표준 / SQL 매핑 / 객체 매핑","explain":"정답: ① JDBC ② ODBC ③ MyBatis ④ ORM\n\n| 기술 | 핵심 |\n|---|---|\n| JDBC | 자바 전용 DB 접속 표준 API(Java Database Connectivity). 1997년 썬 마이크로시스템즈 |\n| ODBC | 언어와 무관한 DB 접속 표준(Open Database Connectivity). 마이크로소프트가 만듦 |\n| MyBatis | SQL을 XML·어노테이션에 분리해 적고 객체와 매핑하는 **SQL Mapping** 프레임워크 |\n| ORM | 객체와 테이블을 직접 매핑, SQL을 자동 생성(JPA, Hibernate) |\n- 헷갈리는 쌍: MyBatis는 SQL을 **직접 쓴다**(SQL Mapper). ORM은 SQL을 **직접 안 쓴다**(객체 중심)\n- 함정 보기: JSON = 데이터 교환 포맷, AJAX = 비동기 웹 통신 기법"},{"id":"db-201","subject":"db","topic":"정규화","sub":"고차 정규형","type":"blank","level":2,"q":"다음 ①~③에 해당하는 정규형의 이름을 쓰시오.","box":"① 제3정규형을 만족하고, 결정자이면서 후보키가 아닌 것을 제거해 **모든 결정자가 후보키**가 되게 한 정규형\n② ①을 만족하고, 다치 종속(Multi-Valued Dependency)을 제거한 정규형\n③ ②를 만족하고, 후보키를 통하지 않는 조인 종속(Join Dependency)을 제거한 정규형","answers":[{"label":"①","accept":["BCNF","보이스-코드 정규형","Boyce-Codd 정규형","보이스 코드 정규형","BCNF(Boyce-Codd Normal Form)"]},{"label":"②","accept":["제4정규형","4NF","4정규형","제4정규형(4NF)"]},{"label":"③","accept":["제5정규형","5NF","5정규형","제5정규형(5NF)"]}],"hint":"'도부이결다조'의 뒤쪽 셋","explain":"정답: ① BCNF ② 제4정규형 ③ 제5정규형\n\n| 정규형 | 제거 대상 | 두음 |\n|---|---|---|\n| 1NF | 도메인을 원자값으로 | 도 |\n| 2NF | 부분 함수 종속 | 부 |\n| 3NF | 이행 함수 종속 | 이 |\n| BCNF | 후보키가 아닌 결정자 | 결 |\n| 4NF | 다치 종속 | 다 |\n| 5NF | 조인 종속 | 조 |\n- BCNF는 '강한 3NF'라고도 부른다. 3NF까지는 결정자가 후보키가 아니어도 되는 경우가 남는다"},{"id":"db-202","subject":"db","topic":"트랜잭션","sub":"병행 제어","type":"short","level":2,"q":"다음 설명에 해당하는 병행 제어 기법을 쓰시오.","box":"- 모든 트랜잭션이 lock과 unlock 요청을 두 단계로 나눠 수행한다.\n- 확장 단계에서는 새로운 lock을 얻을 수만 있고 unlock은 할 수 없다.\n- 축소 단계에서는 unlock만 할 수 있고 새로운 lock은 얻을 수 없다.\n- 직렬 가능성(serializability)을 보장하지만 교착상태가 생길 수 있다.","answers":[{"label":"답","accept":["2단계 로킹(2PL)","2단계 로킹 규약","2단계 잠금","Two-Phase Locking","2PL","2단계 로킹 기법"]}],"hint":"늘리기만 하다가, 줄이기만 한다","explain":"정답: 2단계 로킹(2PL, Two-Phase Locking)\n- 확장(Growing) → 축소(Shrinking) 두 단계. 한 번이라도 unlock하면 더는 lock을 얻지 못한다\n- 2PL은 직렬성을 보장하지만 교착상태는 막지 못한다\n\n| 병행 제어 기법 | 핵심 |\n|---|---|\n| 로킹 | 데이터에 lock을 걸어 접근 통제. 단위가 클수록 병행성↓·오버헤드↓ |\n| 2단계 로킹 | 확장 단계 → 축소 단계 |\n| 타임스탬프 순서 | 트랜잭션 시작 시각 순서대로 실행 순서를 정함 |\n| 낙관적 검증 | 일단 실행하고 끝날 때 검증 |\n| 다중 버전(MVCC) | 데이터의 여러 버전을 두어 읽기와 쓰기가 서로 막지 않게 |"},{"id":"sql-001","subject":"sql","topic":"집합 연산","sub":"UNION·ORDER BY","type":"output","past":"2023-3","level":3,"q":"다음 두 테이블에 SQL을 실행한 결과를 쓰시오. (컬럼명은 빼고 값만 위에서부터 한 줄에 하나씩 쓴다)","box":"**T1**\n| A |\n|---|\n| 5 |\n| 2 |\n| 7 |\n| 2 |\n\n**T2**\n| A |\n|---|\n| 7 |\n| 3 |\n| 5 |","code":{"lang":"sql","src":"SELECT A FROM T1\nUNION\nSELECT A FROM T2\nORDER BY A DESC;"},"answers":[{"label":"답","accept":["7\n5\n3\n2"]}],"hint":"UNION이 지우는 중복은 두 테이블 사이의 중복만이 아니다","explain":"실행 순서: 각 SELECT → 집합 연산 → ORDER BY (전체 결과에 한 번 적용)\n- T1: 5, 2, 7, 2 / T2: 7, 3, 5\n- UNION ALL이면 7행 그대로: 5, 2, 7, 2, 7, 3, 5\n- UNION은 합친 결과 전체에서 중복을 지운다 → {2, 3, 5, 7}. T1 안에 있던 2, 2도 하나만 남는다\n- ORDER BY A DESC → 7, 5, 3, 2\n- **함정 요약**: UNION은 한 테이블 안의 중복까지 지운다. 결과 행 수를 셀 때 원래 행 수를 더하면 틀린다\n\n집합 연산 묶음\n| 연산 | 결과 | 중복 |\n|---|---|---|\n| UNION | 합집합 | 제거 |\n| UNION ALL | 합집합 | 유지 |\n| INTERSECT | 교집합 | 제거 |\n| EXCEPT (Oracle은 MINUS) | 차집합 | 제거 |\n- Oracle은 차집합을 MINUS로 써 왔다. 21c부터는 EXCEPT도 같은 뜻으로 받는다\n- 두 SELECT의 컬럼 수와 타입이 같아야 한다. 결과 컬럼명은 첫 SELECT를 따른다\n- ORDER BY는 맨 마지막 SELECT 뒤에 한 번만 쓴다. 중간에 쓰면 오류\n- 같은 함정이 sql-031(행 수)에도 있다"},{"id":"sql-002","subject":"sql","topic":"서브쿼리","sub":"IN 서브쿼리","type":"output","past":"2024-1","level":3,"q":"다음 테이블에 SQL을 실행한 결과를 쓰시오. (결과 행은 R1에 저장된 순서대로 나온다. 컬럼명은 빼고 값만 한 줄에 하나씩 쓴다)","box":"**R1**\n| A | B | C |\n|---|---|---|\n| 1 | p | k |\n| 2 | q | m |\n| 3 | r | k |\n| 4 | s | n |\n\n**R2**\n| C | D | E |\n|---|---|---|\n| k | y | 5 |\n| m | z | 2 |\n| n | y | 7 |\n| w | y | 1 |","code":{"lang":"sql","src":"SELECT B\nFROM R1\nWHERE C IN (SELECT C FROM R2 WHERE D = 'y');"},"answers":[{"label":"답","accept":["p\nr\ns"]}],"hint":"안쪽 쿼리 결과를 먼저 값 목록으로 적어 둔다","explain":"1. 서브쿼리: R2에서 D = 'y'인 행의 C → k, n, w\n2. 바깥: WHERE C IN ('k', 'n', 'w')\n| R1 행 | C | 포함 |\n|---|---|---|\n| (1, p, k) | k | O |\n| (2, q, m) | m | X (R2에서 m의 D는 'z') |\n| (3, r, k) | k | O |\n| (4, s, n) | n | O |\n- w는 R1에 없으니 아무 영향이 없다 → 결과 p, r, s\n- **함정 요약**: 결과 행은 바깥 테이블(R1) 기준이다. IN 목록에만 있는 값(w)은 행을 만들지 않는다\n\n서브쿼리 연산자 묶음\n- `IN`: 목록 중 하나와 같으면 참. `= ANY`와 같다\n- `NOT IN`: 목록에 NULL이 섞이면 결과가 비게 된다 (sql-020)\n- `EXISTS`: 서브쿼리 결과가 한 행이라도 있으면 참\n- 단일행 비교(`=`, `>`) 뒤에 여러 행이 나오는 서브쿼리를 쓰면 오류 → IN, ANY, ALL을 쓴다 (sql-024)"},{"id":"sql-003","subject":"sql","topic":"WHERE 조건","sub":"AND·OR 우선순위","type":"output","past":"2024-1","level":3,"q":"다음 테이블에 SQL을 실행한 결과를 쓰시오.","box":"**EMP**\n| EMPNO | SAL |\n|---|---|\n| 100 | 2500 |\n| 200 | 1800 |\n| 300 | 3200 |\n| 400 | 2900 |\n| 500 | 3000 |","code":{"lang":"sql","src":"SELECT COUNT(*)\nFROM EMP\nWHERE EMPNO > 200\n  AND SAL >= 3000 OR EMPNO = 200;"},"answers":[{"label":"답","accept":["3"]}],"hint":"괄호가 없을 때 AND와 OR 중 어느 쪽이 먼저 묶이는가","explain":"우선순위는 NOT > AND > OR. 식은 `(EMPNO > 200 AND SAL >= 3000) OR (EMPNO = 200)`이다.\n| EMPNO | SAL | EMPNO > 200 AND SAL >= 3000 | EMPNO = 200 | 결과 |\n|---|---|---|---|---|\n| 100 | 2500 | F | F | F |\n| 200 | 1800 | F | T | **T** |\n| 300 | 3200 | T | F | **T** |\n| 400 | 2900 | F (SAL 미달) | F | F |\n| 500 | 3000 | T (경계 포함) | F | **T** |\n- COUNT(*) = 3\n- 줄바꿈대로 `EMPNO > 200 AND (SAL >= 3000 OR EMPNO = 200)`으로 읽으면 2가 나온다. 이게 노린 오답이다\n- **함정 요약**: AND가 OR보다 먼저 묶인다. 줄바꿈·들여쓰기는 우선순위와 상관없다\n- 같은 문제가 2021-1에도 나왔다\n\n연산자 우선순위 (높은 순)\n- 산술(`*` `/` → `+` `-`) → 비교(`=` `\u003c>` `>` `>=` `\u003c` `\u003c=` LIKE IN BETWEEN IS NULL) → NOT → AND → OR"},{"id":"sql-004","subject":"sql","topic":"서브쿼리","sub":"중첩 서브쿼리·GROUP BY HAVING·JOIN","type":"output","past":"2024-3","level":3,"q":"다음 테이블에 SQL을 실행한 결과를 쓰시오.","box":"**employee**\n| no | name | project_id |\n|---|---|---|\n| 1 | Kim | 10 |\n| 2 | Lee | 20 |\n| 3 | Park | 10 |\n| 4 | Choi | 30 |\n| 5 | Jung | 30 |\n\n**project**\n| project_id | name |\n|---|---|\n| 10 | Alpha |\n| 20 | Beta |\n| 30 | Gamma |\n| 20 | Delta |","code":{"lang":"sql","src":"SELECT COUNT(*)\nFROM employee e JOIN project p ON e.project_id = p.project_id\nWHERE p.name IN (\n    SELECT name FROM project WHERE project_id IN (\n        SELECT project_id FROM employee\n        GROUP BY project_id\n        HAVING COUNT(*) \u003c 2\n    )\n);"},"answers":[{"label":"답","accept":["2"]}],"hint":"project 테이블의 project_id가 유일한지 먼저 확인한다","explain":"안쪽부터 결과를 적어 내려온다.\n1. 가장 안쪽: employee를 project_id로 묶어 COUNT(*) \u003c 2인 그룹\n| project_id | 직원 수 |\n|---|---|\n| 10 | 2 (Kim, Park) |\n| 20 | 1 (Lee) |\n| 30 | 2 (Choi, Jung) |\n→ {20}\n2. 가운데: project에서 project_id = 20인 name → Beta, Delta\n3. 바깥 JOIN: Lee(20)는 project의 20번 두 행과 각각 붙어 (Lee, Beta), (Lee, Delta) 2행이 된다. 다른 직원은 name이 Alpha·Gamma라 탈락\n4. COUNT(*) = 2\n- **함정 요약**: 조인 키가 한쪽에서 중복되면 행이 곱으로 늘어난다. \"직원이 1명\"이라고 1을 쓰면 틀린다\n\n실행 순서: FROM(JOIN) → WHERE → GROUP BY → HAVING → SELECT → ORDER BY\n- WHERE는 그룹을 만들기 전 행을, HAVING은 만든 그룹을 거른다\n- 집계 함수 조건(`COUNT(*) \u003c 2`)은 HAVING에만 쓸 수 있다"},{"id":"sql-005","subject":"sql","topic":"JOIN","sub":"FROM 나열 등가 조인","type":"output","past":"2025-1","level":3,"q":"다음 테이블에 SQL을 실행한 결과를 쓰시오. (컬럼명은 빼고, 행마다 한 줄에 name과 incentive 값을 공백 하나로 구분해 쓴다)","box":"**emp**\n| id | name |\n|---|---|\n| 101 | 김민준 |\n| 102 | 이서연 |\n| 105 | 박도윤 |\n| 107 | 최하은 |\n\n**sal**\n| id | incentive |\n|---|---|\n| 102 | 400 |\n| 105 | 900 |\n| 107 | 500 |\n| 109 | 800 |","code":{"lang":"sql","src":"SELECT name, incentive\nFROM emp, sal\nWHERE emp.id = sal.id\n  AND incentive >= 500\nORDER BY emp.id;"},"answers":[{"label":"답","accept":["박도윤 900\n최하은 500"]}],"hint":"두 테이블에 모두 있는 id만 남는다. 비교 연산자의 경계도 본다","explain":"1. FROM emp, sal: 카티션 곱 4 × 4 = 16행\n2. WHERE emp.id = sal.id: 양쪽에 다 있는 id만 남는다 (101은 sal에 없고, 109는 emp에 없다)\n| id | name | incentive |\n|---|---|---|\n| 102 | 이서연 | 400 |\n| 105 | 박도윤 | 900 |\n| 107 | 최하은 | 500 |\n3. AND incentive >= 500: 400 탈락, 500은 경계 포함\n4. ORDER BY emp.id → 105, 107\n- **함정 요약**: sal의 109(800)는 조건을 만족해 보이지만 emp에 짝이 없어 사라진다\n\n- FROM에 쉼표로 나열하고 WHERE에 조인 조건을 쓰는 방식은 `emp INNER JOIN sal ON emp.id = sal.id`와 같다\n- WHERE의 조인 조건을 빼먹으면 카티션 곱 16행이 그대로 나온다\n- 두 테이블에 같은 이름(id)이 있으면 `emp.id`처럼 테이블명을 붙여야 한다. 안 붙이면 모호하다는 오류"},{"id":"sql-006","subject":"sql","topic":"JOIN","sub":"CROSS JOIN·LIKE 패턴","type":"output","past":"2025-3","level":3,"q":"다음 테이블에 SQL을 실행한 결과를 쓰시오.","box":"**T1**\n| CODE | NAME |\n|---|---|\n| 1 | sam |\n| 2 | paul |\n| 3 | ann |\n| 4 | tom |\n\n**T2**\n| NO | RULE |\n|---|---|\n| 10 | s% |\n| 20 | %a% |\n| 30 | _a% |","code":{"lang":"sql","src":"SELECT COUNT(*) AS CNT\nFROM T1 A CROSS JOIN T2 B\nWHERE A.NAME LIKE B.RULE;"},"answers":[{"label":"답","accept":["6"]}],"hint":"이름 하나가 규칙 여러 개에 동시에 걸릴 수 있다. `_`는 정확히 한 글자","explain":"CROSS JOIN으로 4 × 3 = 12개 조합을 만든 뒤 WHERE로 거른다.\n| NAME | s% | %a% | _a% | 개수 |\n|---|---|---|---|---|\n| sam | O | O | O (둘째 글자 a) | 3 |\n| paul | X | O | O | 2 |\n| ann | X | O | X (a가 첫 글자) | 1 |\n| tom | X | X | X | 0 |\n- 합계 6\n- **함정 요약**: 이름 수(4)나 규칙 수(3)가 아니라 조합 수를 센다. ann은 a로 시작하므로 `_a%`(a 앞에 한 글자가 있어야 함)에 걸리지 않는다\n- 같은 문제가 2021-3에도 나왔다 (smith, allen, scott / s%, %t% → 4)\n\nLIKE 와일드카드\n- `%`: 0글자 이상. `'a%'` a로 시작, `'%a'` a로 끝, `'%a%'` a 포함\n- `_`: 정확히 한 글자. `'_a%'` 둘째 글자가 a, `'___'` 정확히 세 글자\n- `%`·`_` 문자 자체를 찾을 때: `LIKE '%#%%' ESCAPE '#'`\n\nCROSS JOIN 결과: 행 수 = 두 테이블 행 수의 곱, 열 수 = 두 테이블 열 수의 합"},{"id":"sql-007","subject":"sql","topic":"집계 함수","sub":"COUNT(컬럼)과 NULL","type":"output","past":"2025-3","level":3,"q":"다음 테이블에 SQL을 실행한 결과를 쓰시오.","box":"**A**\n| col1 | col2 |\n|---|---|\n| 1 | 4 |\n| 3 | NULL |\n| NULL | 5 |\n| 2 | 2 |\n| 5 | 7 |\n| 3 | 1 |\n| 1 | NULL |\n| 4 | 5 |","code":{"lang":"sql","src":"SELECT COUNT(col2)\nFROM A\nWHERE col1 IN (1, 3) OR col2 IN (2, 5);"},"answers":[{"label":"답","accept":["5"]}],"hint":"WHERE를 통과한 행 수와 COUNT(col2)의 값은 다를 수 있다","explain":"| col1 | col2 | col1 IN (1,3) | col2 IN (2,5) | WHERE |\n|---|---|---|---|---|\n| 1 | 4 | T | F | 통과 |\n| 3 | NULL | T | UNKNOWN | 통과 |\n| NULL | 5 | UNKNOWN | T | 통과 |\n| 2 | 2 | F | T | 통과 |\n| 5 | 7 | F | F | 탈락 |\n| 3 | 1 | T | F | 통과 |\n| 1 | NULL | T | UNKNOWN | 통과 |\n| 4 | 5 | F | T | 통과 |\n- 통과 7행 → COUNT(*)라면 7\n- COUNT(col2)는 col2가 NULL인 2행을 빼고 센다 → 5\n- **함정 요약**: NULL 비교는 UNKNOWN이지만 OR 반대편이 TRUE면 행은 통과한다. 그다음 집계 함수가 NULL을 한 번 더 걸러낸다\n- 같은 함정이 2022-2에도 나왔다\n\nNULL 묶음\n- `UNKNOWN OR TRUE = TRUE`, `UNKNOWN AND FALSE = FALSE`. UNKNOWN이 낀 나머지 조합(`UNKNOWN OR FALSE`, `UNKNOWN AND TRUE`, `NOT UNKNOWN`)은 UNKNOWN. WHERE는 TRUE인 행만 남긴다\n- COUNT(*)만 NULL이 든 행도 센다. COUNT(컬럼)·SUM·AVG·MAX·MIN은 NULL을 빼고 계산한다\n- AVG(컬럼) = SUM(컬럼) / COUNT(컬럼). COUNT(*)로 나누지 않는다\n- NULL 비교는 `= NULL`이 아니라 `IS NULL`, `IS NOT NULL`"},{"id":"sql-008","subject":"sql","topic":"SELECT 기본","sub":"DISTINCT·집계 결과 행 수","type":"blank","past":"2026-1","level":3,"q":"STUDENT 테이블에 경영과 40명, 전자과 70명, 화학과 30명의 학생 정보가 들어 있다. 다음 ①~③ SQL을 각각 실행했을 때 결과로 나오는 행(튜플)의 수를 쓰시오.","box":"- 학생 한 명이 한 행이고, DEPT 컬럼에 학과명이 저장되어 있다.\n- 다른 학과의 학생은 없다.","code":{"lang":"sql","src":"-- ①\nSELECT DEPT FROM STUDENT;\n\n-- ②\nSELECT DISTINCT DEPT FROM STUDENT;\n\n-- ③\nSELECT COUNT(DISTINCT DEPT) FROM STUDENT\nWHERE DEPT = '전자과';"},"answers":[{"label":"①","accept":["140"]},{"label":"②","accept":["3"]},{"label":"③","accept":["1"]}],"hint":"③은 COUNT의 값이 아니라 결과 행이 몇 개인지 묻는다","explain":"- ① 조건이 없으니 140행 전부. 학과명이 겹쳐도 그대로 나온다\n- ② DISTINCT로 중복 제거 → 경영과, 전자과, 화학과 3행\n- ③ WHERE로 전자과 70행만 남긴 뒤 집계 → 결과 1행 (값도 1)\n- **함정 요약**: GROUP BY 없이 집계 함수만 쓰면 결과는 항상 1행이다. 걸러진 행이 0개여도 COUNT는 0이 든 1행을 돌려준다\n- 같은 문제가 2020-1, 2022-3에도 나왔다 (학과명만 다름)\n\nDISTINCT 묶음\n- `SELECT DISTINCT A, B`는 (A, B) 조합 기준으로 중복을 지운다\n- `COUNT(DISTINCT 컬럼)`은 NULL을 뺀 서로 다른 값의 개수\n- DISTINCT의 반대는 ALL이고 기본값이다"},{"id":"sql-009","subject":"sql","topic":"서브쿼리","sub":"스칼라 서브쿼리·AVG","type":"output","past":"2026-1","level":3,"q":"다음 테이블에 SQL을 실행한 결과를 쓰시오.","box":"**employee**\n| emp_id | dep_id |\n|---|---|\n| 1 | 10 |\n| 2 | 30 |\n| 3 | 40 |\n| 4 | 30 |\n\n**dept**\n| dept_id | budget |\n|---|---|\n| 10 | 400 |\n| 20 | 100 |\n| 30 | 260 |\n| 40 | 240 |","code":{"lang":"sql","src":"SELECT COUNT(*)\nFROM employee e\nJOIN dept d ON e.dep_id = d.dept_id\nWHERE d.budget > (SELECT AVG(budget) FROM dept);"},"answers":[{"label":"답","accept":["3"]}],"hint":"평균은 조인 결과가 아니라 서브쿼리 자신의 FROM으로 구한다","explain":"1. 스칼라 서브쿼리: dept 4행 평균 (400 + 100 + 260 + 240) / 4 = 250. 직원이 없는 20번(100)도 평균에 들어간다\n2. JOIN 결과\n| emp_id | dep_id | budget |\n|---|---|---|\n| 1 | 10 | 400 |\n| 2 | 30 | 260 |\n| 3 | 40 | 240 |\n| 4 | 30 | 260 |\n3. budget > 250 → 400, 260, 260 → 3행\n- 조인된 4행의 평균(290)으로 비교하면 1이 나온다. 이게 노린 오답이다\n- **함정 요약**: 서브쿼리는 바깥 FROM과 상관없이 자기 FROM의 테이블 전체로 계산한다\n\n스칼라 서브쿼리\n- 한 행 한 열만 돌려주는 서브쿼리. WHERE 비교식이나 SELECT 목록에 쓴다\n- 두 행 이상이 나오면 오류, 0행이면 NULL"},{"id":"sql-010","subject":"sql","topic":"JOIN","sub":"RIGHT OUTER JOIN·IS NULL","type":"output","past":"2026-2","level":3,"q":"다음 테이블에 SQL을 실행한 결과를 쓰시오.","box":"**A**\n| id | v |\n|---|---|\n| 1 | 10 |\n| 2 | 20 |\n| 2 | 30 |\n| 5 | 50 |\n\n**B**\n| id | w |\n|---|---|\n| 2 | 200 |\n| 3 | 300 |\n| 4 | 400 |\n| 4 | 450 |","code":{"lang":"sql","src":"SELECT COUNT(*) AS RESULT\nFROM A\nRIGHT OUTER JOIN B ON A.id = B.id\nWHERE A.id IS NULL;"},"answers":[{"label":"답","accept":["3"]}],"hint":"보존되는 쪽은 오른쪽 테이블이고, 짝이 없으면 왼쪽 컬럼이 NULL로 채워진다","explain":"1. A RIGHT OUTER JOIN B: B의 행을 모두 남긴다\n| B 행 | 짝이 되는 A 행 | 결과 행 수 | A.id |\n|---|---|---|---|\n| (2, 200) | (2, 20), (2, 30) | 2 | 2, 2 |\n| (3, 300) | 없음 | 1 | NULL |\n| (4, 400) | 없음 | 1 | NULL |\n| (4, 450) | 없음 | 1 | NULL |\n→ 조인 결과 5행. A의 (1, 10), (5, 50)은 B에 짝이 없어 사라진다\n2. WHERE A.id IS NULL → B.id가 3, 4, 4인 행 → 3\n- **함정 요약**: B.id 4가 두 행이라 NULL 행도 두 개다. A에만 있는 1, 5는 RIGHT 조인에서 보존되지 않는다\n- `A RIGHT OUTER JOIN B`는 `B LEFT OUTER JOIN A`와 같다. sqlite 3.51에서 RIGHT JOIN 그대로 실행해 확인했다\n\nOUTER JOIN 묶음\n- LEFT: 왼쪽 행 전부 + 짝이 없으면 오른쪽 컬럼 NULL\n- RIGHT: 오른쪽 행 전부\n- FULL: 양쪽 행 전부\n- `WHERE 반대쪽.키 IS NULL`을 붙이면 짝이 없는 행만 남는다\n- Oracle 옛 표기: `WHERE A.id(+) = B.id`가 RIGHT OUTER JOIN (`(+)`가 붙은 쪽이 NULL로 채워지는 쪽)"},{"id":"sql-011","subject":"sql","topic":"서브쿼리","sub":"상관 서브쿼리·빈 집합 AVG","type":"output","past":"2026-2","level":3,"q":"다음 테이블에 SQL을 실행한 결과를 쓰시오.","box":"**A**\n| id | x |\n|---|---|\n| 1 | 15 |\n| 2 | 25 |\n| 3 | 5 |\n| 4 | 40 |\n\n**B**\n| id | y |\n|---|---|\n| 1 | 10 |\n| 1 | 70 |\n| 2 | 50 |\n| 3 | 4 |\n| 4 | 100 |","code":{"lang":"sql","src":"SELECT COUNT(*) AS RESULT\nFROM A\nWHERE x > (\n    SELECT AVG(y)\n    FROM B\n    WHERE B.id IN (\n        SELECT T2.id\n        FROM A T2\n        WHERE T2.x \u003c A.x\n    )\n);"},"answers":[{"label":"답","accept":["2"]}],"hint":"바깥 A의 행마다 안쪽을 다시 계산한다. 대상이 하나도 없을 때 AVG의 값을 생각한다","explain":"바깥 A의 행마다 `T2.x \u003c A.x`인 id를 모으고, 그 id의 B.y 평균과 x를 비교한다.\n| A 행 (id, x) | x보다 작은 A의 id | 해당 B.y | AVG(y) | x > AVG |\n|---|---|---|---|---|\n| (1, 15) | 3 | 4 | 4 | O |\n| (2, 25) | 1, 3 | 10, 70, 4 | 28 | X |\n| (3, 5) | 없음 | 없음 | NULL | X (UNKNOWN) |\n| (4, 40) | 1, 2, 3 | 10, 70, 50, 4 | 33.5 | O |\n- 결과 2\n- **함정 요약**: 빈 집합의 AVG는 0이 아니라 NULL이다. NULL과 비교하면 참이 아니라서 행이 빠진다. B에 id 1이 두 행이라 평균에 두 값이 다 들어간다\n\n- 상관 서브쿼리: 안쪽이 바깥 컬럼(A.x)을 참조한다. 바깥 행 하나마다 안쪽이 다시 실행된다\n- 같은 테이블 A를 안쪽에서 또 쓰므로 별칭(T2)으로 구분한다\n- 기출 시험지는 `FROM A AS A2`로 냈다. Oracle은 테이블 별칭 앞에 AS를 쓰면 오류라 이의제기가 있었다(표준·MySQL·sqlite는 허용). 여기서는 AS 없이 썼다\n- 빈 집합 집계: COUNT → 0, SUM·AVG·MAX·MIN → NULL"},{"id":"sql-012","subject":"sql","topic":"DDL","sub":"외래키 ON DELETE CASCADE·SET NULL","type":"blank","past":"2022-3","level":3,"q":"다음과 같이 정의한 테이블에 아래 데이터가 들어 있다. SQL을 위에서부터 차례대로 실행했을 때 ①~③의 결과를 쓰시오.","box":"**부서**\n| 부서코드 | 부서명 |\n|---|---|\n| 10 | 영업 |\n| 20 | 기획 |\n| 30 | 개발 |\n\n**직원**\n| 직원코드 | 부서코드 |\n|---|---|\n| 1001 | 10 |\n| 1002 | 20 |\n| 1003 | 20 |\n| 1004 | 30 |\n| 1005 | 20 |\n| 1006 | 30 |\n\n**과제**\n| 과제코드 | 부서코드 |\n|---|---|\n| P1 | 20 |\n| P2 | 30 |\n| P3 | 20 |\n| P4 | NULL |","code":{"lang":"sql","src":"CREATE TABLE 부서 (\n    부서코드 INT PRIMARY KEY,\n    부서명   VARCHAR(10)\n);\nCREATE TABLE 직원 (\n    직원코드 INT PRIMARY KEY,\n    부서코드 INT REFERENCES 부서(부서코드) ON DELETE CASCADE\n);\nCREATE TABLE 과제 (\n    과제코드 CHAR(2) PRIMARY KEY,\n    부서코드 INT REFERENCES 부서(부서코드) ON DELETE SET NULL\n);\n\n-- ①\nSELECT COUNT(*) FROM 직원 WHERE 부서코드 = 20;\n\nDELETE FROM 부서 WHERE 부서코드 = 20;\n\n-- ②\nSELECT COUNT(*) FROM 직원;\n\n-- ③\nSELECT COUNT(부서코드) FROM 과제;"},"answers":[{"label":"①","accept":["3"]},{"label":"②","accept":["3"]},{"label":"③","accept":["1"]}],"hint":"부모 행을 지우면 두 자식 테이블이 서로 다르게 반응한다","explain":"- ① 지우기 전 부서 20의 직원: 1002, 1003, 1005 → 3\n- DELETE 부서 20\n  - 직원(CASCADE): 부서 20 직원 3행이 같이 삭제 → 1001, 1004, 1006만 남는다\n  - 과제(SET NULL): P1, P3의 부서코드가 NULL로 바뀐다. 행은 남는다\n- ② 6 - 3 = 3\n- ③ 과제의 부서코드: NULL, 30, NULL, NULL → COUNT(부서코드) = 1 (COUNT(*)라면 4)\n- **함정 요약**: CASCADE는 자식 행을 지우고, SET NULL은 자식 행을 남긴 채 FK 값만 비운다. 그 NULL은 COUNT(컬럼)에서 빠진다\n- 2022-3 기출은 CASCADE만 물었다(① 3, ② 4). 여기서는 SET NULL과 COUNT(컬럼)을 더했다\n\n참조 동작 묶음 (ON DELETE / ON UPDATE 뒤에 쓴다)\n| 옵션 | 부모 삭제·변경 시 자식 |\n|---|---|\n| CASCADE | 같이 삭제·변경 |\n| SET NULL | FK를 NULL로 |\n| SET DEFAULT | FK를 기본값으로 |\n| RESTRICT / NO ACTION | 자식이 있으면 부모 삭제·변경 거부 |\n- 옵션을 안 쓰면 NO ACTION(거부)이다\n- sqlite에서 `PRAGMA foreign_keys = ON`을 켜고 실행해 확인했다"},{"id":"sql-013","subject":"sql","topic":"윈도 함수","sub":"RANK·DENSE_RANK·ROW_NUMBER","type":"output","level":2,"q":"다음 테이블에 SQL을 실행했을 때, 이름이 '라희'인 행의 R1, R2, R3 값을 차례대로 공백 하나로 구분해 쓰시오.","box":"**성적**\n| 이름 | 점수 |\n|---|---|\n| 가영 | 90 |\n| 나래 | 85 |\n| 다온 | 95 |\n| 라희 | 85 |\n| 마루 | 80 |\n| 바다 | 90 |","code":{"lang":"sql","src":"SELECT 이름,\n       RANK()       OVER (ORDER BY 점수 DESC)          AS R1,\n       DENSE_RANK() OVER (ORDER BY 점수 DESC)          AS R2,\n       ROW_NUMBER() OVER (ORDER BY 점수 DESC, 이름 ASC) AS R3\nFROM 성적;"},"answers":[{"label":"답","accept":["4 3 5"]}],"hint":"동점 다음 순위를 건너뛰는 함수와 이어 붙이는 함수, 동점을 무시하는 함수를 구분한다","explain":"점수 내림차순(동점이면 이름 오름차순)으로 늘어놓는다.\n| 이름 | 점수 | R1 RANK | R2 DENSE_RANK | R3 ROW_NUMBER |\n|---|---|---|---|---|\n| 다온 | 95 | 1 | 1 | 1 |\n| 가영 | 90 | 2 | 2 | 2 |\n| 바다 | 90 | 2 | 2 | 3 |\n| 나래 | 85 | 4 | 3 | 4 |\n| **라희** | 85 | **4** | **3** | **5** |\n| 마루 | 80 | 6 | 4 | 6 |\n- RANK: 동점은 같은 순위, 다음 순위는 동점 수만큼 건너뛴다 (1, 2, 2, 4)\n- DENSE_RANK: 동점은 같은 순위, 다음 순위를 건너뛰지 않는다 (1, 2, 2, 3)\n- ROW_NUMBER: 동점이어도 1씩 올라간다. 여기서는 이름을 둘째 정렬 키로 줘서 순서를 고정했다\n- **함정 요약**: 라희는 85점 두 명 중 이름순 뒤라서 ROW_NUMBER가 5다\n\n윈도 함수 형식\n- `함수() OVER ([PARTITION BY 그룹컬럼] ORDER BY 정렬컬럼)`\n- PARTITION BY를 쓰면 그룹마다 1부터 다시 센다. GROUP BY와 달리 행 수가 줄지 않는다\n- 집계 함수도 쓸 수 있다: `SUM(점수) OVER (PARTITION BY 반)`"},{"id":"sql-014","subject":"sql","topic":"TCL","sub":"SAVEPOINT·ROLLBACK TO·COMMIT","type":"output","level":2,"q":"계좌 테이블이 아래 상태로 COMMIT되어 있고 자동 커밋은 꺼져 있다. 다음 SQL을 차례대로 실행한 뒤 마지막 SELECT의 결과를 쓰시오.","box":"**계좌**\n| 번호 | 잔액 |\n|---|---|\n| 1 | 100 |\n| 2 | 200 |\n| 3 | 300 |\n| 4 | 400 |\n| 5 | 500 |","code":{"lang":"sql","src":"UPDATE 계좌 SET 잔액 = 잔액 + 50 WHERE 번호 BETWEEN 2 AND 4;\nSAVEPOINT S1;\nDELETE FROM 계좌 WHERE 잔액 >= 400;\nSAVEPOINT S2;\nINSERT INTO 계좌 VALUES (6, 600);\nROLLBACK TO S2;\nUPDATE 계좌 SET 잔액 = 0 WHERE 번호 = 1;\nROLLBACK TO S1;\nCOMMIT;\nSELECT SUM(잔액) FROM 계좌;"},"answers":[{"label":"답","accept":["1650"]}],"hint":"BETWEEN의 양 끝이 포함되는지, S1로 돌아가면 S1 뒤의 어떤 작업까지 취소되는지 본다","explain":"| 단계 | 계좌 (번호:잔액) |\n|---|---|\n| 시작 | 1:100, 2:200, 3:300, 4:400, 5:500 |\n| UPDATE 번호 BETWEEN 2 AND 4 | 1:100, 2:250, 3:350, 4:450, 5:500 (2와 4 포함) |\n| SAVEPOINT S1 | 이 상태에 표시 |\n| DELETE 잔액 >= 400 | 1:100, 2:250, 3:350 (4, 5 삭제) |\n| SAVEPOINT S2 | 이 상태에 표시 |\n| INSERT 6 | 6:600 추가 |\n| ROLLBACK TO S2 | INSERT 취소 → 1:100, 2:250, 3:350 |\n| UPDATE 번호 1 | 1:0 |\n| ROLLBACK TO S1 | DELETE와 번호 1 UPDATE 모두 취소 → 1:100, 2:250, 3:350, 4:450, 5:500 |\n| COMMIT | S1 앞의 UPDATE가 확정 |\n- SUM = 100 + 250 + 350 + 450 + 500 = 1650\n- **함정 요약**: ROLLBACK TO는 그 저장점 뒤의 작업만 취소하고 트랜잭션은 이어진다. 저장점 앞의 UPDATE는 COMMIT으로 확정된다. 전부 처음으로 돌린다고 보면 1500이 나온다\n\nTCL 묶음\n- COMMIT: 작업 확정. 그 뒤로는 ROLLBACK으로 되돌릴 수 없다\n- ROLLBACK: 마지막 COMMIT 이후 작업 전부 취소\n- ROLLBACK TO 저장점: 그 저장점 이후만 취소. 표준 문법은 `ROLLBACK TO SAVEPOINT S1`이고 Oracle·MySQL은 SAVEPOINT를 빼고 `ROLLBACK TO S1`로 써도 된다\n- SAVEPOINT: 부분 취소 지점 표시\n- 수험서 다수는 TCL을 따로 두지 않고 COMMIT·ROLLBACK을 DCL에 넣는다 (sql-030)\n- Oracle에서 DDL(CREATE, ALTER, DROP, TRUNCATE)은 실행하면 자동으로 COMMIT된다\n- BETWEEN a AND b = `>= a AND \u003c= b` (양 끝 포함)\n- sqlite에서는 BEGIN으로 트랜잭션을 연 뒤 같은 순서로 실행해 확인했다"},{"id":"sql-015","subject":"sql","topic":"DML","sub":"DELETE","type":"sql","past":"2023-1","level":3,"q":"다음 [회원] 테이블에서 이름이 '지호'인 행을 삭제하는 SQL문을 작성하시오.","box":"**회원**\n| 번호 | 학년 | 이름 |\n|---|---|---|\n| 1 | 1 | 하늘 |\n| 2 | 3 | 지호 |\n| 3 | 2 | 서윤 |\n| 4 | 3 | 도현 |\n\n**조건**\n- 문자열은 작은따옴표로 감싼다\n- 문장 끝 세미콜론은 생략해도 된다","answers":[{"label":"답","accept":["DELETE FROM 회원 WHERE 이름 = '지호';","DELETE FROM 회원 WHERE 회원.이름 = '지호';"]}],"hint":"행을 지우는 DML이다. 테이블 구조는 그대로 둔다","explain":"- 형식: `DELETE FROM 테이블 WHERE 조건;`\n- WHERE를 빼면 모든 행이 지워진다 (테이블 구조는 남는다)\n- 다른 형태도 정답 가능: 컬럼에 테이블명을 붙인 `WHERE 회원.이름 = '지호'`\n- 실행 후: (1, 1, 하늘), (3, 2, 서윤), (4, 3, 도현) — sqlite 확인\n- Oracle은 `DELETE 회원 WHERE …`처럼 FROM을 생략해도 되지만 답안은 표준형으로 쓴다\n- 같은 문제가 2020-3에도 나왔다\n\nDML 4형식\n- `SELECT 컬럼 FROM 테이블 WHERE 조건;`\n- `INSERT INTO 테이블(컬럼, …) VALUES (값, …);`\n- `UPDATE 테이블 SET 컬럼 = 값 WHERE 조건;`\n- `DELETE FROM 테이블 WHERE 조건;`\n- DELETE·TRUNCATE·DROP의 차이는 sql-030"},{"id":"sql-016","subject":"sql","topic":"GROUP BY","sub":"GROUP BY·HAVING·별칭","type":"sql","past":"2023-1","level":3,"q":"다음 [성적] 테이블에서 과목별 점수 평균이 90 이상인 과목의 과목이름, 최소점수, 최대점수를 조회하는 SQL문을 \u003c조건>에 맞게 작성하시오.","box":"**성적**\n| 순번 | 과목이름 | 점수 |\n|---|---|---|\n| 1 | 운영체제 | 92 |\n| 2 | 자료구조 | 85 |\n| 3 | 네트워크 | 95 |\n| 4 | 운영체제 | 88 |\n| 5 | 자료구조 | 91 |\n| 6 | 네트워크 | 93 |\n\n**결과**\n| 과목이름 | 최소점수 | 최대점수 |\n|---|---|---|\n| 운영체제 | 88 | 92 |\n| 네트워크 | 93 | 95 |\n\n**조건**\n- WHERE 구문은 쓰지 않는다\n- GROUP BY와 HAVING을 쓴다\n- 최소점수, 최대점수는 집계 함수에 AS로 별칭을 붙인다\n- 결과 행의 순서는 상관없다","answers":[{"label":"답","accept":["SELECT 과목이름, MIN(점수) AS 최소점수, MAX(점수) AS 최대점수 FROM 성적 GROUP BY 과목이름 HAVING AVG(점수) >= 90;","SELECT 과목이름, MIN(점수) AS 최소점수, MAX(점수) AS 최대점수 FROM 성적 GROUP BY 과목이름 HAVING 90 \u003c= AVG(점수);"]}],"hint":"그룹을 거르는 조건은 WHERE가 아닌 곳에 쓴다. 평균이 딱 90인 과목이 있다","explain":"실행 순서: FROM 성적 → GROUP BY 과목이름 → HAVING AVG(점수) >= 90 → SELECT\n| 과목이름 | 점수 | AVG | HAVING |\n|---|---|---|---|\n| 운영체제 | 92, 88 | 90 | 통과 (경계 포함) |\n| 자료구조 | 85, 91 | 88 | 탈락 |\n| 네트워크 | 95, 93 | 94 | 통과 |\n- `> 90`으로 쓰면 운영체제가 빠진다\n- 다른 형태도 정답 가능: 비교 방향을 뒤집은 `HAVING 90 \u003c= AVG(점수)`. 열 순서(과목이름, 최소점수, 최대점수)는 결과 표를 따른다\n- **함정 요약**: 집계 조건은 HAVING에 쓴다. WHERE에는 집계 함수를 쓸 수 없다\n- SELECT 목록에는 GROUP BY 컬럼과 집계 함수만 올 수 있다. 순번을 넣으면 오류(표준·Oracle)\n- 별칭: `MIN(점수) AS 최소점수`. AS는 생략할 수 있지만 조건이 AS를 요구하면 쓴다\n- 같은 문제가 2020-3에도 나왔다\n\n집계 함수: COUNT, SUM, AVG, MAX, MIN. COUNT(*)를 빼면 모두 NULL을 건너뛴다"},{"id":"sql-017","subject":"sql","topic":"DML","sub":"INSERT","type":"sql","past":"2023-2","level":3,"q":"다음과 같이 정의된 [학생] 테이블에 \u003c결과>의 행을 삽입하는 SQL문을 작성하시오.","box":"**결과**\n| 학번 | 이름 | 학년 | 전공 | 전화번호 |\n|---|---|---|---|---|\n| 20231187 | 김정처 | 2 | 컴퓨터공학 | 010-5555-1234 |\n\n**조건**\n- 문자열은 작은따옴표로 감싼다\n- 컬럼 목록은 써도 되고 생략해도 된다","code":{"lang":"sql","src":"CREATE TABLE 학생 (\n    학번     INT,\n    이름     VARCHAR(20),\n    학년     INT,\n    전공     VARCHAR(30),\n    전화번호 VARCHAR(20)\n);"},"answers":[{"label":"답","accept":["INSERT INTO 학생(학번, 이름, 학년, 전공, 전화번호) VALUES (20231187, '김정처', 2, '컴퓨터공학', '010-5555-1234');","INSERT INTO 학생 VALUES (20231187, '김정처', 2, '컴퓨터공학', '010-5555-1234');"]}],"hint":"숫자 타입 컬럼과 문자 타입 컬럼의 값 표기가 다르다","explain":"- 형식: `INSERT INTO 테이블 [(컬럼1, 컬럼2, …)] VALUES (값1, 값2, …);`\n- 컬럼 목록을 생략하면 테이블 정의의 모든 컬럼에 정의 순서대로 값을 다 줘야 한다\n- 학번·학년은 INT라 따옴표 없이, 나머지는 VARCHAR라 작은따옴표\n- 전화번호를 따옴표 없이 `010-5555-1234`로 쓰면 뺄셈식으로 읽힌다\n- **함정 요약**: 문자열은 작은따옴표. 큰따옴표는
