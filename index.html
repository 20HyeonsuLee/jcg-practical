중위 | 두 재귀 사이 | 7 4 1 9 8 2 6 |\n| 후위 | 재귀 뒤 | 7 4 9 1 2 6 8 |\n\n**함정 요약**: 처리 문장(카운트·출력)이 재귀 호출 앞, 사이, 뒤 어디에 있는지가 순서를 정한다. NULL 자식은 바로 return하므로 세지 않는다.\n- 2026년 2회는 같은 구조에서 후위 순회 세 번째 노드를 물었다"},{"id":"code-c012","subject":"code","topic":"C","sub":"재귀 값과 호출 횟수","type":"output","past":"2026-2","level":3,"q":"다음 C 프로그램의 실행 결과를 쓰시오.","code":{"lang":"c","src":"#include \u003cstdio.h>\n\nint cnt = 0;\n\nint f(int n) {\n    cnt++;\n    if (n \u003c= 1) return n;\n    return f(n - 1) + f(n - 3);\n}\n\nint main() {\n    int r = f(6);\n    printf(\"%d %d\\n\", r, cnt);\n    return 0;\n}"},"answers":[{"label":"답","accept":["1 17\n"]}],"hint":"n이 1 이하면 n을 그대로 돌려준다. 음수도 1 이하다.","explain":"- 기저: n ≤ 1이면 n 반환 → f(1) = 1, f(0) = 0, **f(-1) = -1**, f(-2) = -2\n- 작은 n부터 표로 쌓는다. 호출 수 C(n) = 1 + C(n-1) + C(n-3), 기저는 1번\n\n| n | f(n) | C(n) |\n|---|---|---|\n| -2 ~ 1 | n | 1 |\n| 2 | f(1) + f(-1) = 0 | 3 |\n| 3 | f(2) + f(0) = 0 | 5 |\n| 4 | f(3) + f(1) = 1 | 7 |\n| 5 | f(4) + f(2) = 1 | 11 |\n| 6 | f(5) + f(3) = 1 | 17 |\n\n- 출력 **1 17**\n\n**함정 요약**: 기저 조건 `n \u003c= 1`은 음수 인자도 그대로 반환한다. 재귀 값과 호출 횟수는 작은 n부터 표로 채운다.\n- 피보나치 `f(n-1) + f(n-2)`, 기저 n ≤ 1: f(5) = 5, 호출 15번\n- 팩토리얼 `n * f(n-1)`: f(5) = 120\n- 하노이 원반 n개 이동 횟수: 2ⁿ - 1"},{"id":"code-c013","subject":"code","topic":"C","sub":"하노이 탑 재귀","type":"output","level":2,"q":"다음 C 프로그램의 실행 결과를 쓰시오.","code":{"lang":"c","src":"#include \u003cstdio.h>\n\nint calls = 0;\nint moves = 0;\n\nvoid hanoi(int n, char from, char via, char to) {\n    calls++;\n    if (n == 0) return;\n    hanoi(n - 1, from, to, via);\n    moves++;\n    printf(\"%c%c,\", from, to);\n    hanoi(n - 1, via, from, to);\n}\n\nint main() {\n    hanoi(3, 'A', 'B', 'C');\n    printf(\"\\n%d %d\\n\", moves, calls);\n    return 0;\n}"},"answers":[{"label":"답","accept":["AC,AB,CB,AC,BA,BC,AC,\n7 15\n"]}],"hint":"printf는 두 재귀 호출 사이에 있다. n == 0으로 들어온 호출도 calls에 센다.","explain":"- hanoi(n, 출발, 경유, 도착): n-1개를 경유로 → 가장 큰 원반을 도착으로 → n-1개를 도착으로\n- 이동 순서(괄호는 원반): AC(1) AB(2) CB(1) AC(3) BA(1) BC(2) AC(1)\n- 첫 줄 **AC,AB,CB,AC,BA,BC,AC,** (마지막 쉼표까지)\n- moves = 2³ - 1 = 7\n- calls(n) = 1 + 2 × calls(n-1), calls(0) = 1 → 1, 3, 7, 15 → **7 15**\n\n**함정 요약**: 이동 횟수 2ⁿ - 1과 함수 호출 횟수는 다르다. 기저가 n == 0이면 호출은 2ⁿ⁺¹ - 1번, 기저가 n == 1이면 호출 = 이동 = 2ⁿ - 1번.\n- 출력이 재귀 사이에 있으면 중위, 앞이면 전위, 뒤면 후위 순서로 찍힌다"},{"id":"code-c014","subject":"code","topic":"C","sub":"static 지역 변수와 변수 가림","type":"output","past":"2024-3","level":3,"q":"다음 C 프로그램의 실행 결과를 쓰시오.","code":{"lang":"c","src":"#include \u003cstdio.h>\n\nint x = 5;\n\nint f(int a) {\n    static int s = 1;\n    int t = 1;\n    s += a;\n    t += a;\n    x += s;\n    return s * 10 + t;\n}\n\nvoid show(void) {\n    printf(\"%d\\n\", x);\n}\n\nint main() {\n    int x = 2;\n    int sum = 0;\n    for (int i = 1; i \u003c= 3; i++) {\n        int x = i;\n        sum += f(x);\n    }\n    printf(\"%d %d\\n\", sum, x);\n    show();\n    return 0;\n}"},"answers":[{"label":"답","accept":["139 2\n18\n"]}],"hint":"static은 한 번만 초기화된다. 이름이 같은 x가 세 군데 있다.","explain":"- x가 셋: 전역 x(5), main의 x(2), for 블록 안 x(i)\n- f 안의 x는 지역 x가 없으니 **전역 x**\n- s는 static이라 처음 한 번만 1, t는 호출마다 1로 다시 시작\n\n| i | s | t | 전역 x | 반환 s×10+t |\n|---|---|---|---|---|\n| 1 | 2 | 2 | 7 | 22 |\n| 2 | 4 | 3 | 11 | 43 |\n| 3 | 7 | 4 | 18 | 74 |\n\n- sum = 22 + 43 + 74 = 139, main의 x는 2 → **139 2**\n- show()는 전역 x → **18**\n\n**함정 요약**: 안쪽 블록에서 같은 이름을 선언하면 바깥 변수를 가린다. 가린 쪽을 바꿔도 바깥 변수는 그대로다.\n- static 지역 변수: 수명은 프로그램 전체, 보이는 범위는 함수 안\n- 전역·static 변수는 초기값이 없으면 0, 일반 지역 변수는 쓰레기값"},{"id":"code-c015","subject":"code","topic":"C","sub":"증감 연산자와 단락 평가","type":"output","level":2,"q":"다음 C 프로그램의 실행 결과를 쓰시오.","code":{"lang":"c","src":"#include \u003cstdio.h>\n\nint main() {\n    int i = 5, j, k;\n    int a = 3, b = 5, c = 0;\n    int r1, r2, r3;\n\n    j = i++ + 2;\n    k = ++i * 2;\n    printf(\"%d %d %d\\n\", i, j, k);\n\n    r1 = a++ > 3 && ++b > 5;\n    printf(\"%d %d %d\\n\", r1, a, b);\n    r2 = --a == 3 || b++ > 0;\n    printf(\"%d %d %d\\n\", r2, a, b);\n    r3 = c++ && b-- || a-- > 3;\n    printf(\"%d %d %d %d\\n\", r3, a, b, c);\n    return 0;\n}"},"answers":[{"label":"답","accept":["7 7 14\n0 4 5\n1 3 5\n0 2 5 1\n"]}],"hint":"`&&` 왼쪽이 거짓이거나 `||` 왼쪽이 참이면 오른쪽은 실행되지 않는다. 그 안의 증감도 같이 건너뛴다.","explain":"- `j = i++ + 2`: 5 + 2 = 7, 이후 i = 6\n- `k = ++i * 2`: i = 7 먼저, 7 × 2 = 14 → **7 7 14**\n- r1 = `a++ > 3 && ++b > 5`: 3 > 3 거짓(a는 4) → 오른쪽 건너뜀 → **0 4 5**\n- r2 = `--a == 3 || b++ > 0`: a = 3, 참 → 오른쪽 건너뜀 → **1 3 5**\n- r3: `&&`가 `||`보다 먼저 묶여 `(c++ && b--) || (a-- > 3)`\n  - c++는 0(이후 c = 1) → `b--` 건너뜀, 왼쪽 묶음 거짓\n  - `a-- > 3`: 3 > 3 거짓, a = 2 → r3 = 0 → **0 2 5 1**\n\n**함정 요약**: 단락 평가로 건너뛴 쪽의 `++`, `--`는 실행되지 않는다.\n- 후위 `i++`: 식에는 원래 값, 끝난 뒤 증가 / 전위 `++i`: 먼저 증가하고 그 값\n- 우선순위: `!` > 산술 > 비교 > `&&` > `||` > 대입\n- 관계·논리 연산 결과는 참 1, 거짓 0"},{"id":"code-c016","subject":"code","topic":"C","sub":"비트 연산과 우선순위","type":"output","past":"2025-3","level":3,"q":"다음 C 프로그램의 실행 결과를 쓰시오.","code":{"lang":"c","src":"#include \u003cstdio.h>\n\nint main() {\n    int a = 13, b = 6, c;\n\n    c = a & b \u003c\u003c 1;\n    printf(\"%d\\n\", c);\n    c = a ^ b | 1;\n    printf(\"%d\\n\", c);\n    c = ~a + 1;\n    printf(\"%d\\n\", c);\n    c = a > b ? a >> 2 : b \u003c\u003c 2;\n    printf(\"%d\\n\", c);\n    if (a & 1 ? 0 : 1)\n        printf(\"T\\n\");\n    else\n        printf(\"F\\n\");\n    printf(\"%x\\n\", a \u003c\u003c 4 | b);\n    for (int i = 7; i >= 0; i--)\n        printf(\"%d\", (a >> i) & 1);\n    printf(\"\\n\");\n    return 0;\n}"},"answers":[{"label":"답","accept":["12\n11\n-13\n3\nF\nd6\n00001101\n"]}],"hint":"시프트는 `&`보다, `&`는 `^`보다, `^`는 `|`보다 먼저 계산된다.","explain":"- a = 13 = 1101₂, b = 6 = 0110₂\n- `a & b \u003c\u003c 1` = 13 & (6 \u003c\u003c 1) = 1101 & 1100 = **12**\n- `a ^ b | 1` = (1101 ^ 0110) | 1 = 1011 | 0001 = **11**\n- `~a + 1` = -14 + 1 = **-13** (`~a` = -a - 1)\n- `a > b ? a >> 2 : b \u003c\u003c 2` → 참이라 13 >> 2 = **3**\n- `a & 1 ? 0 : 1` = `(a & 1) ? 0 : 1` → a & 1 = 1이라 0 → else → **F**\n- `a \u003c\u003c 4 | b` = 208 | 6 = 214 = 0xd6 → **d6** (%x는 소문자)\n- `(a >> i) & 1`을 i = 7 → 0 → 8자리 2진수 **00001101**\n\n**함정 요약**: 비트 연산자 `& ^ |`는 비교 연산자보다 늦게, 시프트는 덧셈 바로 다음에 계산된다.\n- 우선순위: 단항(`~` `!`) > `* / %` > `+ -` > `\u003c\u003c >>` > `\u003c >` > `== !=` > `&` > `^` > `|` > `&&` > `||` > `?:` > 대입\n- `x \u003c\u003c n` = x × 2ⁿ, `x >> n` = x ÷ 2ⁿ의 몫(양수)\n- `x & 1`: 홀짝, `~x` = -(x + 1)\n- 2024년 1회: `if (v1 > v2 ? v2 : v1)`처럼 삼항식 결과를 조건으로 쓰면 0만 거짓"},{"id":"code-c017","subject":"code","topic":"C","sub":"진법 변환","type":"blank","past":"2023-1","level":2,"q":"다음은 3진수로 적힌 수를 10진수로 바꾸는 C 프로그램이다. 실행 결과가 `64`가 되도록 ( ① ) ~ ( ③ )에 들어갈 알맞은 연산자 또는 값을 쓰시오.","box":"- input의 각 자리는 0, 1, 2 중 하나다.\n- **[실행 결과]** `64`","code":{"lang":"c","src":"#include \u003cstdio.h>\n\nint main() {\n    int input = 2101;\n    int di = 1;\n    int sum = 0;\n    while (input > 0) {\n        sum = sum + (input ( ① ) ( ② )) * di;\n        di = di * ( ③ );\n        input = input / 10;\n    }\n    printf(\"%d\", sum);\n    return 0;\n}"},"answers":[{"label":"①","accept":["%"]},{"label":"②","accept":["10"]},{"label":"③","accept":["3"]}],"hint":"input은 10진 정수로 저장돼 있다. 맨 끝 자리를 떼어내는 연산을 떠올린다.","explain":"- 2101₃ = 2×27 + 1×9 + 0×3 + 1×1 = 64\n- input은 그냥 10진 정수 2101 → 끝 자리 `input % 10`, 다음 자리로 `input / 10`\n- di는 자리값 1 → 3 → 9 → 27 (`di * 3`)\n\n| 반복 | input % 10 | di | sum |\n|---|---|---|---|\n| 1 | 1 | 1 | 1 |\n| 2 | 0 | 3 | 1 |\n| 3 | 1 | 9 | 10 |\n| 4 | 2 | 27 | 64 |\n\n**함정 요약**: 자리 떼기는 `% 10`과 `/ 10`, 자리값은 진법만큼 곱한다. 진법이 바뀌어도 `% 10`은 그대로다.\n- 10진 → 2진: `n % 2`를 모은 뒤 거꾸로 출력, `n /= 2`\n- 2023년 1회는 같은 구조의 2진 → 10진(`input % 10`, `di * 2`)"},{"id":"code-c018","subject":"code","topic":"C","sub":"call by value와 switch fall-through","type":"output","past":"2024-2","level":3,"q":"다음 C 프로그램의 실행 결과를 쓰시오.","code":{"lang":"c","src":"#include \u003cstdio.h>\n\nvoid swapV(int a, int b) {\n    int t = a;\n    a = b;\n    b = t;\n}\n\nvoid swapP(int *a, int *b) {\n    int t = *a;\n    *a = *b;\n    *b = t;\n}\n\nint main() {\n    int a = 3, b = 7, r = 0;\n\n    swapV(a, b);\n    switch (a) {\n        case 3: r += 1;\n        case 7: r += 10;\n            break;\n        default: r += 100;\n    }\n    swapP(&a, &b);\n    switch (a % 4) {\n        case 0: r += 1000;\n        case 1: r += 2000;\n        default: r += 3000;\n        case 2: r += 4000;\n    }\n    printf(\"%d %d %d\\n\", a, b, r);\n    return 0;\n}"},"answers":[{"label":"답","accept":["7 3 7011\n"]}],"hint":"값 전달 함수는 main 변수를 못 바꾼다. default가 중간에 있어도 break가 없으면 아래로 흐른다.","explain":"- swapV(a, b): 복사본만 바꿈 → a = 3, b = 7 그대로\n- switch(3): case 3에서 r = 1 → break 없어 case 7로 흘러 r = 11 → break\n- swapP(&a, &b): 주소로 바꿈 → a = 7, b = 3\n- switch(7 % 4 = 3): 맞는 case가 없어 default부터 → r = 3011 → 아래 case 2로 흘러 r = **7011**\n- 출력 **7 3 7011**\n\n**함정 요약**: switch는 맞는 case(없으면 default)에서 시작해 break를 만날 때까지 아래로 계속 실행한다. default가 중간에 있으면 그 아래 case도 실행된다.\n- call by value: 값 복사 → 원본 그대로\n- call by address: 주소 전달 후 `*a = ...` → 원본 변경\n- 배열 이름을 넘기면 주소 전달이라 함수 안에서 원소를 바꾸면 원본도 바뀐다"},{"id":"code-c019","subject":"code","topic":"C","sub":"약수·자릿수 합과 break/continue","type":"output","past":"2023-3","level":2,"q":"다음 C 프로그램의 실행 결과를 쓰시오.","code":{"lang":"c","src":"#include \u003cstdio.h>\n\nint divSum(int n) {\n    int s = 0;\n    for (int i = 1; i \u003c= n / 2; i++) {\n        if (n % i == 0)\n            s += i;\n    }\n    return s;\n}\n\nint digitSum(int n) {\n    int s = 0;\n    while (n > 0) {\n        s += n % 10;\n        n /= 10;\n    }\n    return s;\n}\n\nint main() {\n    int cnt = 0, sum = 0, last = 0;\n    for (int n = 2; n \u003c= 100; n++) {\n        int s = divSum(n);\n        if (s == 1) continue;\n        if (s \u003c= n) continue;\n        cnt++;\n        sum += digitSum(n);\n        last = n;\n        if (cnt == 4) break;\n    }\n    printf(\"%d %d %d\\n\", cnt, sum, last);\n    return 0;\n}"},"answers":[{"label":"답","accept":["4 20 24\n"]}],"hint":"divSum은 자기 자신을 뺀 약수 합이다. continue 두 개가 무엇을 걸러내는지 본다.","explain":"- divSum(n): n/2까지 나눠 떨어지는 수의 합 = 진약수 합\n- `s == 1`: 진약수가 1뿐 → 소수 → 건너뜀\n- `s \u003c= n`: 부족수·완전수 → 건너뜀\n- 남는 수는 진약수 합 > n인 과잉수: 12, 18, 20, 24, …\n\n| n | 진약수 합 | 자릿수 합 | cnt | sum |\n|---|---|---|---|---|\n| 12 | 16 | 3 | 1 | 3 |\n| 18 | 21 | 9 | 2 | 12 |\n| 20 | 22 | 2 | 3 | 14 |\n| 24 | 36 | 6 | 4 | 20 |\n\n- cnt == 4에서 break → **4 20 24**\n\n**함정 요약**: `continue`는 아래 문장을 건너뛰고 증감식으로, `break`는 반복문을 바로 빠져나간다.\n- 완전수: 진약수 합 = n (6, 28, 496). 2023년 3회는 2~100 완전수 합 34\n- 소수 판정: 2부터 √n까지 나눠 떨어지는 수가 없으면 소수\n- 자릿수 합: `s += n % 10; n /= 10;` 반복"},{"id":"code-c020","subject":"code","topic":"C","sub":"형 변환과 정수 나눗셈","type":"output","past":"2026-1","level":3,"q":"다음 C 프로그램의 실행 결과를 쓰시오.","code":{"lang":"c","src":"#include \u003cstdio.h>\n\nint avg1(int p[], int len) {\n    int s = 0;\n    for (int i = 0; i \u003c len; i++)\n        s += p[i];\n    return s / len;\n}\n\ndouble avg2(int *p, int len) {\n    double s = 0;\n    for (int i = 0; i \u003c len; i++)\n        s += *(p + i);\n    return s / len;\n}\n\nint main() {\n    int arr[] = {7, 4, 9, 2, 6, 5};\n    int len = sizeof(arr) / sizeof(arr[0]);\n    double d = 3.7;\n    char ch = 'C';\n\n    printf(\"%d\\n\", avg1(arr, len));\n    printf(\"%.2f\\n\", avg2(arr, len));\n    printf(\"%.1f\\n\", (double)(33 / len) + 33 / (double)len);\n    printf(\"%d %d\\n\", (int)d, (int)-d);\n    printf(\"%d %c\\n\", ch - 'A', ch + 2);\n    return 0;\n}"},"answers":[{"label":"답","accept":["5\n5.50\n10.5\n3 -3\n2 E\n"]}],"hint":"int끼리 나누면 소수점이 버려진다. 언제, 어느 쪽을 double로 바꿨는지 본다.","explain":"- 합 33, len = sizeof(arr) / sizeof(arr[0]) = 24 / 4 = 6\n- avg1: int / int → 33 / 6 = **5**\n- avg2: s가 double → 33.0 / 6 = 5.5 → **5.50**\n- `(double)(33 / len)`: 괄호 안 정수 나눗셈 먼저 → 5 → 5.0\n- `33 / (double)len` = 5.5 → 합 **10.5**\n- `(int)3.7` = 3, `(int)-3.7` = -3 (0 쪽으로 버림) → **3 -3**\n- `ch - 'A'` = 67 - 65 = 2, `ch + 2` = 69 → %c **E**\n\n**함정 요약**: 형 변환은 나누기 전에 적용돼야 실수 결과가 나온다. `(double)(a / b)`는 이미 버린 몫을 바꿀 뿐이다.\n- (int) 변환은 반올림이 아니라 버림(0 방향)\n- `%.2f`: 소수 둘째 자리까지 반올림 표시\n- `sizeof(arr) / sizeof(arr[0])`: 원소 개수. 함수 매개변수 `int p[]`는 포인터라 이 식이 통하지 않는다"},{"id":"code-c021","subject":"code","topic":"C","sub":"함수 포인터","type":"output","past":"2026-1","level":3,"q":"다음 C 프로그램의 실행 결과를 쓰시오.","code":{"lang":"c","src":"#include \u003cstdio.h>\n\nint add(int a, int b) { return a + b; }\nint sub(int a, int b) { return a - b; }\nint mul(int a, int b) { return a * b; }\n\nint *jump(int *p) { return p + 2; }\n\nstruct Calc {\n    int (*op)(int, int);\n    int *(*move)(int *);\n};\n\nint main() {\n    int (*ops[3])(int, int) = {add, sub, mul};\n    int n[] = {10, 26, 31, 47, 60};\n    struct Calc c;\n    int r = 0;\n\n    for (int i = 0; i \u003c 3; i++)\n        r = ops[i](r, i + 2);\n    printf(\"%d\\n\", r);\n\n    c.op = ops[2];\n    c.move = jump;\n    printf(\"%d\\n\", c.op(3, *c.move(n)));\n    printf(\"%x\\n\", *c.move(n + 1));\n    return 0;\n}"},"answers":[{"label":"답","accept":["-4\n93\n2f\n"]}],"hint":"`*c.move(n)`에서 `.`과 `()`가 `*`보다 먼저다. %x는 16진수.","explain":"- `int (*ops[3])(int, int)`: int 둘을 받아 int를 반환하는 함수 포인터 3개짜리 배열\n- 반복: add(0, 2) = 2 → sub(2, 3) = -1 → mul(-1, 4) = **-4**\n- `int *(*move)(int *)`: int *를 받아 int *를 반환하는 함수 포인터\n- `*c.move(n)` = `*(n + 2)` = 31, c.op = mul → 3 × 31 = **93**\n- `*c.move(n + 1)` = `*(n + 3)` = 47 = 2×16 + 15 → **2f**\n\n**함정 요약**: 함수 포인터는 `반환형 (*이름)(매개변수)` 꼴이다. 괄호를 빼면(`int *f(int)`) 포인터를 반환하는 함수 선언이 된다.\n- 함수 이름은 함수 주소라 `ops[0] = add`처럼 & 없이 대입\n- 호출은 `f(x)`, `(*f)(x)` 둘 다 된다\n- %x 16진 소문자, %X 대문자, %o 8진수"},{"id":"code-c022","subject":"code","topic":"C","sub":"문자열 함수와 널 문자","type":"output","past":"2024-2","level":3,"q":"다음 C 프로그램의 실행 결과를 쓰시오.","code":{"lang":"c","src":"#include \u003cstdio.h>\n#include \u003cstring.h>\n\nvoid copy(char *d, const char *s) {\n    while (*s) {\n        *d++ = *s++;\n    }\n    *d = '\\0';\n}\n\nint main() {\n    char a[20] = \"keyboard\";\n    char b[20];\n    int sum = 0;\n\n    copy(a, \"pen\");\n    printf(\"%s %d\\n\", a, (int)strlen(a));\n    printf(\"%c\\n\", a[5]);\n    strcpy(b, a);\n    strcat(b, a + 1);\n    printf(\"%s\\n\", b);\n    for (int i = 0; b[i] != '\\0'; i++)\n        sum += i;\n    printf(\"%d %d\\n\", sum, (int)sizeof(a));\n    return 0;\n}"},"answers":[{"label":"답","accept":["pen 3\na\npenen\n10 20\n"]}],"hint":"복사 뒤 '\\0' 뒤쪽에 옛 글자가 남는다. strlen과 sizeof는 재는 대상이 다르다.","explain":"- a = \"keyboard\" (k0 e1 y2 b3 o4 a5 r6 d7)\n- copy(a, \"pen\") 후: p e n \\0 o a r d \\0 → %s는 \"pen\", strlen = 3 → **pen 3**\n- `a[5]`: 덮어쓰지 않은 칸 그대로 → **a**\n- strcpy(b, a) → b = \"pen\" ('\\0'까지만 복사)\n- strcat(b, a + 1) → a + 1 = \"en\"을 이어 붙여 **penen**\n- 인덱스 합 0+1+2+3+4 = 10, sizeof(a) = 선언 크기 20 → **10 20**\n\n**함정 요약**: 문자열 함수는 모두 '\\0'에서 멈춘다. '\\0' 뒤 칸은 남아 있지만 %s와 strlen에는 안 보인다.\n- strlen: '\\0' 앞 글자 수 / sizeof: 선언 크기(바이트)\n- strcpy(d, s): 덮어쓰기 / strcat(d, s): d의 '\\0' 자리부터 이어 붙이기\n- `char s[] = \"abc\"`면 sizeof(s) = 4, strlen(s) = 3"},{"id":"code-c023","subject":"code","topic":"C","sub":"문자열 뒤집기와 문자 연산","type":"output","past":"2024-1","level":3,"q":"다음 C 프로그램의 실행 결과를 쓰시오.","code":{"lang":"c","src":"#include \u003cstdio.h>\n#include \u003cstring.h>\n\nvoid reverse(char *s) {\n    char *p = s;\n    char *q = s + strlen(s) - 1;\n    while (p \u003c q) {\n        char t = *p;\n        *p++ = *q;\n        *q-- = t;\n    }\n}\n\nint main() {\n    char s[] = \"Key9Zoo\";\n    int len = strlen(s);\n\n    reverse(s);\n    for (int i = 0; i \u003c len; i++) {\n        if (s[i] >= 'a' && s[i] \u003c= 'z')\n            s[i] = (s[i] - 'a' + 3) % 26 + 'a';\n        else if (s[i] >= 'A' && s[i] \u003c= 'Z')\n            s[i] = s[i] + 32;\n        else if (s[i] >= '0' && s[i] \u003c= '9')\n            s[i] = (s[i] - '0' + 5) % 10 + '0';\n    }\n    printf(\"%s\\n\", s);\n    for (int i = 0; i \u003c len; i += 3)\n        printf(\"%c\", s[i]);\n    printf(\"\\n\");\n    return 0;\n}"},"answers":[{"label":"답","accept":["rrz4bhk\nr4k\n"]}],"hint":"뒤집은 다음에 바꾼다. 소문자는 % 26으로 a로 되돌아간다.","explain":"- reverse: 양 끝 포인터를 바꾸며 가운데로 → \"Key9Zoo\" → \"ooZ9yeK\"\n- 규칙: 소문자 3칸 뒤로(z 다음 a), 대문자 +32 → 소문자, 숫자 (d + 5) % 10\n\n| 글자 | o | o | Z | 9 | y | e | K |\n|---|---|---|---|---|---|---|---|\n| 결과 | r | r | z | 4 | b | h | k |\n\n- y: (24 + 3) % 26 = 1 → b\n- 출력 **rrz4bhk**, 인덱스 0, 3, 6 → **r4k**\n\n**함정 요약**: 문자는 정수다. `c - 'a'`로 0~25 번호로 바꾸고 계산한 뒤 `+ 'a'`로 되돌린다.\n- 대문자 → 소문자 +32, 소문자 → 대문자 -32\n- 숫자 문자 → 정수 `c - '0'`, 정수 → 숫자 문자 `n + '0'`\n- 뒤집기 조건 `p \u003c q`: 가운데에서 멈춘다(홀수 길이면 가운데 글자는 그대로)"},{"id":"code-c024","subject":"code","topic":"C","sub":"버블 정렬 중간 상태","type":"output","level":2,"q":"다음 C 프로그램의 실행 결과를 쓰시오.","code":{"lang":"c","src":"#include \u003cstdio.h>\n\nint main() {\n    int a[] = {5, 1, 4, 2, 8, 3};\n    int n = 6, swaps = 0;\n\n    for (int i = 0; i \u003c n - 1; i++) {\n        int changed = 0;\n        for (int j = 0; j \u003c n - 1 - i; j++) {\n            if (a[j] > a[j + 1]) {\n                int t = a[j];\n                a[j] = a[j + 1];\n                a[j + 1] = t;\n                swaps++;\n                changed = 1;\n            }\n        }\n        if (i == 1) {\n            for (int k = 0; k \u003c n; k++)\n                printf(\"%d\", a[k]);\n            printf(\"\\n\");\n        }\n        if (!changed) break;\n    }\n    printf(\"%d\\n\", swaps);\n    return 0;\n}"},"answers":[{"label":"답","accept":["124358\n7\n"]}],"hint":"한 회전이 끝나면 가장 큰 값이 맨 뒤에 확정된다. i == 1은 두 번째 회전이다.","explain":"| 회전 i | 회전 후 배열 | 이번 교환 | 누적 |\n|---|---|---|---|\n| 시작 | 5 1 4 2 8 3 | | |\n| 0 | 1 4 2 5 3 8 | 4 | 4 |\n| 1 | 1 2 4 3 5 8 | 2 | 6 |\n| 2 | 1 2 3 4 5 8 | 1 | 7 |\n| 3 | 1 2 3 4 5 8 | 0 | 7, break |\n\n- i == 1 회전 후 **124358**, 총 교환 **7**\n\n**함정 요약**: 버블 정렬은 이웃끼리 비교·교환해 큰 값을 뒤로 보낸다. 교환 횟수 = 역순 쌍(앞이 더 큰 쌍) 개수.\n- 버블: i 회전 후 뒤쪽 i+1개 확정, 교환이 없으면 조기 종료\n- 선택: 남은 구간의 최솟값(최댓값)을 찾아 앞자리와 한 번 교환\n- 삽입: 앞쪽 정렬 구간에 끼워 넣기, 거의 정렬된 배열에 빠르다"},{"id":"code-c025","subject":"code","topic":"C","sub":"선택 정렬","type":"blank","past":"2023-2","level":2,"q":"다음은 배열을 선택 정렬로 내림차순 정렬하는 C 프로그램이다. ( ① )에 들어갈 연산자를 \u003c보기>에서 골라 기호로 쓰고, ( ② )에는 바깥 for문의 i가 1인 회전이 끝난 직후 배열 a의 상태를 쓰시오.","box":"- 값이 같으면 k를 바꾸지 않는다(앞쪽 원소 유지).\n- **[실행 결과]** `37 29 14 13 10`\n- ( ② ) 답 형식 예: `1 2 3 4 5`","code":{"lang":"c","src":"#include \u003cstdio.h>\n\nint main() {\n    int a[] = {29, 10, 14, 37, 13};\n    int n = sizeof(a) / sizeof(a[0]);\n\n    for (int i = 0; i \u003c n - 1; i++) {\n        int k = i;\n        for (int j = i + 1; j \u003c n; j++) {\n            if (a[j] ( ① ) a[k])\n                k = j;\n        }\n        int t = a[i];\n        a[i] = a[k];\n        a[k] = t;\n    }\n    for (int i = 0; i \u003c n; i++)\n        printf(\"%d \", a[i]);\n    return 0;\n}"},"options":["ㄱ. \u003c","ㄴ. \u003c=","ㄷ. >","ㄹ. >=","ㅁ. ==","ㅂ. !="],"answers":[{"label":"①","accept":["ㄷ(>)"]},{"label":"②","accept":["37 29 14 10 13","37,29,14,10,13"]}],"hint":"내림차순이면 매 회전 남은 구간에서 무엇을 찾아 앞으로 보내는가.","explain":"- 내림차순: 매 회전 남은 구간의 **최댓값**을 찾아 i 자리와 교환 → `a[j] > a[k]`면 k = j\n- `>=`는 값이 같을 때 뒤쪽 원소로 k가 바뀌어 조건에 어긋난다. `\u003c`, `\u003c=`는 오름차순이 된다\n\n| i | 최댓값(k) | 교환 후 |\n|---|---|---|\n| 시작 | | 29 10 14 37 13 |\n| 0 | 37 (3) | 37 10 14 29 13 |\n| 1 | 29 (3) | 37 29 14 10 13 |\n| 2 | 14 (2) | 37 29 14 10 13 |\n| 3 | 13 (4) | 37 29 14 13 10 |\n\n- ② **37 29 14 10 13**\n\n**함정 요약**: 선택 정렬은 회전마다 교환 1번, 버블 정렬은 이웃끼리 여러 번. 중간 상태를 물으면 회전 번호가 0부터인지 먼저 확인한다.\n- 오름차순 `a[j] \u003c a[k]`, 내림차순 `a[j] > a[k]`\n- 비교 횟수는 데이터와 무관하게 n(n-1)/2 = 10번"},{"id":"code-j001","subject":"code","topic":"Java","sub":"동적 바인딩·super 메서드","type":"output","past":"2023-3","level":3,"q":"다음 Java 프로그램의 실행 결과를 쓰시오.","code":{"lang":"java","src":"class Shape {\n    void render() {\n        System.out.print(\"S\");\n        paint();\n    }\n\n    void paint() {\n        System.out.print(\"P\");\n        mark();\n    }\n\n    void mark() {\n        System.out.print(\"M\");\n    }\n}\n\nclass Circle extends Shape {\n    void render() {\n        super.paint();\n        System.out.print(\"C\");\n        super.render();\n    }\n\n    void paint() {\n        System.out.print(\"Q\");\n    }\n\n    void mark() {\n        System.out.print(\"K\");\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        Shape s = new Circle();\n        s.render();\n        System.out.print(\"/\");\n        s.paint();\n    }\n}"},"answers":[{"label":"답","accept":["PKCSQ/Q"]}],"hint":"super.메서드() 안에서 다시 부르는 메서드가 누구의 것인지 본다.","explain":"- 참조 변수는 `Shape`, 실제 객체는 `Circle`. 인스턴스 메서드는 실제 객체 기준으로 실행된다(동적 바인딩).\n- `super.paint()`는 그 한 번만 부모 것을 부른다. 부모 메서드 안의 `mark()`, `paint()`는 `this.mark()`, `this.paint()`라서 다시 Circle 것이 실행된다.\n\n| 호출 | 실행되는 메서드 | 출력 |\n|---|---|---|\n| s.render() | Circle.render | |\n| super.paint() | Shape.paint | P |\n| 그 안의 mark() | Circle.mark | K |\n| print(\"C\") | | C |\n| super.render() | Shape.render | S |\n| 그 안의 paint() | Circle.paint | Q |\n| print(\"/\") | | / |\n| s.paint() | Circle.paint | Q |\n\n- 함정 요약: Shape.paint 안의 mark()를 Shape.mark(M)로 읽으면 오답. M은 한 번도 출력되지 않는다."},{"id":"code-j002","subject":"code","topic":"Java","sub":"필드 정적 바인딩","type":"output","past":"2024-3","level":3,"q":"다음 Java 프로그램의 실행 결과를 쓰시오.","code":{"lang":"java","src":"class Base {\n    int v = 4;\n\n    int get() {\n        return v + 1;\n    }\n}\n\nclass Sub extends Base {\n    int v = 9;\n\n    int get() {\n        return v * 2 + super.v;\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        Base a = new Sub();\n        Sub b = new Sub();\n        System.out.println(a.get() + a.v);\n        System.out.println(b.get() + b.v);\n        System.out.println(((Sub) a).v - ((Base) b).v);\n    }\n}"},"answers":[{"label":"답","accept":["26\n31\n5"]}],"hint":"같은 이름의 필드가 몇 개 있는지, 필드는 무엇을 기준으로 고르는지 본다.","explain":"- Sub 객체 안에는 `Base.v(4)`와 `Sub.v(9)`가 **둘 다** 있다. 같은 이름 필드는 덮어쓰지 않고 가린다(hiding).\n\n| 멤버 | 고르는 기준 |\n|---|---|\n| 인스턴스 메서드 | 실제 객체 타입 (실행 시점) |\n| 필드 | 참조 변수 타입 (컴파일 시점) |\n| static 메서드 | 참조 변수 타입 (컴파일 시점) |\n\n- `a.get()`: Sub.get 실행 → 9 × 2 + super.v(4) = 22, `a.v`: Base 타입 → 4 → 26\n- `b.get()` = 22, `b.v`: Sub 타입 → 9 → 31\n- `((Sub) a).v` = 9, `((Base) b).v` = 4 → 5\n- 메서드 안에서 쓰는 `v`는 그 메서드가 정의된 클래스의 필드다. Sub.get의 v는 9, super.v는 4.\n- 함정 요약: `a.v`를 9로 읽으면 오답. 캐스팅하면 보는 필드가 바뀐다."},{"id":"code-j003","subject":"code","topic":"Java","sub":"오버로딩·오버라이딩 결합","type":"output","past":"2026-1","level":3,"q":"다음 Java 프로그램의 실행 결과를 쓰시오.","code":{"lang":"java","src":"class P {\n    String m(Object o) {\n        return \"A\";\n    }\n\n    String call() {\n        return m(\"hi\");\n    }\n}\n\nclass Q extends P {\n    String m(Object o) {\n        return \"B\";\n    }\n\n    String m(String s) {\n        return \"C\";\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        P p = new Q();\n        Q q = new Q();\n        Object o = \"hi\";\n        System.out.print(p.call());\n        System.out.print(p.m(\"hi\"));\n        System.out.print(q.m(\"hi\"));\n        System.out.print(q.m(o));\n    }\n}"},"answers":[{"label":"답","accept":["BBCB"]}],"hint":"시그니처를 고르는 시점과 구현 클래스를 고르는 시점을 나눠서 본다.","explain":"- 두 단계로 나눠 푼다.\n  - 1단계 오버로딩: **컴파일 시점**에 참조 변수(선언) 타입에서 보이는 메서드 중 시그니처를 고른다.\n  - 2단계 오버라이딩: **실행 시점**에 실제 객체가 그 시그니처를 재정의했으면 그 구현을 실행한다.\n\n| 호출 | 1단계 시그니처 | 2단계 실행 | 출력 |\n|---|---|---|---|\n| p.call() 안의 m(\"hi\") | P 안에는 m(Object)뿐 | Q.m(Object) | B |\n| p.m(\"hi\") | P 타입 → m(Object) | Q.m(Object) | B |\n| q.m(\"hi\") | Q 타입 → m(String)이 더 구체적 | Q.m(String) | C |\n| q.m(o) | o 선언 타입이 Object → m(Object) | Q.m(Object) | B |\n\n- `Q.m(String)`은 P에 없는 새 메서드(오버로딩)라서 P 타입 참조로는 고를 수 없다.\n- 함정 요약: 인자가 실제로 문자열이어도 선언 타입이 Object면 m(Object)가 선택된다. 첫 글자를 C로 쓰면 오답."},{"id":"code-j004","subject":"code","topic":"Java","sub":"오버로딩 자동 형 변환·문자 연산","type":"output","past":"2026-1","level":3,"q":"다음 Java 프로그램의 실행 결과를 쓰시오.","code":{"lang":"java","src":"public class Main {\n    static String f(int x) {\n        return \"I\" + x;\n    }\n\n    static String f(long x) {\n        return \"L\" + x;\n    }\n\n    static String f(double x) {\n        return \"D\" + x;\n    }\n\n    static int g(char a, char b) {\n        return a + b;\n    }\n\n    static char g(char a) {\n        return (char) (a + 2);\n    }\n\n    public static void main(String[] args) {\n        byte b = 3;\n        char c = 'A';\n        System.out.println(f(b) + f(c) + f(5L) + f(2.5f));\n        int n = g('1', '2');\n        char m = g('x');\n        System.out.println(n + 1 + \"|\" + m + 1);\n        System.out.println('a' + 'b' + \"c\" + 'd' + 'e');\n    }\n}"},"answers":[{"label":"답","accept":["I3I65L5D2.5\n100|z1\n195cde"]}],"hint":"오버로딩 후보 중 가장 좁은 타입, 문자열이 처음 등장하는 위치를 본다.","explain":"- 오버로딩 선택 순서: 정확히 일치 → 기본형 확대 변환 → 박싱 → 가변 인자. 후보가 여럿이면 **가장 좁은 타입**.\n- 확대 변환: `byte → short → int → long → float → double`, `char → int`\n- `f(b)`: byte는 int·long·double 모두 가능 → 가장 좁은 int → I3\n- `f(c)`: char → int → 'A' = 65 → I65\n- `f(5L)` → L5, `f(2.5f)`: float → double → D2.5\n- `g('1', '2')`: char + char는 int → 49 + 50 = 99\n- `g('x')`: (char)('x' + 2) = 'z'\n- `n + 1 + \"|\" + m + 1`: 왼쪽부터 → 99 + 1 = 100 → \"100|\" → \"100|z\" → \"100|z1\"\n- `'a' + 'b' + \"c\" + 'd' + 'e'`: 97 + 98 = 195 → \"195c\" → \"195cd\" → \"195cde\"\n- 함정 요약: 문자열이 나오기 전까지는 숫자 덧셈, 나온 뒤로는 전부 이어 붙이기. char끼리 더하면 정수."},{"id":"code-j005","subject":"code","topic":"Java","sub":"static 메서드 가림(hiding)","type":"output","past":"2025-2","level":3,"q":"다음 Java 프로그램의 실행 결과를 쓰시오.","code":{"lang":"java","src":"class Animal {\n    static String kind() {\n        return \"A\";\n    }\n\n    String sound() {\n        return \"a\";\n    }\n\n    String desc() {\n        return kind() + sound();\n    }\n}\n\nclass Dog extends Animal {\n    static String kind() {\n        return \"D\";\n    }\n\n    String sound() {\n        return \"d\";\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        Animal x = new Dog();\n        Dog y = new Dog();\n        System.out.print(x.kind() + x.sound());\n        System.out.print(y.kind() + y.sound());\n        System.out.print(x.desc() + y.desc());\n        System.out.print(Animal.kind() + Dog.kind());\n    }\n}"},"answers":[{"label":"답","accept":["AdDdAdAdAD"]}],"hint":"static 메서드도 오버라이딩되는지 생각한다.","explain":"- static 메서드는 오버라이딩되지 않고 **가려질(hiding)** 뿐이다. 호출 대상은 참조 변수의 선언 타입으로 컴파일 때 정해진다.\n- 인스턴스 메서드 `sound()`는 오버라이딩 → 실제 객체(Dog) 것.\n\n| 호출 | kind() | sound() | 출력 |\n|---|---|---|---|\n| x (Animal 타입) | Animal.kind | Dog.sound | Ad |\n| y (Dog 타입) | Dog.kind | Dog.sound | Dd |\n| x.desc(), y.desc() | desc가 Animal에 있어 Animal.kind로 고정 | Dog.sound | Ad, Ad |\n| Animal.kind() + Dog.kind() | 클래스 이름 그대로 | | AD |\n\n- static 메서드에 `@Override`를 붙이면 컴파일 에러. 부모의 인스턴스 메서드를 자식이 static으로 선언해도 컴파일 에러.\n- 함정 요약: 객체가 Dog여도 Animal 타입 변수로 부른 static 메서드는 Animal 것. desc() 안의 kind()도 마찬가지."},{"id":"code-j006","subject":"code","topic":"Java","sub":"생성자 this()·super() 호출 순서","type":"output","past":"2023-1","level":3,"q":"다음 Java 프로그램의 실행 결과를 쓰시오.","code":{"lang":"java","src":"class Parent {\n    int x = 10;\n\n    Parent() {\n        this(30);\n        System.out.print(\"P1 \");\n    }\n\n    Parent(int x) {\n        this.x += x;\n        System.out.print(\"P2 \");\n    }\n\n    int getX() {\n        return x;\n    }\n}\n\nclass Child extends Parent {\n    int x = 50;\n\n    Child() {\n        this(7);\n        System.out.print(\"C1 \");\n    }\n\n    Child(int x) {\n        this.x = this.x * x;\n        System.out.print(\"C2 \");\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        Child c = new Child();\n        System.out.println(c.getX() + \" \" + c.x);\n    }\n}"},"answers":[{"label":"답","accept":["P2 P1 C2 C1 40 350"]}],"hint":"this(...)가 있는 생성자에는 super()가 들어가지 않는다. 필드 초기값이 들어가는 시점도 본다.","explain":"- 생성자 첫 줄은 `this(...)` 또는 `super(...)`. 둘 다 없으면 컴파일러가 `super()`를 넣는다.\n- 필드 초기값(`int x = 10`)은 super(...)가 끝난 직후, 생성자 본문보다 먼저 들어간다.\n\n| 순서 | 실행 | 출력 |\n|---|---|---|\n| 1 | Child() → this(7) → Child(int) | |\n| 2 | Child(int) 첫 줄에 숨은 super() → Parent() | |\n| 3 | Parent() → this(30) → Parent(int) | |\n| 4 | Parent.x = 10 → x += 30 → 40 | P2 |\n| 5 | Parent() 본문 마무리 | P1 |\n| 6 | Child.x = 50 → x = 50 × 7 = 350 | C2 |\n| 7 | Child() 본문 마무리 | C1 |\n\n- `c.getX()`는 Parent에 정의된 메서드라 Parent.x(40)를 돌려준다. `c.x`는 Child 타입이라 Child.x(350).\n- 함정 요약: 출력은 가장 안쪽 생성자 본문부터 끝난다(P2 → P1 → C2 → C1). x는 부모·자식에 따로 있다."},{"id":"code-j007","subject":"code","topic":"Java","sub":"부모 생성자 안의 오버라이딩 호출","type":"output","past":"2025-1","level":3,"q":"다음 Java 프로그램의 실행 결과를 쓰시오.","code":{"lang":"java","src":"class Base {\n    static int sum = 0;\n    int n = 2;\n\n    Base() {\n        sum += n++;\n        add();\n    }\n\n    void add() {\n        sum += 100;\n    }\n}\n\nclass Derived extends Base {\n    int n = 5;\n\n    Derived() {\n        n *= 3;\n        sum += n;\n        add();\n    }\n\n    @Override\n    void add() {\n        sum += n * 10;\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        new Derived();\n        System.out.println(Base.sum);\n        new Base();\n        System.out.println(Base.sum);\n    }\n}"},"answers":[{"label":"답","accept":["167\n269"]}],"hint":"부모 생성자가 실행되는 동안 자식 필드에 무슨 값이 들어 있는지 본다.","explain":"- 부모 생성자가 도는 동안 자식 필드는 아직 초기값이 안 들어간 **기본값 0**이다.\n- 그때 부모 생성자가 부른 `add()`도 동적 바인딩으로 자식 것이 실행된다.\n\n| 단계 | 실행 | sum |\n|---|---|---|\n| Base() | Base.n = 2, sum += n++ → +2 (n은 3) | 2 |\n| add() | Derived.add, Derived.n은 아직 0 → +0 | 2 |\n| Derived 필드 초기화 | Derived.n = 5 | 2 |\n| Derived() | n *= 3 → 15, sum += 15 | 17 |\n| add() | +15 × 10 | 167 |\n| new Base() | sum += 2 | 169 |\n| add() | Base.add → +100 | 269 |\n\n- `sum`은 static이라 두 객체가 같은 변수를 공유하고 계속 누적된다.\n- 함정 요약: Base.n과 Derived.n은 다른 필드, 부모 생성자 속 add()에서 n은 0."},{"id":"code-j008","subject":"code","topic":"Java","sub":"static 공유·초기화 블록 순서","type":"output","level":3,"q":"다음 Java 프로그램의 실행 결과를 쓰시오.","code":{"lang":"java","src":"class Parent {\n    static int count = 0;\n    int id;\n\n    static {\n        System.out.print(\"A\");\n    }\n\n    {\n        System.out.print(\"B\");\n    }\n\n    Parent() {\n        count++;\n        id = count;\n        System.out.print(\"C\");\n    }\n}\n\nclass Child extends Parent {\n    static {\n        System.out.print(\"D\");\n    }\n\n    {\n        System.out.print(\"E\");\n    }\n\n    Child() {\n        count += 10;\n        System.out.print(\"F\");\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        new Child();\n        System.out.println();\n        new Child();\n        System.out.println();\n        Parent p = new Parent();\n        Child c = new Child();\n        System.out.println();\n        System.out.println(p.id + \" \" + c.id + \" \" + c.count);\n    }\n}"},"answers":[{"label":"답","accept":["ADBCEF\nBCEF\nBCBCEF\n23 24 34"]}],"hint":"static 블록은 몇 번 실행되는지, count와 id 중 어느 것이 공유되는지 본다.","explain":"- 실행 순서\n  - 클래스를 처음 쓸 때 **한 번만**: 부모 static 블록 → 자식 static 블록\n  - 객체마다: 부모 인스턴스 블록 → 부모 생성자 본문 → 자식 인스턴스 블록 → 자식 생성자 본문\n\n| 문장 | 출력 | count 변화 | id |\n|---|---|---|---|\n| new Child() 1번째 | ADBCEF | 0 → 1 → 11 | 1 |\n| new Child() 2번째 | BCEF | 12 → 22 | 12 |\n| new Parent() | BC | 23 | p.id = 23 |\n| new Child() | BCEF | 24 → 34 | c.id = 24 |\n\n- `count`는 static이라 모든 객체가 변수 하나를 공유 → `c.count` = `Parent.count` = 34\n- `id`는 객체마다 따로 있다. c.id는 Child 생성자가 10을 더하기 **전**에 저장된 24.\n- static 메서드 안에서 인스턴스 필드를 바로 쓰면 컴파일 에러(2023년 3회 기출).\n- 함정 요약: 두 번째 객체부터 A, D는 다시 출력되지 않는다."},{"id":"code-j009","subject":"code","topic":"Java","sub":"인터페이스·추상 클래스 키워드","type":"blank","past":"2025-3","level":3,"q":"다음 Java 프로그램의 실행 결과가 \u003c실행 결과>와 같을 때, 빈칸 ①~④에 들어갈 알맞은 키워드를 쓰시오.","box":"**\u003c실행 결과>**\n```\nrect 12.0\nshape 2.5\n```\n- 빈칸 하나에 키워드 하나만 쓴다.","code":{"lang":"java","src":"interface Shape {\n    double area();\n\n    ( ① ) String name() {\n        return \"shape\";\n    }\n}\n\nabstract class Polygon ( ② ) Shape {\n    protected int w, h;\n\n    Polygon(int w, int h) {\n        this.w = w;\n        this.h = h;\n    }\n}\n\nclass Rect ( ③ ) Polygon {\n    Rect(int w, int h) {\n        ( ④ )(w, h);\n    }\n\n    public double area() {\n        return w * h;\n    }\n\n    public String name() {\n        return \"rect\";\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        Shape[] arr = {\n            new Rect(3, 4),\n            new Shape() {\n                public double area() {\n                    return 2.5;\n                }\n            }\n        };\n        for (Shape s : arr) {\n            System.out.println(s.name() + \" \" + s.area());\n        }\n    }\n}"},"answers":[{"label":"①","accept":["default"]},{"label":"②","accept":["implements"]},{"label":"③","accept":["extends"]},{"label":"④","accept":["super"]}],"hint":"인터페이스 안의 몸체 있는 메서드, 부모 클래스에 기본 생성자가 있는지 본다.","explain":"- ① `default`: 인터페이스에 몸체 있는 인스턴스 메서드를 두려면 default. 구현 클래스가 재정의하지 않으면 이 몸체가 쓰인다(익명 클래스 → shape).\n- ② `implements`: 클래스가 인터페이스를 구현. 추상 클래스는 인터페이스 메서드(area)를 구현하지 않고 자식에게 넘길 수 있다.\n- ③ `extends`: 클래스가 클래스를 상속(단일 상속).\n- ④ `super`: Polygon에 기본 생성자가 없으니 `super(w, h)`를 직접 불러야 한다. 빼면 컴파일러가 넣는 `super()`가 실패해 컴파일 에러.\n- 실행: Rect는 name() 재정의 → rect, `w * h`(int 12)가 double로 반환 → 12.0 / 익명 클래스는 area()만 구현 → shape 2.5\n\n| 키워드 | 쓰는 곳 |\n|---|---|\n| extends | 클래스 → 클래스, 인터페이스 → 인터페이스 |\n| implements | 클래스 → 인터페이스 (여러 개 가능) |\n| abstract | 추상 클래스, 몸체 없는 추상 메서드 |\n| default | 인터페이스의 몸체 있는 메서드 |\n| super(...) | 부모 생성자 호출, 생성자 첫 줄 |\n| this(...) | 같은 클래스의 다른 생성자 호출, 생성자 첫 줄 |\n\n- 인터페이스 메서드는 자동으로 public이라 구현할 때 public을 빼면 컴파일 에러.\n- 함정 요약: ④에 this를 쓰면 자기 생성자를 다시 부르는 재귀 호출이라 컴파일 에러."},{"id":"code-j010","subject":"code","topic":"Java","sub":"instanceof·다운캐스팅","type":"blank","level":2,"q":"다음 Java 프로그램의 실행 결과가 \u003c실행 결과>와 같을 때, 빈칸 ①, ②에 들어갈 알맞은 코드를 쓰시오.","box":"**\u003c실행 결과>**\n```\nwoof cat animal woof 2\n```\n- ①은 연산자 하나, ②는 형 변환 식을 쓴다.","code":{"lang":"java","src":"class Animal {\n    String name() {\n        return \"animal\";\n    }\n}\n\nclass Dog extends Animal {\n    String name() {\n        return \"dog\";\n    }\n\n    String bark() {\n        return \"woof\";\n    }\n}\n\nclass Cat extends Animal {\n    String name() {\n        return \"cat\";\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        Animal[] list = { new Dog(), new Cat(), new Animal(), new Dog() };\n        int cnt = 0;\n        for (Animal a : list) {\n            if (a ( ① ) Dog) {\n                Dog d = ( ② ) a;\n                System.out.print(d.bark() + \" \");\n                cnt++;\n            } else {\n                System.out.print(a.name() + \" \");\n            }\n        }\n        System.out.println(cnt);\n    }\n}"},"answers":[{"label":"①","accept":["instanceof"]},{"label":"②","accept":["(Dog)","Dog"]}],"hint":"실제 객체 타입을 검사하는 연산자, 부모 타입을 자식 타입으로 바꾸는 방법.","explain":"- 업캐스팅(자식 → 부모)은 자동: `Animal a = new Dog();`\n- 다운캐스팅(부모 → 자식)은 `(Dog)`를 명시해야 한다. 실제 객체가 Dog가 아니면 실행 중 **ClassCastException**.\n- 그래서 `a instanceof Dog`로 실제 객체 타입을 먼저 검사한다.\n- `a.bark()`는 Animal 타입에 없는 메서드라 컴파일 에러 → bark를 부르려면 다운캐스팅 필요.\n\n| 원소 | instanceof Dog | 출력 |\n|---|---|---|\n| new Dog() | true | woof |\n| new Cat() | false | cat (name() 동적 바인딩) |\n| new Animal() | false | animal |\n| new Dog() | true | woof |\n\n- instanceof 규칙: `new Dog() instanceof Animal` → true(부모 타입으로 물어도 참), `null instanceof Dog` → false\n- 함정 요약: 캐스팅은 참조 타입만 바꾸고 객체는 그대로다. 오버라이딩된 메서드는 캐스팅과 상관없이 실제 객체 것."},{"id":"code-j011","subject":"code","topic":"Java","sub":"다중 catch·finally·사용자 정의 예외","type":"output","past":"2024-3","level":3,"q":"다음 Java 프로그램의 실행 결과를 쓰시오.","code":{"lang":"java","src":"class LimitException extends Exception {\n    int code;\n\n    LimitException(int code) {\n        this.code = code;\n    }\n}\n\npublic class Main {\n    static int[] arr = {4, 0, 2};\n\n    static int calc(int i) throws LimitException {\n        if (i == 3) {\n            throw new LimitException(7);\n        }\n        return 12 / arr[i];\n    }\n\n    public static void main(String[] args) {\n        int sum = 0;\n        for (int i = 0; i \u003c 5; i++) {\n            try {\n                sum += calc(i);\n                System.out.print(\"T\");\n            } catch (ArithmeticException e) {\n                sum += 10;\n                System.out.print(\"A\");\n            } catch (LimitException e) {\n                sum += e.code;\n                System.out.print(\"L\");\n            } catch (Exception e) {\n                sum += 100;\n                System.out.print(\"E\");\n            } finally {\n                sum += 1;\n            }\n        }\n        System.out.println(\" \" + sum);\n    }\n}"},"answers":[{"label":"답","accept":["TATLE 131"]}],"hint":"catch는 몇 개 실행되는지, 예외가 나면 try의 나머지 문장은 어떻게 되는지 본다.","explain":"| i | 일어난 일 | 실행된 catch | 출력 | finally 후 sum |\n|---|---|---|---|---|\n| 0 | 12 / 4 = 3 | 없음 | T | 4 |\n| 1 | 12 / 0 → ArithmeticException | ArithmeticException +10 | A | 15 |\n| 2 | 12 / 2 = 6 | 없음 | T | 22 |\n| 3 | throw LimitException(7) | LimitException +7 | L | 30 |\n| 4 | arr[4] → ArrayIndexOutOfBoundsException | Exception +100 | E | 131 |\n\n- catch는 위에서부터 **처음 맞는 하나만** 실행. finally는 예외가 나든 안 나든 매번 실행.\n- 예외가 나면 try의 나머지(`sum +=` 대입, `print(\"T\")`)는 건너뛴다.\n- 상위 타입(Exception) catch를 하위 타입보다 위에 두면 아래 catch에 도달할 수 없어 컴파일 에러.\n- 사용자 정의 예외: Exception을 상속하면 checked 예외 → 던지는 메서드에 `throws` 선언 필수. RuntimeException 상속이면 생략 가능.\n- 정수를 0으로 나누면 ArithmeticException, 실수 0.0으로 나누면 예외 없이 Infinity.\n- 함정 요약: 배열 범위 초과는 따로 catch가 없어 Exception으로 간다."},{"id":"code-j012","subject":"code","topic":"Java","sub":"finally와 return·람다 예외","type":"output","past":"2025-2","level":3,"q":"다음 Java 프로그램의 실행 결과를 쓰시오.","code":{"lang":"java","src":"public class Main {\n    interface Calc {\n        int run(int x) throws Exception;\n    }\n\n    static int count = 0;\n\n    static int exec(Calc c, int v) {\n        try {\n            return c.run(v);\n        } catch (Exception e) {\n            return -1;\n        } finally {\n            count++;\n        }\n    }\n\n    static int keep() {\n        int x = 1;\n        try {\n            x = 5;\n            return x;\n        } finally {\n            x = 50;\n        }\n    }\n\n    static int over() {\n        try {\n            throw new RuntimeException();\n        } finally {\n            return 9;\n        }\n    }\n\n    public static void main(String[] args) {\n        Calc half = n -> {\n            if (n % 2 != 0) {\n                throw new Exception();\n            }\n            return n / 2;\n        };\n        int a = exec(half, 8) + exec(half, 7) + exec(n -> n * 3, 2);\n        System.out.println(a + \" \" + count);\n        System.out.println(keep() + over());\n    }\n}"},"answers":[{"label":"답","accept":["9 3\n14"]}],"hint":"반환값이 정해지는 시점, finally 안의 return이 하는 일.","explain":"- `exec(half, 8)`: 짝수 → 4, finally에서 count = 1\n- `exec(half, 7)`: 홀수 → 람다가 예외를 던짐 → catch → -1, count = 2\n- `exec(n -> n * 3, 2)`: 6, count = 3 → a = 4 - 1 + 6 = 9 → `9 3`\n- `keep()`: `return x`를 만나는 순간 반환값 5가 정해지고, 그다음 finally 실행. finally에서 x를 50으로 바꿔도 반환값은 5(기본형).\n- `over()`: finally의 `return 9`가 try에서 던진 예외를 덮어써 예외가 사라지고 9 반환\n- 5 + 9 = 14\n- finally 규칙\n  - try·catch에서 return해도 finally는 실행된다. 건너뛰는 경우는 System.exit()뿐.\n  - finally 안의 return은 앞의 return 값과 예외를 모두 덮는다.\n- 람다: 추상 메서드가 하나인 인터페이스(함수형 인터페이스)를 식으로 구현한 것. run에 `throws Exception`이 있어 람다 안에서 checked 예외를 던질 수 있다.\n- 함정 요약: finally에서 변수를 바꾸는 것(반환값 그대로)과 finally에서 return하는 것(반환값 교체)은 다르다."},{"id":"code-j013","subject":"code","topic":"Java","sub":"String == 와 equals","type":"output","past":"2023-2","level":3,"q":"다음 Java 프로그램의 실행 결과를 쓰시오.","code":{"lang":"java","src":"public class Main {\n    public static void main(String[] args) {\n        String a = \"Java\";\n        String b = \"Ja\" + \"va\";\n        String c = new String(\"Java\");\n        String d = \"Ja\";\n        String e = d + \"va\";\n        System.out.println(a == b);\n        System.out.println(a == c);\n        System.out.println(a == e);\n        System.out.println(a.equals(c) && c.equals(e));\n        System.out.println(\"a==b: \" + a == b);\n    }\n}"},"answers":[{"label":"답","accept":["true\nfalse\nfalse\ntrue\nfalse"]}],"hint":"컴파일할 때 합쳐지는 문자열, + 와 == 중 무엇이 먼저 계산되는지 본다.","explain":"- `==`는 참조(주소) 비교, `equals`는 문자열 내용 비교.\n\n| 변수 | 만드는 방법 | 위치 |\n|---|---|---|\n| a | 리터럴 \"Java\" | 상수 풀 |\n| b | 리터럴끼리 \"Ja\" + \"va\" → 컴파일할 때 \"Java\"로 합쳐짐 | 상수 풀 (a와 같은 객체) |\n| c | new String(\"Java\") | 힙의 새 객체 |\n| e | 변수 d + \"va\" → 실행 중 연결 | 힙의 새 객체 |\n\n- a == b → true, a == c → false, a == e → false\n- 내용 비교 equals는 모두 같으므로 true && true → true\n- 마지막 줄: `+`가 `==`보다 먼저 → `(\"a==b: \" + a) == b` → \"a==b: Java\"와 \"Java\"의 참조 비교 → **false**만 출력\n- d가 `final String d = \"Ja\";`였다면 `d + \"va\"`도 컴파일 상수가 되어 a == e가 true.\n- 함정 요약: 마지막 줄을 `a==b: true`로 쓰면 오답. 접두 문자열 없이 false 한 단어."},{"id":"code-j014","subject":"code","topic":"Java","sub":"StringBuilder·String 불변","type":"output","level":2,"q":"다음 Java 프로그램의 실행 결과를 쓰시오.","code":{"lang":"java","src":"public class Main {\n    public static void main(String[] args) {\n        String s = \"abc\";\n        s.toUpperCase();\n        s.concat(\"de\");\n        StringBuilder sb = new StringBuilder(s);\n        StringBuilder t = sb;\n        sb.append(\"de\").reverse();\n        t.insert(2, \"X\");\n        System.out.println(s);\n        System.out.println(sb);\n        System.out.println(t.length() + \" \" + (sb == t));\n        String u = sb.toString().replace(\"X\", \"\") + s.toUpperCase();\n        System.out.println(u.charAt(4) + \"\" + u.indexOf(\"c\") + u.indexOf(\"C\"));\n    }\n}"},"answers":[{"label":"답","accept":["abc\nedXcba\n6 true\na27"]}],"hint":"String 메서드의 반환값을 변수에 받았는지, 두 변수가 같은 객체를 가리키는지 본다.","explain":"- String은 불변. `toUpperCase()`, `concat()`은 새 문자열을 돌려줄 뿐 s를 바꾸지 않는다. 받지 않으면 버려진다 → s = \"abc\"\n- StringBuilder는 가변. `t = sb`는 같은 객체를 가리킨다.\n\n| 문장 | sb (= t) |\n|---|---|\n| new StringBuilder(\"abc\") | abc |\n| append(\"de\") | abcde |\n| reverse() | edcba |\n| t.insert(2, \"X\") | edXcba |\n\n- `t.length()` = 6, `sb == t` → true\n- u = \"edcba\" + \"ABC\" = \"edcbaABC\"\n  - charAt(4) = 'a' (e0 d1 c2 b3 a4)\n  - indexOf(\"c\") = 2, indexOf(\"C\") = 7\n- `u.charAt(4) + \"\" + ...`: 중간의 \"\"로 문자열 연결이 된다. \"\"가 없으면 char + int 덧셈.\n- StringBuilder 메서드: append(뒤에 붙임), insert(i, x)(i번 자리 앞에 끼움), reverse, delete(s, e)(s ~ e-1 삭제). 모두 자기 자신을 바꾸고 자신을 돌려준다.\n- 함정 요약: `s.toUpperCase();`만 쓰면 s는 그대로. sb와 t는 이름만 둘이고 객체는 하나."},{"id":"code-j015","subject":"code","topic":"Java","sub":"String 메서드(split·substring·indexOf)","type":"output","past":"2024-2","level":3,"q":"다음 Java 프로그램의 실행 결과를 쓰시오.","code":{"lang":"java","src":"public class Main {\n    public static void main(String[] args) {\n        String str = \"BANABBREADB\";\n        String[] p = str.split(\"B\");\n        System.out.println(p.length + \" \" + p[1] + p[p.length - 1]);\n        System.out.println(\"[\" + p[0] + \"][\" + p[2] + \"]\");\n        String s = str.substring(2, 6);\n        System.out.println(s + \" \" + str.indexOf(\"A\") + \" \" + str.indexOf(\"A\", 2));\n        System.out.println(str.replace(\"B\", \"\").charAt(4));\n    }\n}"},"answers":[{"label":"답","accept":["4 ANAREAD\n[][]\nNABB 1 3\nE"]}],"hint":"split 결과의 맨 앞과 맨 끝에 생기는 빈 문자열을 본다.","explain":"- 인덱스: B0 A1 N2 A3 B4 B5 R6 E7 A8 D9 B10\n- `split(\"B\")`: \"\" / \"ANA\" / \"\" / \"READ\" / \"\" 로 잘린 뒤 **끝쪽 빈 문자열만 제거** → [\"\", \"ANA\", \"\", \"READ\"], 길이 4\n  - 맨 앞이 구분자면 앞에 빈 문자열이 남는다.\n  - 구분자가 연속(BB)이면 사이에 빈 문자열이 생긴다.\n- `p[1] + p[3]` = ANAREAD, `[p[0]][p[2]]` = [][]\n- `substring(2, 6)`: 2 ~ 5번 → N A B B → NABB (끝 인덱스는 포함하지 않음)\n- `indexOf(\"A\")` = 1, `indexOf(\"A\", 2)`: 2번부터 찾음 → 3\n- `replace(\"B\", \"\")` → \"ANAREAD\", charAt(4) = 'E'\n- 함정 요약: 길이를 5로 세면 오답. 앞의 빈 문자열은 남고 끝의 빈 문자열은 사라진다."},{"id":"code-j016","subject":"code","topic":"Java","sub":"배열·객체 참조 전달","type":"output","past":"2025-2","level":3,"q":"다음 Java 프로그램의 실행 결과를 쓰시오.","code":{"lang":"java","src":"public class Main {\n    static void modify(int[] arr, int n, String s, StringBuilder sb) {\n        arr[0] += n;\n        n += 100;\n        s += \"!\";\n        sb.append(\"!\");\n        arr = new int[]{9, 9, 9};\n        arr[1] = 0;\n    }\n\n    public static void main(String[] args) {\n        int[] a = {1, 2, 3};\n        int[] b = a;\n        int[] c = {1, 2, 3};\n        int n = 5;\n        String s = \"hi\";\n        StringBuilder sb = new StringBuilder(\"hi\");\n        modify(a, n, s, sb);\n        System.out.println(a[0] + \" \" + a[1] + \" \" + n);\n        System.out.println(s + \" \" + sb);\n        System.out.println((a == b) + \" \" + (b == c) + \" \" + (b[0] == 6));\n    }\n}"},"answers":[{"label":"답","accept":["6 2 5\nhi hi!\ntrue false true"]}],"hint":"매개변수에 새 객체를 대입한 뒤의 변경이 main에 닿는지 본다.","explain":"- Java는 항상 값 전달. 배열·객체는 **참조값이 복사**되어 넘어간다. 같은 객체의 내용은 바꿀 수 있지만, 매개변수에 새 객체를 넣어도 호출한 쪽 변수는 그대로다.\n\n| 매개변수 | 메서드 안 동작 | main에 반영 |\n|---|---|---|\n| arr | arr[0] += 5 | O (a[0] = 6, b도 같은 배열) |\n| arr | new int[] 대입 후 arr[1] = 0 | X (새 배열만 바뀜) |\n| n | n += 100 | X (기본형 복사) |\n| s | s += \"!\" (새 String 생성) | X |\n| sb | append(\"!\") (같은 객체 수정) | O |\n\n- `a == b`: 같은 배열 → true / `b == c`: 내용이 같아도 다른 객체 → false / `b[0] == 6` → true\n- 함정 요약: `arr = new int[]` 다음 줄의 arr[1] = 0은 main의 a와 무관. String은 +=로 바꿔도 새 객체라 반영 안 된다."},{"id":"code-j017","subject":"code","topic":"Java","sub":"2차원·가변 배열","type":"output","level":2,"q":"다음 Java 프로그램의 실행 결과를 쓰시오.","code":{"lang":"java","src":"public class Main {\n    public static void main(String[] args) {\n        int[][] m = new int[3][];\n        for (int i = 0; i \u003c m.length; i++) {\n            m[i] = new int[i + 2];\n            for (int j = 0; j \u003c m[i].length; j++) {\n                m[i][j] = i * j + 1;\n            }\n        }\n        int total = 0;\n        for (int[] row : m) {\n            total += row[row.length - 1];\n        }\n        System.out.println(m.length + \" \" + m[2].length + \" \" + total);\n\n        int[][] g = {{1, 2, 3}, {4, 5}, {6}};\n        int s = 0;\n        for (int i = 0; i \u003c g.length; i++) {\n            for (int j = i; j \u003c g[i].length; j++) {\n                s += g[i][j];\n            }\n        }\n        System.out.println(s + \" \" + g[1][g[2].length]);\n    }\n}"},"answers":[{"label":"답","accept":["3 4 11\n11 5"]}],"hint":"행마다 길이가 다르다. 안쪽 반복의 시작값도 본다.","explain":"- `new int[3][]`: 행 3개만 만들고 각 행 배열은 따로 만든다(가변 배열). `m.length` = 행 수, `m[i].length` = i행의 길이.\n\n| i | 길이 | 값 (i × j + 1) | 마지막 원소 |\n|---|---|---|---|\n| 0 | 2 | 1 1 | 1 |\n| 1 | 3 | 1 2 3 | 3 |\n| 2 | 4 | 1 3 5 7 | 7 |\n\n- total = 1 + 3 + 7 = 11 → `3 4 11`\n- g는 j가 i부터 시작\n  - 0행: 1 + 2 + 3 = 6\n  - 1행: j = 1만 → 5\n  - 2행: j = 2인데 길이 1 → 반복 없음\n  - s = 11\n- `g[1][g[2].length]` = g[1][1] = 5\n- 함정 요약: 직사각형이 아닌 배열은 행마다 length를 따로 본다. 2행은 한 번도 더해지지 않는다."},{"id":"code-j018","subject":"code","topic":"Java","sub":"정수 나눗셈·나머지·문자 형 변환","type":"blank","past":"2023-2","level":2,"q":"다음 Java 프로그램의 실행 결과가 \u003c실행 결과>와 같을 때, 빈칸 ①~③에 들어갈 알맞은 코드를 \u003c조건>에 맞게 쓰시오.","box":"**\u003c실행 결과>**\n```\nEHCF\n```\n**\u003c조건>**\n- ①, ③: 변수 `n`, 정수 `10`, 연산자 `/` `%` 중 하나만 사용\n- ②: 자료형 하나를 이용한 형 변환","code":{"lang":"java","src":"public class Main {\n    public static void main(String[] args) {\n        int n = 5274;\n        String r = \"\";\n        while (n > 0) {\n            int d = ( ① );\n            r += ( ② ) ('A' + d);\n            n = ( ③ );\n        }\n        System.out.println(r);\n    }\n}"},"answers":[{"label":"①","accept":["n % 10","n%10"]},{"label":"②","accept":["(char)","char"]},{"label":"③","accept":["n / 10","n/10"]}],"hint":"일의 자리를 꺼내는 연산과 일의 자리를 떼어 내는 연산.","explain":"- 정수 / 정수 = 몫(소수점 버림), `%` = 나머지. `n % 10`은 일의 자리, `n / 10`은 일의 자리를 떼어 낸 수.\n\n| 반복 | n | d = n % 10 | 'A' + d | r |\n|---|---|---|---|---|\n| 1 | 5274 | 4 | E (69) | E |\n| 2 | 527 | 7 | H (72) | EH |\n| 3 | 52 | 2 | C (67) | EHC |\n| 4 | 5 | 5 | F (70) | EHCF |\n\n- ②가 없으면 `'A' + d`는 int라 r에 숫자가 붙어 \"69726770\"이 된다. `(char)`로 바꿔야 문자.\n- 문자 연산: char + int → int, (char)로 되돌림. 'A' = 65, 'a' = 97, '0' = 48\n- 같은 유형(2023년 2회): 4620원 → 1000원 m / 1000, 500원 m % 1000 / 500, 100원 m % 500 / 100, 10원 m % 100 / 10\n- 함정 요약: 뒷자리부터 꺼내므로 숫자 순서가 뒤집혀 나온다."},{"id":"code-j019","subject":"code","topic":"Java","sub":"비트·시프트·증감·삼항","type":"output","level":2,"q":"다음 Java 프로그램의 실행 결과를 쓰시오.","code":{"lang":"java","src":"public class Main {\n    public static void main(String[] args) {\n        int a = 13, b = 6;\n        System.out.println((a & b) + \" \" + (a | b) + \" \" + (a ^ b) + \" \" + (~a));\n        System.out.println((a \u003c\u003c 2) + \" \" + (-a >> 1) + \" \" + (-1 >>> 28));\n        int x = 5;\n        int y = x++ + ++x;\n        int z = (x > 6) ? x-- : --x;\n        System.out.println(x + \" \" + y + \" \" + z);\n    }\n}"},"answers":[{"label":"답","accept":["4 15 11 -14\n52 -7 15\n6 12 7"]}],"hint":"음수에서 >> 와 >>> 의 차이, 후위·전위 증감이 값을 쓰는 시점.","explain":"- 13 = 1101, 6 = 0110\n  - `&` → 0100 = 4, `|` → 1111 = 15, `^` → 1011 = 11\n  - `~a` = -(a + 1) = -14 (2의 보수)\n- `a \u003c\u003c 2` = 13 × 4 = 52\n- `-a >> 1`: 부호 비트를 채우는 산술 시프트, 결과는 내림 → -6.5의 내림 -7 (나눗셈 -13 / 2 = -6과 다르다)\n- `-1 >>> 28`: 빈자리를 0으로 채우는 논리 시프트 → 1이 4개 남음 → 15\n- `y = x++ + ++x`: x++는 5를 쓰고 x = 6, ++x는 x = 7로 올린 뒤 7 → y = 12\n- `z`: x(7) > 6 참 → `x--`는 7을 쓰고 x = 6 → z = 7\n- 결과 x = 6, y = 12, z = 7\n- 함정 요약: 음수의 >>는 0이 아닌 음의 무한대 쪽으로 내린다. ~a는 -a-1."},{"id":"code-j020","subject":"code","topic":"Java","sub":"재귀·오버라이딩된 재귀","type":"output","past":"2023-3","level":3,"q":"다음 Java 프로그램의 실행 결과를 쓰시오.","code":{"lang":"java","src":"class Calc {\n    int f(int n) {\n        if (n \u003c= 1) {\n            return n;\n        }\n        return f(n - 1) + f(n - 2);\n    }\n}\n\nclass FastCalc extends Calc {\n    int f(int n) {\n        if (n \u003c= 1) {\n            return n;\n        }\n        return f(n - 3) + super.f(n - 1);\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        Calc c = new FastCalc();\n        System.out.println(c.f(5) + \" \" + new Calc().f(5));\n    }\n}"},"answers":[{"label":"답","accept":["1 5"]}],"hint":"super.f 안의 f 호출이 어느 클래스로 가는지, 음수가 기저 조건에 걸릴 때 반환값.","explain":"- c는 FastCalc 객체. `super.f(...)`로 Calc.f에 들어가도 그 안의 `f(...)`는 `this.f`라서 다시 FastCalc.f가 실행된다.\n- F = FastCalc.f, C = super.f로 들어간 Calc.f\n  - F(n): n ≤ 1이면 n, 아니면 F(n-3) + C(n-1)\n  - C(n): n ≤ 1이면 n, 아니면 F(n-1) + F(n-2)\n\n| 값 | 계산 | 결과 |\n|---|---|---|\n| F(-1), F(0), F(1) | 기저 (n 그대로) | -1, 0, 1 |\n| C(1) | 기저 | 1 |\n| F(2) | F(-1) + C(1) | 0 |\n| C(2) | F(1) + F(0) | 1 |\n| F(3) | F(0) + C(2) | 1 |\n| C(4) | F(3) + F(2) | 1 |\n| F(5) | F(2) + C(4) | 1 |\n\n- `new Calc().f(5)`는 순수 Calc 객체라 피보나치 → 5\n- 함정 요약: 기저 조건 n ≤ 1은 음수도 그대로 돌려준다(F(-1) = -1). super로 한 번 들어가도 안쪽 재귀는 자식 것."},{"id":"code-j021","subject":"code","topic":"Java","sub":"제네릭·내부 클래스·오버로딩","type":"output","past":"2024-3","level":3,"q":"다음 Java 프로그램의 실행 결과를 쓰시오.","code":{"lang":"java","src":"public class Main {\n    static class Box\u003cT> {\n        T item;\n\n        Box(T item) {\n            this.item = item;\n        }\n\n        void show() {\n            Printer p = new Printer();\n            Integer k = 10;\n            p.print(item);\n            p.print(10);\n            p.print(k);\n        }\n\n        class Printer {\n            void print(Object o) {\n                System.out.println(\"O\" + o);\n            }\n\n            void print(Integer i) {\n                System.out.println(\"I\" + i);\n            }\n\n            void print(double d) {\n                System.out.println(\"D\" + d);\n            }\n        }\n    }\n\n    public static void main(String[] args) {\n        new Box\u003c>(7).show();\n    }\n}"},"answers":[{"label":"답","accept":["O7\nD10.0\nI10"]}],"hint":"제네릭 타입 변수가 컴파일러에게 어떤 타입으로 보이는지, 박싱과 확대 변환 중 먼저 시도하는 것.","explain":"- 오버로딩은 **컴파일 시점의 선언 타입**으로 고른다.\n- `p.print(item)`: item의 타입은 T. 컴파일러는 T를 Object로 본다(타입 소거) → print(Object) → O7 (실제 값이 Integer여도)\n- `p.print(10)`: 선택 단계\n  - 1단계: 박싱 없이 확대 변환만으로 맞는 메서드 → int → double 가능 → print(double) 선택 → D10.0\n  - 2단계(박싱·언박싱)는 1단계에서 못 찾을 때만 간다 → print(Integer)는 후보가 못 된다.\n- `p.print(k)`: k는 Integer → 정확히 일치 → I10\n- 내부 클래스\n  - Printer는 Box의 (인스턴스) 내부 클래스 → Box 객체의 메서드 안에서 `new Printer()` 가능, 바깥 필드에 바로 접근 가능\n  - Box는 static 중첩 클래스 → 바깥 Main 객체 없이 `new Box\u003c>(7)` 가능\n  - `\u003c>`(다이아몬드)는 인자 7을 보고 T = Integer로 추론\n- 함정 요약: int 인자는 Integer보다 double 쪽으로 먼저 간다. 제네릭 값은 Object 오버로드로 간다."},{"id":"code-j022","subject":"code","topic":"Java","sub":"ArrayList·HashMap·enum","type":"output","level":2,"q":"다음 Java 프로그램의 실행 결과를 쓰시오.","code":{"lang":"java","src":"import java.util.*;\n\nenum Level {\n    LOW(1), MID(5), HIGH(10);\n\n    private final int w;\n\n    Level(int w) {\n        this.w = w;\n    }\n\n    int weight() {\n        return w;\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        List\u003cInteger> list = new ArrayList\u003c>();\n        for (int i = 1; i \u003c= 5; i++) {\n            list.add(i * 2);\n        }\n        list.remove(1);\n        list.remove(Integer.valueOf(8));\n        list.add(1, 4);\n        System.out.println(list);\n\n        Map\u003cString, Integer> map = new HashMap\u003c>();\n        for (Level lv : Level.values()) {\n            map.put(lv.name().substring(0, 1), lv.weight() * list.get(lv.ordinal()));\n        }\n        map.put(\"M\", map.get(\"M\") + 1);\n        Integer old = map.put(\"L\", 0);\n        System.out.println(old + map.get(\"M\") + map.get(\"H\") + map.getOrDefault(\"X\", 100));\n        System.out.println(map.size() + \" \" + map.containsKey(\"LOW\") + \" \" + Level.valueOf(\"HIGH\").ordinal());\n    }\n}"},"answers":[{"label":"답","accept":["[2, 4, 6, 10]\n183\n3 false 2"]}],"hint":"remove에 int를 넘기면 인덱스와 값 중 무엇으로 해석되는지, put이 돌려주는 값.","explain":"- `remove(int)`은 인덱스 삭제, `remove(Object)`는 값 삭제. int 리터럴을 넣으면 인덱스로 처리된다.\n\n| 문장 | list |\n|---|---|\n| add 반복 | [2, 4, 6, 8, 10] |\n| remove(1) | [2, 6, 8, 10] |\n| remove(Integer.valueOf(8)) | [2, 6, 10] |\n| add(1, 4) | [2, 4, 6, 10] |\n\n- enum: `values()`는 선언 순서 배열, `ordinal()`은 0부터 순번, `name()`은 상수 이름 문자열\n\n| lv | 키 | 값 |\n|---|---|---|\n| LOW (0) | L | 1 × list.get(0) = 2 |\n| MID (1) | M | 5 × list.get(1) = 20 |\n| HIGH (2) | H | 10 × list.get(2) = 60 |\n\n- `put(\"M\", 21)`: 같은 키면 덮어씀. `put(\"L\", 0)`은 이전 값 2를 돌려준다 → old = 2\n- `getOrDefault(\"X\", 100)`: 키가 없으니 100\n- old + 21 + 60 + 100 = 183 (Integer끼리 +는 언박싱 후 덧셈)\n- 키는 L, M, H 3개 → size 3, `containsKey(\"LOW\")` false, `valueOf(\"HIGH\").ordinal()` = 2\n- 함정 요약: remove(1)은 값 1이 아니라 1번 자리를 지운다."},{"id":"code-p001","subject":"code","topic":"Python","sub":"문자열 슬라이싱","type":"output","past":"2026-2","level":3,"q":"다음 Python 프로그램의 실행 결과를 쓰시오.","code":{"lang":"python","src":"s = \"INFORMATION_PROCESSING\"\na = s[2:6]\nb = s[-3:]\nc = s[::5]\nd = s[-1:-9:-3]\ne = s[12:3]\nf = s[len(s) - 1] + s[-len(s)]\nprint(a + \"/\" + b + \"/\" + c + \"/\" + d)\nprint(e + \"/\" + str(len(e)) + \"/\" + f)"},"answers":[{"label":"답","accept":["FORM/ING/IMNCN/GSC\n/0/GI"]}],"hint":"음수 step이 멈추는 위치, 시작이 끝보다 뒤인 양수 step 슬라이스","explain":"인덱스 (길이 22)\n```\n 0 I   1 N   2 F   3 O   4 R   5 M   6 A   7 T\n 8 I   9 O  10 N  11 _  12 P  13 R  14 O  15 C\n16 E  17 S  18 S  19 I  20 N  21 G\n```\n| 식 | 고르는 인덱스 | 결과 |\n|---|---|---|\n| `s[2:6]` | 2, 3, 4, 5 | FORM |\n| `s[-3:]` | 19, 20, 21 | ING |\n| `s[::5]` | 0, 5, 10, 15, 20 | IMNCN |\n| `s[-1:-9:-3]` | 21, 18, 15 (끝 -9 = 13은 미포함, 다음 12는 범위 밖) | GSC |\n| `s[12:3]` | step 1인데 시작 > 끝 | 빈 문자열 |\n| `s[len(s)-1] + s[-len(s)]` | 21, 0 | GI |\n\n- 둘째 줄은 빈 문자열 e로 시작하므로 `/`가 맨 앞에 온다. len(e)는 0\n- **함정 요약**: 빈 슬라이스는 오류가 아니라 `''`이다.\n- 일반 규칙\n  - `s[a:b:c]`에서 b는 항상 미포함\n  - c > 0이면 a \u003c b일 때만, c \u003c 0이면 a > b일 때만 값이 나온다\n  - 음수 인덱스 -k는 len - k. `[::-1]` 역순, `[-3:]` 끝 3개\n  - 슬라이스는 범위를 넘어도 잘라서 돌려주고, 인덱싱 `s[99]`는 IndexError"},{"id":"code-p002","subject":"code","topic":"Python","sub":"얕은 복사와 +=","type":"output","past":"2026-1","level":3,"q":"다음 Python 프로그램의 실행 결과를 쓰시오.","code":{"lang":"python","src":"def build(data):\n    m = [[x] for x in data]\n    b = m[:]\n    b[0] = [0]\n    for i in range(1, len(b)):\n        b[i] += b[i - 1]\n    return m, b\n\nm, b = build([5, 6, 7])\nprint(m)\nprint(b)\nprint(m[2] is b[2], m[0] is b[0])"},"answers":[{"label":"답","accept":["[[5], [6, 0], [7, 6, 0]]\n[[0], [6, 0], [7, 6, 0]]\nTrue False"]}],"hint":"`b[0] = ...`(칸 바꾸기)와 `b[i] += ...`(안쪽 리스트 고치기)는 m에 미치는 영향이 다르다","explain":"- `b = m[:]`는 바깥 리스트만 새로 만든다. 안쪽 리스트 3개는 m과 b가 같이 가리킨다\n- `b[0] = [0]`은 b의 0번 칸에 새 리스트를 넣는다. m[0]은 그대로 [5]\n- 리스트의 `+=`는 extend와 같은 제자리 변경이다. 공유 중인 안쪽 리스트가 바뀌므로 m에도 보인다\n\n| 단계 | m | b |\n|---|---|---|\n| 복사 직후 | [[5], [6], [7]] | 같은 안쪽 리스트 공유 |\n| `b[0] = [0]` | [[5], [6], [7]] | [[0], [6], [7]] |\n| i=1 `b[1] += b[0]` | [[5], [6, 0], [7]] | [[0], [6, 0], [7]] |\n| i=2 `b[2] += b[1]` | [[5], [6, 0], [7, 6, 0]] | [[0], [6, 0], [7, 6, 0]] |\n\n- `m[2] is b[2]` → True (같은 객체), `m[0] is b[0]` → False (b 쪽만 새 객체로 바뀜)\n- **함정 요약**: 칸에 새 값을 대입하면 공유가 끊기고, 안쪽 객체를 고치면 양쪽에 다 보인다.\n- 일반 규칙\n  - 얕은 복사: `a[:]`, `list(a)`, `a.copy()`, `copy.copy(a)`\n  - 깊은 복사: `copy.deepcopy(a)` (안쪽까지 새로 만든다)\n  - 리스트 `x += y`는 제자리 변경, `x = x + y`는 새 리스트를 만들어 공유가 끊긴다"},{"id":"code-p003","subject":"code","topic":"Python","sub":"[[0]*3]*3 참조 공유·2차원 리스트","type":"output","level":3,"q":"다음 Python 프로그램의 실행 결과를 쓰시오.","code":{"lang":"python","src":"a = [[0] * 3] * 3\nb = [[0] * 3 for _ in range(3)]\nfor i in range(3):\n    a[i][i] = i + 1\n    b[i][i] = i + 1\n\nc = b\nc[0][2] = 5\nt = [[b[j][i] for j in range(3)] for i in range(3)]\nflat = [x for row in t for x in row if x > 0]\n\nprint(a)\nprint(t)\nprint(flat, sum(row[2] for row in a))"},"answers":[{"label":"답","accept":["[[1, 2, 3], [1, 2, 3], [1, 2, 3]]\n[[1, 0, 0], [0, 2, 0], [5, 0, 3]]\n[1, 2, 5, 3] 9"]}],"hint":"`*`로 늘린 행과 컴프리헨션으로 만든 행이 각각 몇 개의 객체인지 세어 볼 것","explain":"- `[[0] * 3] * 3`은 행 리스트 1개를 3번 가리킨다. a[0][0]=1, a[1][1]=2, a[2][2]=3이 모두 한 행에 쌓여 [1, 2, 3]이 세 번 보인다\n- `[[0] * 3 for _ in range(3)]`은 행을 3개 따로 만든다. 대각선만 바뀐다\n- `c = b`는 복사가 아니라 같은 객체에 이름 하나 더 붙이기 → `c[0][2] = 5`가 b에 반영\n\n| 변수 | 값 |\n|---|---|\n| a | [[1, 2, 3], [1, 2, 3], [1, 2, 3]] (한 행 공유) |\n| b | [[1, 0, 5], [0, 2, 0], [0, 0, 3]] |\n| t (전치, t[i][j] = b[j][i]) | [[1, 0, 0], [0, 2, 0], [5, 0, 3]] |\n| flat | t를 행 순서로 펴서 0 제외 → [1, 2, 5, 3] |\n\n- 중첩 컴프리헨션 `[x for row in t for x in row if x > 0]`은 앞의 for가 바깥 반복이다\n- a의 세 행은 모두 [1, 2, 3]이라 row[2] 합은 3 × 3 = 9\n- **함정 요약**: `[[0]*3]*3`은 행을 공유하고, `=` 대입은 별칭을 만든다.\n- 일반 규칙\n  - `[0] * 3`처럼 불변 값(int, str)을 늘리는 건 안전\n  - 리스트를 담은 리스트를 `*`로 늘리면 같은 객체가 반복된다\n  - 2차원 초기화는 `[[0] * m for _ in range(n)]`"},{"id":"code-p004","subject":"code","topic":"Python","sub":"dict 컴프리헨션·set 연산","type":"output","past":"2025-2","level":3,"q":"다음 Python 프로그램의 실행 결과를 쓰시오.","code":{"lang":"python","src":"nums = [3, 1, 4, 1, 5]\nd = {n: n % 3 for n in nums}\ns = set(d.values())\n\nnums.append(9)\nd[4] = 2\nt = set(d.keys())\nt.discard(7)\nt.add(1)\ns.update([4, 0])\n\nprint(d)\nprint(sorted(s & t), sorted(s - t), sorted(s ^ t))\nprint(len(s | t))"},"answers":[{"label":"답","accept":["{3: 0, 1: 1, 4: 2, 5: 2}\n[1, 4] [0, 2] [0, 2, 3, 5]\n6"]}],"hint":"컴프리헨션의 중복 키, 없는 원소의 discard, 만들어진 dict와 원본 리스트의 관계","explain":"- nums에 1이 두 번 → 같은 키를 다시 넣으면 값만 덮어쓰고 자리는 처음 들어간 위치 그대로 → d = {3: 0, 1: 1, 4: 1, 5: 2}\n- s = set(d.values()) = {0, 1, 2}\n- `nums.append(9)`는 이미 만든 d와 상관없다 (컴프리헨션은 만든 시점의 값으로 끝)\n- `d[4] = 2` → {3: 0, 1: 1, 4: 2, 5: 2}\n- t = {1, 3, 4, 5}. `discard(7)`은 없는 원소라도 오류 없음, `add(1)`은 중복이라 변화 없음\n- `s.update([4, 0])` → s = {0, 1, 2, 4}\n\n연산 결과 (s = {0, 1, 2, 4}, t = {1, 3, 4, 5})\n- `s & t` 교집합 → [1, 4]\n- `s - t` 차집합 → [0, 2]\n- `s ^ t` 대칭차집합 (한쪽에만 있는 것) → [0, 2, 3, 5]\n- `s | t` 합집합 → {0, 1, 2, 3, 4, 5} → 길이 6\n\n- **함정 요약**: set은 출력 순서가 보장되지 않아 시험은 sorted나 len으로 묻는다. 기출(2023-1)처럼 set을 그대로 출력하면 원소만 쓰게 한다.\n- 일반 규칙\n  - add(원소 1개) / update(반복 가능 객체를 풀어서 여러 개)\n  - remove(없으면 KeyError) / discard(없어도 통과) / pop(임의 원소 하나)\n  - `set(\"hello\")` → 글자 단위로 쪼개져 중복 제거 → 4개"},{"id":"code-p005","subject":"code","topic":"Python","sub":"리스트 메서드","type":"output","level":3,"q":"다음 Python 프로그램의 실행 결과를 쓰시오.","code":{"lang":"python","src":"a = [5, 3, 8]\nb = a\na.append([1, 2])\na.extend([1, 2])\na.insert(1, 7)\nx = a.pop()\ny = a.pop(0)\na.remove(1)\nprint(a, x, y)\n\nc = [n for n in a if type(n) == int]\nd = sorted(c, reverse=True)\nc.reverse()\nr = c.sort()\nprint(b is a, len(b), r)\nprint(c, d)"},"answers":[{"label":"답","accept":["[7, 3, 8, [1, 2]] 2 5\nTrue 4 None\n[3, 7, 8] [8, 7, 3]"]}],"hint":"append와 extend가 넣는 개수, remove가 지우는 대상, sort()와 reverse()의 반환값","explain":"| 실행 | a |\n|---|---|\n| 시작 | [5, 3, 8] |\n| `append([1, 2])` | [5, 3, 8, [1, 2]] (리스트 통째로 1개) |\n| `extend([1, 2])` | [5, 3, 8, [1, 2], 1, 2] (풀어서 2개) |\n| `insert(1, 7)` | [5, 7, 3, 8, [1, 2], 1, 2] |\n| `pop()` → x = 2 | [5, 7, 3, 8, [1, 2], 1] |\n| `pop(0)` → y = 5 | [7, 3, 8, [1, 2], 1] |\n| `remove(1)` | [7, 3, 8, [1, 2]] (값이 1인 첫 원소. [1, 2]는 1이 아니다) |\n\n- `b = a`는 같은 객체 → `b is a` True, len(b) 4\n- c = [7, 3, 8] (int만 걸러냄)\n- `d = sorted(c, reverse=True)` → 새 리스트 [8, 7, 3]\n- `c.reverse()` → [8, 3, 7]. 내림차순 정렬이 아니라 순서만 뒤집는다\n- `r = c.sort()` → c는 [3, 7, 8]이 되고 r은 None\n- **함정 요약**: 제자리 메서드(sort, reverse, append, extend, insert, remove)의 반환값은 None이다.\n- 일반 규칙\n  - pop(i)는 인덱스로, remove(x)는 값으로 지운다 (없는 값이면 ValueError)\n  - sorted()는 새 리스트, sort()는 원본 변경\n  - reverse()와 sort(reverse=True)는 다르다"},{"id":"code-p006","subject":"code","topic":"Python","sub":"클래스 변수와 인스턴스 변수","type":"output","past":"2026-2","level":3,"q":"다음 Python 프로그램의 실행 결과를 쓰시오.","code":{"lang":"python","src":"class Shop:\n    count = 0\n    items = []\n    codes = {\"KOR\": \"Seoul\", \"JPN\": \"Tokyo\", \"USA\": \"Boston\"}\n\n    def __init__(self, name):\n        self.name = name\n        self.count += 1\n        Shop.count += 2\n        self.items.append(name)\n\ns1 = Shop(\"pen\")\ns2 = Shop(\"cup\")\ns2.items = [\"box\"]\ns3 = Shop(\"ink\")\n\nprint(Shop.count, s1.count, s2.count, s3.count)\nprint(Shop.items, s2.items)\n\nr = \"\"\nfor k, v in s1.codes.items():\n    r += k[-1] + v[:2]\nprint(r)"},"answers":[{"label":"답","accept":["6 1 3 5\n['pen', 'cup', 'ink'] ['box']\nRSeNToABo"]}],"hint":"`self.count += 1`은 읽는 곳과 쓰는 곳이 다르다. `self.items.append`는 어디에 붙는가","explain":"- `self.count += 1`은 `self.count = self.count + 1`이다. 오른쪽은 (인스턴스에 없으니) 클래스 변수를 읽고, 왼쪽 대입은 인스턴스 변수를 새로 만든다\n- `Shop.count += 2`는 클래스 변수 자체를 바꾼다\n- `self.items.append()`는 인스턴스에 items가 없으면 클래스 리스트를 그대로 고친다 (모든 인스턴스 공유)\n\n| 실행 | 읽은 Shop.count | 인스턴스 count | 이후 Shop.count | Shop.items |\n|---|---|---|---|---|\n| s1 생성 | 0 | 1 | 2 | ['pen'] |\n| s2 생성 | 2 | 3 | 4 | ['pen', 'cup'] |\n| `s2.items = ['box']` | - | - | 4 | 변화 없음 (s2에 인스턴스 변수가 생김) |\n| s3 생성 | 4 | 5 | 6 | ['pen', 'cup', 'ink'] |\n\n- codes.items()는 넣은 순서대로 (3.7+). `k[-1]` 마지막 글자 + `v[:2]` 앞 두 글자\n  - KOR/Seoul → RSe, JPN/Tokyo → NTo, USA/Boston → ABo → RSeNToABo\n- **함정 요약**: 대입하면 인스턴스 변수가 생겨 클래스 변수를 가리고, append처럼 고치면 공유 객체가 바뀐다.\n- 일반 규칙: 속성 찾는 순서는 인스턴스 → 클래스 → 부모 클래스. 기출(2021-1, 2024-1, 2026-2)은 클래스 변수 리스트·dict를 순회하며 글자를 뽑아 잇는 형태"},{"id":"code-p007","subject":"code","topic":"Python","sub":"튜플 언패킹 swap·step 슬라이싱","type":"output","past":"2024-3","level":3,"q":"다음 Python 프로그램의 실행 결과를 쓰시오.","code":{"lang":"python","src":"def flip(lst):\n    n = len(lst)\n    for i in range(n // 2):\n        lst[i], lst[-i - 1] = lst[-i - 1], lst[i]\n    return n % 2\n\ndata = [3, 1, 4, 1, 5, 9, 2]\nmid = flip(data)\nx, y = data[::3], data[1::2]\nx, y = y, x\n\nprint(data[-3:], mid)\nprint(x, y)\nprint(sum(x) - sum(y))"},"answers":[{"label":"답","accept":["[4, 1, 3] 1\n[9, 1, 1] [2, 1, 3]\n5"]}],"hint":"길이가 홀수일 때 가운데 원소, [::3]과 [1::2]가 고르는 인덱스, swap 뒤 x·y가 가리키는 값","explain":"flip: range(7 // 2) → i = 0, 1, 2. 양끝을 맞바꿔 뒤집는다. 가운데 인덱스 3은 그대로\n\n| i | 교환 | data |\n|---|---|---|\n| 0 | 0 ↔ 6 | [2, 1, 4, 1, 5, 9, 3] |\n| 1 | 1 ↔ 5 | [2, 9, 4, 1, 5, 1, 3] |\n| 2 | 2 ↔ 4 | [2, 9, 5, 1, 4, 1, 3] |\n\n- 반환값 7 % 2 = 1. 리스트는 함수 안에서 고쳐도 밖의 data가 바뀐다 (같은 객체)\n- `data[::3]` → 인덱스 0, 3, 6 → [2, 1, 3]\n- `data[1::2]` → 인덱스 1, 3, 5 → [9, 1, 1]\n- `x, y = y, x` → 오른쪽 튜플을 먼저 만든 뒤 대입 → x = [9, 1, 1], y = [2, 1, 3]\n- `data[-3:]` → [4, 1, 3]\n- sum(x) - sum(y) = 11 - 6 = 5\n- **함정 요약**: swap 뒤에 x와 y는 서로 바뀐 리스트를 가리킨다.\n- 일반 규칙\n  - `lst[-i-1]`은 뒤에서 i+1번째\n  - `[::2]` 짝수 인덱스, `[1::2]` 홀수 인덱스\n  - `a, b = b, a`는 임시 변수 없이 교환된다"},{"id":"code-p008","subject":"code","topic":"Python","sub":"type·isinstance·is와 ==","type":"output","past":"2024-3","level":2,"q":"다음 Python 프로그램의 실행 결과를 쓰시오.","code":{"lang":"python","src":"def score(v):\n    if type(v) == type(1):\n        return 1\n    elif isinstance(v, int):\n        return 10\n    elif type(v) == type(\"\"):\n        return len(v)\n    elif isinstance(v, (list, tuple)):\n        return 100\n    return 1000\n\na = [1, 2]\nb = a\nc = a[:]\nvals = [7, True, \"7.0\", 7.0, (7,), a]\n\nprint(sum(score(v) for v in vals))\nprint(a == c, a is c, b is a)\nprint(type(3 / 1) == type(3), 3 // 1 == 3.0)"},"answers":[{"label":"답","accept":["1214\nTrue False True\nFalse True"]}],"hint":"bool은 int의 자식 클래스다. 문자열 \"7.0\"과 실수 7.0은 다르다","explain":"| v | 걸리는 조건 | 반환 |\n|---|---|---|\n| 7 | `type(v) == type(1)` (int) | 1 |\n| True | type은 bool이라 첫 조건 탈락, `isinstance(True, int)`는 True | 10 |\n| \"7.0\" | str → len(\"7.0\") | 3 |\n| 7.0 | float는 어느 조건에도 안 걸림 | 1000 |\n| (7,) | tuple | 100 |\n| a | list | 100 |\n\n합계 1 + 10 + 3 + 1000 + 100 + 100 = 1214\n\n- `==`는 값 비교, `is`는 같은 객체인지 비교\n  - c = a[:]는 새 리스트 → `a == c` True, `a is c` False\n  - b = a는 같은 객체 → `b is a` True\n- `/`는 항상 float (3 / 1 = 3.0) → type 비교 False\n- `3 // 1`은 int 3, `3 == 3.0`은 값 비교라 True\n- **함정 요약**: type() 비교는 상속을 무시하고 isinstance는 상속을 따른다.\n- 일반 규칙: `is`는 `x is None` 비교에 쓴다. 작은 정수·짧은 문자열의 is 결과는 구현에 따라 달라서 시험 정답이 될 수 없다."},{"id":"code-p009","subject":"code","topic":"Python","sub":"트리 재귀","type":"output","past":"2025-1","level":2,"q":"다음 Python 프로그램의 실행 결과를 쓰시오.","code":{"lang":"python","src":"class Node:\n    def __init__(self, value):\n        self.value = value\n        self.children = []\n\ndef build(values):\n    nodes = [Node(v) for v in values]\n    for i in range(1, len(values)):\n        nodes[(i - 1) // 2].children.append(nodes[i])\n    return nodes[0]\n\ndef calc(node, depth=0):\n    total = node.value * depth if depth % 2 == 0 else -node.value\n    return total + sum(calc(c, depth + 1) for c in node.children)\n\ndef leaves(node):\n    if not node.children:\n        return [node.value]\n    return [v for c in node.children for v in leaves(c)]\n\nroot = build([4, 7, 2, 9, 1, 6])\nprint(calc(root))\nprint(leaves(root))"},"answers":[{"label":"답","accept":["23\n[9, 1, 6]"]}],"hint":"부모 인덱스 (i-1)//2로 트리를 그린 뒤, 조건식이 무엇을 묶는지 볼 것","explain":"부모 인덱스 (i - 1) // 2로 만든 트리\n```\n        4          depth 0\n      /   \\\n     7     2       depth 1\n    / \\   /\n   9   1 6         depth 2\n```\n- `node.value * depth if depth % 2 == 0 else -node.value`는 `(값 × depth) if 짝수 else (-값)`으로 묶인다\n\n| 노드 | depth | 기여 |\n|---|---|---|\n| 4 | 0 | 4 × 0 = 0 |\n| 7, 2 | 1 | -7, -2 |\n| 9, 1, 6 | 2 | 18, 2, 12 |\n\n- 합 0 - 9 + 32 = 23\n- leaves: 자식이 없는 노드를 왼쪽부터 모은다 → [9, 1, 6]\n- **함정 요약**: 루트는 depth 0이라 0을 곱해 사라진다.\n- 일반 규칙\n  - 완전 이진트리 배열 표현: i의 부모 (i - 1) // 2, 자식 2i + 1, 2i + 2\n  - `sum(calc(c, depth + 1) for c in ...)`는 자식마다 재귀 결과를 더한다. 자식이 없으면 sum은 0"},{"id":"code-p010","subject":"code","topic":"Python","sub":"부분 문자열 개수·find·f-string 포맷","type":"output","past":"2024-2","level":3,"q":"다음 Python 프로그램의 실행 결과를 쓰시오.","code":{"lang":"python","src":"def count_sub(text, pat):\n    cnt = 0\n    for i in range(len(text)):\n        if text[i:i + len(pat)] == pat:\n            cnt += 1\n    return cnt\n\ns = \"abababcab\"\np = \"aba\"\nc1 = count_sub(s, p)\nc2 = s.count(p)\ni1 = s.find(\"cab\")\ni2 = s.find(\"x\")\nrate = c2 / c1\n\nprint(f\"{p}{c1}{p}{c2}\")\nprint(f\"[{i1:>4}][{i2:\u003c3}][{rate:.2f}]\")\nprint(s.replace(\"ab\", \"X\", 2))"},"answers":[{"label":"답","accept":["aba2aba1\n[   6][-1 ][0.50]\nXXabcab"]}],"hint":"직접 센 개수와 str.count는 겹치는 경우에서 갈린다. 포맷의 정렬 방향과 폭","explain":"s = `a b a b a b c a b` (인덱스 0~8)\n\n- count_sub: 모든 위치에서 길이 3 조각을 비교 → 0, 2에서 \"aba\" → c1 = 2 (겹쳐도 센다)\n- `s.count(\"aba\")`: 찾으면 그 끝(3)부터 다시 찾는다 → 겹치는 2번 위치는 못 센다 → c2 = 1\n- `find(\"cab\")` = 6, `find(\"x\")` = -1 (index였다면 ValueError)\n- rate = 1 / 2 = 0.5\n\n| 포맷 | 뜻 | 결과 |\n|---|---|---|\n| `{i1:>4}` | 폭 4, 오른쪽 정렬 | `[   6]` |\n| `{i2:\u003c3}` | 폭 3, 왼쪽 정렬 | `[-1 ]` |\n| `{rate:.2f}` | 소수 둘째 자리 | `[0.50]` |\n\n- `replace(\"ab\", \"X\", 2)` → 앞에서 2번만 바꾼다 → XXabcab\n- **함정 요약**: str.count는 겹치지 않게 센다.\n- 일반 규칙\n  - `{:^5}` 가운데, `{:05d}` 0으로 채움, `{:,}` 천 단위 쉼표, `{:.2f}` 반올림\n  - find/rfind는 없으면 -1, index/rindex는 없으면 ValueError\n  - replace(old, new, 횟수) 횟수를 빼면 전부 바꾼다"},{"id":"code-p011","subject":"code","topic":"Python","sub":"split·join·역순·ord/chr","type":"output","past":"2026-1","level":3,"q":"다음 Python 프로그램의 실행 결과를 쓰시오.","code":{"lang":"python","src":"text = \"  Data  Base sql  \"\nwords = text.strip().split()\nx = []\nfor w in words:\n    x.append(w[::-1].lower())\ny = \"-\".join(x)\nz = \"\".join(c for c in y if c not in \"aeiou\")\ncode = sum(ord(c) - ord(\"a\") for c in z if c.isalpha())\n\nprint(words, len(text.split(\" \")))\nprint(y)\nprint(z, chr(ord(z[0]) - 32), code)"},"answers":[{"label":"답","accept":["['Data', 'Base', 'sql'] 8\natad-esab-lqs\ntd-sb-lqs T 86"]}],"hint":"split()과 split(\" \")의 차이, 필터가 지우는 글자, 소문자 → 대문자 코드 차이","explain":"- `text.strip().split()` → 공백 여러 칸을 하나로 보고 나눈다 → ['Data', 'Base', 'sql']\n- `text.split(\" \")` → 공백 한 칸마다 자른다 → ['', '', 'Data', '', 'Base', 'sql', '', ''] → 8개\n- 단어마다 `[::-1]` 후 lower → atad, esab, lqs → `\"-\".join` → atad-esab-lqs\n- `c not in \"aeiou\"`는 글자 하나씩 검사 → 모음 제거, 하이픈은 남는다 → td-sb-lqs\n- `chr(ord(\"t\") - 32)` → 116 - 32 = 84 → T\n- code: 알파벳만 `ord(c) - ord(\"a\")`\n\n| 글자 | t | d | s | b | l | q | s |\n|---|---|---|---|---|---|---|---|\n| 값 | 19 | 3 | 18 | 1 | 11 | 16 | 18 |\n\n합 86\n- **함정 요약**: 인자 없는 split()은 빈 문자열을 만들지 않고, split(\" \")은 만든다.\n- 일반 규칙\n  - ord(\"A\") = 65, ord(\"a\") = 97, ord(\"0\") = 48. 대소문자 차이 32\n  - strip/lstrip/rstrip, upper/lower/swapcase/capitalize/title\n  - `구분자.join(문자열 리스트)`"},{"id":"code-p012","subject":"code","topic":"Python","sub":"range·print sep/end·for-else","type":"output","past":"2026-1","level":3,"q":"다음 Python 프로그램의 실행 결과를 쓰시오.","code":{"lang":"python","src":"lst = list(range(1, 15, 3))\nfor v in lst[::-2]:\n    print(v, end=\"#\")\nprint()\n\nfor i in range(10, 0, -4):\n    print(i, i // 3, sep=\":\", end=\"|\")\nprint()\n\nfor n in range(len(lst)):\n    if lst[n] % 5 == 0:\n        print(\"found\", n)\n        break\nelse:\n    print(\"none\")\n\nfor n in range(2, 2):\n    print(\"loop\")\nelse:\n    print(\"empty\", n)"},"answers":[{"label":"답","accept":["13#7#1#\n10:3|6:2|2:0|\nfound 3\nempty 3"]}],"hint":"end가 바꾼 줄 끝, 한 번도 안 도는 for의 else, 반복 변수는 반복이 끝나도 남는다","explain":"- `list(range(1, 15, 3))` → [1, 4, 7, 10, 13] (15 미포함)\n- `lst[::-2]` → 끝에서 2칸씩 → 13, 7, 1. 각 값 뒤에 `#` → `13#7#1#`, 다음 print()가 줄바꿈\n- `range(10, 0, -4)` → 10, 6, 2 (0 미포함)\n  - sep=\":\"은 값 사이, end=\"|\"는 끝 → `10:3|6:2|2:0|`\n- 첫 for-else: lst[3] = 10이 5의 배수 → `found 3` 출력 후 break → else 건너뜀\n- 둘째 for-else: range(2, 2)는 비어 있다 → 본문 0회, break가 없었으므로 else 실행\n  - n은 새로 대입되지 않아 앞 반복에서 남은 3 → `empty 3`\n- **함정 요약**: for의 else는 break 없이 끝났을 때 실행되고, 0회 반복도 여기에 들어간다.\n- 일반 규칙\n  - range(시작, 끝, 간격)에서 끝은 미포함. 간격이 음수면 시작 > 끝이어야 값이 나온다\n  - print 기본값은 sep=\" \", end=\"\\n\"\n  - while-else도 같은 규칙"},{"id":"code-p013","subject":"code","topic":"Python","sub":"enumerate·zip·dict 메서드","type":"output","past":"2025-3","level":3,"q":"다음 Python 프로그램의 실행 결과를 쓰시오.","code":{"lang":"python","src":"names = [\"kim\", \"lee\", \"park\", \"choi\", \"jung\"]\nscores = [[80, 90], [70], [95, 85, 75], [60, 100]]\n\nresult = {}\nfor idx, (name, sc) in enumerate(zip(names, scores), start=1):\n    result[name] = (idx, sum(sc) // len(sc))\n\ngrade = {}\nfor name, (idx, avg) in result.items():\n    key = \"A\" if avg >= 80 else \"B\"\n    grade.setdefault(key, []).append(idx)\n\nprint(result)\nprint(grade)\nprint(grade.get(\"C\", 0), result.get(\"jung\"), len(result))"},"answers":[{"label":"답","accept":["{'kim': (1, 85), 'lee': (2, 70), 'park': (3, 85), 'choi': (4, 80)}\n{'A': [1, 3, 4], 'B': [2]}\n0 None 4"]}],"hint":"zip은 짧은 쪽에 맞춘다. enumerate의 start, setdefault가 돌려주는 것","explain":"- `zip(names, scores)` → scores가 4개라 jung은 버려진다\n- `enumerate(..., start=1)` → 번호가 1부터\n\n| idx | name | sc | sum // len |\n|---|---|---|---|\n| 1 | kim | [80, 90] | 85 |\n| 2 | lee | [70] | 70 |\n| 3 | park | [95, 85, 75] | 85 |\n| 4 | choi | [60, 100] | 80 |\n\n- `setdefault(key, [])` → 키가 없으면 []를 넣고 그 리스트를, 있으면 기존 리스트를 돌려준다 → 바로 append해도 dict 안에 반영 → {'A': [1, 3, 4], 'B': [2]}\n- `grade.get(\"C\", 0)` → 키가 없어 기본값 0\n- `result.get(\"jung\")` → 기본값을 안 주면 None (대괄호 접근이면 KeyError)\n- len(result) = 4\n- dict 출력 형식: 문자열 키는 작은따옴표, 튜플 값은 `(1, 85)`\n- **함정 요약**: zip에서 잘린 원소는 dict에 아예 들어가지 않는다.\n- 일반 규칙\n  - keys() / values() / items(), get(k, 기본값), setdefault(k, 기본값), pop(k)\n  - `k in d`는 키를 검사한다\n  - 3.7+ dict는 넣은 순서를 유지한다"},{"id":"code-p014","subject":"code","topic":"Python","sub":"// % 음수·거듭제곱·비트 연산","type":"output","level":2,"q":"다음 Python 프로그램의 실행 결과를 쓰시오.","code":{"lang":"python","src":"a, b = -7, 3\nprint(a // b, a % b, -(7 // 3), 7 % -3)\n\nq, r = divmod(a, b)\nprint(q * b + r == a, divmod(17, -5))\nprint(-2 ** 2, (-2) ** 2, 2 ** 3 ** 2)\n\nx = 13\nprint(x & 6, x | 6, x ^ 6, ~x, x \u003c\u003c 2, x >> 1)\n\ntotal = 0\nfor i in range(1, 4):\n    total += x >> i\nprint(total)"},"answers":[{"label":"답","accept":["-3 2 -2 -2\nTrue (-4, -3)\n-4 4 512\n4 15 11 -14 52 6\n10"]}],"hint":"//는 버림이 아니라 내림, 단항 -와 거듭제곱의 우선순위, 거듭제곱의 결합 방향","explain":"- `//`는 음의 무한대 방향으로 내림 → -7 // 3 = -2.33…의 내림 → -3\n- `%`의 부호는 오른쪽 피연산자를 따른다\n  - -7 % 3 = 2 (-3 × 3 + 2 = -7)\n  - 7 % -3 = -2 (-3 × -3 - 2 = 7)\n- `-(7 // 3)` = -2 → -7 // 3과 다르다\n- divmod(a, b) = (a // b, a % b) → 항상 q × b + r == a → True. divmod(17, -5) = (-4, -3)\n\n거듭제곱\n```\n-2 ** 2     → -(2 ** 2) = -4    거듭제곱이 단항 -보다 먼저\n(-2) ** 2   → 4\n2 ** 3 ** 2 → 2 ** 9 = 512      오른쪽부터 결합\n```\n비트 연산 (13 = 1101, 6 = 0110)\n```\n13 & 6   → 0100 = 4\n13 | 6   → 1111 = 15\n13 ^ 6   → 1011 = 11\n~13      → -(13 + 1) = -14\n13 \u003c\u003c 2  → 13 × 4 = 52\n13 >> 1  → 13 // 2 = 6\n```\n- total = (13 >> 1) + (13 >> 2) + (13 >> 3) = 6 + 3 + 1 = 10\n- **함정 요약**: 파이썬 //, %는 음수에서 C·Java(0 쪽으로 버림)와 결과가 다르다.\n- 일반 규칙\n  - C·Java: -7 / 3 = -2, -7 % 3 = -1\n  - Python: -7 // 3 = -3, -7 % 3 = 2\n  - `~x` = -x - 1, `x \u003c\u003c n` = x × 2ⁿ, `x >> n` = x // 2ⁿ"},{"id":"code-p015","subject":"code","topic":"Python","sub":"lambda·map·filter·reduce·sorted","type":"output","past":"2022-3","level":2,"q":"다음 Python 프로그램의 실행 결과를 쓰시오.","code":{"lang":"python","src":"from functools import reduce\n\nnums = [15, 4, 22, 9, 30, 7]\na = list(map(lambda n: n % 10, nums))\nb = list(filter(lambda n: n % 3 == 0, nums))\nc = reduce(lambda acc, n: acc * 10 + n, a[:3], 0)\nd = reduce(lambda x, y: x if x > y else y, nums)\n\nwords = [\"kiwi\", \"fig\", \"banana\", \"apple\", \"date\"]\ne = sorted(words, key=lambda w: (len(w), w))\nf = sorted(words, key=len, reverse=True)\ng = sorted(nums, key=lambda n: -(n % 10))\n\nprint(a, b)\nprint(c, d)\nprint(e)\nprint(f)\nprint(g)"},"answers":[{"label":"답","accept":["[5, 4, 2, 9, 0, 7] [15, 9, 30]\n542 30\n['fig', 'date', 'kiwi', 'apple', 'banana']\n['banana', 'apple', 'kiwi', 'date', 'fig']\n[9, 7, 15, 4, 22, 30]"]}],"hint":"reduce의 초깃값, key가 같은 원소끼리의 순서, 음수 key의 정렬 방향","explain":"- `map(n % 10)` → [5, 4, 2, 9, 0, 7]\n- `filter(3의 배수)` → [15, 9, 30]\n- `reduce(f, [5, 4, 2], 0)` → 0 → 0 × 10 + 5 = 5 → 54 → 542\n- `reduce(큰 값 남기기, nums)` → 30\n- e: key = (길이, 단어) → 3: fig / 4: date, kiwi (사전순) / 5: apple / 6: banana\n- f: key = len, reverse=True → 길이 내림차순. 길이가 같은 kiwi·date는 원래 순서(kiwi 먼저) 유지\n- g: key = -(일의 자리) → 일의 자리가 큰 순\n\n| n | 9 | 7 | 15 | 4 | 22 | 30 |\n|---|---|---|---|---|---|---|\n| key | -9 | -7 | -5 | -4 | -2 | 0 |\n\n- **함정 요약**: reverse=True는 정렬 결과를 뒤집는 게 아니라 비교만 반대로 해서, 같은 key끼리는 원래 순서가 남는다(안정 정렬).\n- 일반 규칙\n  - map/filter는 이터레이터 → list()로 감싸야 리스트로 출력된다\n  - reduce는 `from functools import reduce`. 초깃값을 안 주면 첫 원소부터 시작\n  - sorted(key=...)는 원본을 바꾸지 않는다"},{"id":"code-p016","subject":"code","topic":"Python","sub":"가변 기본 인자","type":"output","level":2,"q":"다음 Python 프로그램의 실행 결과를 쓰시오.","code":{"lang":"python","src":"def add_item(item, box=[]):\n    box.append(item)\n    return box\n\ndef add_safe(item, box=None):\n    if box is None:\n        box = []\n    box.append(item)\n    return box\n\ndef show(x, y=2, *rest):\n    print(\"x=\", x, \"y=\", y, rest)\n\na = add_item(1)\nb = add_item(2)\nc = add_item(3, [])\nd = add_item(4)\ne = add_safe(5)\nf = add_safe(6)\n\nprint(a, b, c, d)\nprint(e, f, a is d)\nshow(10)\nshow(10, 20, 30, 40)"},"answers":[{"label":"답","accept":["[1, 2, 4] [1, 2, 4] [3] [1, 2, 4]\n[5] [6] True\nx= 10 y= 2 ()\nx= 10 y= 20 (30, 40)"]}],"hint":"기본값 []는 언제 몇 번 만들어지는가. print 인자 사이에 들어가는 문자","explain":"- 기본값은 함수를 정의할 때 한 번만 만들어진다 → `box=[]`는 호출끼리 같은 리스트를 쓴다\n\n| 호출 | 쓰는 리스트 | 그 시점 값 |\n|---|---|---|\n| add_item(1) | 기본 리스트 | [1] → a |\n| add_item(2) | 같은 기본 리스트 | [1, 2] → b |\n| add_item(3, []) | 새로 넘긴 리스트 | [3] → c |\n| add_item(4) | 같은 기본 리스트 | [1, 2, 4] → d |\n\n- a, b, d는 같은 객체 → 출력 시점의 값 [1, 2, 4]가 셋 다 찍힌다. `a is d` True\n- add_safe는 None으로 받고 안에서 새로 만든다 → [5], [6]\n- show: print 기본 sep은 공백 → `x= 10 y= 2 ()`\n  - 남는 위치 인자는 `*rest` 튜플로 모인다 → (30, 40), 없으면 ()\n- **함정 요약**: a는 [1]일 때 받았지만 같은 리스트라 뒤의 변경이 다 보인다.\n- 일반 규칙\n  - 기본값에 list·dict·set을 쓰지 말고 None으로 받아 안에서 만든다\n  - 기본값 있는 매개변수는 기본값 없는 매개변수 뒤에 온다 (기출 2022-1)"},{"id":"code-p017","subject":"code","topic":"Python","sub":"상속·super·오버라이딩","type":"output","level":2,"q":"다음 Python 프로그램의 실행 결과를 쓰시오.","code":{"lang":"python","src":"class Animal:\n    sound = \"...\"\n    count = 0\n\n    def __init__(self, name):\n        self.name = name\n        Animal.count += 1\n\n    def speak(self):\n        return self.name + \":\" + self.sound\n\n    def intro(self):\n        return \"[\" + self.speak() + \"]\"\n\nclass Dog(Animal):\n    sound = \"woof\"\n\n    def __init__(self, name, age):\n        super().__init__(name)\n        self.age = age\n\n    def speak(self):\n        if self.age > 2:\n            return super().speak() * 2\n        return super().speak()\n\nclass Puppy(Dog):\n    def __init__(self, name):\n        super().__init__(name, 1)\n        self.sound = \"yip\"\n\npets = [Animal(\"cat\"), Dog(\"max\", 3), Puppy(\"bo\")]\nfor p in pets:\n    print(p.intro())\nprint(Animal.count, Dog.count, pets[2].sound, Dog.sound)"},"answers":[{"label":"답","accept":["[cat:...]\n[max:woofmax:woof]\n[bo:yip]\n3 3 yip woof"]}],"hint":"부모 메서드 안의 self.speak()는 누구의 speak인가. sound는 인스턴스와 클래스 중 어디서 찾는가","explain":"- intro는 Animal에만 있지만 그 안의 `self.speak()`는 실제 객체의 클래스부터 찾는다 (오버라이딩된 쪽이 불림)\n\n| 객체 | 불리는 speak | sound | intro 결과 |\n|---|---|---|---|\n| Animal(\"cat\") | Animal.speak | 클래스 변수 \"...\" | [cat:...] |\n| Dog(\"max\", 3) | Dog.speak, age > 2 → 부모 결과 × 2 | Dog 클래스 변수 \"woof\" | [max:woofmax:woof] |\n| Puppy(\"bo\") | Puppy에 없어 Dog.speak, age 1 → 부모 결과 | 인스턴스 변수 \"yip\" | [bo:yip] |\n\n- Puppy 생성자 → super()로 Dog 생성자(age = 1) → 다시 super()로 Animal 생성자\n- `Animal.count += 1`은 Animal의 클래스 변수 → 객체 3개 → 3\n- `Dog.count`는 Dog에 없어 부모 Animal의 3을 읽는다\n- `pets[2].sound` → 인스턴스 변수 \"yip\", `Dog.sound` → \"woof\"\n- **함정 요약**: 부모 메서드가 부르는 메서드도 자식 클래스 것이 먼저다.\n- 일반 규칙\n  - 문자열 × 정수 → 반복 (\"ab\" * 2 = \"abab\")\n  - 속성·메서드 찾는 순서: 인스턴스 → 자기 클래스 → 부모 클래스 (MRO)\n  - super()는 부모 클래스의 메서드를 부른다"},{"id":"code-p018","subject":"code","topic":"Python","sub":"제너레이터 yield·next","type":"blank","level":2,"q":"다음 Python 프로그램이 \u003c실행 결과>처럼 출력되도록 ①, ②에 들어갈 알맞은 말을 쓰시오.","box":"**\u003c실행 결과>**\n```\n2 3\n[5, 7, 11, 13, 17, 19]\n[]\n```\n- ①은 파이썬 키워드, ②는 내장 함수 이름이다.","code":{"lang":"python","src":"def gen(limit):\n    n = 2\n    while n \u003c= limit:\n        for d in range(2, n):\n            if n % d == 0:\n                break\n        else:\n            ① n\n        n += 1\n\ng = gen(20
