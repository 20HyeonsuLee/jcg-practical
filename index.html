<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="정처기 실기">
<meta name="theme-color" content="#f6f6f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15171c" media="(prefers-color-scheme: dark)">
<title>정보처리기사 실기 문제풀이</title>
<style>
:root{
  --mark:#ffe08a99;
  --bg:#f6f6f3; --card:#fff; --text:#1f2328; --muted:#6b7280; --line:#e3e3df;
  --accent:#2457d6; --accent-weak:#e3ebfd; --ok:#167a3e; --ok-weak:#ddf5e5;
  --bad:#b42318; --bad-weak:#fde4e1; --mid:#a15c07; --mid-weak:#fdf0d5;
  --code-bg:#f2f2ef; --box-bg:#fbfbf9;
}
[data-theme=dark]{
  --mark:#8a6a0066;
  --bg:#15171c; --card:#1d2027; --text:#e7e7e7; --muted:#9aa1ad; --line:#2f343e;
  --accent:#7aa2ff; --accent-weak:#1f2d4d; --ok:#5fd38d; --ok-weak:#163323;
  --bad:#ff8a80; --bad-weak:#3d1d1b; --mid:#f5b94a; --mid-weak:#3a2e14;
  --code-bg:#242832; --box-bg:#1a1d23;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:15px/1.65 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
code,pre,textarea.mono{font-family:"SF Mono",Menlo,Consolas,"D2Coding",monospace}
.wrap{max-width:860px;margin:0 auto;padding:16px}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-top:10px;padding-bottom:10px}
header.top h1{font-size:16px;margin:0;font-weight:700;cursor:pointer;white-space:nowrap}
header.top .sp{flex:1}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.dday{color:var(--accent);border-color:var(--accent)}
.pill.timer{font-variant-numeric:tabular-nums}
.pill.timer.over{color:var(--bad);border-color:var(--bad)}
.iconbtn{background:none;border:1px solid var(--line);border-radius:8px;padding:3px 9px;font-size:13px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px;font-size:14px}
@media (hover:hover){.btn:hover{border-color:var(--accent)}}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
[data-theme=dark] .btn.primary,[data-theme=dark] .chip.on{color:#0d1b3a}
[data-theme=dark] .hero .btn.primary span{color:#1d2f5c}
.btn.ghost{background:none}
.btn.sm{padding:4px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.small{font-size:13px}
h2{font-size:18px;margin:22px 0 10px}
h3{font-size:15px;margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.hero{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px}
.hero .btn{padding:14px;text-align:left;border-radius:12px}
.hero .btn b{display:block;font-size:15px}
.hero .btn span{font-size:12px;color:var(--muted)}
.hero .btn.primary span{color:#dfe7ff}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.subj .head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.subj .cnt{font-size:12px;color:var(--muted)}
.bar{display:flex;height:6px;border-radius:4px;overflow:hidden;background:var(--line);margin:10px 0}
.bar i{display:block;height:100%}
.bar .o{background:var(--ok)} .bar .t{background:var(--mid)} .bar .x{background:var(--bad)}
.legend{font-size:12px;color:var(--muted)}
.topics{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px;display:none}
.topics.open{display:block}
.topic{display:flex;justify-content:space-between;align-items:center;padding:5px 6px;border-radius:8px;cursor:pointer;font-size:14px}
@media (hover:hover){.topic:hover{background:var(--accent-weak)}}
.topic .tc{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.opts{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:12px 0 4px}
.opts label{display:flex;gap:5px;align-items:center;cursor:pointer}
/* quiz */
.qmeta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.tag{font-size:12px;padding:1px 8px;border-radius:6px;background:var(--code-bg);color:var(--muted)}
.tag.past{background:var(--accent-weak);color:var(--accent)}
.tag.l3{background:var(--bad-weak);color:var(--bad)}
.tag.l2{background:var(--mid-weak);color:var(--mid)}
.qnum{font-weight:700;font-size:15px;margin-right:4px}
.qtext{font-size:16px;font-weight:600;margin:4px 0 12px}
.qtext p{margin:0}
.box{border:1px solid var(--text);border-radius:4px;padding:12px 14px;margin:10px 0;background:var(--box-bg)}
.box p{margin:2px 0}
.box ul,.explain ul{margin:4px 0;padding-left:20px}
.bogi{border:1px solid var(--text);border-radius:4px;padding:18px 14px 10px;margin:16px 0 10px;position:relative;background:var(--box-bg)}
.bogi .lbl{position:absolute;top:-11px;left:50%;transform:translateX(-50%);background:var(--card);padding:0 8px;font-weight:700;font-size:14px}
.bogi .items{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:2px 14px;font-size:14px}
.bogi.long .items{grid-template-columns:1fr}
.gap{height:6px}
table.md{border-collapse:collapse;margin:6px 0;font-size:14px}
table.md th,table.md td{border:1px solid var(--line);padding:4px 9px;text-align:left;vertical-align:top}
table.md th{background:var(--code-bg)}
pre.code{background:var(--code-bg);border-radius:8px;padding:12px 14px;overflow:auto;font-size:13.5px;line-height:1.55;margin:10px 0;tab-size:4}
code{background:var(--code-bg);padding:0 4px;border-radius:4px;font-size:.92em}
pre code{background:none;padding:0}
.ans{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.ansrow{display:flex;gap:8px;align-items:flex-start}
.ansrow .lb{min-width:34px;padding-top:7px;font-weight:600;color:var(--muted);font-size:14px}
.ansrow .field{flex:1}
.ansrow input,.ansrow textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font-size:15px}
.ansrow textarea{min-height:70px;resize:vertical}
.ansrow input:focus,.ansrow textarea:focus{outline:2px solid var(--accent-weak);border-color:var(--accent)}
.ansrow.ok input,.ansrow.ok textarea{border-color:var(--ok);background:var(--ok-weak)}
.ansrow.bad input,.ansrow.bad textarea{border-color:var(--bad);background:var(--bad-weak)}
.right{font-size:14px;margin-top:4px}
.right b{color:var(--ok)}
.right pre{margin:4px 0}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center}
.hint{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--mid-weak);color:var(--text);font-size:14px}
.explain{margin-top:14px;padding:12px 14px;border-radius:10px;background:var(--accent-weak);font-size:14px}
.explain p{margin:2px 0}
.explain .ttl{font-weight:700;margin-bottom:4px}
.model{margin-top:8px;padding:10px 12px;border-radius:10px;border:1px dashed var(--ok);font-size:14px}
.markbar{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;align-items:center}
.markbar .btn.o{border-color:var(--ok);color:var(--ok)} .markbar .btn.o.sel{background:var(--ok);color:#fff}
.markbar .btn.x{border-color:var(--bad);color:var(--bad)} .markbar .btn.x.sel{background:var(--bad);color:#fff}
.markbar .btn.t{border-color:var(--mid);color:var(--mid)} .markbar .btn.t.sel{background:var(--mid);color:#fff}
.markbar .sug{font-size:13px;color:var(--muted)}
.nav{display:flex;justify-content:space-between;margin-top:14px;gap:8px}
.dots{display:flex;flex-wrap:wrap;gap:4px;margin:10px 0 0}
.dot{width:24px;height:24px;border-radius:6px;border:1px solid var(--line);font-size:11px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);background:var(--card)}
.dot.cur{border-color:var(--accent);color:var(--accent);font-weight:700}
.dot.o{background:var(--ok-weak);color:var(--ok);border-color:var(--ok)}
.dot.x{background:var(--bad-weak);color:var(--bad);border-color:var(--bad)}
.dot.t{background:var(--mid-weak);color:var(--mid);border-color:var(--mid)}
.dot.a{background:var(--accent-weak)}
.progress{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin:4px 0 12px}
.progress i{display:block;height:100%;background:var(--accent)}
.score{font-size:30px;font-weight:800}
.reslist .it{display:flex;gap:10px;align-items:center;padding:7px 4px;border-bottom:1px solid var(--line);cursor:pointer;font-size:14px}
@media (hover:hover){.reslist .it:hover{background:var(--accent-weak)}}
.st{width:22px;text-align:center;font-weight:700}
.st.o{color:var(--ok)} .st.x{color:var(--bad)} .st.t{color:var(--mid)}
.kbd{font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 4px;color:var(--muted);margin-left:4px}
footer{margin:30px 0 40px;font-size:12px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}
footer a{color:var(--muted);cursor:pointer;text-decoration:underline}
/* ---------- 기기 대응 ---------- */
html{-webkit-text-size-adjust:100%}
button,.chip,.dot,.topic,.it{touch-action:manipulation}
header.top{padding-top:env(safe-area-inset-top)}
.wrap{padding-left:max(16px, env(safe-area-inset-left));padding-right:max(16px, env(safe-area-inset-right))}
main.wrap{padding-bottom:calc(28px + env(safe-area-inset-bottom))}
@media (hover:none){
  .kbd,.keyhint{display:none}
  .ansrow input,.ansrow textarea{font-size:16px}   /* iOS 입력 확대 방지 */
}
/* 한국어는 단어 중간에서 줄을 바꾸지 않는다 */
.doc,.qtext,.box,.explain,.hint,.model,.bogi{word-break:keep-all;overflow-wrap:break-word}
/* 아이폰 */
@media (max-width:640px){
  .doc table.md.stack,.doc table.md.stack tbody,.doc table.md.stack tr,.doc table.md.stack td{display:block;width:100%}
  .doc table.md.stack{border:0}
  .doc table.md.stack tr:first-child{display:none}
  .doc table.md.stack tr{border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:8px 0;background:var(--card)}
  .doc table.md.stack td{border:0;padding:1px 0;background:none!important}
  .doc table.md.stack td:first-child{font-size:15px;font-weight:700;padding-bottom:3px}
  .doc table.md.stack td:not(:first-child)::before{content:attr(data-th) " · ";color:var(--muted);font-size:12px}
  .doc table.md.stack td:empty{display:none}
  .wrap{padding-top:12px}
  header.top .wrap{gap:8px}
  .pill{font-size:11px;padding:1px 7px}
  .card{padding:14px;border-radius:12px}
  .btn{padding:10px 14px}
  .btn.sm{padding:7px 11px;font-size:13.5px}
  .qtext{font-size:15.5px}
  pre.code{font-size:12.5px;padding:10px 12px}
  table.md th,table.md td{padding:4px 7px}
  .actions .btn,.markbar .btn{flex:1}
  .markbar .sug{width:100%}
  .nav{position:sticky;bottom:0;z-index:3;background:var(--bg);margin:12px calc(-1 * max(16px, env(safe-area-inset-left))) 0;
       padding:8px max(16px, env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
  .nav .btn{flex:1}
  .dot{width:30px;height:30px;font-size:12px}
  .doc{font-size:15px}
  .doc table.md{font-size:12.5px}
  .sec h2{font-size:17.5px}
  .chip{font-size:13px;padding:5px 11px}
  .cv-head .row{width:100%}
  .cv-head .row .btn{flex:1}
}
/* 아이패드·데스크톱 */
@media (min-width:900px){
  .wrap{max-width:960px}
  body{font-size:16px}
  .qtext{font-size:17px}
  .doc{font-size:16.5px}
}
/* 넓은 화면(아이패드 가로 등): 개념 목차를 왼쪽 세로 목록으로 */
@media (min-width:1180px){
  .wrap.wide{max-width:1240px}
  .cv-body{display:grid;grid-template-columns:230px minmax(0,1fr);gap:32px;align-items:start}
  .cv-body .chips{flex-direction:column;flex-wrap:nowrap;overflow-x:hidden;overflow-y:auto;gap:2px;border-bottom:0;padding:4px 0;
                  top:calc(var(--hh,49px) + 12px);max-height:calc(100vh - var(--hh,49px) - 24px)}
  .cv-body .chip{white-space:normal;border-radius:8px;border-color:transparent;background:none;padding:6px 10px;font-size:13.5px}
  .cv-body .chip.on{background:var(--accent)}
  .cv-body .cprog{display:none}
}
@media (max-width:640px){
  .hero,.grid{grid-template-columns:1fr}
  header.top h1{font-size:14px}
  .kbd{display:none}
}
/* ---------- 개념 화면 ---------- */
.cv-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin:2px 0 4px}
.cv-title{font-size:18px}
.chips{position:sticky;top:var(--hh,49px);z-index:4;background:var(--bg);display:flex;gap:6px;overflow-x:auto;padding:8px 0;border-bottom:1px solid var(--line);scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;font-size:12.5px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);cursor:pointer;white-space:nowrap;background:var(--card);user-select:none}
.chip.seen{color:var(--text)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.cprog{position:sticky;top:calc(var(--hh,49px) + var(--ch,42px));z-index:4;height:3px;background:var(--line)}
.cprog i{display:block;height:100%;width:0;background:var(--accent)}
.doc .intro{color:var(--muted);font-size:14px;margin:10px 0 0}
.sec{padding:18px 0 12px;border-bottom:1px solid var(--line);scroll-margin-top:calc(var(--hh,49px) + var(--ch,42px) + 6px)}
.sec h2{margin:0 0 10px;font-size:19px;display:flex;align-items:center;gap:8px}
.sec h2::before{content:'';flex:0 0 4px;height:1.1em;border-radius:2px;background:var(--line)}
.sec.lv3 h2::before{background:var(--bad)} .sec.lv2 h2::before{background:var(--mid)} .sec.lv1 h2::before{background:var(--muted)}
.doc p{margin:4px 0}
.doc .ul{margin:4px 0}
.doc .li{position:relative;padding-left:16px;margin:2px 0}
.doc .li::before{content:'•';position:absolute;left:3px;color:var(--muted)}
.doc .li.d1{margin-left:16px} .doc .li.d2{margin-left:32px} .doc .li.d3{margin-left:48px}
.doc .li.d1::before,.doc .li.d2::before,.doc .li.d3::before{content:'◦'}
.doc .li.ol{padding-left:24px} .doc .li.ol::before{content:none}
.doc .li .n{position:absolute;left:0;color:var(--muted);font-variant-numeric:tabular-nums}
.doc .tw{overflow-x:auto}
/* 미출제: 흐리게, 누르면 보임. 보여도 흐린 글자로 남김 */
.doc tr.nx td,.doc .li.nx{filter:blur(4px);cursor:pointer;user-select:none;transition:filter .15s}
.doc tr.nx.show td,.doc .li.nx.show,body.nx-off .doc tr.nx td,body.nx-off .doc .li.nx{filter:none;user-select:auto;color:var(--muted)}
body.nx-off .doc tr.nx td,body.nx-off .doc .li.nx{cursor:auto}
.nxnote{font-size:12px;color:var(--muted);margin:6px 0 0}
.doc table.md{font-size:13.5px}
.doc .dh{font-size:15px;margin:12px 0 4px}
.doc hr{border:0;border-top:1px dashed var(--line);margin:12px 0}
.doc a{color:var(--accent)}
.doc img.dimg{display:block;max-width:100%;height:auto;border-radius:8px;border:1px solid var(--line);margin:8px 0;background:#fff}
.sec-q{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 2px}
.sec-q .btn{border-color:var(--accent);color:var(--accent);background:none}
.cv-end{margin:22px 0 40px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.keyhint{font-size:12px;color:var(--muted)}
.ov{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px}
/* 개념 노트 읽기 */
.doc{font-size:15.5px;line-height:1.72}
.doc b{background:linear-gradient(transparent 60%, var(--mark) 60%)}
.doc .dh{font-size:15.5px;margin:18px 0 6px}
.doc .dh b{background:none;border-bottom:2px solid var(--accent-weak);padding-bottom:1px}
.doc table.md tr:nth-child(even) td{background:var(--box-bg)}
.doc table.md td:first-child{font-weight:500}
.co{border-left:4px solid var(--line);background:var(--code-bg);border-radius:8px;padding:8px 12px;margin:10px 0}
.co-t{font-weight:700;font-size:14px;margin-bottom:2px}
.co .ul,.co p{margin:2px 0}
.co-tip{border-color:var(--ok);background:var(--ok-weak)}
.co-warning,.co-caution{border-color:var(--mid);background:var(--mid-weak)}
.co-example,.co-info,.co-note,.co-summary{border-color:var(--accent);background:var(--accent-weak)}
.co-danger,.co-important,.co-bug{border-color:var(--bad);background:var(--bad-weak)}
.doc blockquote{margin:8px 0;padding:4px 12px;border-left:3px solid var(--line);color:var(--muted)}
.doc .gc{font-size:13px;color:var(--muted);margin-top:10px}
.doc .gc b{background:none}
.gtag{display:inline-block;font-size:11px;line-height:18px;padding:0 6px;border-radius:4px;background:var(--accent-weak);color:var(--accent);margin-right:6px;font-weight:600}
/* 코드 하이라이트 */
.hk{color:#8250df} .hs{color:#0a7f3f} .hc{color:var(--muted);font-style:italic} .hn{color:#b35900}
[data-theme=dark] .hk{color:#c49bff} [data-theme=dark] .hs{color:#7ee2a8} [data-theme=dark] .hn{color:#ffb070}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <h1 id="home-link">정처기 실기 문제풀이</h1>
  <span class="pill dday" id="dday"></span>
  <span class="sp"></span>
  <span class="pill timer" id="timer" hidden></span>
  <button class="iconbtn" id="theme" title="테마">◐</button>
</div></header>
<main class="wrap" id="app"></main>

<script id="qdata" type="application/json">[{"id":"design-001","subject":"design","topic":"디자인 패턴","sub":"행위 패턴","type":"short","past":"2020-2","level":3,"q":"다음 설명에 해당하는 디자인 패턴을 영문 Full-Name으로 쓰시오.","box":"- 한 객체의 상태가 바뀌면 그 객체에 의존하는 다른 객체들에게 연락이 가고, 자동으로 내용이 갱신된다.\n- 일대다(1:N)의 의존성을 정의한다.\n- 상호작용하는 객체 사이에서는 가능하면 느슨하게 결합하는 설계를 쓴다.","answers":[{"label":"답","accept":["Observer","Observer Pattern"]}],"hint":"구독자 목록에 알림을 뿌린다","explain":"정답: Observer Pattern — '상태 변화 → 의존 객체들에 자동 통지·갱신, 1:N'\n- 주제(Subject)는 구독자(Observer) 목록만 알고 구체 클래스는 모른다 → 느슨한 결합\n- 별칭: 발행-구독(Publish-Subscribe), Dependents\n- 영문으로 쓰라는 문제다. 한글 '옵저버'만 쓰면 감점될 수 있다\n\n헷갈리는 이웃\n- Mediator: 여러 객체가 서로 얽힌 통신(N:M)을 중재자 하나로 모은다. Observer는 한 객체가 여럿에게 알리는 1:N\n- Chain of Responsibility: 처리할 객체를 찾을 때까지 요청을 넘긴다. 받는 쪽이 하나로 끝난다\n\n| 행위 패턴 | 한 줄 |\n|---|---|\n| Chain of Responsibility | 처리할 객체를 만날 때까지 요청을 사슬로 넘김 |\n| Command | 요청을 객체로 캡슐화 (큐잉, 로그, Undo) |\n| Interpreter | 언어 문법을 클래스로 표현해 해석 |\n| Iterator | 내부 구조를 드러내지 않고 순차 접근 |\n| Mediator | 객체 간 통신을 중재자 하나로 모음 (N:M → 1:N) |\n| Memento | 상태 스냅샷을 저장했다가 복원 (Undo) |\n| Observer | 상태 변화를 의존 객체들에 자동 통지 (1:N) |\n| State | 상태마다 클래스, 상태가 바뀌면 행위도 바뀜 |\n| Strategy | 알고리즘군을 캡슐화해 실행 중 교체 |\n| Template Method | 골격은 상위 클래스, 세부 단계는 하위 클래스 |\n| Visitor | 구조는 그대로, 새 연산을 외부 클래스로 추가 |"},{"id":"design-002","subject":"design","topic":"디자인 패턴","sub":"패턴 분류","type":"short","past":"2020-4","level":3,"q":"다음 ( )에 들어갈 알맞은 용어를 쓰시오.","box":"GoF(Gang of Four) 디자인 패턴은 목적(Purpose)에 따라 세 가지로 분류한다.\n- 생성 패턴(Creational Pattern)\n- 구조 패턴(Structural Pattern)\n- ( ) 패턴","answers":[{"label":"답","accept":["행위","Behavioral","행동","행위 패턴","Behavioral Pattern","행동 패턴"]}],"hint":"객체끼리 책임을 나누고 통신하는 방식","explain":"정답: 행위(Behavioral)\n- 생성: 객체를 어떻게 만들지 / 구조: 클래스·객체를 어떻게 조합할지 / 행위: 객체끼리 책임을 어떻게 나누고 통신할지\n- GoF 분류 기준은 두 가지다: 목적(생성·구조·행위)과 범위(클래스·객체)\n\n| 분류 | 패턴 |\n|---|---|\n| 생성 (5) | Singleton, Factory Method, Abstract Factory, Builder, Prototype |\n| 구조 (7) | Adapter, Bridge, Composite, Decorator, Facade, Flyweight, Proxy |\n| 행위 (11) | Chain of Responsibility, Command, Interpreter, Iterator, Mediator, Memento, Observer, State, Strategy, Template Method, Visitor |\n- 생성 5개와 구조 7개(알파벳 A·B·C·D·F·F·P)만 외우면 나머지 11개는 행위"},{"id":"design-003","subject":"design","topic":"디자인 패턴","sub":"패턴 분류","type":"short","past":"2021-2","level":3,"q":"다음 설명에 해당하는 디자인 패턴의 분류를 쓰시오.","box":"- 객체나 클래스 사이의 알고리즘이나 책임 분배에 관한 패턴이다.\n- 한 객체가 혼자 할 수 없는 작업을 여러 객체로 어떻게 나누는지, 객체 사이의 결합도를 어떻게 줄이는지에 중점을 둔다.\n- Interpreter, Observer, Command 패턴이 여기에 속한다.","answers":[{"label":"답","accept":["행위","Behavioral","행동","행위 패턴","Behavioral Pattern","행동 패턴"]}],"hint":"예시 패턴 셋이 모두 '생성'도 '구조'도 아니다","explain":"정답: 행위(Behavioral) — '책임 분배·상호작용' + Interpreter·Observer·Command\n- 같은 분류 문제가 2020-4, 2021-2, 2024-3에 나왔다. 단서는 '책임 분배', '상호작용', '알고리즘'\n\n소속이 헷갈리는 패턴\n| 패턴 | 분류 | 착각 이유 |\n|---|---|---|\n| Interpreter | 행위 | 이름이 구조처럼 들림 |\n| Iterator, Visitor | 행위 | 자료구조를 다뤄서 구조로 착각 |\n| Template Method | 행위 | 상속 구조라 구조로 착각 |\n| Facade, Flyweight, Proxy | 구조 | 동작을 대신해 줘서 행위로 착각 |\n| Builder, Prototype | 생성 | 조립·복제라 구조로 착각 |\n\n| 분류 | 패턴 |\n|---|---|\n| 생성 (5) | Singleton, Factory Method, Abstract Factory, Builder, Prototype |\n| 구조 (7) | Adapter, Bridge, Composite, Decorator, Facade, Flyweight, Proxy |\n| 행위 (11) | Chain of Responsibility, Command, Interpreter, Iterator, Mediator, Memento, Observer, State, Strategy, Template Method, Visitor |\n- 생성 5개와 구조 7개(알파벳 A·B·C·D·F·F·P)만 외우면 나머지 11개는 행위"},{"id":"design-004","subject":"design","topic":"디자인 패턴","sub":"패턴 분류","type":"blank","past":"2024-3","level":3,"q":"다음은 GoF 디자인 패턴을 목적에 따라 묶은 것이다. ( ① )~( ③ )에 들어갈 분류명을 쓰시오.","box":"| 분류 | 설명 | 패턴 |\n|---|---|---|\n| ( ① ) | 객체를 만드는 과정을 캡슐화해 어떤 객체를 만들지 유연하게 정한다 | Builder, Prototype, Singleton |\n| ( ② ) | 클래스나 객체를 조합해 더 큰 구조를 만든다 | Composite, Facade, Flyweight |\n| ( ③ ) | 객체 사이의 상호작용과 책임 분배를 다룬다 | Chain of Responsibility, Command, Observer |","answers":[{"label":"①","accept":["생성","Creational","생성 패턴","Creational Pattern"]},{"label":"②","accept":["구조","Structural","구조 패턴","Structural Pattern"]},{"label":"③","accept":["행위","Behavioral","행동","행위 패턴","Behavioral Pattern","행동 패턴"]}],"hint":"만들기 / 조합하기 / 주고받기","explain":"정답: ① 생성 ② 구조 ③ 행위\n- 2024-3 실제 문제는 ③만 물었다(Chain of Responsibility·Command·Observer가 속한 분류 → 행위)\n- 판별 순서: 생성 5개인지 → 구조 7개(A·B·C·D·F·F·P)인지 → 둘 다 아니면 행위\n\n| 분류 | 패턴 |\n|---|---|\n| 생성 (5) | Singleton, Factory Method, Abstract Factory, Builder, Prototype |\n| 구조 (7) | Adapter, Bridge, Composite, Decorator, Facade, Flyweight, Proxy |\n| 행위 (11) | Chain of Responsibility, Command, Interpreter, Iterator, Mediator, Memento, Observer, State, Strategy, Template Method, Visitor |\n- 생성 5개와 구조 7개(알파벳 A·B·C·D·F·F·P)만 외우면 나머지 11개는 행위"},{"id":"design-005","subject":"design","topic":"디자인 패턴","sub":"생성 패턴","type":"short","past":"2021-3","level":3,"q":"다음 설명에 해당하는 디자인 패턴을 쓰시오.","box":"- 상위 클래스에서 객체를 생성하는 인터페이스를 정의하지만, 어떤 클래스의 인스턴스를 만들지는 하위 클래스가 결정한다.\n- 상위 클래스 코드에 구체 클래스 이름을 감추기 위한 방법으로 쓴다.\n- 생성 패턴에 속한다.","answers":[{"label":"답","accept":["Factory Method","팩토리 메서드","팩토리 메소드","Factory Method Pattern","팩토리 메서드 패턴","팩토리 메소드 패턴"]}],"hint":"생성 책임을 하위 클래스의 메서드 하나로 미룬다","explain":"정답: Factory Method — '어떤 클래스를 만들지 하위 클래스가 결정'\n- 별칭: 가상 생성자(Virtual Constructor)\n- 상속으로 생성 메서드 하나를 재정의한다\n\n헷갈리는 이웃\n| 패턴 | 핵심 | 결과물 |\n|---|---|---|\n| Factory Method | 생성 메서드를 하위 클래스가 재정의 (상속) | 제품 하나 |\n| Abstract Factory | 팩토리 객체를 통째로 교체 (구성) | 관련 제품군 여러 개, 별칭 Kit |\n| Template Method | 알고리즘 골격은 상위, 단계는 하위 | 생성이 아니라 행위 |\n- Factory Method는 Template Method의 단계 하나가 '객체 생성'인 경우로 볼 수 있다\n\n| 생성 패턴 | 한 줄 |\n|---|---|\n| Singleton | 인스턴스 하나만 만들고 전역 접근점 제공 |\n| Factory Method | 무엇을 만들지 하위 클래스가 결정 (가상 생성자) |\n| Abstract Factory | 관련 객체 제품군을 구체 클래스 없이 생성 (Kit) |\n| Builder | 복잡한 객체를 단계별로 조립, 같은 과정으로 다른 표현 |\n| Prototype | 원형을 복제(clone)해서 생성 |"},{"id":"design-006","subject":"design","topic":"디자인 패턴","sub":"구조·행위 패턴","type":"blank","past":"2022-3","level":3,"q":"다음 설명에 해당하는 디자인 패턴을 쓰시오.","box":"( ① ): 기능의 클래스 계층과 구현의 클래스 계층을 연결하고, 구현부에서 추상 계층을 분리해 두 계층을 각자 독립적으로 변형·확장할 수 있게 한다.\n( ② ): 한 객체의 상태가 바뀌면 그 객체에 의존하는 다른 객체들에게 연락이 가고 자동으로 내용이 갱신되는 일대다 의존성을 가진다.","answers":[{"label":"①","accept":["Bridge","브리지","브릿지","Bridge Pattern","브리지 패턴","브릿지 패턴"]},{"label":"②","accept":["Observer","옵저버","옵서버","관찰자","Observer Pattern","옵저버 패턴","옵서버 패턴","관찰자 패턴"]}],"hint":"① 두 계층 사이에 놓는 다리 ② 구독","explain":"정답: ① Bridge ② Observer\n- Bridge 단서: '기능 계층 ↔ 구현 계층', '분리해 따로 확장'\n- Bridge 예: 도형(원·사각형) × 그리기 API(Windows·Linux). 상속으로 풀면 2×2 = 4개 클래스, Bridge면 2+2개\n- Bridge vs Adapter: Adapter는 이미 있는 맞지 않는 인터페이스를 나중에 맞춘다. Bridge는 처음부터 추상과 구현을 갈라 설계한다\n- 같은 조합이 2026-1에 다시 나왔다\n\n| 구조 패턴 | 한 줄 |\n|---|---|\n| Adapter | 맞지 않는 인터페이스를 변환 (Wrapper) |\n| Bridge | 기능 계층과 구현 계층을 분리해 따로 확장 |\n| Composite | 부분-전체 트리, 단일·복합 객체를 똑같이 다룸 |\n| Decorator | 같은 인터페이스로 감싸 기능을 동적으로 덧붙임 |\n| Facade | 복잡한 서브시스템 앞에 단순한 창구 하나 |\n| Flyweight | 같은 객체를 공유해 메모리 절약 |\n| Proxy | 대리 객체가 접근 제어·지연 생성 |\n- 구조 7개는 알파벳 순 A·B·C·D·F·F·P"},{"id":"design-007","subject":"design","topic":"디자인 패턴","sub":"구조·행위 패턴","type":"blank","past":"2026-1","level":3,"q":"다음 ( ㄱ ), ( ㄴ )에 해당하는 디자인 패턴을 \u003c보기>에서 골라 쓰시오.","box":"- ( ㄱ ) 패턴은 기능 클래스 계층과 구현 클래스 계층을 이어 주는 패턴으로, 두 계층을 분리해 서로 영향 없이 확장할 수 있게 한다.\n- ( ㄴ ) 패턴은 한 객체의 상태가 변하면 그 객체에 의존하는 객체들에게 변화를 알리는 패턴으로, 발행-구독 모델이라고도 한다.","options":["① Adapter","② Bridge","③ Decorator","④ Mediator","⑤ Observer","⑥ Strategy","⑦ Visitor"],"answers":[{"label":"ㄱ","accept":["②","Bridge","브리지","브릿지","Bridge Pattern","브리지 패턴","브릿지 패턴","② Bridge"]},{"label":"ㄴ","accept":["⑤","Observer","옵저버","옵서버","관찰자","Observer Pattern","옵저버 패턴","옵서버 패턴","관찰자 패턴","⑤ Observer"]}],"hint":"ㄱ 구조 패턴, ㄴ 행위 패턴","explain":"정답: ㄱ Bridge ㄴ Observer\n- 2022-3과 같은 정답이 다시 나왔다. 실제 시험은 보기 없이 빈칸만 있었다\n\n보기 속 오답과 구분\n| 보기 | 핵심 | 이 문제와 다른 점 |\n|---|---|---|\n| Adapter | 맞지 않는 인터페이스 변환 | 계층 분리가 아니라 사후 변환 |\n| Decorator | 감싸서 기능 추가 | 계층을 나누지 않는다 |\n| Mediator | 중재자 하나가 통신을 모음 | 알림이 아니라 중재 (N:M → 1:N) |\n| Strategy | 알고리즘 교체 | 상태 변화 통지가 아니다 |\n| Visitor | 구조에 새 연산 추가 | 통지와 무관 |"},{"id":"design-008","subject":"design","topic":"디자인 패턴","sub":"구조 패턴","type":"choice","past":"2023-1","level":3,"q":"다음 설명에 해당하는 디자인 패턴을 \u003c보기>에서 골라 쓰시오.","box":"- 다른 객체에 대한 접근을 제어하려고 그 객체의 대리자 역할을 하는 객체를 둔다.\n- 클라이언트의 호출을 중간에서 가로채 대신 처리하거나 실제 객체에 넘긴다.\n- 실제 객체가 필요한 시점까지 생성을 미루거나, 접근 권한을 검사하는 데 쓴다.","options":["ㄱ. Singleton","ㄴ. Factory Method","ㄷ. Builder","ㄹ. Prototype","ㅁ. Adapter","ㅂ. Bridge","ㅅ. Proxy","ㅇ. Decorator","ㅈ. Observer","ㅊ. Strategy","ㅋ. Visitor","ㅌ. Command"],"answers":[{"label":"답","accept":["ㅅ","Proxy","프록시","Proxy Pattern","프록시 패턴","ㅅ Proxy"]}],"hint":"실제 객체 앞을 지키는 문지기","explain":"정답: ㅅ Proxy — '대리 객체', '접근 제어', '생성 지연'\n- 종류: 가상 프록시(무거운 객체를 필요할 때 생성), 보호 프록시(접근 권한 검사), 원격 프록시(다른 주소 공간의 객체를 대신)\n- 별칭: Surrogate\n\n감싸는 패턴 셋 구분\n| 패턴 | 인터페이스 | 목적 |\n|---|---|---|\n| Proxy | 실제 객체와 같음 | 접근 제어·지연 생성 |\n| Decorator | 같음 | 기능 덧붙임, 여러 겹 감싸기 |\n| Adapter | 다름 → 바꿈 | 호환 안 되는 인터페이스 변환 |"},{"id":"design-009","subject":"design","topic":"디자인 패턴","sub":"구조 패턴","type":"short","past":"2025-2","level":3,"q":"다음 설명에 해당하는 디자인 패턴을 쓰시오.","box":"- 실제 객체에 직접 접근하지 않고 대리 객체를 거쳐 접근하게 하는 구조 패턴이다.\n- 대리 객체가 실제 객체에 대한 접근을 제어하거나 부가 기능을 수행한다.\n- 실제 객체의 생성을 필요한 시점까지 늦춰 자원을 아끼고, 실제 객체를 숨겨 정보 은닉을 강화한다.","answers":[{"label":"답","accept":["Proxy","프록시","Proxy Pattern","프록시 패턴"]}],"hint":"실제 객체 앞을 지키는 문지기","explain":"정답: Proxy — '대리 객체', '접근 제어', '생성 지연', '정보 은닉'\n- '부가 기능'만 보면 Decorator와 겹친다. 결정적 단서는 접근 제어와 생성 지연이다\n- 구분 질문: 실제 객체를 언제 만들고 누가 접근하게 할지 감싼 쪽이 정하는가? → Proxy. 기능을 겹겹이 더하는가? → Decorator\n- 2023-1(보기 12개 중 고르기)에 이어 두 번째 출제. 문어CBT 복원은 4지 보기(Proxy, Adapter, Observer, Builder)를 붙였다\n\n| 구조 패턴 | 한 줄 |\n|---|---|\n| Adapter | 맞지 않는 인터페이스를 변환 (Wrapper) |\n| Bridge | 기능 계층과 구현 계층을 분리해 따로 확장 |\n| Composite | 부분-전체 트리, 단일·복합 객체를 똑같이 다룸 |\n| Decorator | 같은 인터페이스로 감싸 기능을 동적으로 덧붙임 |\n| Facade | 복잡한 서브시스템 앞에 단순한 창구 하나 |\n| Flyweight | 같은 객체를 공유해 메모리 절약 |\n| Proxy | 대리 객체가 접근 제어·지연 생성 |\n- 구조 7개는 알파벳 순 A·B·C·D·F·F·P"},{"id":"design-010","subject":"design","topic":"디자인 패턴","sub":"생성·행위 패턴","type":"blank","past":"2023-2","level":3,"q":"다음 ( ① ), ( ② )에 해당하는 디자인 패턴을 \u003c보기>에서 골라 쓰시오.","box":"( ① ): 생성 요청이 여러 번 들어와도 객체는 처음 한 번만 만들고, 이후에는 이미 만든 그 객체를 돌려준다. 어디서든 그 하나의 객체에 접근할 수 있다.\n( ② ): 데이터 구조(원소 클래스)는 그대로 두고, 그 구조 위에서 수행할 새로운 연산을 별도의 클래스로 분리해 추가한다. 원소가 연산 객체를 받아들이는(accept) 방식이다.","options":["ㄱ. Singleton","ㄴ. Factory Method","ㄷ. Builder","ㄹ. Adapter","ㅁ. Bridge","ㅂ. Decorator","ㅅ. Observer","ㅇ. Strategy","ㅈ. Visitor"],"answers":[{"label":"①","accept":["ㄱ","Singleton","싱글톤","싱글턴","Singleton Pattern","싱글톤 패턴","싱글턴 패턴","ㄱ Singleton"]},{"label":"②","accept":["ㅈ","Visitor","비지터","방문자","Visitor Pattern","비지터 패턴","방문자 패턴","ㅈ Visitor"]}],"hint":"① 하나뿐 ② 방문해서 일을 하고 간다","explain":"정답: ① Singleton ② Visitor\n- Singleton 구현: 생성자를 private으로 막고, static 필드에 인스턴스 하나를 두고, getInstance()로 돌려준다\n- Visitor: 원소의 accept(visitor)가 visitor.visit(this)를 다시 부른다(더블 디스패치). 원소 클래스를 고치지 않고 연산만 늘린다\n- Visitor vs Iterator: Iterator는 '순회 방법'을 주고, Visitor는 '각 원소에 할 연산'을 밖에서 넣는다\n\n| 생성 패턴 | 한 줄 |\n|---|---|\n| Singleton | 인스턴스 하나만 만들고 전역 접근점 제공 |\n| Factory Method | 무엇을 만들지 하위 클래스가 결정 (가상 생성자) |\n| Abstract Factory | 관련 객체 제품군을 구체 클래스 없이 생성 (Kit) |\n| Builder | 복잡한 객체를 단계별로 조립, 같은 과정으로 다른 표현 |\n| Prototype | 원형을 복제(clone)해서 생성 |"},{"id":"design-011","subject":"design","topic":"디자인 패턴","sub":"생성 패턴","type":"short","past":"2024-1","level":3,"q":"다음 설명에 해당하는 디자인 패턴을 쓰시오.","box":"- 구체적인 클래스에 의존하지 않고, 서로 연관되거나 의존하는 객체들의 조합(제품군)을 만드는 인터페이스를 제공한다.\n- 관련된 서브 클래스들을 묶어 한꺼번에 교체할 수 있다.\n- 키트(Kit)라고도 부르며, 생성 패턴에 속한다.","answers":[{"label":"답","accept":["Abstract Factory","추상 팩토리","앱스트랙트 팩토리","Abstract Factory Pattern","추상 팩토리 패턴","앱스트랙트 팩토리 패턴"]}],"hint":"공장 자체를 갈아 끼우면 제품 묶음이 통째로 바뀐다","explain":"정답: Abstract Factory — '연관 객체 제품군', 'Kit'\n- 예: GUI 테마. WinFactory는 WinButton·WinCheckbox를, MacFactory는 MacButton·MacCheckbox를 만든다. 팩토리만 바꾸면 화면 전체 스타일이 바뀐다\n- Factory Method와 구분: FM은 제품 하나를 하위 클래스가 결정(상속), AF는 제품 여러 개를 묶은 팩토리 객체를 교체(구성)\n- 2026-2에 같은 패턴이 보기 선택형으로 다시 나왔다\n\n| 생성 패턴 | 한 줄 |\n|---|---|\n| Singleton | 인스턴스 하나만 만들고 전역 접근점 제공 |\n| Factory Method | 무엇을 만들지 하위 클래스가 결정 (가상 생성자) |\n| Abstract Factory | 관련 객체 제품군을 구체 클래스 없이 생성 (Kit) |\n| Builder | 복잡한 객체를 단계별로 조립, 같은 과정으로 다른 표현 |\n| Prototype | 원형을 복제(clone)해서 생성 |"},{"id":"design-012","subject":"design","topic":"디자인 패턴","sub":"생성 패턴","type":"choice","past":"2026-2","level":3,"q":"다음 설명에 해당하는 디자인 패턴을 \u003c보기>에서 골라 쓰시오.","box":"- 구체 클래스를 직접 지정하지 않고, 관련된 객체 제품군을 생성하는 인터페이스를 제공한다.\n- 팩토리 객체만 바꾸면 생성되는 제품군 전체가 한 번에 바뀐다.\n- 다른 이름으로 Kit라고 한다.","options":["ㄱ. Composite","ㄴ. Bridge","ㄷ. Abstract Factory","ㄹ. Adapter","ㅁ. Decorator"],"answers":[{"label":"답","accept":["ㄷ","Abstract Factory","추상 팩토리","앱스트랙트 팩토리","Abstract Factory Pattern","추상 팩토리 패턴","앱스트랙트 팩토리 패턴","ㄷ Abstract Factory"]}],"hint":"보기 중 생성 패턴은 하나뿐이다","explain":"정답: ㄷ Abstract Factory — '제품군', 'Kit'\n- 지문이 '생성'을 말하고 보기의 나머지 넷(Composite, Bridge, Adapter, Decorator)은 모두 구조 패턴이다. 분류만 알아도 풀린다\n- 2024-1 단답형과 같은 개념. 문어CBT 복원 기준 보기이고 chobopark는 보기 없는 단답으로 복원했다\n\n| 생성 패턴 | 한 줄 |\n|---|---|\n| Singleton | 인스턴스 하나만 만들고 전역 접근점 제공 |\n| Factory Method | 무엇을 만들지 하위 클래스가 결정 (가상 생성자) |\n| Abstract Factory | 관련 객체 제품군을 구체 클래스 없이 생성 (Kit) |\n| Builder | 복잡한 객체를 단계별로 조립, 같은 과정으로 다른 표현 |\n| Prototype | 원형을 복제(clone)해서 생성 |"},{"id":"design-013","subject":"design","topic":"디자인 패턴","sub":"행위 패턴","type":"choice","past":"2024-2","level":3,"q":"다음 설명에 해당하는 디자인 패턴을 \u003c보기>에서 골라 쓰시오.","box":"컬렉션(집합 객체)의 내부 표현 방식을 드러내지 않고, 그 안에 든 원소들에 차례로 접근하는 방법을 제공하는 패턴이다. 배열이든 리스트든 트리든 같은 방식(hasNext, next)으로 순회할 수 있다.","options":["ㄱ. Singleton","ㄴ. Factory Method","ㄷ. Abstract Factory","ㄹ. Adapter","ㅁ. Bridge","ㅂ. Composite","ㅅ. Iterator","ㅇ. Visitor","ㅈ. Observer"],"answers":[{"label":"답","accept":["ㅅ","Iterator","이터레이터","반복자","Iterator Pattern","이터레이터 패턴","반복자 패턴","ㅅ Iterator"]}],"hint":"for-each 문이 뒤에서 쓰는 것","explain":"정답: ㅅ Iterator — '내부 구조를 드러내지 않고 차례로 접근'\n- Java의 Iterator 인터페이스(hasNext, next), for-each 문이 이 패턴이다\n\n헷갈리는 이웃\n- Visitor: 원소마다 수행할 '연산'을 밖에서 추가한다. 순회 방법은 Iterator, 할 일은 Visitor\n- Composite: 부분-전체 트리 '구조'를 만든다. 그 트리를 도는 것은 Iterator\n\n| 행위 패턴 | 한 줄 |\n|---|---|\n| Chain of Responsibility | 처리할 객체를 만날 때까지 요청을 사슬로 넘김 |\n| Command | 요청을 객체로 캡슐화 (큐잉, 로그, Undo) |\n| Interpreter | 언어 문법을 클래스로 표현해 해석 |\n| Iterator | 내부 구조를 드러내지 않고 순차 접근 |\n| Mediator | 객체 간 통신을 중재자 하나로 모음 (N:M → 1:N) |\n| Memento | 상태 스냅샷을 저장했다가 복원 (Undo) |\n| Observer | 상태 변화를 의존 객체들에 자동 통지 (1:N) |\n| State | 상태마다 클래스, 상태가 바뀌면 행위도 바뀜 |\n| Strategy | 알고리즘군을 캡슐화해 실행 중 교체 |\n| Template Method | 골격은 상위 클래스, 세부 단계는 하위 클래스 |\n| Visitor | 구조는 그대로, 새 연산을 외부 클래스로 추가 |"},{"id":"design-014","subject":"design","topic":"디자인 패턴","sub":"구조 패턴","type":"choice","past":"2025-1","level":3,"q":"다음 설명에 해당하는 디자인 패턴을 \u003c보기>에서 골라 쓰시오.","box":"- 인터페이스가 서로 맞지 않아 함께 쓸 수 없는 클래스를 함께 동작하게 해 준다.\n- 기존 클래스(Adaptee)를 감싸서 클라이언트가 기대하는 인터페이스(Target)로 변환한다.\n- 기존 코드를 고치지 않고 재사용할 수 있다.","options":["① Singleton","② Factory Method","③ Abstract Factory","④ Builder","⑤ Prototype","⑥ Adapter","⑦ Bridge","⑧ Composite","⑨ Decorator","⑩ Facade","⑪ Strategy","⑫ Template Method","⑬ Observer","⑭ State","⑮ Command"],"answers":[{"label":"답","accept":["⑥","Adapter","어댑터","아답터","Adapter Pattern","어댑터 패턴","아답터 패턴","⑥ Adapter"]}],"hint":"110V 기기를 220V 콘센트에 꽂는 변환 플러그","explain":"정답: ⑥ Adapter — 'Adaptee', 'Target', '인터페이스 변환'\n- 구현 방식 두 가지: 클래스 어댑터(상속), 객체 어댑터(Adaptee를 필드로 갖는 합성)\n- 별칭: Wrapper (Decorator도 Wrapper라고 부른다)\n\n헷갈리는 이웃\n| 패턴 | 하는 일 |\n|---|---|\n| Adapter | 기존 인터페이스 1개를 원하는 인터페이스로 바꿈 |\n| Facade | 여러 서브시스템 앞에 단순한 새 창구를 둠 |\n| Bridge | 처음부터 추상과 구현을 갈라 설계 |\n| Decorator | 인터페이스는 그대로, 기능을 덧붙임 |"},{"id":"design-015","subject":"design","topic":"디자인 패턴","sub":"생성 패턴","type":"blank","level":3,"q":"다음은 생성 패턴에 대한 설명이다. ( ① ), ( ② )에 해당하는 패턴을 \u003c보기>에서 골라 쓰시오.","box":"( ① ): 복잡한 객체를 만드는 과정과 표현 방법을 분리해, 같은 생성 절차로 서로 다른 표현의 객체를 만든다. 부품을 하나씩 단계별로 조립한 뒤 마지막에 완성품을 돌려받는다.\n( ② ): 처음부터 새로 만들지 않고, 이미 있는 원형 객체를 복제(clone)해서 새 객체를 만든다. 생성 비용이 큰 객체를 여러 개 만들 때 쓴다.","options":["ㄱ. Singleton","ㄴ. Factory Method","ㄷ. Abstract Factory","ㄹ. Builder","ㅁ. Prototype","ㅂ. Composite"],"answers":[{"label":"①","accept":["ㄹ","Builder","빌더","Builder Pattern","빌더 패턴","ㄹ Builder"]},{"label":"②","accept":["ㅁ","Prototype","프로토타입","Prototype Pattern","프로토타입 패턴","ㅁ Prototype"]}],"hint":"① 단계별 조립 ② 복사","explain":"정답: ① Builder ② Prototype\n- Builder 단서: '단계별', '같은 생성 절차로 다른 표현'. 예: new Pizza.Builder().dough().sauce().build()\n- Prototype 단서: '원형', '복제(clone)'. Java의 Cloneable, clone()\n- Builder vs Abstract Factory: Builder는 '한 객체'를 여러 단계로 조립해 마지막에 돌려준다. AF는 '여러 객체(제품군)'를 바로바로 만든다\n\n| 생성 패턴 | 한 줄 |\n|---|---|\n| Singleton | 인스턴스 하나만 만들고 전역 접근점 제공 |\n| Factory Method | 무엇을 만들지 하위 클래스가 결정 (가상 생성자) |\n| Abstract Factory | 관련 객체 제품군을 구체 클래스 없이 생성 (Kit) |\n| Builder | 복잡한 객체를 단계별로 조립, 같은 과정으로 다른 표현 |\n| Prototype | 원형을 복제(clone)해서 생성 |"},{"id":"design-016","subject":"design","topic":"디자인 패턴","sub":"구조 패턴","type":"blank","level":3,"q":"다음은 구조 패턴에 대한 설명이다. ( ① )~( ③ )에 해당하는 패턴을 \u003c보기>에서 골라 쓰시오.","box":"( ① ): 객체들을 트리 구조로 구성해 부분-전체 계층을 표현한다. 파일과 폴더처럼 단일 객체와 복합 객체를 클라이언트가 똑같이 다룰 수 있다.\n( ② ): 복잡하게 얽힌 여러 서브시스템 앞에 통합된 단순한 인터페이스(창구) 하나를 둔다. 클라이언트는 이 창구만 알면 된다.\n( ③ ): 같은 내용을 가진 객체를 매번 새로 만들지 않고 공유해서 재사용한다. 작은 객체가 대량으로 필요할 때 메모리 사용량을 줄인다.","options":["ㄱ. Adapter","ㄴ. Bridge","ㄷ. Composite","ㄹ. Decorator","ㅁ. Facade","ㅂ. Flyweight","ㅅ. Proxy"],"answers":[{"label":"①","accept":["ㄷ","Composite","컴포지트","Composite Pattern","컴포지트 패턴","ㄷ Composite"]},{"label":"②","accept":["ㅁ","Facade","퍼사드","파사드","Façade","Facade Pattern","퍼사드 패턴","파사드 패턴","Façade 패턴","ㅁ Facade"]},{"label":"③","accept":["ㅂ","Flyweight","플라이웨이트","Flyweight Pattern","플라이웨이트 패턴","ㅂ Flyweight"]}],"hint":"① 트리 ② 건물 정면 ③ 가벼운 체급","explain":"정답: ① Composite ② Facade ③ Flyweight\n- Composite: Leaf와 Composite가 같은 Component 인터페이스를 구현한다. 폴더 크기 = 안에 든 파일·폴더 크기의 합(재귀)\n- Facade: 홈시어터 '영화 보기' 버튼 하나가 조명·스크린·앰프·플레이어를 차례로 켠다\n- Flyweight: 워드 문서의 글자 'a' 객체 하나를 수천 번 공유하고, 위치 같은 바뀌는 값만 밖에서 넘긴다\n- Composite vs Decorator: 둘 다 같은 인터페이스로 감싸지만 Composite는 자식이 여럿(부분-전체), Decorator는 감싸는 대상이 하나이고 기능을 더한다\n\n| 구조 패턴 | 한 줄 |\n|---|---|\n| Adapter | 맞지 않는 인터페이스를 변환 (Wrapper) |\n| Bridge | 기능 계층과 구현 계층을 분리해 따로 확장 |\n| Composite | 부분-전체 트리, 단일·복합 객체를 똑같이 다룸 |\n| Decorator | 같은 인터페이스로 감싸 기능을 동적으로 덧붙임 |\n| Facade | 복잡한 서브시스템 앞에 단순한 창구 하나 |\n| Flyweight | 같은 객체를 공유해 메모리 절약 |\n| Proxy | 대리 객체가 접근 제어·지연 생성 |\n- 구조 7개는 알파벳 순 A·B·C·D·F·F·P"},{"id":"design-017","subject":"design","topic":"디자인 패턴","sub":"구조 패턴","type":"choice","level":3,"q":"다음 설명에 해당하는 디자인 패턴을 \u003c보기>에서 골라 쓰시오.","box":"- 기존 객체를 수정하지 않고, 같은 인터페이스를 가진 객체로 감싸서 기능을 동적으로 덧붙인다.\n- 감싸기를 여러 겹 겹쳐 기능을 조합할 수 있어, 상속으로 기능을 늘릴 때 생기는 클래스 폭발을 막는다.\n- 예: 커피 객체를 우유 객체로 감싸고, 다시 시럽 객체로 감싸 최종 가격을 계산한다.","options":["ㄱ. Adapter","ㄴ. Proxy","ㄷ. Decorator","ㄹ. Composite","ㅁ. Facade","ㅂ. Bridge"],"answers":[{"label":"답","accept":["ㄷ","Decorator","데코레이터","Decorator Pattern","데코레이터 패턴","ㄷ Decorator"]}],"hint":"케이크 장식을 한 겹씩 올린다","explain":"정답: ㄷ Decorator — '감싸서 기능을 동적으로 추가', '여러 겹'\n- Java 입출력: new BufferedReader(new InputStreamReader(System.in)) 가 Decorator다\n\n감싸는 패턴 넷 구분\n| 패턴 | 감싼 뒤 인터페이스 | 목적 |\n|---|---|---|\n| Decorator | 같음 | 기능 추가, 겹겹이 |\n| Proxy | 같음 | 접근 제어·지연 생성 |\n| Adapter | 다름 | 인터페이스 변환 |\n| Composite | 같음 | 자식 여럿을 트리로 묶음 |"},{"id":"design-018","subject":"design","topic":"디자인 패턴","sub":"행위 패턴","type":"blank","level":3,"q":"다음은 '바뀌는 행위'를 다루는 행위 패턴들이다. ( ① )~( ③ )에 해당하는 패턴을 쓰시오.","box":"( ① ): 자판기는 '동전 없음', '동전 있음', '품절' 상태에 따라 같은 버튼 입력에도 다르게 동작한다. 상태마다 클래스를 만들고, 객체의 내부 상태가 바뀌면 행위도 바뀌게 한다. 상태 전환은 객체 스스로 한다.\n( ② ): 정렬 프로그램이 퀵 정렬·병합 정렬 알고리즘을 각각 캡슐화해 두고, 실행 중에 클라이언트가 원하는 알고리즘 객체로 바꿔 끼운다.\n( ③ ): 상위 클래스에 알고리즘의 골격(처리 순서)을 정의하고, 세부 단계 몇 개만 하위 클래스가 재정의한다.","answers":[{"label":"①","accept":["State","스테이트","상태","State Pattern","스테이트 패턴","상태 패턴"]},{"label":"②","accept":["Strategy","스트래티지","전략","Strategy Pattern","스트래티지 패턴","전략 패턴"]},{"label":"③","accept":["Template Method","템플릿 메서드","템플릿 메소드","Template Method Pattern","템플릿 메서드 패턴","템플릿 메소드 패턴"]}],"hint":"① 자판기 모드가 스스로 바뀐다 ② 갈아 끼우는 알고리즘 ③ 틀은 부모가","explain":"정답: ① State ② Strategy ③ Template Method\n| 패턴 | 무엇이 바뀌나 | 누가 바꾸나 | 방식 |\n|---|---|---|---|\n| State | 상태에 따른 행위 | 객체 내부 (상태 전이) | 구성(위임) |\n| Strategy | 알고리즘 전체 | 클라이언트가 선택 | 구성(위임) |\n| Template Method | 알고리즘의 일부 단계 | 하위 클래스 | 상속 |\n- State와 Strategy는 클래스 다이어그램이 거의 같다. 단서는 '상태 전이'(State)인지 '알고리즘 교체·선택'(Strategy)인지\n- Strategy 별칭: Policy\n\n| 행위 패턴 | 한 줄 |\n|---|---|\n| Chain of Responsibility | 처리할 객체를 만날 때까지 요청을 사슬로 넘김 |\n| Command | 요청을 객체로 캡슐화 (큐잉, 로그, Undo) |\n| Interpreter | 언어 문법을 클래스로 표현해 해석 |\n| Iterator | 내부 구조를 드러내지 않고 순차 접근 |\n| Mediator | 객체 간 통신을 중재자 하나로 모음 (N:M → 1:N) |\n| Memento | 상태 스냅샷을 저장했다가 복원 (Undo) |\n| Observer | 상태 변화를 의존 객체들에 자동 통지 (1:N) |\n| State | 상태마다 클래스, 상태가 바뀌면 행위도 바뀜 |\n| Strategy | 알고리즘군을 캡슐화해 실행 중 교체 |\n| Template Method | 골격은 상위 클래스, 세부 단계는 하위 클래스 |\n| Visitor | 구조는 그대로, 새 연산을 외부 클래스로 추가 |"},{"id":"design-019","subject":"design","topic":"디자인 패턴","sub":"행위 패턴","type":"blank","level":3,"q":"다음 ( ① )~( ⑤ )에 해당하는 행위 패턴을 \u003c보기>에서 골라 쓰시오.","box":"( ① ): 요청을 처리할 수 있는 객체들을 사슬처럼 연결해 두고, 요청을 처리할 객체를 만날 때까지 다음 객체로 넘긴다.\n( ② ): 요청 자체를 객체로 캡슐화해 요청을 큐에 쌓거나 로그로 남기고, 실행 취소(Undo)를 지원한다.\n( ③ ): 간단한 언어의 문법 규칙을 클래스로 표현하고, 그 언어로 쓰인 문장을 해석한다.\n( ④ ): 여러 객체가 서로 직접 참조하지 않고 중간의 한 객체를 거쳐 통신하게 해, 객체 사이의 복잡한 N:M 관계를 1:N으로 줄인다.\n( ⑤ ): 캡슐화를 깨지 않고 객체의 내부 상태를 스냅샷으로 저장해 두었다가, 나중에 그 상태로 되돌린다.","options":["ㄱ. Chain of Responsibility","ㄴ. Command","ㄷ. Interpreter","ㄹ. Iterator","ㅁ. Mediator","ㅂ. Memento","ㅅ. Observer","ㅇ. Visitor"],"answers":[{"label":"①","accept":["ㄱ","Chain of Responsibility","책임 연쇄","Chain of Responsibility Pattern","책임 연쇄 패턴","ㄱ Chain of Responsibility"]},{"label":"②","accept":["ㄴ","Command","커맨드","명령","Command Pattern","커맨드 패턴","명령 패턴","ㄴ Command"]},{"label":"③","accept":["ㄷ","Interpreter","인터프리터","해석자","Interpreter Pattern","인터프리터 패턴","해석자 패턴","ㄷ Interpreter"]},{"label":"④","accept":["ㅁ","Mediator","미디에이터","중재자","Mediator Pattern","미디에이터 패턴","중재자 패턴","ㅁ Mediator"]},{"label":"⑤","accept":["ㅂ","Memento","메멘토","Memento Pattern","메멘토 패턴","ㅂ Memento"]}],"hint":"① 결재 라인 ② 요청 한 건 = 객체 하나 ③ 문법 규칙 = 클래스 ④ 관제탑 ⑤ 스냅샷 금고","explain":"정답: ① Chain of Responsibility ② Command ③ Interpreter ④ Mediator ⑤ Memento\n- Undo 짝 구분: Command는 '한 일'을 객체로 기록해 역연산으로 되돌린다. Memento는 '그때 상태'를 통째로 저장해 복원한다\n- Mediator vs Observer: Mediator는 중재자가 양방향 통신을 조율(관제탑). Observer는 주제가 구독자에게 한 방향으로 알린다\n- Chain of Responsibility 예: 결재 라인(팀장 → 부장 → 이사), 예외 처리 catch 사슬\n\n| 행위 패턴 | 한 줄 |\n|---|---|\n| Chain of Responsibility | 처리할 객체를 만날 때까지 요청을 사슬로 넘김 |\n| Command | 요청을 객체로 캡슐화 (큐잉, 로그, Undo) |\n| Interpreter | 언어 문법을 클래스로 표현해 해석 |\n| Iterator | 내부 구조를 드러내지 않고 순차 접근 |\n| Mediator | 객체 간 통신을 중재자 하나로 모음 (N:M → 1:N) |\n| Memento | 상태 스냅샷을 저장했다가 복원 (Undo) |\n| Observer | 상태 변화를 의존 객체들에 자동 통지 (1:N) |\n| State | 상태마다 클래스, 상태가 바뀌면 행위도 바뀜 |\n| Strategy | 알고리즘군을 캡슐화해 실행 중 교체 |\n| Template Method | 골격은 상위 클래스, 세부 단계는 하위 클래스 |\n| Visitor | 구조는 그대로, 새 연산을 외부 클래스로 추가 |"},{"id":"design-020","subject":"design","topic":"응집도·결합도","sub":"모듈 독립성","type":"blank","past":"2020-1","level":3,"q":"다음 ( ① ), ( ② )에 들어갈 알맞은 용어를 쓰시오.","box":"공통 모듈을 구현할 때는 재사용성을 높이고 다른 모듈에 주는 영향을 줄이기 위해 모듈의 독립성을 높여야 한다. 이를 위해 모듈 사이의 ( ① )는 줄이고, 개별 모듈 내부 기능들 사이의 ( ② )는 높이는 것이 좋다.","answers":[{"label":"①","accept":["결합도","Coupling"]},{"label":"②","accept":["응집도","Cohesion"]}],"hint":"① 모듈 '사이' ② 모듈 '안'","explain":"정답: ① 결합도(Coupling) ② 응집도(Cohesion)\n- 결합도: 모듈 사이의 의존 정도 → 낮을수록 좋다\n- 응집도: 모듈 안 요소들이 한 목적으로 뭉친 정도 → 높을수록 좋다\n- 순서를 바꿔 쓰면 틀린다. '사이 = 결합, 안 = 응집'\n\n효과적인 모듈 설계\n- 결합도는 낮추고 응집도는 높여 독립성을 높인다\n- 복잡도와 중복을 줄이고 일관성을 지킨다\n- fan-in은 높게(재사용), fan-out은 낮게(한 모듈이 너무 많이 부르지 않게)\n- 모듈은 입구 하나, 출구 하나\n- 모듈 크기는 기능과 구조를 이해하기 쉬운 정도로 나눈다\n\n| 순서 | 응집도 | 판별 단서 |\n|---|---|---|\n| 강 1 | 기능적 | 단일 목적, 하나의 기능만 수행 |\n| 2 | 순차적 | 앞 활동의 출력 = 다음 활동의 입력 |\n| 3 | 교환적(통신적) | 같은 입력·출력 데이터를 쓰는 서로 다른 기능 |\n| 4 | 절차적 | 데이터 연결 없이 정해진 순서대로 수행 |\n| 5 | 시간적 | 같은 시점에 실행 (초기화, 종료 처리) |\n| 6 | 논리적 | 비슷한 성격끼리 묶고 플래그·case로 골라 실행 |\n| 약 7 | 우연적 | 서로 관련 없음 |\n- 강→약 '기순교절시논우', 약→강 '우논시절교순기'\n\n| 순서 | 결합도 | 판별 단서 |\n|---|---|---|\n| 약 1 | 자료 | 필요한 값(파라미터)만 주고받음 |\n| 2 | 스탬프 | 배열·레코드·구조체 같은 자료 구조를 통째로 넘김 |\n| 3 | 제어 | 플래그 같은 제어 요소로 상대 모듈의 처리 흐름을 정함 |\n| 4 | 외부 | 외부에 선언된 데이터, 외부에서 정한 형식·프로토콜을 함께 씀 |\n| 5 | 공통 | 전역 변수(공통 데이터 영역)를 함께 참조·갱신 |\n| 강 6 | 내용 | 다른 모듈의 내부 자료·코드를 직접 참조·수정 |\n- 약→강 '자스제외공내', 강→약 '내공외제스자'"},{"id":"design-021","subject":"design","topic":"응집도·결합도","sub":"fan-in·fan-out","type":"calc","past":"2020-1","level":3,"q":"다음은 모듈 간 호출 관계를 나타낸 것이다. fan-in이 2 이상인 모듈을 모두 쓰시오. (빈칸 하나에 모듈 하나)","box":"화살표는 호출 방향(상위 → 하위)이다.\n\n| 호출하는 모듈 | 호출받는 모듈 |\n|---|---|\n| A | B, C, D |\n| B | E, F |\n| C | F, G |\n| D | J |\n| E | H |\n| F | H |\n| G | I |","anyOrder":true,"answers":[{"label":"①","accept":["F"]},{"label":"②","accept":["H"]}],"hint":"'호출받는 모듈' 열에 두 번 이상 나오는 이름을 센다","explain":"정답: F, H\n1. fan-in = 나를 호출하는 상위 모듈 수 = 들어오는 화살표 수\n2. 모듈별 fan-in: B 1(A), C 1(A), D 1(A), E 1(B), **F 2(B, C)**, G 1(C), J 1(D), **H 2(E, F)**, I 1(G), A 0\n3. 2 이상 → F, H\n- 출처마다 그림 복원이 다름: 다른 복원본(J가 G·H에서 호출되는 그림)에서는 F, J가 답이다. 개수 세는 방법은 같다\n\n| 용어 | 뜻 | 세는 법 |\n|---|---|---|\n| fan-in | 나를 호출하는 모듈 수 | 들어오는 화살표 |\n| fan-out | 내가 호출하는 모듈 수 | 나가는 화살표 |\n- fan-in이 높다 = 재사용이 많다(좋음, 대신 바꿀 때 영향이 큼). fan-out이 높다 = 책임이 몰렸다(분리 검토)"},{"id":"design-022","subject":"design","topic":"응집도·결합도","sub":"fan-in·fan-out","type":"calc","past":"2022-2","level":3,"q":"다음 모듈 구조에서 모듈 F의 fan-in과 fan-out을 구하시오.","box":"화살표는 호출 방향(상위 → 하위)이다.\n\n| 호출하는 모듈 | 호출받는 모듈 |\n|---|---|\n| A | D, F |\n| B | E, F |\n| C | F |\n| D | G, H |\n| E | H |\n| F | G, H |","answers":[{"label":"fan-in","accept":["3"]},{"label":"fan-out","accept":["2"]}],"hint":"F로 들어오는 줄과 F에서 나가는 줄을 따로 센다","explain":"정답: fan-in 3, fan-out 2\n1. F를 호출하는 모듈: A, B, C → fan-in 3\n2. F가 호출하는 모듈: G, H → fan-out 2\n- 함정: G·H는 D, E도 부른다. F의 fan-out에는 F가 직접 부르는 것만 센다\n- 참고로 H의 fan-in은 3(D, E, F), G의 fan-in은 2(D, F)\n- 설계 지침: 복잡도를 낮추려면 fan-in은 높이고 fan-out은 낮춘다"},{"id":"design-023","subject":"design","topic":"응집도·결합도","sub":"결합도","type":"blank","past":"2021-1","level":3,"q":"다음 설명에 해당하는 결합도를 \u003c보기>에서 골라 쓰시오.","box":"( ① ): 한 모듈이 다른 모듈의 내부 기능 및 그 내부 자료를 직접 참조하거나 수정한다.\n( ② ): 두 모듈이 배열·레코드·구조체 같은 자료 구조를 인터페이스로 주고받는다.\n( ③ ): 파라미터가 아닌 모듈 밖에 선언된 전역 변수를 참조하고 갱신하며 상호작용한다.","options":["ㄱ. 자료 결합도","ㄴ. 스탬프 결합도","ㄷ. 제어 결합도","ㄹ. 공통 결합도","ㅁ. 내용 결합도","ㅂ. 외부 결합도"],"answers":[{"label":"①","accept":["ㅁ","내용 결합도","내용","Content Coupling","Content","ㅁ 내용 결합도"]},{"label":"②","accept":["ㄴ","스탬프 결합도","스탬프","Stamp Coupling","Stamp","ㄴ 스탬프 결합도"]},{"label":"③","accept":["ㄹ","공통 결합도","공통","Common Coupling","Common","ㄹ 공통 결합도"]}],"hint":"① 남의 속을 직접 ② 구조체째 ③ 전역","explain":"정답: ① 내용 결합도 ② 스탬프 결합도 ③ 공통 결합도\n- 스탬프 vs 자료: 자료 구조를 통째로 넘기면 스탬프, 필요한 값만 넘기면 자료\n- 공통 vs 외부: 전역 변수(공통 데이터 영역)를 함께 쓰면 공통, 외부에서 정한 데이터 형식·프로토콜을 함께 따르면 외부\n- 2025-1에 같은 보기·같은 답으로 다시 나왔다\n\n| 순서 | 결합도 | 판별 단서 |\n|---|---|---|\n| 약 1 | 자료 | 필요한 값(파라미터)만 주고받음 |\n| 2 | 스탬프 | 배열·레코드·구조체 같은 자료 구조를 통째로 넘김 |\n| 3 | 제어 | 플래그 같은 제어 요소로 상대 모듈의 처리 흐름을 정함 |\n| 4 | 외부 | 외부에 선언된 데이터, 외부에서 정한 형식·프로토콜을 함께 씀 |\n| 5 | 공통 | 전역 변수(공통 데이터 영역)를 함께 참조·갱신 |\n| 강 6 | 내용 | 다른 모듈의 내부 자료·코드를 직접 참조·수정 |\n- 약→강 '자스제외공내', 강→약 '내공외제스자'"},{"id":"design-024","subject":"design","topic":"응집도·결합도","sub":"결합도","type":"blank","past":"2025-1","level":3,"q":"다음 사례에 해당하는 결합도를 \u003c보기>에서 골라 쓰시오.","box":"( ① ): 모듈 A가 모듈 B 안의 지역 변수 count를 직접 바꾸고, B의 코드 중간 위치로 바로 분기한다.\n( ② ): 주소 출력 모듈에 학생 레코드(학번·이름·주소·연락처) 전체를 넘기지만, 받는 쪽은 주소 필드만 쓴다.\n( ③ ): 여러 모듈이 전역 변수 config를 함께 읽고 고친다. 한 모듈이 값을 바꾸면 다른 모듈의 동작이 달라진다.","options":["ㄱ. 자료 결합도","ㄴ. 스탬프 결합도","ㄷ. 제어 결합도","ㄹ. 공통 결합도","ㅁ. 내용 결합도","ㅂ. 외부 결합도"],"answers":[{"label":"①","accept":["ㅁ","내용 결합도","내용","Content Coupling","Content","ㅁ 내용 결합도"]},{"label":"②","accept":["ㄴ","스탬프 결합도","스탬프","Stamp Coupling","Stamp","ㄴ 스탬프 결합도"]},{"label":"③","accept":["ㄹ","공통 결합도","공통","Common Coupling","Common","ㄹ 공통 결합도"]}],"hint":"2021-1과 같은 세 가지를 사례로 바꿨다","explain":"정답: ① 내용 ② 스탬프 ③ 공통\n- 2025-1 실제 문제는 2021-1과 같은 정의 문장(내부 직접 참조 / 자료 구조 전달 / 전역 변수)이었다. 여기서는 사례로 바꿔 물었다\n- ② 결합도를 낮추려면 주소 값만 넘긴다 → 자료 결합도\n- ③ 결합도를 낮추려면 config 값을 매개변수로 넘긴다\n\n| 순서 | 결합도 | 판별 단서 |\n|---|---|---|\n| 약 1 | 자료 | 필요한 값(파라미터)만 주고받음 |\n| 2 | 스탬프 | 배열·레코드·구조체 같은 자료 구조를 통째로 넘김 |\n| 3 | 제어 | 플래그 같은 제어 요소로 상대 모듈의 처리 흐름을 정함 |\n| 4 | 외부 | 외부에 선언된 데이터, 외부에서 정한 형식·프로토콜을 함께 씀 |\n| 5 | 공통 | 전역 변수(공통 데이터 영역)를 함께 참조·갱신 |\n| 강 6 | 내용 | 다른 모듈의 내부 자료·코드를 직접 참조·수정 |\n- 약→강 '자스제외공내', 강→약 '내공외제스자'"},{"id":"design-025","subject":"design","topic":"응집도·결합도","sub":"결합도","type":"short","past":"2021-3","level":3,"q":"다음 설명에 해당하는 결합도를 영문으로 쓰시오.","box":"- 어떤 모듈이 다른 모듈의 내부 논리 흐름을 조정하려고 제어 신호(플래그 등)를 이용하여 통신하는 결합도이다.\n- 하위 모듈에서 상위 모듈로 제어 신호가 이동하여, 하위 모듈이 상위 모듈에게 처리를 지시하는 권리 전도 현상이 생길 수 있다.","answers":[{"label":"답","accept":["Control Coupling","Control"]}],"hint":"flag, switch","explain":"정답: Control Coupling (제어 결합도)\n- 단서: '제어 신호', '논리 흐름 조정', '권리 전도'\n- 영문으로 쓰라는 문제다. 결합도 영문: Data, Stamp, Control, External, Common, Content\n- 2024-2에 '( ) Coupling' 빈칸으로 다시 나왔다\n\n| 순서 | 결합도 | 판별 단서 |\n|---|---|---|\n| 약 1 | 자료 | 필요한 값(파라미터)만 주고받음 |\n| 2 | 스탬프 | 배열·레코드·구조체 같은 자료 구조를 통째로 넘김 |\n| 3 | 제어 | 플래그 같은 제어 요소로 상대 모듈의 처리 흐름을 정함 |\n| 4 | 외부 | 외부에 선언된 데이터, 외부에서 정한 형식·프로토콜을 함께 씀 |\n| 5 | 공통 | 전역 변수(공통 데이터 영역)를 함께 참조·갱신 |\n| 강 6 | 내용 | 다른 모듈의 내부 자료·코드를 직접 참조·수정 |\n- 약→강 '자스제외공내', 강→약 '내공외제스자'"},{"id":"design-026","subject":"design","topic":"응집도·결합도","sub":"결합도","type":"short","past":"2024-2","level":3,"q":"다음 설명과 코드에 해당하는 결합도가 되도록 빈칸에 들어갈 단어를 쓰시오.","box":"다른 모듈의 내부 논리 흐름을 제어하려고 제어 요소를 전달하는 결합도를 ( ) Coupling이라고 한다.","code":{"lang":"c","src":"void print(int data[], int n, int mode) {\n    if (mode == 1) { /* 오름차순으로 출력 */ }\n    else           { /* 내림차순으로 출력 */ }\n}\n\nint main(void) {\n    int a[3] = {3, 1, 2};\n    print(a, 3, 1);   /* mode 값이 print의 처리 흐름을 정한다 */\n    return 0;\n}"},"answers":[{"label":"답","accept":["Control","제어","Control Coupling","제어 결합도"]}],"hint":"mode가 데이터인가, 지시인가","explain":"정답: Control (제어 결합도)\n- mode는 계산에 쓰는 값이 아니라 print가 '어느 쪽으로 돌지' 정하는 지시다 → 제어 결합도\n- 낮추는 법: printAsc(data, n), printDesc(data, n)로 나누면 값만 넘기는 자료 결합도가 된다\n- 배열 a는 자료 구조라서 스탬프 결합도로 보는 시각도 있지만, 이 문제의 핵심 단서는 제어 요소(mode)다\n\n| 순서 | 결합도 | 판별 단서 |\n|---|---|---|\n| 약 1 | 자료 | 필요한 값(파라미터)만 주고받음 |\n| 2 | 스탬프 | 배열·레코드·구조체 같은 자료 구조를 통째로 넘김 |\n| 3 | 제어 | 플래그 같은 제어 요소로 상대 모듈의 처리 흐름을 정함 |\n| 4 | 외부 | 외부에 선언된 데이터, 외부에서 정한 형식·프로토콜을 함께 씀 |\n| 5 | 공통 | 전역 변수(공통 데이터 영역)를 함께 참조·갱신 |\n| 강 6 | 내용 | 다른 모듈의 내부 자료·코드를 직접 참조·수정 |\n- 약→강 '자스제외공내', 강→약 '내공외제스자'"},{"id":"design-027","subject":"design","topic":"응집도·결합도","sub":"결합도","type":"choice","past":"2026-2","level":3,"q":"다음 설명에 해당하는 것을 \u003c보기>에서 골라 쓰시오.","box":"한 모듈이 다른 모듈의 내부 기능이나 내부 자료를 직접 참조하거나 수정하는 경우로, 모듈 사이의 의존 정도가 가장 강하다.","options":["① 자료 결합도","② 기능적 응집도","③ 스탬프 결합도","④ 순차적 응집도","⑤ 제어 결합도","⑥ 교환적 응집도","⑦ 외부 결합도","⑧ 절차적 응집도","⑨ 공통 결합도","⑩ 시간적 응집도","⑪ 내용 결합도","⑫ 논리적 응집도","⑬ 우연적 응집도"],"answers":[{"label":"답","accept":["⑪","내용 결합도","내용","Content Coupling","Content","⑪ 내용 결합도"]}],"hint":"'다른 모듈'이면 응집도가 아니다","explain":"정답: ⑪ 내용 결합도\n1. '다른 모듈'과의 관계 → 응집도(모듈 안) 7개를 먼저 지운다\n2. '내부를 직접 참조·수정', '가장 강하다' → 내용 결합도\n- 2026-2는 응집도와 결합도를 한 보기에 섞어 냈다. 두 척도의 방향(응집 ↑ 좋음, 결합 ↓ 좋음)을 같이 외운다\n\n| 순서 | 결합도 | 판별 단서 |\n|---|---|---|\n| 약 1 | 자료 | 필요한 값(파라미터)만 주고받음 |\n| 2 | 스탬프 | 배열·레코드·구조체 같은 자료 구조를 통째로 넘김 |\n| 3 | 제어 | 플래그 같은 제어 요소로 상대 모듈의 처리 흐름을 정함 |\n| 4 | 외부 | 외부에 선언된 데이터, 외부에서 정한 형식·프로토콜을 함께 씀 |\n| 5 | 공통 | 전역 변수(공통 데이터 영역)를 함께 참조·갱신 |\n| 강 6 | 내용 | 다른 모듈의 내부 자료·코드를 직접 참조·수정 |\n- 약→강 '자스제외공내', 강→약 '내공외제스자'\n\n| 순서 | 응집도 | 판별 단서 |\n|---|---|---|\n| 강 1 | 기능적 | 단일 목적, 하나의 기능만 수행 |\n| 2 | 순차적 | 앞 활동의 출력 = 다음 활동의 입력 |\n| 3 | 교환적(통신적) | 같은 입력·출력 데이터를 쓰는 서로 다른 기능 |\n| 4 | 절차적 | 데이터 연결 없이 정해진 순서대로 수행 |\n| 5 | 시간적 | 같은 시점에 실행 (초기화, 종료 처리) |\n| 6 | 논리적 | 비슷한 성격끼리 묶고 플래그·case로 골라 실행 |\n| 약 7 | 우연적 | 서로 관련 없음 |\n- 강→약 '기순교절시논우', 약→강 '우논시절교순기'"},{"id":"design-028","subject":"design","topic":"응집도·결합도","sub":"응집도","type":"blank","past":"2021-2","level":3,"q":"다음 설명에 해당하는 응집도를 \u003c보기>에서 골라 쓰시오.","box":"( ① ): 모듈 안의 구성 요소들이 서로 입출력 연관은 없지만, 정해진 순서에 따라 차례로 수행되어야 하는 기능들로 묶여 있다.\n( ② ): 동일한 입력과 출력을 사용하여 서로 다른 기능을 수행하는 구성 요소들이 모여 있다.\n( ③ ): 모듈 내부의 모든 기능 요소가 단일 문제와 연관되어 하나의 기능을 수행한다.","options":["ㄱ. 기능적 응집도","ㄴ. 시간적 응집도","ㄷ. 교환적 응집도","ㄹ. 절차적 응집도","ㅁ. 순차적 응집도","ㅂ. 우연적 응집도","ㅅ. 논리적 응집도"],"answers":[{"label":"①","accept":["ㄹ","절차적 응집도","절차적","절차 응집도","절차","Procedural Cohesion","Procedural","ㄹ 절차적 응집도"]},{"label":"②","accept":["ㄷ","교환적 응집도","통신적 응집도","교환적","통신적","교환 응집도","통신 응집도","교환","통신","Communicational Cohesion","Communicational","Communication Cohesion","ㄷ 교환적 응집도"]},{"label":"③","accept":["ㄱ","기능적 응집도","기능적","기능 응집도","기능","Functional Cohesion","Functional","ㄱ 기능적 응집도"]}],"hint":"① 순서만 있음 ② 같은 데이터 ③ 한 가지 일","explain":"정답: ① 절차적 ② 교환적(통신적) ③ 기능적\n- 절차 vs 순차: 둘 다 순서대로 실행한다. 앞 출력이 다음 입력으로 이어지면 순차, 데이터 연결 없이 순서만 있으면 절차\n- 교환적과 통신적은 같은 것이다(Communicational). 출처마다 표기가 다르니 둘 다 기억한다\n- 2026-1에 같은 세 가지가 빈칸형으로 다시 나왔다\n\n| 순서 | 응집도 | 판별 단서 |\n|---|---|---|\n| 강 1 | 기능적 | 단일 목적, 하나의 기능만 수행 |\n| 2 | 순차적 | 앞 활동의 출력 = 다음 활동의 입력 |\n| 3 | 교환적(통신적) | 같은 입력·출력 데이터를 쓰는 서로 다른 기능 |\n| 4 | 절차적 | 데이터 연결 없이 정해진 순서대로 수행 |\n| 5 | 시간적 | 같은 시점에 실행 (초기화, 종료 처리) |\n| 6 | 논리적 | 비슷한 성격끼리 묶고 플래그·case로 골라 실행 |\n| 약 7 | 우연적 | 서로 관련 없음 |\n- 강→약 '기순교절시논우', 약→강 '우논시절교순기'"},{"id":"design-029","subject":"design","topic":"응집도·결합도","sub":"응집도","type":"blank","past":"2026-1","level":3,"q":"다음 사례에 해당하는 응집도를 쓰시오.","box":"( ① ): 회원 가입 모듈이 '입력 화면 띄우기 → 약관 동의 확인 → 가입 완료 메일 발송'을 정해진 순서대로 수행한다. 단계 사이에 데이터를 넘겨받지는 않는다.\n( ② ): 학번 하나를 입력받아 이름 조회, 성적 조회, 주소 조회를 수행하는 기능들이 한 모듈에 모여 있다.\n( ③ ): 원의 넓이 계산 모듈이 반지름을 받아 넓이 하나만 계산해 돌려준다.","answers":[{"label":"①","accept":["절차적 응집도","절차적","절차 응집도","절차","Procedural Cohesion","Procedural"]},{"label":"②","accept":["교환적 응집도","통신적 응집도","교환적","통신적","교환 응집도","통신 응집도","교환","통신","Communicational Cohesion","Communicational","Communication Cohesion"]},{"label":"③","accept":["기능적 응집도","기능적","기능 응집도","기능","Functional Cohesion","Functional"]}],"hint":"2021-2와 같은 세 응집도","explain":"정답: ① 절차적 ② 교환적(통신적) ③ 기능적\n- 2026-1 실제 문제는 정의 문장(관련 기능을 순서대로 수행 / 같은 입출력을 쓰는 서로 다른 기능 / 모든 기능이 단일 목적)이었다. 여기서는 사례로 물었다\n- ①에서 '앞 단계 출력을 다음 단계가 입력으로 쓴다'가 붙으면 순차적 로 관련 없음 |\n- 강→약 '기순교절시논우', 약→강 '우논시절교순기'"},{"id":"design-032","subject":"design","topic":"응집도·결합도","sub":"결합도","type":"order","level":3,"q":"다음 \u003c보기>의 결합도를 결합도가 약한 것부터 강한 순서로 나열하여 기호로 쓰시오.","options":["ㄱ. 공통 결합도","ㄴ. 자료 결합도","ㄷ. 내용 결합도","ㄹ. 제어 결합도","ㅁ. 외부 결합도","ㅂ. 스탬프 결합도"],"answers":[{"label":"답","accept":["ㄴ-ㅂ-ㄹ-ㅁ-ㄱ-ㄷ"]}],"hint":"자스제외공내","explain":"정답: ㄴ → ㅂ → ㄹ → ㅁ → ㄱ → ㄷ (자료 → 스탬프 → 제어 → 외부 → 공통 → 내용)\n- 약한 결합이 좋은 설계다. 맨 앞(자료)이 가장 바람직하다\n- 문제가 '강한 것부터'를 물으면 거꾸로: 내공외제스자\n\n| 순서 | 결합도 | 판별 단서 |\n|---|---|---|\n| 약 1 | 자료 | 필요한 값(파라미터)만 주고받음 |\n| 2 | 스탬프 | 배열·레코드·구조체 같은 자료 구조를 통째로 넘김 |\n| 3 | 제어 | 플래그 같은 제어 요소로 상대 모듈의 처리 흐름을 정함 |\n| 4 | 외부 | 외부에 선언된 데이터, 외부에서 정한 형식·프로토콜을 함께 씀 |\n| 5 | 공통 | 전역 변수(공통 데이터 영역)를 함께 참조·갱신 |\n| 강 6 | 내용 | 다른 모듈의 내부 자료·코드를 직접 참조·수정 |\n- 약→강 '자스제외공내', 강→약 '내공외제스자'"},{"id":"design-033","subject":"design","topic":"응집도·결합도","sub":"응집도","type":"order","level":3,"q":"다음 \u003c보기>의 응집도를 응집도가 강한 것부터 약한 순서로 나열하여 기호로 쓰시오.","options":["ㄱ. 논리적 응집도","ㄴ. 순차적 응집도","ㄷ. 우연적 응집도","ㄹ. 기능적 응집도","ㅁ. 시간적 응집도","ㅂ. 절차적 응집도","ㅅ. 교환적 응집도"],"answers":[{"label":"답","accept":["ㄹ-ㄴ-ㅅ-ㅂ-ㅁ-ㄱ-ㄷ"]}],"hint":"기순교절시논우","explain":"정답: ㄹ → ㄴ → ㅅ → ㅂ → ㅁ → ㄱ → ㄷ (기능 → 순차 → 교환 → 절차 → 시간 → 논리 → 우연)\n- 헷갈리는 구간: 순차(데이터 이어짐) > 교환(같은 데이터 공유) > 절차(순서만)\n- 시간(같은 시점) > 논리(비슷한 종류) > 우연(관계 없음)\n\n| 순서 | 응집도 | 판별 단서 |\n|---|---|---|\n| 강 1 | 기능적 | 단일 목적, 하나의 기능만 수행 |\n| 2 | 순차적 | 앞 활동의 출력 = 다음 활동의 입력 |\n| 3 | 교환적(통신적) | 같은 입력·출력 데이터를 쓰는 서로 다른 기능 |\n| 4 | 절차적 | 데이터 연결 없이 정해진 순서대로 수행 |\n| 5 | 시간적 | 같은 시점에 실행 (초기화, 종료 처리) |\n| 6 | 논리적 | 비슷한 성격끼리 묶고 플래그·case로 골라 실행 |\n| 약 7 | 우연적 | 서로 관련 없음 |\n- 강→약 '기순교절시논우', 약→강 '우논시절교순기'"},{"id":"design-034","subject":"design","topic":"응집도·결합도","sub":"응집도·결합도","type":"blank","level":3,"q":"다음 사례에 해당하는 응집도 또는 결합도의 이름을 쓰시오. (예: ○○ 응집도, ○○ 결합도)","box":"( ① ): 프로그램 시작 시 한꺼번에 실행되는 변수 초기화, 환경 설정 읽기, 로그 파일 열기를 initialize 모듈 하나에 모아 두었다.\n( ② ): 마우스·키보드·터치 입력 처리를 모두 한 모듈에 넣고, 넘어온 입력 종류에 따라 case 문으로 골라 처리한다.\n( ③ ): sendEmail, calculateSum, printReport처럼 서로 아무 관련이 없는 기능들을 Utils 모듈에 모아 두었다.\n( ④ ): 덧셈 모듈이 정수 a, b 두 값만 매개변수로 받아 합을 돌려준다.\n( ⑤ ): 한 모듈에서 선언한 데이터를 외부의 다른 모듈이 참조하거나, 두 모듈이 외부에서 정한 파일 형식·통신 프로토콜을 함께 따른다.","answers":[{"label":"①","accept":["시간적 응집도","시간적","시간 응집도","시간","Temporal Cohesion","Temporal"]},{"label":"②","accept":["논리적 응집도","논리적","논리 응집도","논리","Logical Cohesion","Logical"]},{"label":"③","accept":["우연적 응집도","우연적","우연 응집도","우연","Coincidental Cohesion","Coincidental","Accidental Cohesion","Accidental"]},{"label":"④","accept":["자료 결합도","자료","데이터 결합도","데이터","Data Coupling","Data"]},{"label":"⑤","accept":["외부 결합도","외부","External Coupling","External"]}],"hint":"①②③ 응집도 하위 셋, ④⑤ 결합도","explain":"정답: ① 시간적 응집도 ② 논리적 응집도 ③ 우연적 응집도 ④ 자료 결합도 ⑤ 외부 결합도\n- ① '같은 시점' → 시간적. 초기화·종료 처리 모듈이 대표 예\n- ② '비슷한 종류를 묶고 골라 실행' → 논리적\n- ⑤ 외부 결합도 정의는 출처마다 표현이 다르다: 시나공 계열은 '한 모듈에서 선언한 데이터(변수)를 외부 모듈이 참조', 감자는 '외부에서 정한 데이터 형식·통신 프로토콜·장치를 공유'. 둘 다 외부 결합도의 단서다\n\n| 순서 | 응집도 | 판별 단서 |\n|---|---|---|\n| 강 1 | 기능적 | 단일 목적, 하나의 기능만 수행 |\n| 2 | 순차적 | 앞 활동의 출력 = 다음 활동의 입력 |\n| 3 | 교환적(통신적) | 같은 입력·출력 데이터를 쓰는 서로 다른 기능 |\n| 4 | 절차적 | 데이터 연결 없이 정해진 순서대로 수행 |\n| 5 | 시간적 | 같은 시점에 실행 (초기화, 종료 처리) |\n| 6 | 논리적 | 비슷한 성격끼리 묶고 플래그·case로 골라 실행 |\n| 약 7 | 우연적 | 서로 관련 없음 |\n- 강→약 '기순교절시논우', 약→강 '우논시절교순기'\n\n| 순서 | 결합도 | 판별 단서 |\n|---|---|---|\n| 약 1 | 자료 | 필요한 값(파라미터)만 주고받음 |\n| 2 | 스탬프 | 배열·레코드·구조체 같은 자료 구조를 통째로 넘김 |\n| 3 | 제어 | 플래그 같은 제어 요소로 상대 모듈의 처리 흐름을 정함 |\n| 4 | 외부 | 외부에 선언된 데이터, 외부에서 정한 형식·프로토콜을 함께 씀 |\n| 5 | 공통 | 전역 변수(공통 데이터 영역)를 함께 참조·갱신 |\n| 강 6 | 내용 | 다른 모듈의 내부 자료·코드를 직접 참조·수정 |\n- 약→강 '자스제외공내', 강→약 '내공외제스자'"},{"id":"design-035","subject":"design","topic":"응집도·결합도","sub":"설계 원리","type":"blank","level":2,"q":"다음은 컴포넌트 설계 시 '협약에 의한 설계(Design by Contract)'에 대한 설명이다. ( ① )~( ③ )에 들어갈 조건을 쓰시오.","box":"협약에 의한 설계는 클래스에 대한 여러 가정을 공유할 수 있도록 명세하는 설계 방법이다.\n- ( ① ) 조건: 오퍼레이션이 호출되기 전에 참이 되어야 할 조건\n- ( ② ) 조건: 오퍼레이션이 수행된 후 만족되어야 할 조건\n- ( ③ ) 조건: 오퍼레이션이 실행되는 동안 항상 만족되어야 할 조건","answers":[{"label":"①","accept":["선행","Precondition","사전","선행 조건","사전 조건"]},{"label":"②","accept":["결과","Postcondition","사후","결과 조건","사후 조건"]},{"label":"③","accept":["불변","Invariant","불변 조건"]}],"hint":"전 / 후 / 항상","explain":"정답: ① 선행(Precondition) ② 결과(Postcondition) ③ 불변(Invariant)\n- 예: 계좌 출금 withdraw(amount) — 선행: amount > 0, 잔액 ≥ amount / 결과: 잔액이 amount만큼 줄었다 / 불변: 잔액 ≥ 0\n\n설계 원리 묶음\n- 모듈화: 시스템을 기능 단위(모듈)로 나눈다\n- 추상화: 공통 성질만 뽑는다. 과정 추상화, 데이터(자료) 추상화, 제어 추상화\n- 단계적 분해: 상위 개념부터 하향식으로 점점 구체화한다\n- 정보 은닉: 모듈 내부를 숨기고 인터페이스로만 접근하게 한다"},{"id":"design-036","subject":"design","topic":"응집도·결합도","sub":"설계 원리","type":"blank","level":2,"q":"다음은 공통 모듈의 명세 기법(원칙)에 대한 설명이다. ( ① )~( ④ )에 해당하는 원칙을 \u003c보기>에서 골라 쓰시오.","box":"( ① ): 해당 기능을 이해할 때 중의적으로 해석되지 않도록 분명하게 작성한다.\n( ② ): 시스템 구현을 위해 필요한 모든 것을 빠짐없이 기술한다.\n( ③ ): 공통 기능들 사이에 상호 충돌이 생기지 않도록 작성한다.\n( ④ ): 기능에 대한 요구사항의 출처, 관련 시스템 등의 관계를 파악할 수 있도록 작성한다.","options":["ㄱ. 정확성","ㄴ. 명확성","ㄷ. 완전성","ㄹ. 일관성","ㅁ. 추적성","ㅂ. 재사용성"],"answers":[{"label":"①","accept":["명확성","Clarity","ㄴ","ㄴ 명확성"]},{"label":"②","accept":["완전성","Completeness","ㄷ","ㄷ 완전성"]},{"label":"③","accept":["일관성","Consistency","ㄹ","ㄹ 일관성"]},{"label":"④","accept":["추적성","Traceability","ㅁ","ㅁ 추적성"]}],"hint":"중의 없음 / 빠짐 없음 / 충돌 없음 / 출처 있음","explain":"정답: ① 명확성 ② 완전성 ③ 일관성 ④ 추적성\n- 남은 하나 정확성(Correctness): 시스템 구현 시 해당 기능이 필요하다는 것을 알 수 있도록 정확히 작성\n- 5원칙: 정확성·명확성·완전성·일관성·추적성 ('정명완일추')\n- 명확성 vs 정확성: 명확성은 '한 가지로만 읽히는가', 정확성은 '필요한 기능을 맞게 적었는가'\n- 재사용성은 명세 원칙이 아니라 공통 모듈의 목적이다"},{"id":"design-037","subject":"design","topic":"응집도·결합도","sub":"모듈 설계","type":"essay","level":2,"q":"모듈의 독립성을 높이는 설계 방안을 결합도·응집도와 fan-in·fan-out 관점에서 약술하시오.","answers":[{"label":"답","accept":[],"model":"결합도는 낮추고 응집도는 높여 모듈 하나가 한 가지 기능만 하고 다른 모듈에 덜 의존하게 한다. 시스템 복잡도를 줄이려면 fan-in은 높이고(여러 모듈이 재사용) fan-out은 낮춘다(한 모듈이 너무 많은 하위 모듈을 부르지 않게)."}],"hint":"사이는 낮게, 안은 높게 / 들어오는 건 많게, 나가는 건 적게","explain":"채점 포인트\n- 결합도 ↓, 응집도 ↑ 두 가지가 다 있는가\n- fan-in ↑, fan-out ↓ 방향이 맞는가 (반대로 쓰기 쉽다)\n\n덧붙이면 좋은 것\n- 모듈은 입구 하나, 출구 하나\n- 모듈 크기는 이해하기 쉬운 정도로 나눈다\n- 정보 은닉으로 내부 변경이 밖에 번지지 않게 한다"},{"id":"design-038","subject":"design","topic":"UML","sub":"패키지 다이어그램","type":"short","past":"2020-4","level":3,"q":"다음 설명에 해당하는 UML 다이어그램의 이름을 쓰시오.","box":"- 판매 시스템의 요소를 ordering, pricing, products라는 세 묶음으로 나누어 그렸다.\n- 각 묶음은 왼쪽 위에 탭이 달린 폴더 모양이다.\n- ordering에서 pricing, products로 점선 화살표가 그어져 있고, 화살표 위에 `\u003c\u003cimport>>`가 적혀 있다.","answers":[{"label":"답","accept":["패키지 다이어그램","Package Diagram","패키지","Package"]}],"hint":"탭 달린 폴더 = 묶음","explain":"정답: 패키지 다이어그램(Package Diagram)\n- 단서: 폴더 모양, 요소 묶음, 묶음 사이 점선 의존 화살표, «import»\n- 구조(정적) 다이어그램이다\n- 2023-3에 같은 그림이, 2025-3에는 설명형(폴더 모양 묶음, «import»·«access»·«merge»)으로 다시 나왔다. 2020-4부터 3회 출제\n\n패키지 의존 스테레오타입\n- «import»: 대상 패키지의 공개 요소를 가져와 이름만으로 쓴다(공개 가져오기)\n- «access»: 가져오되 비공개로 쓴다\n- «merge»: 두 패키지의 내용을 합친다\n\n| 구분 | 다이어그램 |\n|---|---|\n| 구조(정적) | 클래스, 객체, 컴포넌트, 배치, 복합체 구조, 패키지 |\n| 행위(동적) | 유스케이스, 시퀀스, 커뮤니케이션, 상태, 활동, 상호작용 개요, 타이밍 |\n- 두음: 구조 '클객컴배복패', 행위 '유시커상활타' (+상호작용 개요)\n- 행위 다이어그램 개수는 출처마다 다르다: UML 2.5 표준과 다수 교재는 상호작용 개요를 넣어 7개, 정처기 감자는 빼고 6개(유시커상활타)\n- 구조 쪽도 UML 2.5 표준은 프로파일 다이어그램을 더해 7개다. 교재는 보통 위 6개만 적는다"},{"id":"design-039","subject":"design","topic":"UML","sub":"패키지 다이어그램","type":"blank","past":"2023-3","level":3,"q":"다음 그림 설명을 보고 ( ① ), ( ② )에 들어갈 알맞은 용어를 쓰시오.","box":"- 판매 관련 요소를 ordering, pricing, products로 묶어 탭 달린 폴더 모양으로 그렸다.\n- ordering → pricing, ordering → products 사이에 점선 화살표와 «import» 표시가 있다.\n\n이 그림은 UML ( ① ) 다이어그램이다. 묶음 사이의 점선 화살표는 한쪽이 다른 쪽을 사용하는 ( ② ) 관계를 나타낸다.","answers":[{"label":"①","accept":["패키지","Package","패키지 다이어그램","Package Diagram"]},{"label":"②","accept":["의존","Dependency","의존 관계","의존성"]}],"hint":"② 점선 + 열린 화살표","explain":"정답: ① 패키지 ② 의존(Dependency)\n- 2023-3 실제 문제는 다이어그램 이름(패키지 다이어그램)만 물었다\n- 점선 + 열린 화살표 = 의존. 점선 + 빈 삼각형이면 실체화다\n\n| 관계 | 표기 | 의미·예 |\n|---|---|---|\n| 연관(Association) | 실선 (방향이 있으면 화살표) | 계속 참조하는 관계. 차-엔진 |\n| 집합(Aggregation) | 실선 + 전체 쪽 빈 마름모 ◇ | 전체-부분, 부분이 따로 존재. 학과-학생 |\n| 포함(Composition) | 실선 + 전체 쪽 채운 마름모 ◆ | 전체-부분, 생명주기가 같음. 집-방 |\n| 일반화(Generalization) | 실선 + 빈 삼각형 화살표 | is-a, 상속. 버스→차 |\n| 실체화(Realization) | 점선 + 빈 삼각형 화살표 | 인터페이스 구현. 로봇청소기→청소 가능 |\n| 의존(Dependency) | 점선 + 열린 화살표 | 잠깐 사용(매개변수·지역 변수). TV→리모컨 |\n- 번역어가 여러 개다: 집합 = 집약, 포함 = 합성 = 복합\n- 마름모 2개(포함·집합), 화살표 2개(연관·의존), 빈 삼각형 2개(일반화·실체화). 실선이 강하고 점선이 약하다"},{"id":"design-040","subject":"design","topic":"UML","sub":"패키지 다이어그램","type":"choice","past":"2025-3","level":3,"q":"다음 설명에 해당하는 UML 다이어그램을 \u003c보기>에서 골라 쓰시오.","box":"- 시스템을 폴더 모양의 단위로 묶어, 구성 요소들이 어떻게 무리 지어 있고 서로 어떻게 의존하는지 표현하는 구조 다이어그램이다.\n- 한 묶음 안에 클래스나 하위 묶음을 넣을 수 있다.\n- 묶음 사이의 의존은 «import», «access», «merge» 같은 스테레오타입으로 표시한다.","options":["ㄱ. 클래스 다이어그램","ㄴ. 시퀀스 다이어그램","ㄷ. 패키지 다이어그램","ㄹ. 상태 다이어그램"],"answers":[{"label":"답","accept":["ㄷ","패키지 다이어그램","Package Diagram","패키지","Package","ㄷ 패키지 다이어그램"]}],"hint":"폴더 모양 묶음","explain":"정답: ㄷ 패키지 다이어그램\n- 2020-4, 2023-3, 2025-3 세 번 나온 다이어그램. chobopark 복원은 보기 없는 단답, 문어CBT는 4지 보기\n- 클래스 다이어그램도 구조 다이어그램이지만 '폴더 모양 묶음'이 아니다\n\n| 구분 | 다이어그램 |\n|---|---|\n| 구조(정적) | 클래스, 객체, 컴포넌트, 배치, 복합체 구조, 패키지 |\n| 행위(동적) | 유스케이스, 시퀀스, 커뮤니케이션, 상태, 활동, 상호작용 개요, 타이밍 |\n- 두음: 구조 '클객컴배복패', 행위 '유시커상활타' (+상호작용 개요)\n- 행위 다이어그램 개수는 출처마다 다르다: UML 2.5 표준과 다수 교재는 상호작용 개요를 넣어 7개, 정처기 감자는 빼고 6개(유시커상활타)\n- 구조 쪽도 UML 2.5 표준은 프로파일 다이어그램을 더해 7개다. 교재는 보통 위 6개만 적는다"},{"id":"design-041","subject":"design","topic":"UML","sub":"클래스 관계","type":"blank","past":"2021-3","level":3,"q":"다음은 UML 클래스 사이의 관계에 대한 설명이다. ( ① ), ( ② )에 들어갈 관계를 쓰시오.","box":"( ① ): 하나의 객체에 여러 개의 독립적인 객체들이 구성되는 전체-부분 관계이다. 부분 객체는 전체 객체가 사라져도 따로 존재할 수 있다.\n( ② ): 한 클래스가 다른 클래스보다 더 일반적인 개념(상위)이고, 다른 클래스가 그 구체적인 개념(하위)인 is-a 관계이다.","answers":[{"label":"①","accept":["집합","Aggregation","집약","집합 관계","집약 관계","집단화","집단화 관계"]},{"label":"②","accept":["일반화","Generalization","일반화 관계"]}],"hint":"① 빈 마름모 ② 상속","explain":"정답: ① 집합(Aggregation, 집약) ② 일반화(Generalization)\n- 객체지향 관계 용어로는 is-part-of를 집단화(Aggregation)라고 부르는 교재도 있다. 집합·집약·집단화 모두 Aggregation\n- 집합 vs 포함: 둘 다 전체-부분. 부분이 따로 살 수 있으면 집합(◇), 전체와 함께 사라지면 포함(◆)\n- 일반화 화살표는 하위 → 상위 쪽을 가리킨다(빈 삼각형이 상위 클래스에 붙는다)\n\n| 관계 | 표기 | 의미·예 |\n|---|---|---|\n| 연관(Association) | 실선 (방향이 있으면 화살표) | 계속 참조하는 관계. 차-엔진 |\n| 집합(Aggregation) | 실선 + 전체 쪽 빈 마름모 ◇ | 전체-부분, 부분이 따로 존재. 학과-학생 |\n| 포함(Composition) | 실선 + 전체 쪽 채운 마름모 ◆ | 전체-부분, 생명주기가 같음. 집-방 |\n| 일반화(Generalization) | 실선 + 빈 삼각형 화살표 | is-a, 상속. 버스→차 |\n| 실체화(Realization) | 점선 + 빈 삼각형 화살표 | 인터페이스 구현. 로봇청소기→청소 가능 |\n| 의존(Dependency) | 점선 + 열린 화살표 | 잠깐 사용(매개변수·지역 변수). TV→리모컨 |\n- 번역어가 여러 개다: 집합 = 집약, 포함 = 합성 = 복합\n- 마름모 2개(포함·집합), 화살표 2개(연관·의존), 빈 삼각형 2개(일반화·실체화). 실선이 강하고 점선이 약하다"},{"id":"design-042","subject":"design","topic":"UML","sub":"클래스 다이어그램","type":"short","past":"2021-3","level":3,"q":"다음 설명에 해당하는 UML 다이어그램을 쓰시오.","box":"- 문제 해결을 위한 도메인 구조를 표현해, 보이지 않는 도메인 안의 추상적인 개념을 기술한다.\n- 소프트웨어 설계 또는 완성된 소프트웨어의 구현 설명을 목적으로 쓸 수 있다.\n- 이 다이어그램은 속성(attribute)과 메서드(method)를 포함한다.","answers":[{"label":"답","accept":["클래스 다이어그램","Class Diagram","클래스","Class"]}],"hint":"이름·속성·연산 세 칸짜리 상자","explain":"정답: 클래스 다이어그램(Class Diagram)\n- 클래스 상자는 세 칸: 이름 / 속성 / 연산(메서드)\n- 클래스 vs 객체 다이어그램: 클래스는 '틀'과 관계, 객체 다이어그램은 특정 시점의 인스턴스와 링크\n- 가장 대표적인 구조(정적) 다이어그램\n\n| 구분 | 다이어그램 |\n|---|---|\n| 구조(정적) | 클래스, 객체, 컴포넌트, 배치, 복합체 구조, 패키지 |\n| 행위(동적) | 유스케이스, 시퀀스, 커뮤니케이션, 상태, 활동, 상호작용 개요, 타이밍 |\n- 두음: 구조 '클객컴배복패', 행위 '유시커상활타' (+상호작용 개요)\n- 행위 다이어그램 개수는 출처마다 다르다: UML 2.5 표준과 다수 교재는 상호작용 개요를 넣어 7개, 정처기 감자는 빼고 6개(유시커상활타)\n- 구조 쪽도 UML 2.5 표준은 프로파일 다이어그램을 더해 7개다. 교재는 보통 위 6개만 적는다"},{"id":"design-043","subject":"design","topic":"UML","sub":"UML 구성요소","type":"blank","past":"2022-3","level":3,"q":"다음 UML에 대한 설명에서 ( ① )~( ③ )에 들어갈 알맞은 용어를 쓰시오.","box":"- UML의 구성 요소는 사물(Things), ( ① ), 다이어그램으로 이루어진다.\n- ( ② ) 다이어그램은 객체 타입을 나타내고, 그 사이에 존재하는 정적인 관계를 표현한다.\n- ( ③ )는 클래스가 구현해야 할 오퍼레이션(메서드) 선언의 집합을 정의한 모델 요소다. 다른 클래스가 이를 실체화(realization)해 구현한다.","answers":[{"label":"①","accept":["관계","Relationship","Relationships"]},{"label":"②","accept":["클래스","Class"]},{"label":"③","accept":["인터페이스","Interface"]}],"hint":"① 사물과 사물을 잇는 것 ③ 구현부 없는 약속","explain":"정답: ① 관계(Relationship) ② 클래스(Class) ③ 인터페이스(Interface)\n- UML 구성요소 3가지: 사물, 관계, 다이어그램\n- 사물 4종: 구조 사물(클래스·유스케이스·컴포넌트·노드), 행동 사물(상호작용·상태 머신), 그룹 사물(패키지), 주해 사물(노트)\n- 스테레오타입: «include», «interface»처럼 길러멧(« »)으로 확장 의미를 붙인다\n- UML은 가시화·명세화·구축·문서화 언어다\n\n| 관계 | 표기 | 의미·예 |\n|---|---|---|\n| 연관(Association) | 실선 (방향이 있으면 화살표) | 계속 참조하는 관계. 차-엔진 |\n| 집합(Aggregation) | 실선 + 전체 쪽 빈 마름모 ◇ | 전체-부분, 부분이 따로 존재. 학과-학생 |\n| 포함(Composition) | 실선 + 전체 쪽 채운 마름모 ◆ | 전체-부분, 생명주기가 같음. 집-방 |\n| 일반화(Generalization) | 실선 + 빈 삼각형 화살표 | is-a, 상속. 버스→차 |\n| 실체화(Realization) | 점선 + 빈 삼각형 화살표 | 인터페이스 구현. 로봇청소기→청소 가능 |\n| 의존(Dependency) | 점선 + 열린 화살표 | 잠깐 사용(매개변수·지역 변수). TV→리모컨 |\n- 번역어가 여러 개다: 집합 = 집약, 포함 = 합성 = 복합\n- 마름모 2개(포함·집합), 화살표 2개(연관·의존), 빈 삼각형 2개(일반화·실체화). 실선이 강하고 점선이 약하다"},{"id":"design-044","subject":"design","topic":"UML","sub":"클래스 관계","type":"blank","past":"2024-3","level":3,"q":"다음은 UML 클래스 다이어그램의 관계 그림을 글로 옮긴 것이다. (1)~(3)에 해당하는 관계를 \u003c보기>에서 골라 쓰시오.","box":"(1) '차' 클래스와 '타이어', '바퀴', '엔진' 클래스가 각각 화살촉 없는 실선으로 연결되어 있다.\n(2) '버스', '택시', '승용차' 클래스에서 '차' 클래스로, 속이 빈 삼각형 화살표가 달린 실선이 그어져 있다.\n(3) '텔레비전' 클래스에서 '리모컨' 클래스로 점선 화살표가 그어져 있다.","options":["ㄱ. 의존","ㄴ. 연관","ㄷ. 일반화"],"answers":[{"label":"(1)","accept":["ㄴ","연관","Association","연관 관계","ㄴ 연관"]},{"label":"(2)","accept":["ㄷ","일반화","Generalization","일반화 관계","ㄷ 일반화"]},{"label":"(3)","accept":["ㄱ","의존","Dependency","의존 관계","ㄱ 의존"]}],"hint":"실선 / 실선+빈 삼각형 / 점선","explain":"정답: (1) 연관 (2) 일반화 (3) 의존\n- 연관(실선): 멤버로 계속 참조한다\n- 의존(점선 화살표): 매개변수·지역 변수로 잠깐 쓴다. TV가 리모컨 신호를 받아 잠깐 쓰는 관계\n- 일반화(실선 + 빈 삼각형): 버스·택시·승용차 is-a 차\n\n| 관계 | 표기 | 의미·예 |\n|---|---|---|\n| 연관(Association) | 실선 (방향이 있으면 화살표) | 계속 참조하는 관계. 차-엔진 |\n| 집합(Aggregation) | 실선 + 전체 쪽 빈 마름모 ◇ | 전체-부분, 부분이 따로 존재. 학과-학생 |\n| 포함(Composition) | 실선 + 전체 쪽 채운 마름모 ◆ | 전체-부분, 생명주기가 같음. 집-방 |\n| 일반화(Generalization) | 실선 + 빈 삼각형 화살표 | is-a, 상속. 버스→차 |\n| 실체화(Realization) | 점선 + 빈 삼각형 화살표 | 인터페이스 구현. 로봇청소기→청소 가능 |\n| 의존(Dependency) | 점선 + 열린 화살표 | 잠깐 사용(매개변수·지역 변수). TV→리모컨 |\n- 번역어가 여러 개다: 집합 = 집약, 포함 = 합성 = 복합\n- 마름모 2개(포함·집합), 화살표 2개(연관·의존), 빈 삼각형 2개(일반화·실체화). 실선이 강하고 점선이 약하다"},{"id":"design-045","subject":"design","topic":"UML","sub":"행위 다이어그램","type":"blank","level":3,"q":"다음은 UML 행위(동적) 다이어그램에 대한 설명이다. ( ① )~( ⑤ )에 해당하는 다이어그램을 \u003c보기>에서 골라 쓰시오.","box":"( ① ): 사용자(액터) 관점에서 시스템이 제공하는 기능과 액터와의 상호작용을 표현한다. 요구사항을 정리할 때 가장 먼저 그린다.\n( ② ): 객체들이 주고받는 메시지를 시간 순서에 따라 위에서 아래로 표현한다. 생명선과 실행 상자가 있다.\n( ③ ): ②와 같은 상호작용을 다루지만, 시간 순서보다 객체들 사이의 연결(링크)과 메시지 교환에 초점을 둔다. 메시지 순서는 번호로 표시한다.\n( ④ ): 하나의 객체가 이벤트에 따라 상태를 어떻게 바꾸는지 표현한다.\n( ⑤ ): 시스템이 수행하는 처리의 흐름(작업 순서, 분기, 병렬 처리)을 순서도처럼 표현한다.","options":["ㄱ. 유스케이스","ㄴ. 시퀀스","ㄷ. 커뮤니케이션","ㄹ. 상태","ㅁ. 활동","ㅂ. 타이밍","ㅅ. 컴포넌트","ㅇ. 배치"],"answers":[{"label":"①","accept":["ㄱ","유스케이스","Use Case","유스케이스 다이어그램","Use Case Diagram","ㄱ 유스케이스"]},{"label":"②","accept":["ㄴ","시퀀스","Sequence","시퀀스 다이어그램","Sequence Diagram","순차 다이어그램","ㄴ 시퀀스"]},{"label":"③","accept":["ㄷ","커뮤니케이션","Communication","커뮤니케이션 다이어그램","Communication Diagram","통신 다이어그램","협력 다이어그램","Collaboration Diagram","ㄷ 커뮤니케이션"]},{"label":"④","accept":["ㄹ","상태","State","상태 다이어그램","State Diagram","상태 머신 다이어그램","State Machine Diagram","ㄹ 상태"]},{"label":"⑤","accept":["ㅁ","활동","Activity","활동 다이어그램","Activity Diagram","ㅁ 활동"]}],"hint":"① 액터 ② 시간축 ③ 링크와 번호 ④ 한 객체의 일생 ⑤ 순서도","explain":"정답: ① 유스케이스 ② 시퀀스 ③ 커뮤니케이션 ④ 상태 ⑤ 활동\n- 시퀀스 vs 커뮤니케이션: 같은 상호작용을 시퀀스는 시간 순서로, 커뮤니케이션은 객체 연결 관계로 본다 (커뮤니케이션은 UML 1의 협력 다이어그램)\n- 상태 vs 활동: 상태는 '한 객체'의 상태 변화, 활동은 '처리 흐름'. 활동 다이어그램 구성: 액션, 시작·종료 노드, 조건(결정) 노드, 병합 노드, 포크·조인 노드, 스윔레인(책임 구분 영역)\n- 타이밍: 시간 제약에 따른 상태 변화. 상호작용 개요: 여러 상호작용을 활동 다이어그램처럼 묶음\n\n| 구분 | 다이어그램 |\n|---|---|\n| 구조(정적) | 클래스, 객체, 컴포넌트, 배치, 복합체 구조, 패키지 |\n| 행위(동적) | 유스케이스, 시퀀스, 커뮤니케이션, 상태, 활동, 상호작용 개요, 타이밍 |\n- 두음: 구조 '클객컴배복패', 행위 '유시커상활타' (+상호작용 개요)\n- 행위 다이어그램 개수는 출처마다 다르다: UML 2.5 표준과 다수 교재는 상호작용 개요를 넣어 7개, 정처기 감자는 빼고 6개(유시커상활타)\n- 구조 쪽도 UML 2.5 표준은 프로파일 다이어그램을 더해 7개다. 교재는 보통 위 6개만 적는다"},{"id":"design-046","subject":"design","topic":"UML","sub":"구조 다이어그램","type":"blank","level":3,"q":"다음은 UML 구조(정적) 다이어그램에 대한 설명이다. ( ① )~( ③ )에 해당하는 다이어그램을 쓰시오.","box":"( ① ): 특정 시점에 존재하는 인스턴스(객체)들과 그 사이의 링크를 표현한다. 클래스 다이어그램의 실제 예시에 해당한다.\n( ② ): 시스템을 구성하는 물리적인 소프트웨어 구성 요소(모듈, 라이브러리, 실행 파일)와 그 사이의 인터페이스·의존 관계를 표현한다.\n( ③ ): 소프트웨어 구성 요소가 어떤 하드웨어 노드(서버, 장비)에 어떻게 놓이는지 물리적 배치를 표현한다.","answers":[{"label":"①","accept":["객체","Object","객체 다이어그램","Object Diagram"]},{"label":"②","accept":["컴포넌트","Component","컴포넌트 다이어그램","Component Diagram"]},{"label":"③","accept":["배치","Deployment","배치 다이어그램","배포 다이어그램","Deployment Diagram","배포"]}],"hint":"① 인스턴스 ② 부품 ③ 노드","explain":"정답: ① 객체 ② 컴포넌트 ③ 배치(배포)\n- 컴포넌트 vs 배치: 컴포넌트는 '어떤 SW 부품이 있고 어떻게 의존하나', 배치는 '그 부품이 어느 하드웨어에 올라가나'\n- 복합체 구조: 클래스·컴포넌트의 내부 구조와 협력\n- 패키지: 요소를 폴더 모양으로 묶고 묶음 사이 의존 표시 (2020-4·2023-3·2025-3 출제)\n\n| 구분 | 다이어그램 |\n|---|---|\n| 구조(정적) | 클래스, 객체, 컴포넌트, 배치, 복합체 구조, 패키지 |\n| 행위(동적) | 유스케이스, 시퀀스, 커뮤니케이션, 상태, 활동, 상호작용 개요, 타이밍 |\n- 두음: 구조 '클객컴배복패', 행위 '유시커상활타' (+상호작용 개요)\n- 행위 다이어그램 개수는 출처마다 다르다: UML 2.5 표준과 다수 교재는 상호작용 개요를 넣어 7개, 정처기 감자는 빼고 6개(유시커상활타)\n- 구조 쪽도 UML 2.5 표준은 프로파일 다이어그램을 더해 7개다. 교재는 보통 위 6개만 적는다"},{"id":"design-047","subject":"design","topic":"UML","sub":"시퀀스 다이어그램","type":"blank","level":2,"q":"다음은 시퀀스 다이어그램의 구성 요소에 대한 설명이다. ( ① )~( ⑤ )에 해당하는 용어를 \u003c보기>에서 골라 쓰시오.","box":"( ① ): 시스템 바깥에서 시스템과 상호작용하는 사람이나 외부 시스템. 사람 모양 아이콘으로 그린다.\n( ② ): 메시지를 주고받는 주체로, 다이어그램 맨 위에 사각형으로 그린다.\n( ③ ): ②에서 아래로 내려오는 점선으로, 객체가 존재하는 기간을 나타낸다.\n( ④ ): ③ 위에 그리는 가늘고 긴 직사각형으로, 객체가 연산을 수행하고 있는 구간을 나타낸다.\n( ⑤ ): 객체 사이에 주고받는 요청·응답으로, 화살표로 그린다.","options":["ㄱ. 액터","ㄴ. 객체","ㄷ. 생명선","ㄹ. 실행 상자","ㅁ. 메시지","ㅂ. 링크","ㅅ. 노드"],"answers":[{"label":"①","accept":["ㄱ","액터","Actor","ㄱ 액터"]},{"label":"②","accept":["ㄴ","객체","Object","ㄴ 객체"]},{"label":"③","accept":["ㄷ","생명선","Lifeline","ㄷ 생명선"]},{"label":"④","accept":["ㄹ","실행 상자","실행","활성 상자","활성화","Activation","Active Box","Execution Occurrence","실행 명세","ㄹ 실행 상자"]},{"label":"⑤","accept":["ㅁ","메시지","Message","ㅁ 메시지"]}],"hint":"사람 / 상자 / 세로 점선 / 세로 막대 / 화살표","explain":"정답: ① 액터 ② 객체 ③ 생명선 ④ 실행 상자(활성 상자) ⑤ 메시지\n- 그 밖의 구성: 객체 소멸(생명선 끝의 X), 프레임(alt·loop 같은 조합 조각)\n- 메시지 표기: 동기 메시지는 실선 + 채운 화살촉, 비동기 메시지는 실선 + 열린 화살촉, 응답(반환)은 점선 화살표\n- 링크는 커뮤니케이션 다이어그램, 노드는 배치 다이어그램의 구성 요소다"},{"id":"design-048","subject":"design","topic":"UML","sub":"유스케이스 다이어그램","type":"blank","level":3,"q":"다음은 유스케이스 다이어그램에 대한 설명이다. ( ① )~( ③ )에 들어갈 알맞은 용어를 쓰시오.","box":"온라인 쇼핑몰에서 '주문하기'를 할 때는 반드시 '사용자 인증'이 함께 수행된다. 이처럼 기본 유스케이스를 수행할 때 다른 유스케이스가 항상 같이 수행되는 관계를 ( ① ) 관계라 한다.\n'주문하기' 도중 사용자가 원할 때만 '쿠폰 적용'이 수행된다. 이처럼 특정 조건을 만족할 때만 다른 유스케이스가 덧붙어 수행되는 관계를 ( ② ) 관계라 한다.\n'주문하기'를 요청하는 고객처럼 시스템 바깥에서 시스템과 상호작용하는 사람이나 외부 시스템을 ( ③ )라 한다.","answers":[{"label":"①","accept":["포함","include","\u003c\u003cinclude>>","포함 관계"]},{"label":"②","accept":["확장","extend","\u003c\u003cextend>>","확장 관계"]},{"label":"③","accept":["액터","Actor"]}],"hint":"① 항상 ② 가끔 ③ 사람 모양","explain":"정답: ① 포함(include) ② 확장(extend) ③ 액터(Actor)\n- 화살표 방향: «include»는 기본 → 포함되는 유스케이스, «extend»는 확장 → 기본 유스케이스 (둘 다 점선 화살표)\n- 유스케이스 다이어그램 구성: 시스템(시스템 범위, 사각형), 액터(주액터·부액터), 유스케이스(타원), 관계(연관·포함·확장·일반화)\n- 주액터는 시스템을 사용해 이득을 얻는 쪽, 부액터는 주액터의 목적 달성을 돕는 외부 시스템\n\n| 구분 | 다이어그램 |\n|---|---|\n| 구조(정적) | 클래스, 객체, 컴포넌트, 배치, 복합체 구조, 패키지 |\n| 행위(동적) | 유스케이스, 시퀀스, 커뮤니케이션, 상태, 활동, 상호작용 개요, 타이밍 |\n- 두음: 구조 '클객컴배복패', 행위 '유시커상활타' (+상호작용 개요)\n- 행위 다이어그램 개수는 출처마다 다르다: UML 2.5 표준과 다수 교재는 상호작용 개요를 넣어 7개, 정처기 감자는 빼고 6개(유시커상활타)\n- 구조 쪽도 UML 2.5 표준은 프로파일 다이어그램을 더해 7개다. 교재는 보통 위 6개만 적는다"},{"id":"design-049","subject":"design","topic":"UML","sub":"클래스 관계","type":"blank","level":3,"q":"다음은 클래스 다이어그램의 관계 표기와 예이다. ( ① )~( ③ )에 들어갈 관계를 쓰시오.","box":"| 관계 | 표기 | 예 |\n|---|---|---|\n| ( ① ) | 실선 + 전체 쪽에 속이 채워진 마름모(◆) | 집과 방: 집이 없어지면 방도 없어진다 |\n| 집합 | 실선 + 전체 쪽에 속이 빈 마름모(◇) | 학과와 학생: 학과가 없어져도 학생은 남는다 |\n| ( ② ) | 점선 + 속이 빈 삼각형 화살표 | 로봇청소기 클래스가 '청소할 수 있음' 인터페이스를 구현한다 |\n| ( ③ ) | 점선 + 열린 화살표 | 개발자 객체가 책 객체를 매개변수로 받아 잠깐 쓴다 |","answers":[{"label":"①","accept":["포함","Composition","합성","복합","포함 관계","합성 관계","복합 관계","컴포지션"]},{"label":"②","accept":["실체화","Realization","실현","실체화 관계"]},{"label":"③","accept":["의존","Dependency","의존 관계"]}],"hint":"① 운명 공동체 ② 인터페이스 약속 ③ 잠깐","explain":"정답: ① 포함(Composition, 합성) ② 실체화(Realization) ③ 의존(Dependency)\n- 포함 vs 집합: 부분의 생명주기가 전체에 묶이면 포함(◆), 따로 살면 집합(◇)\n- 실체화 vs 일반화: 둘 다 빈 삼각형. 인터페이스 구현이면 점선(실체화), 클래스 상속이면 실선(일반화)\n\n| 관계 | 표기 | 의미·예 |\n|---|---|---|\n| 연관(Association) | 실선 (방향이 있으면 화살표) | 계속 참조하는 관계. 차-엔진 |\n| 집합(Aggregation) | 실선 + 전체 쪽 빈 마름모 ◇ | 전체-부분, 부분이 따로 존재. 학과-학생 |\n| 포함(Composition) | 실선 + 전체 쪽 채운 마름모 ◆ | 전체-부분, 생명주기가 같음. 집-방 |\n| 일반화(Generalization) | 실선 + 빈 삼각형 화살표 | is-a, 상속. 버스→차 |\n| 실체화(Realization) | 점선 + 빈 삼각형 화살표 | 인터페이스 구현. 로봇청소기→청소 가능 |\n| 의존(Dependency) | 점선 + 열린 화살표 | 잠깐 사용(매개변수·지역 변수). TV→리모컨 |\n- 번역어가 여러 개다: 집합 = 집약, 포함 = 합성 = 복합\n- 마름모 2개(포함·집합), 화살표 2개(연관·의존), 빈 삼각형 2개(일반화·실체화). 실선이 강하고 점선이 약하다"},{"id":"design-050","subject":"design","topic":"UML","sub":"클래스 다이어그램","type":"blank","level":3,"q":"다음 클래스 다이어그램을 보고 ( ① )~( ⑤ )에 들어갈 알맞은 용어를 쓰시오. (①~④는 접근 제어자를 영문으로 쓴다)","box":"| Account |\n|---|\n| - balance: int |\n| # owner: String |\n| ~ branchCode: String |\n| + deposit(amount: int): void |\n\n- 기호 `-`는 ( ① ), `#`는 ( ② ), `~`는 ( ③ ), `+`는 ( ④ ) 접근을 뜻한다.\n- Account와 Transaction을 잇는 연관선 양 끝에 `1`과 `0..*`처럼 연관된 객체 수를 적은 것을 ( ⑤ )라 한다.","answers":[{"label":"①","accept":["private"]},{"label":"②","accept":["protected"]},{"label":"③","accept":["package","default","package-private"]},{"label":"④","accept":["public"]},{"label":"⑤","accept":["다중성","Multiplicity","다중도"]}],"hint":"Java 접근 제어자 4개를 떠올린다","explain":"정답: ① private ② protected ③ package ④ public ⑤ 다중성(Multiplicity)\n| 기호 | 접근 제어자 | 접근 범위 |\n|---|---|---|\n| `+` | public | 어디서나 |\n| `-` | private | 그 클래스 안에서만 |\n| `#` | protected | 같은 패키지 + 하위 클래스 |\n| `~` | package (default) | 같은 패키지 안 |\n- 다중성 표기: `1` 정확히 하나, `0..1` 없거나 하나, `*`·`0..*` 0개 이상, `1..*` 1개 이상\n- 카디널리티(Cardinality)는 DB의 E-R·관계 모델 쪽 용어다. UML 클래스 다이어그램의 연관 끝 숫자는 다중성(Multiplicity)\n- 속성 표기 형식: 가시성 이름: 타입 (예: `- balance: int`)"},{"id":"design-051","subject":"design","topic":"객체지향","sub":"SOLID","type":"choice","past":"2022-2","level":2,"q":"다음 설명에 해당하는 객체지향 설계 원칙을 \u003c보기>에서 골라 쓰시오.","box":"- 클라이언트는 자신이 사용하지 않는 메서드와 의존 관계를 맺으면 안 된다.\n- 예를 들어 복합기 객체가 프린터·복사·팩스 기능을 모두 담은 큰 인터페이스 하나를 구현하면, 프린터 기능만 쓰는 클라이언트도 팩스 기능 변경의 영향을 받는다.\n- 그래서 큰 인터페이스를 클라이언트별로 작은 인터페이스 여러 개로 나눈다.","options":["ㄱ. SRP","ㄴ. OCP","ㄷ. LSP","ㄹ. ISP","ㅁ. DIP"],"answers":[{"label":"답","accept":["ㄹ","ISP","인터페이스 분리 원칙","Interface Segregation Principle","ㄹ ISP"]}],"hint":"인터페이스를 쪼갠다","explain":"정답: ㄹ ISP(Interface Segregation Principle, 인터페이스 분리 원칙)\n- SRP와 헷갈린다: SRP는 '클래스'의 책임을 하나로, ISP는 '인터페이스'를 사용자별로 나눈다\n\n| 약어 | 원칙 | 한 줄 |\n|---|---|---|\n| SRP | 단일 책임 원칙 | 클래스는 책임 하나, 바뀔 이유도 하나 |\n| OCP | 개방-폐쇄 원칙 | 확장에는 열리고 수정에는 닫힌다 |\n| LSP | 리스코프 치환 원칙 | 하위 타입은 상위 타입 자리를 대신할 수 있어야 한다 |\n| ISP | 인터페이스 분리 원칙 | 쓰지 않는 메서드에 의존하지 않게 인터페이스를 쪼갠다 |\n| DIP | 의존 역전 원칙 | 고수준·저수준 모두 추상화에 의존한다 |"},{"id":"design-052","subject":"design","topic":"객체지향","sub":"SOLID","type":"blank","level":2,"q":"다음은 객체지향 설계 원칙 SOLID에 대한 설명이다. ( ① )~( ④ )에 해당하는 원칙을 영문 약어로 쓰시오.","box":"( ① ): 하나의 클래스는 하나의 책임만 가져야 한다. 클래스를 바꿔야 하는 이유는 하나뿐이어야 한다.\n( ② ): 소프트웨어 개체는 확장에는 열려 있고, 수정에는 닫혀 있어야 한다. 기능을 추가할 때 기존 코드를 고치지 않는다.\n( ③ ): 하위 타입 객체는 언제나 상위 타입 객체를 대체할 수 있어야 한다. 부모 자리에 자식을 넣어도 프로그램이 올바르게 동작해야 한다.\n( ④ ): 고수준 모듈은 저수준 모듈에 의존하지 말고, 둘 다 추상화(인터페이스)에 의존해야 한다.","answers":[{"label":"①","accept":["SRP"]},{"label":"②","accept":["OCP"]},{"label":"③","accept":["LSP"]},{"label":"④","accept":["DIP"]}],"hint":"S·O·L·_·D","explain":"정답: ① SRP ② OCP ③ LSP ④ DIP (남은 하나 ISP는 2022-2 기출)\n- OCP 예: 결제 수단을 추가할 때 if 문을 고치지 않고 Payment 인터페이스 구현 클래스를 새로 만든다\n- LSP 위반 예: 정사각형이 직사각형을 상속하면 setWidth만 바꿔도 높이까지 바뀌어 부모처럼 쓸 수 없다\n- DIP 예: 서비스가 MySQLRepository가 아니라 Repository 인터페이스에 의존한다\n\n| 약어 | 원칙 | 한 줄 |\n|---|---|---|\n| SRP | 단일 책임 원칙 | 클래스는 책임 하나, 바뀔 이유도 하나 |\n| OCP | 개방-폐쇄 원칙 | 확장에는 열리고 수정에는 닫힌다 |\n| LSP | 리스코프 치환 원칙 | 하위 타입은 상위 타입 자리를 대신할 수 있어야 한다 |\n| ISP | 인터페이스 분리 원칙 | 쓰지 않는 메서드에 의존하지 않게 인터페이스를 쪼갠다 |\n| DIP | 의존 역전 원칙 | 고수준·저수준 모두 추상화에 의존한다 |"},{"id":"design-053","subject":"design","topic":"객체지향","sub":"럼바우 OMT","type":"blank","past":"2021-2","level":2,"q":"다음은 럼바우(Rumbaugh)의 객체지향 분석 기법에 대한 설명이다. ( ① )~( ③ )에 들어갈 알맞은 용어를 \u003c보기>에서 골라 쓰시오.","box":"( ① ) 모델링: 입력값이 출력값으로 바뀌는 과정을 프로세스 중심으로 표현한다. 자료 흐름도(DFD)를 쓴다.\n( ② ) 모델링: 시간의 흐름에 따른 객체들의 상태 변화와 제어 흐름을 표현한다. 상태 다이어그램을 쓴다.\n( ③ ) 모델링: 시스템에서 요구하는 객체를 찾아 속성과 연산을 정하고, 객체들 사이의 관계를 규정한다. ER 다이어그램(객체 다이어그램)을 쓴다.","options":["ㄱ. Operation","ㄴ. Sequence","ㄷ. Information","ㄹ. Transaction","ㅁ. Function","ㅂ. I/O","ㅅ. Dynamic","ㅇ. Architecture","ㅈ. Cause-Effect","ㅊ. Constraint","ㅋ. Rebuilding","ㅌ. Duration"],"answers":[{"label":"①","accept":["Function","기능","Functional","ㅁ","ㅁ Function"]},{"label":"②","accept":["Dynamic","동적","ㅅ","ㅅ Dynamic"]},{"label":"③","accept":["Information","Object","객체","정보","ㄷ","ㄷ Information"]}],"hint":"DFD / 상태 다이어그램 / ER 다이어그램","explain":"정답: ① Function(기능) ② Dynamic(동적) ③ Information(객체·정보)\n- 출처마다 정답 표기가 다름: 문어CBT 등은 ③을 Object(객체)로 적었다. 복원된 보기에는 Object가 없고 Information만 있어 보기에서 고르면 Information이 답이다\n- 객체 모델링의 다른 이름이 정보 모델링(Information Modeling)이라 둘은 같은 것을 가리킨다\n\n| 모델링 | 무엇을 | 도구 |\n|---|---|---|\n| 객체(정보) | 객체·속성·연산·관계, 정적 구조 | 객체 다이어그램, ER 다이어그램 |\n| 동적 | 시간에 따른 상태 변화·제어 흐름 | 상태 다이어그램 |\n| 기능 | 입력 → 출력 처리 과정, 자료 흐름 | 자료 흐름도(DFD) |\n- 진행 순서: 객체 → 동적 → 기능 ('객동기')"},{"id":"design-054","subject":"design","topic":"객체지향","sub":"럼바우 OMT","type":"order","level":2,"q":"럼바우(Rumbaugh)의 객체 모델링 기법(OMT)에서 분석 활동의 순서를 \u003c보기>에서 골라 기호로 쓰시오.","options":["ㄱ. 기능 모델링","ㄴ. 객체 모델링","ㄷ. 동적 모델링"],"answers":[{"label":"답","accept":["ㄴ-ㄷ-ㄱ"]}],"hint":"객동기","explain":"정답: ㄴ → ㄷ → ㄱ (객체 → 동적 → 기능)\n- 무엇이 있는지(객체) 정하고 → 언제 어떻게 바뀌는지(동적) 보고 → 무엇을 계산하는지(기능) 정한다\n- 도구 짝: 객체-객체 다이어그램(ER), 동적-상태 다이어그램, 기능-DFD\n- OMT = Object Modeling Technique"},{"id":"design-055","subject":"design","topic":"객체지향","sub":"객체지향 개념","type":"blank","level":1,"q":"다음은 객체지향의 주요 개념에 대한 설명이다. ( ① )~( ⑥ )에 해당하는 용어를 \u003c보기>에서 골라 쓰시오.","box":"( ① ): 데이터(속성)와 그 데이터를 처리하는 함수(메서드)를 하나의 단위로 묶는 것이다.\n( ② ): 객체 내부의 구현 세부를 외부에서 볼 수 없게 감추고, 공개된 인터페이스로만 접근하게 하는 것이다. private 접근 제어자로 실현한다.\n( ③ ): 상위 클래스의 속성과 메서드를 하위 클래스가 물려받아 그대로 쓰거나 확장하는 것이다.\n( ④ ): 같은 이름의 메시지(메서드 호출)에 대해 객체마다 서로 다른 방식으로 응답하는 성질이다. 오버로딩과 오버라이딩으로 구현한다.\n( ⑤ ): 불필요한 세부는 버리고 공통된 핵심 특징만 뽑아 모델로 표현하는 것이다.\n( ⑥ ): 객체에게 어떤 행위를 하도록 요청하는 명령으로, 수신 객체·메서드 이름·인자로 이루어진다. 객체들은 이것을 주고받으며 협력한다.","options":["ㄱ. 캡슐화","ㄴ. 정보 은닉","ㄷ. 상속","ㄹ. 다형성","ㅁ. 추상화","ㅂ. 메시지","ㅅ. 인스턴스"],"answers":[{"label":"①","accept":["ㄱ","캡슐화","Encapsulation","ㄱ 캡슐화"]},{"label":"②","accept":["ㄴ","정보 은닉","Information Hiding","정보은닉","ㄴ 정보 은닉"]},{"label":"③","accept":["ㄷ","상속","Inheritance","ㄷ 상속"]},{"label":"④","accept":["ㄹ","다형성","Polymorphism","ㄹ 다형성"]},{"label":"⑤","accept":["ㅁ","추상화","Abstraction","ㅁ 추상화"]},{"label":"⑥","accept":["ㅂ","메시지","Message","ㅂ 메시지"]}],"hint":"묶기 / 숨기기 / 물려받기 / 여러 모양 / 뽑아내기 / 요청","explain":"정답: ① 캡슐화 ② 정보 은닉 ③ 상속 ④ 다형성 ⑤ 추상화 ⑥ 메시지\n- 캡슐화 vs 정보 은닉: 캡슐화는 '묶는 것', 정보 은닉은 '숨기는 것'. 캡슐화하면 정보 은닉이 쉬워진다\n- 클래스(틀) → 객체(실체) / 인스턴스: 클래스로 만든 객체 하나하나 / 속성(데이터), 메서드(연산)\n\n다형성 구현 두 가지\n| 구분 | 오버로딩(Overloading) | 오버라이딩(Overriding) |\n|---|---|---|\n| 위치 | 같은 클래스 안 | 상속 관계(하위 클래스) |\n| 이름 | 같음 | 같음 |\n| 매개변수 | 개수·타입이 달라야 함 | 같아야 함 |\n| 결정 시점 | 컴파일 시점 | 실행 시점(동적 바인딩) |\n- 객체지향 관계: is-a 일반화, is-part-of 집단화(집합), is-instance-of 분류화, is-member-of 연관화"},{"id":"design-056","subject":"design","topic":"객체지향","sub":"생성자","type":"essay","past":"2020-3","level":2,"q":"C++에서 생성자(Constructor)가 무엇인지 약술하시오.","answers":[{"label":"답","accept":[],"model":"객체가 생성될 때 자동으로 호출되는 특수한 메서드로, 객체의 멤버 변수를 초기화한다. 클래스와 이름이 같고 반환형이 없다."}],"hint":"new로 객체를 만드는 순간 저절로 불린다","explain":"채점 포인트\n- '객체 생성 시 자동 호출' + '초기화' 두 가지가 들어가야 한다\n- 덧붙이면 좋은 것: 클래스와 이름이 같다, 반환형이 없다, 매개변수를 달리해 여러 개 둘 수 있다(오버로딩)\n\n관련 개념\n- 소멸자(Destructor): 객체가 사라질 때 자동 호출, 자원 정리. C++은 ~클래스명()\n- 기본 생성자: 생성자를 하나도 안 쓰면 컴파일러가 매개변수 없는 생성자를 넣어 준다\n- Java: this(...)는 같은 클래스의 다른 생성자, super(...)는 부모 생성자 호출. 자식 생성자는 부모 생성자를 먼저 실행한다"},{"id":"design-057","subject":"design","topic":"객체지향","sub":"객체지향 분석 방법론","type":"blank","level":1,"q":"다음은 객체지향 분석 방법론에 대한 설명이다. ( ① )~( ④ )에 해당하는 방법론을 \u003c보기>에서 골라 쓰시오.","box":"( ① ): 미시적
