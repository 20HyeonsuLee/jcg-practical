      i++; out.push(`<pre class="code"><code>${highlight(buf.join('\n'), lang)}</code></pre>`); continue;
    }
    if (/^\s*\|/.test(L)){
      const rows = []; while (i < lines.length && /^\s*\|/.test(lines[i])) rows.push(lines[i++]);
      out.push('<div class="tw">' + mdTable(rows) + '</div>'); continue;
    }
    if ((m = L.match(/^(#{3,6})\s+(.*)/))){ out.push(`<div class="dh"><b>${inline(m[2])}</b></div>`); i++; continue; }
    if (/^\s*([-*]|\d+\.)\s/.test(L)){
      const items = [];
      while (i < lines.length && (m = lines[i].match(/^(\s*)([-*]|\d+\.)\s+(.*)/))){
        const d = Math.min(3, Math.floor(m[1].length / 2)), ol = /\d/.test(m[2]);
        const nx = m[3].startsWith('{{nx}}');
        items.push(`<div class="li d${d}${ol ? ' ol' : ''}${nx ? ' nx' : ''}">${ol ? `<span class="n">${m[2]}</span>` : ''}${inline(nx ? m[3].slice(6) : m[3])}</div>`); i++;
      }
      out.push('<div class="ul">' + items.join('') + '</div>'); continue;
    }
    if (/^>/.test(L)){
      const buf = [];
      while (i < lines.length && /^>/.test(lines[i])) buf.push(lines[i++].replace(/^>\s?/, ''));
      const cm = buf[0].match(/^\[!(\w+)\][+-]?\s*(.*)$/);
      if (cm){
        const type = cm[1].toLowerCase(), [icon, name] = CALLOUT[type] || ['📌', type];
        out.push(`<div class="co co-${type}"><div class="co-t">${icon} ${inline(cm[2] || name)}</div>${mdDoc(buf.slice(1).join('\n'))}</div>`);
      } else out.push(`<blockquote>${mdDoc(buf.join('\n'))}</blockquote>`);
      continue;
    }
    if ((m = L.match(/^\s*기출\s*[:：]\s*(.*)$/))){ out.push(`<p class="gc"><span class="gtag">기출</span>${inline(m[1])}</p>`); i++; continue; }
    if (/^\s*-{3,}\s*$/.test(L)){ out.push('<hr>'); i++; continue; }
    if ((m = L.match(/^!\[(\d*)\]\((data:image\/[a-z+]+;base64,[A-Za-z0-9+\/=]+)\)\s*$/))){
      out.push(`<img class="dimg" src="${m[2]}"${m[1] ? ` style="width:${m[1]}px"` : ''} alt="">`); i++; continue;
    }
    if (L.trim() === ''){ i++; continue; }
    out.push('<p>' + inline(L) + '</p>'); i++;
  }
  return out.join('');
}
function shuffle(a){ for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function dday(){
  const now = new Date(), ex = new Date(EXAM_DATE + 'T00:00:00');
  const d = Math.ceil((ex - new Date(now.getFullYear(), now.getMonth(), now.getDate())) / 864e5);
  return d > 0 ? 'D-' + d : d === 0 ? 'D-DAY' : '시험 종료';
}

/* ---------- 채점 ---------- */
function norm(s){
  const base = String(s ?? '').normalize('NFC').toLowerCase();
  const stripped = base.replace(/[\s\-_,.·・\/→⇒>()\[\]{}'"`:;~<]/g, '');
  // 기호만으로 된 답(//, ->, <<)은 공백만 지우고 비교
  return stripped || base.replace(/\s/g, '');
}
function variants(acc){
  const out = new Set();
  for (const a of acc){
    out.add(norm(a));
    const m = String(a).match(/^(.*?)\s*[(（](.*?)[)）]\s*$/);
    if (m){ if (m[1].trim()) out.add(norm(m[1])); if (m[2].trim()) out.add(norm(m[2])); }
  }
  out.delete('');
  return out;
}
// 여러 개 고르는 답("ㄱ, ㄷ, ㅁ")은 순서와 상관없이 비교
function tokenKey(s, bySpace){
  return String(s ?? '').split(bySpace ? /[,，、\s]+/ : /[,，、]/).map(norm).filter(Boolean).sort().join('|');
}
// "모두 고르시오"류 또는 보기 선택형만 순서 무관. 배열 상태·천 단위 쉼표 같은 답은 순서대로 비교
function unorderedOK(q){
  return q.type !== 'order' && (q.type === 'choice' || /모두|있는 대로|전부/.test(q.q + ' ' + (q.box || '')));
}
function matchOne(acc, inp, q){
  if (variants(acc).has(norm(inp))) return true;
  if (!unorderedOK(q) || !String(inp ?? '').trim()) return false;
  for (const a of acc){
    if (!/[,，、]/.test(a)) continue;
    const key = tokenKey(a, false);
    if (tokenKey(inp, false) === key || tokenKey(inp, true) === key) return true;
    // 한 글자 기호만 나열한 경우(ㄷㅁㅅㅇ)
    const parts = key.split('|');
    if (parts.every(x => [...x].length === 1) && [...norm(inp)].sort().join('|') === key) return true;
  }
  return false;
}
function normOut(s){ return String(s ?? '').replace(/\r/g, '').split('\n').map(l => l.replace(/\s+$/, '')).join('\n').replace(/^\n+|\n+$/g, ''); }
function normSql(s){ return String(s ?? '').toLowerCase().replace(/;\s*$/, '').replace(/\s+/g, ' ').replace(/\s*([(),=<>])\s*/g, '$1').trim(); }
// 반환: 빈칸별 true/false/null(자기 채점)
function judge(q, inputs){
  if (q.type === 'essay') return q.answers.map(() => null);
  if (q.type === 'output'){
    const exp = normOut(q.answers[0].accept[0]), got = normOut(inputs[0]);
    return [exp === got || exp.replace(/\s/g, '') === got.replace(/\s/g, '')];
  }
  if (q.type === 'sql'){
    const got = normSql(inputs[0]);
    return [q.answers[0].accept.some(a => normSql(a) === got) ? true : (got ? null : false)];
  }
  if (q.anyOrder){
    const pools = q.answers.map(a => variants(a.accept)), used = new Set();
    return inputs.map(inp => {
      const n = norm(inp);
      for (let k = 0; k < pools.length; k++){ if (!used.has(k) && (pools[k].has(n) || matchOne(q.answers[k].accept, inp, q))){ used.add(k); return true; } }
      return false;
    });
  }
  return q.answers.map((a, k) => matchOne(a.accept, inputs[k], q));
}
function suggest(res){
  if (res.some(r => r === null)) return null;
  const ok = res.filter(Boolean).length;
  return ok === res.length ? 'o' : ok === 0 ? 'x' : 't';
}

function onConceptScroll(){
  if (!CV || !CV.secs.length || CV.raf) return;
  CV.raf = requestAnimationFrame(() => {
    if (!CV) return;
    CV.raf = 0;
    const off = (parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--hh')) || 49)
              + (parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--ch')) || 42) + 24;
    let cur = 0;
    for (let k = 0; k < CV.secs.length; k++){ if (CV.secs[k].getBoundingClientRect().top - off <= 0) cur = k; else break; }
    const docH = document.documentElement.scrollHeight - innerHeight;
    if (docH > 0 && scrollY >= docH - 4) cur = CV.secs.length - 1;
    CV.bar.style.width = (docH > 0 ? Math.min(100, scrollY / docH * 100) : 100) + '%';
    if (cur === CV.cur) return;
    CV.cur = cur;
    const r = cread[CV.key] || (cread[CV.key] = {max: -1, last: 0});
    r.last = cur; if (cur > r.max) r.max = cur;
    CV.chips.forEach((c, k) => { c.classList.toggle('on', k === cur); c.classList.toggle('seen', k <= r.max); });

    if (c){

      else CV.nav.scrollTo({left: c.offsetLeft - CV.nav.clientWidth / 2 + c.offsetWidth / 2, behavior: 'smooth'});
    }
    saveCread();
  });
}

  <div class="nav">
    <button class="btn" data-act="prev" ${S.i === 0 ? 'disabled' : ''}>← 이전</button>
    <button class="btn" data-act="next">${S.i === n - 1 ? (S.mode === 'exam' ? '마지막 문제' : '결과 보기') : '다음 →'}</button>
  </div>
  <div class="dots">${S.ids.map((id, k) => {
    const m = S.marks[id], a = S.inputs[id]?.some(v => v && v.trim());
    return `<span class="dot ${k === S.i ? 'cur' : ''} ${m || (S.mode === 'exam' && a ? 'a' : '')}" data-act="jump" data-k="${k}">${k + 1}</span>`;
  }).join('')}</div>`;
  app.innerHTML = h;
  window.scrollTo(0, 0);
  if (!shown){ const f = app.querySelector('[data-blank]'); if (f) f.focus({preventScroll:true}); }
}

function go(k){
  readInputs();
  if (k < 0) return;
  if (k >= S.ids.length){ if (S.mode === 'exam') return; return renderResult(); }
  S.i = k; renderQuiz();
}
function check(){
  readInputs();
  const q = curQ();
  S.revealed[q.id] = true;
  renderQuiz();
}
function doMark(r){
  const q = curQ();
  S.marks[q.id] = r;
  record(q.id, r);
  if (S.mode === 'review'){ renderQuiz(); return; }
  go(S.i + 1);
}
function submitExam(){
  readInputs();
  const blank = S.ids.filter(id => !(S.inputs[id] || []).some(v => v && v.trim())).length;
  if (!confirm(blank ? `빈 답안 ${blank}문항이 있습니다. 제출할까요?` : '제출하고 채점할까요?')) return;
  stopTimer();
  for (const id of S.ids){
    const q = BYID[id], res = judge(q, S.inputs[id] || []);
    S.auto[id] = res;
    const sg = suggest(res) || 'x';
    S.marks[id] = sg; record(id, sg);
  }
  S.mode = 'review'; S.title = '실전 모의고사';
  renderResult();
}

/* ---------- 화면: 결과 ---------- */
function renderResult(){
  stopTimer(); CV = null; setWide(false);
  readInputs();
  const ids = S.ids, c = {o:0, t:0, x:0, '-':0};
  for (const id of ids) c[S.marks[id] || '-']++;
  const score = c.o * 5 + c.t * 2.5;
  const isExam = S.mode === 'review';
  const wrong = ids.filter(id => ['x', 't'].includes(S.marks[id]));
  let h = `<div class="card">
    <div class="muted small">${esc(S.title)} 결과</div>
    ${isExam ? `<div class="score">${score}점 <span class="muted small" style="font-weight:400">/ 100 · 합격선 60</span></div>` :
      `<div class="score">${c.o} / ${ids.length}</div>`}
    <div class="muted small">맞음 ${c.o} · 애매 ${c.t} · 틀림 ${c.x}${c['-'] ? ' · 안 넘김 ' + c['-'] : ''}${isExam ? ' · 애매는 2.5점으로 계산' : ''}</div>
    <div class="row" style="margin-top:12px">
      <button class="btn primary" data-act="retry-wrong" ${wrong.length ? '' : 'disabled'}>틀린 것만 다시 (${wrong.length})</button>
      ${S.origin ? `<button class="btn" data-act="back-concept">개념으로 돌아가기</button>` : ''}
      <button class="btn" data-act="home">홈</button>
    </div>
  </div>
  <h2>문항별</h2>
  <div class="card reslist">${ids.map((id, k) => {
    const q = BYID[id], m = S.marks[id];
    const plain = x => String(x).replace(/[*`|_]/g, ' ').replace(/^\s*-\s*/gm, '').replace(/\s+/g, ' ').trim();
    const head = plain(q.box && !q.box.trim().startsWith('|') ? q.box : q.q).slice(0, 70);
    return `<div class="it" data-act="open" data-k="${k}"><span class="st ${m || ''}">${{o:'○', t:'△', x:'✕'}[m] || '·'}</span><span class="muted small" style="min-width:110px">${esc(SUBJ[q.subject]?.name)} · ${esc(q.topic)}</span><span>${esc(head)}</span></div>`;
  }).join('')}</div>`;
  app.innerHTML = h;
  window.scrollTo(0, 0);
}

/* ---------- 이벤트 ---------- */
app.addEventListener('click', e => {
  const nx = e.target.closest('.doc .nx');
  if (nx && !document.body.classList.contains('nx-off')){ nx.classList.toggle('show'); return; }
  const t = e.target.closest('[data-act]'); if (!t || t.disabled) return;
  const act = t.dataset.act, s = t.dataset.s;
  const bySubj = k => DATA.filter(q => q.subject === k);
  switch (act){
    case 'exam': startExam(); break;
    case 'concept': renderConcept(s); break;
    case 'cjump': cjump(+t.dataset.k, true); break;
    case 'nx-toggle': {
      const off = document.body.classList.toggle('nx-off');
      localStorage.setItem(KEY + ':nx', off ? 'off' : 'on');
      t.textContent = nxLabel(); break;
    }
    case 'topic-from': startPractice(SUBJ[s].name + ' · ' + t.dataset.t, bySubj(s).filter(q => q.topic === t.dataset.t), {origin: {key: s, k: +t.dataset.k}}); break;
    case 'back-concept': { const o = S.origin; renderConcept(o.key, o.k); break; }
    case 'review': startPractice('오답 · 애매 복습', wrongList(filtered(DATA)), {raw:true, shuffle:true}); break;
    case 'unseen': startPractice('안 푼 문제 랜덤', shuffle(unseenList(filtered(DATA))).slice(0, 20), {raw:true}); break;
    case 'subj': startPractice(SUBJ[s].name, bySubj(s)); break;
    case 'subj-unseen': startPractice(SUBJ[s].name + ' · 안 푼 것', unseenList(filtered(bySubj(s))), {raw:true}); break;
    case 'subj-wrong': startPractice(SUBJ[s].name + ' · 오답', wrongList(filtered(bySubj(s))), {raw:true}); break;
    case 'toggle-topics': document.getElementById('tp-' + s).classList.toggle('open'); break;
    case 'topic': startPractice(SUBJ[s].name + ' · ' + t.dataset.t, bySubj(s).filter(q => q.topic === t.dataset.t)); break;
    case 'reset': if (confirm('푼 기록을 모두 지울까요?')){ for (const k of Object.keys(store)) delete store[k]; save(); renderHome(); } break;
    case 'hint': readInputs(); S.hinted[curQ().id] = true; renderQuiz(); break;
    case 'check': check(); break;
    case 'mark': doMark(t.dataset.r); break;
    case 'prev': go(S.i - 1); break;
    case 'next': go(S.i + 1); break;
    case 'jump': go(+t.dataset.k); break;
    case 'finish': renderResult(); break;
    case 'submit': submitExam(); break;
    case 'home': renderHome(); break;
    case 'open': S.i = +t.dataset.k; if (S.mode !== 'review'){ S.revealed[S.ids[S.i]] = true; } renderQuiz(); break;
    case 'retry-wrong': {
      const qs = S.ids.filter(id => ['x', 't'].includes(S.marks[id])).map(id => BYID[id]);
      startPractice('틀린 것 다시', qs, {raw:true, origin: S.origin});
      break;
    }
  }
});
app.addEventListener('change', e => {
  const p = e.target.dataset.pref; if (!p) return;
  prefs[p] = e.target.checked; savePrefs(); renderHome();
});
document.addEventListener('keydown', e => {
  if (CV && !S){
    if (/^(INPUT|TEXTAREA)$/.test(document.activeElement?.tagName) || e.metaKey || e.ctrlKey || e.altKey) return;
    const base = Math.max(CV.cur, 0);
    if (e.code === 'KeyJ' || e.code === 'KeyS'){ e.preventDefault(); cjump(Math.min(CV.secs.length - 1, base + 1)); }
    if (e.code === 'KeyK' || e.code === 'KeyW'){ e.preventDefault(); cjump(Math.max(0, base - 1)); }
    return;
  }
  if (!S || !app.querySelector('.qmeta')) return;
  const q = curQ(), shown = S.mode === 'review' || S.revealed[q.id];
  const inField = /^(INPUT|TEXTAREA)$/.test(document.activeElement?.tagName) && !document.activeElement.readOnly;
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing){
    if (inField && document.activeElement.tagName === 'TEXTAREA' && !(e.metaKey || e.ctrlKey)) return;
    if (inField && document.activeElement.tagName === 'INPUT'){
      const fields = [...app.querySelectorAll('[data-blank]')], idx = fields.indexOf(document.activeElement);
      if (idx >= 0 && idx < fields.length - 1){ e.preventDefault(); fields[idx + 1].focus(); return; }
    }
    e.preventDefault();
    if (S.mode === 'practice' && !shown) check();
    else if (S.mode === 'exam') go(S.i + 1);
    else if (shown && S.mode === 'practice'){ const sg = S.marks[q.id] || suggest(S.auto[q.id] || []); if (sg) doMark(sg); }
    return;
  }
  if (inField) return;
  if (shown && ['1', '2', '3'].includes(e.key)){ doMark({1:'o', 2:'t', 3:'x'}[e.key]); return; }
  if (e.key === 'ArrowRight'){ go(S.i + 1); }
  if (e.key === 'ArrowLeft'){ go(S.i - 1); }
});
$('#home-link').addEventListener('click', () => {
  if (S && S.mode === 'exam' && !confirm('모의고사를 그만두고 홈으로 갈까요?')) return;
  renderHome();
});
function applyTheme(){
  const dark = prefs.theme ? prefs.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
}
$('#theme').addEventListener('click', () => {
  prefs.theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  savePrefs(); applyTheme();
});
$('#dday').textContent = dday();
applyTheme();
renderHome();
</script>
</body>
</html>
