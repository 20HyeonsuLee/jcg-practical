시간과 경과 시간의 차이: 응답 시간은 출력이 **시작**될 때까지, 경과 시간은 출력이 **완료**될 때까지\n- 4대 지표 두음 '처응경자': 처리량 · 응답 시간 · 경과 시간 · 자원 사용률\n- 성능 테스트 도구는 이 지표들로 목표 달성 여부를 확인한다\n- 성능 저하 원인 예: DB 락, 불필요한 대량 Fetch, 커넥션 누수, 커넥션 풀 크기 부족"},{"id":"dev-038","subject":"dev","topic":"테스트 관리","sub":"테스트 오라클","type":"short","past":"2020-4","level":2,"q":"테스트 오라클 중 특정한 몇 개의 입력값에 대해서만 기대하는 결과를 제공하는 오라클을 쓰시오.","answers":[{"label":"답","accept":["샘플링 오라클","샘플링","Sampling Oracle","Sampling"]}],"hint":"표본","explain":"정답: 샘플링(Sampling) 오라클\n- 테스트 오라클: 테스트 결과가 맞는지 판단하려고 미리 정의한 참 값을 대입해 비교하는 기법\n\n| 종류 | 기대 결과를 주는 범위 |\n|---|---|\n| 참(True) | 모든 입력값 → 모든 오류 검출 |\n| 샘플링(Sampling) | 특정 몇몇 입력값만 |\n| 휴리스틱(Heuristic, 추정) | 특정 입력값은 기대 결과, 나머지는 추정 |\n| 일관성 검사(Consistent) | 변경 전후 결과가 같은지 비교 |\n- 두음 '참샘휴일'. 휴리스틱 = 샘플링 + 추정\n- 오라클 특징: 제한된 검증, 수학적 기법, 자동화 가능"},{"id":"dev-039","subject":"dev","topic":"테스트 관리","sub":"테스트 케이스 구성 요소","type":"blank","past":"2021-3","level":3,"q":"다음은 로그인 기능 테스트 케이스다. 표의 ①~③ 열에 알맞은 테스트 케이스 구성 요소를 쓰시오.","box":"| 식별자 ID | 테스트 항목 | ( ① ) | ( ② ) | ( ③ ) |\n|---|---|---|---|---|\n| DS-45S-21 | 로그인 기능 | 사용자 초기 화면 | 아이디(Test11) / 비밀번호(test@#@!#) | 로그인 성공 |\n| DS-45S-25 | 로그인 기능 | 사용자 초기 화면 | 아이디(Test11) / 비밀번호(\"\") | 로그인 실패 |","answers":[{"label":"①","accept":["테스트 조건","Test Condition"]},{"label":"②","accept":["테스트 데이터","Test Data"]},{"label":"③","accept":["예상 결과","기대 결과","Expected Result"]}],"hint":"실행 전 상태 / 넣는 값 / 나와야 할 것","explain":"정답: ① 테스트 조건 ② 테스트 데이터 ③ 예상 결과\n- '사용자 초기 화면'은 테스트를 시작할 때의 전제 상태 → 테스트 조건\n- 아이디·비밀번호 값은 입력 → 테스트 데이터\n- 로그인 성공·실패는 실행 뒤 나와야 할 결과 → 예상 결과\n- 테스트 케이스 = 입력값 + 실행 조건 + 기대 결과로 된 테스트 항목 명세서. 명세 기반(블랙박스) 테스트의 설계 산출물\n- 실제 2021년 3회는 보기(테스트 조건, 테스트 데이터, 예상 결과)를 주고 고르게 했다. 2025년 3회에 보기를 늘려 다시 나왔다(dev-040)"},{"id":"dev-040","subject":"dev","topic":"테스트 관리","sub":"테스트 케이스 구성 요소","type":"blank","past":"2025-3","level":3,"q":"다음은 결제 기능의 테스트 케이스다. ①~③에 들어갈 알맞은 용어를 \u003c보기>에서 골라 쓰시오.","box":"| 식별자 | 테스트 항목 | ( ① ) | ( ② ) | ( ③ ) |\n|---|---|---|---|---|\n| PAY_001 | 결제 기능 | 로그인 상태, 결제 화면 | 결제 금액 5,000원 | 결제 성공 메시지 |\n| PAY_002 | 결제 기능 | 로그인 상태, 결제 화면 | 결제 금액 0원 | 결제 실패 메시지 |\n\n① 입력에 대한 전제나 검증 대상 조건 ② 테스트에 쓸 입력값 ③ 실행 후 기대되는 결과","options":["ㄱ. 테스트 조건","ㄴ. 테스트 환경","ㄷ. 테스트 유형","ㄹ. 테스트 데이터","ㅁ. 예상 결과","ㅂ. 수행 단계","ㅅ. 성공/실패 기준"],"answers":[{"label":"①","accept":["ㄱ","테스트 조건"]},{"label":"②","accept":["ㄹ","테스트 데이터"]},{"label":"③","accept":["ㅁ","예상 결과","기대 결과"]}],"hint":"2021년 3회와 같은 세 칸. 보기에 비슷한 함정이 늘었다","explain":"정답: ① ㄱ 테스트 조건 ② ㄹ 테스트 데이터 ③ ㅁ 예상 결과\n- 함정 보기: 테스트 환경(하드웨어·소프트웨어 구성), 수행 단계(절차), 성공/실패 기준(판정 기준)은 테스트 계획·절차 쪽 용어\n\n| 용어 | 뜻 |\n|---|---|\n| 테스트 케이스 | 특정 조건·입력으로 예상 결과를 검증하는 최소 단위 |\n| 테스트 시나리오 | 케이스를 적용 순서대로 묶은 집합(업무 흐름) |\n| 테스트 스크립트 | 자동화 도구로 실행하게 쓴 코드·절차 |\n- 표준(ISO/IEC/IEEE 29119-3)의 테스트 케이스 항목은 식별자·테스트 항목·입력 명세·출력 명세·환경 설정·특수 절차 요구·의존성 기술(dev-043)\n- 복원본마다 표 내용이 다르다. 묻는 세 칸은 같다"},{"id":"dev-041","subject":"dev","topic":"테스트 관리","sub":"테스트 원리","type":"blank","level":2,"q":"다음은 소프트웨어 테스트의 기본 원리에 대한 설명이다. ①~③에 알맞은 원리를 \u003c보기>에서 골라 쓰시오.","box":"① 애플리케이션 결함의 대부분은 소수의 특정 모듈에 몰려 있다. 파레토 법칙이 적용된다.\n② 결함을 모두 제거해도 사용자의 요구사항을 충족하지 못하면 그 소프트웨어는 품질이 높다고 할 수 없다.\n③ 소프트웨어의 특징, 테스트 환경, 테스터 역량 등 정황에 따라 테스트 결과가 달라질 수 있으므로 정황에 맞게 테스트해야 한다.","options":["ㄱ. 살충제 패러독스","ㄴ. 결함 집중","ㄷ. 오류-부재의 궤변","ㄹ. 완벽한 테스트 불가능","ㅁ. 정황 의존","ㅂ. 조기 테스트","ㅅ. 결함 존재 증명"],"answers":[{"label":"①","accept":["ㄴ","결함 집중","Defect Clustering"]},{"label":"②","accept":["ㄷ","오류-부재의 궤변","Absence of Errors Fallacy"]},{"label":"③","accept":["ㅁ","정황 의존","정황 의존성","Context Dependent"]}],"hint":"① 80:20 ② 결함 0인데도 실패 ③ 상황 따라","explain":"정답: ① ㄴ 결함 집중 ② ㄷ 오류-부재의 궤변 ③ ㅁ 정황 의존\n- 헷갈리는 쌍: 결함 존재 증명(ㅅ) '결함이 없다는 건 증명 못 함' vs 오류-부재의 궤변(ㄷ) '결함이 없어도 요구를 못 채우면 소용없음'\n- 살충제 패러독스(ㄱ): 같은 케이스 반복 → 새 결함 못 찾음 → 케이스를 주기적으로 갱신\n- 완벽한 테스트 불가능(ㄹ): 무한 경로·입력 → 위험과 우선순위로 범위를 정한다\n- 조기 테스트(ㅂ): 일찍 시작할수록 결함 수정 비용이 적다\n- 7원리 두음 '결완초집 살정오'"},{"id":"dev-042","subject":"dev","topic":"테스트 관리","sub":"테스트 오라클","type":"blank","level":2,"q":"다음은 테스트 오라클의 종류다. ①~③에 알맞은 오라클 이름을 쓰시오.","box":"- ( ① ) 오라클: 모든 테스트 케이스의 입력값에 대해 기대하는 결과를 제공한다. 발생한 모든 오류를 검출할 수 있다.\n- 샘플링 오라클: 특정한 몇몇 입력값에 대해서만 기대하는 결과를 제공한다.\n- ( ② ) 오라클: 특정 입력값에는 기대 결과를 제공하고, 나머지 입력값에는 추정으로 처리한다. 샘플링 오라클을 개선한 것이다.\n- ( ③ ) 오라클: 애플리케이션에 변경이 있을 때, 테스트 케이스의 수행 전과 후 결과값이 동일한지 확인한다.","answers":[{"label":"①","accept":["참","참 오라클","True","True Oracle"]},{"label":"②","accept":["휴리스틱","휴리스틱 오라클","추정","추정 오라클","Heuristic","Heuristic Oracle"]},{"label":"③","accept":["일관성 검사","일관성 검사 오라클","일관성","Consistent","Consistent Oracle"]}],"hint":"① 전부 ② 일부 + 어림짐작 ③ 수정 전후 비교","explain":"정답: ① 참(True) ② 휴리스틱(Heuristic, 추정) ③ 일관성 검사(Consistent)\n- 기대 결과를 주는 범위가 넓은 순: 참(전부) > 휴리스틱(일부 + 추정) > 샘플링(일부)\n- 일관성 검사 오라클은 변경 전후 비교라서 회귀 테스트에 쓰인다\n- 테스트 오라클 = 테스트 결과가 올바른지 판단하는 참 값(기준)을 대입해 비교하는 기법\n- 2020년 4회에 샘플링 오라클이 단답으로 나왔다(dev-038)"},{"id":"dev-043","subject":"dev","topic":"테스트 관리","sub":"ISO/IEC/IEEE 29119-3","type":"blank","level":1,"q":"다음은 ISO/IEC/IEEE 29119-3 표준에 따른 테스트 케이스 구성 요소다. ①~③에 알맞은 항목을 \u003c보기>에서 골라 쓰시오.","box":"| 항목 | 내용 |\n|---|---|\n| 식별자 | 항목 식별자, 일련번호 |\n| 테스트 항목 | 테스트할 모듈 또는 기능 |\n| ( ① ) | 입력 데이터 또는 입력 조건 |\n| ( ② ) | 테스트 케이스 수행 후 기대되는 출력 결과 |\n| ( ③ ) | 필요한 하드웨어·소프트웨어 환경 |\n| 특수 절차 요구 | 테스트 케이스 수행 때 특별히 필요한 절차 |\n| 의존성 기술 | 테스트 케이스 사이의 의존성 |","options":["ㄱ. 입력 명세","ㄴ. 출력 명세","ㄷ. 환경 설정","ㄹ. 테스트 오라클","ㅁ. 결함 심각도","ㅂ. 테스트 스크립트"],"answers":[{"label":"①","accept":["ㄱ","입력 명세"]},{"label":"②","accept":["ㄴ","출력 명세"]},{"label":"③","accept":["ㄷ","환경 설정"]}],"hint":"명세 두 개와 설정 하나","explain":"정답: ① ㄱ 입력 명세 ② ㄴ 출력 명세 ③ ㄷ 환경 설정\n- 7항목: 식별자 · 테스트 항목 · 입력 명세 · 출력 명세 · 환경 설정 · 특수 절차 요구 · 의존성 기술\n- 기출 표(2021-3, 2025-3)의 세 열과는 1:1로 맞지 않는다. 테스트 데이터 ≈ 입력 명세, 예상 결과 ≈ 출력 명세 정도만 대응하고, 테스트 조건(시작 전 상태)에 딱 맞는 항목은 없다\n- 이 7항목은 원래 IEEE 829(테스트 문서 표준)의 테스트 케이스 명세 목차다. 수험서는 829의 후속 표준인 29119-3 이름으로 소개한다\n- 표를 주고 열 이름을 물으면 기출 용어(테스트 조건·테스트 데이터·예상 결과)로, '29119-3 항목'을 물으면 이 7개로 답한다"},{"id":"dev-044","subject":"dev","topic":"테스트 관리","sub":"테스트 시나리오","type":"short","level":1,"q":"다음 설명에 해당하는 용어를 쓰시오.","box":"테스트 케이스를 적용하는 순서에 따라 여러 개의 테스트 케이스를 묶은 집합으로, 테스트 케이스들을 적용하는 구체적인 절차를 명세한 문서다. 시스템별·모듈별·항목별로 나눠 여러 개를 작성하며, 사용자 요구사항과 설계 문서를 바탕으로 만든다. 예) 회원 가입 → 로그인 → 상품 검색 → 장바구니 → 결제","answers":[{"label":"답","accept":["테스트 시나리오","Test Scenario"]}],"hint":"케이스를 이어 붙인 이야기","explain":"정답: 테스트 시나리오\n- 테스트 케이스: 입력값·실행 조건·기대 결과로 된 하나의 검증 단위\n- 테스트 시나리오: 케이스를 **순서**대로 묶은 흐름\n- 테스트 슈트: 케이스를 **모아 놓은** 집합(순서보다 묶음)\n- 테스트 스크립트: 자동화된 테스트 실행 절차 명세(코드)\n- 구분 포인트: '순서·절차' → 시나리오, '집합·묶음' → 슈트"},{"id":"dev-045","subject":"dev","topic":"테스트 관리","sub":"테스트 하네스","type":"blank","level":2,"q":"다음은 테스트 자동화 환경에 대한 설명이다. ①~④에 알맞은 용어를 쓰시오.","box":"애플리케이션 컴포넌트와 모듈을 테스트하는 환경의 일부로, 테스트를 지원하려고 만든 코드와 데이터를 ( ① )(이)라 한다. 구성 요소는 다음과 같다.\n- 테스트 드라이버, 테스트 스텁, 테스트 케이스\n- ( ② ): 테스트 대상 컴포넌트나 모듈, 시스템에 사용되는 테스트 케이스의 집합\n- ( ③ ): 자동화된 테스트 실행 절차에 대한 명세\n- ( ④ ): 사전에 사용자의 행위를 조건부로 입력해 두면, 그 상황에 맞는 예정된 행위를 수행하는 객체","answers":[{"label":"①","accept":["테스트 하네스","하네스","Test Harness"]},{"label":"②","accept":["테스트 슈트","테스트 스위트","Test Suite","Test Suites"]},{"label":"③","accept":["테스트 스크립트","Test Script"]},{"label":"④","accept":["목 오브젝트","목 객체","모의 객체","Mock Object"]}],"hint":"① 말에 채우는 마구(馬具) ④ 흉내 내는 객체","explain":"정답: ① 테스트 하네스 ② 테스트 슈트 ③ 테스트 스크립트 ④ 목 오브젝트\n- 하네스 구성 6가지: 드라이버 · 스텁 · 슈트 · 케이스 · 스크립트 · 목 오브젝트 (두음 '드스슈케스목'). 감자는 테스트 시나리오까지 넣어 7가지로 적는다\n- 스텁 vs 목 오브젝트: 스텁은 정해진 값만 돌려준다(상태 확인). 목은 '몇 번, 어떤 인자로 호출됐나'까지 검증한다(행위 확인)\n- 테스트 대역(Test Double) 종류: 더미(자리만 채움) · 스텁(고정 응답) · 스파이(호출 기록) · 페이크(가벼운 실제 구현) · 목(기대 행위 검증)\n- 테스트 하네스 도구는 테스트 자동화 도구 유형 중 하나이기도 하다(dev-046)"},{"id":"dev-046","subject":"dev","topic":"테스트 관리","sub":"테스트 자동화 도구","type":"blank","level":2,"q":"다음은 테스트 자동화 도구의 유형이다. ①~④에 알맞은 도구 유형을 쓰시오.","box":"- 정적 분석 도구: 만들어진 애플리케이션을 실행하지 않고 코딩 표준·코딩 스타일·코드 복잡도·남은 결함을 분석한다.\n- ( ① ) 도구: 테스트 데이터와 수행 방법이 담긴 스크립트를 작성해 실행한다. 데이터 주도 접근 방식과 키워드 주도 접근 방식이 있다.\n- ( ② ) 도구: 가상의 사용자를 만들어 처리량·응답 시간·경과 시간·자원 사용률을 측정하고 성능 목표 달성 여부를 확인한다.\n- ( ③ ) 도구: 테스트 계획과 관리, 테스트 수행, 결함 관리 등을 맡는다.\n- ( ④ ) 도구: 테스트가 실행될 환경을 시뮬레이션해 컴포넌트와 모듈이 정상적으로 테스트되게 한다.","answers":[{"label":"①","accept":["테스트 실행","테스트 실행 도구","Test Execution","Test Execution Tools"]},{"label":"②","accept":["성능 테스트","성능 테스트 도구","성능","Performance Test","Performance Test Tools"]},{"label":"③","accept":["테스트 통제","테스트 통제 도구","통제","Test Control","Test Control Tools"]},{"label":"④","accept":["테스트 하네스","테스트 하네스 도구","하네스","Test Harness","Test Harness Tools"]}],"hint":"① 스크립트를 돌린다 ② 가상 사용자로 부하를 건다 ③ 계획·수행·결함을 관리한다 ④ 드라이버·스텁으로 실행 환경을 꾸민다","explain":"정답: ① 테스트 실행 ② 성능 테스트 ③ 테스트 통제 ④ 테스트 하네스\n- 두음 '정실성통하': 정적 분석 · 테스트 실행 · 성능 · 통제 · 하네스\n- 테스트 실행 도구의 두 접근\n- 데이터 주도(Data-driven): 스프레드시트에 테스트 데이터를 저장하고 스크립트가 읽어 실행. 같은 스크립트로 데이터만 바꿔 여러 번\n- 키워드 주도(Keyword-driven): 테스트 동작을 키워드로 정의해 두고 키워드 조합으로 실행\n- 교재에 따라 하네스를 빼고 4가지로 정리하기도 한다\n- 결함 관리(테스트 통제) 도구 예: Mantis, Bugzilla, Redmine, Trac"},{"id":"dev-047","subject":"dev","topic":"테스트 관리","sub":"결함 관리","type":"order","level":1,"q":"다음은 결함 심각도 분류다. 심각도가 높은 것부터 낮은 것 순으로 기호를 나열하시오.","options":["ㄱ. 보통 결함(Normal): 사소한 기능 오작동","ㄴ. 치명적 결함(Critical): 시스템 중단, 데이터 손실","ㄷ. 단순 결함(Simple): UI 오타 등 미관상 문제","ㄹ. 주요 결함(Major): 주요 기능 장애","ㅁ. 경미한 결함(Minor): 표준 위반 등 사용에 큰 지장 없음"],"answers":[{"label":"답","accept":["ㄴ-ㄹ-ㄱ-ㅁ-ㄷ"]}],"hint":"시스템이 멈추는 결함부터 화면 오타까지","explain":"정답: ㄴ → ㄹ → ㄱ → ㅁ → ㄷ (치명적 → 주요 → 보통 → 경미 → 단순)\n- 두음 '치주보경단'\n- 결함 우선순위(얼마나 빨리 고칠지)는 별개: 결정적(Critical) → 높음(High) → 보통(Medium) → 낮음(Low). 심각도가 낮아도 우선순위는 높을 수 있다(예: 첫 화면의 회사명 오타)\n- 결함 관리 프로세스: 결함 관리 계획 → 결함 기록 → 결함 검토 → 결함 수정 → 결함 재확인 → 결함 상태 추적·모니터링 → 최종 결함 분석·보고서 작성\n- 결함 분석: 구체화(결함을 일으킨 입력값·절차·환경 파악) → 고립화(어느 요소가 영향을 주는지) → 일반화(영향 요소를 일반화)\n- 통합 테스트 뒤 결함 추이를 분석해 잔존 결함을 추정한다(출제기준 문구)"},{"id":"dev-048","subject":"dev","topic":"코드 품질","sub":"소스 코드 품질 분석 도구","type":"short","past":"2020-2","level":3,"q":"애플리케이션을 실행하지 않고, 소스 코드의 코딩 표준·코딩 스타일·코드 복잡도와 남은 결함을 발견하려고 사용하는 도구를 쓰시오.","answers":[{"label":"답","accept":["정적 분석 도구","정적 분석","정적 분석 툴","Static Analysis","Static Analysis Tool"]}],"hint":"실행하지 않는다 = 움직이지 않는다","explain":"정답: 정적 분석 도구(Static Analysis Tool)\n\n| 구분 | 정적 분석 | 동적 분석 |\n|---|---|---|\n| 실행 | 안 함 | 실행하며 분석 |\n| 찾는 것 | 코딩 표준·스타일 위반, 복잡도, 잠재 결함 | 메모리 누수, 스레드 결함, 오버플로 |\n| 도구 | pmd, cppcheck, SonarQube, checkstyle, ccm, cobertura | Avalanche, Valgrind |\n- cobertura는 테스트를 돌리며 커버리지를 재는 도구라 실제 성격은 동적에 가깝다. 교재(시나공 계열) 목록이 정적에 넣으므로 보기에 나오면 정적으로 고른다\n- 같은 개념이 2022년 1회에 영문(Static/Dynamic)으로 나왔다(dev-049)"},{"id":"dev-049","subject":"dev","topic":"코드 품질","sub":"소스 코드 품질 분석 도구","type":"blank","past":"2022-1","level":3,"q":"다음은 소스 코드 분석 기법에 대한 설명이다. ①, ②에 알맞은 답을 \u003c보기>에서 골라 쓰시오.","box":"① 소스 코드를 실행하지 않고, 코드의 의미를 분석해 결함을 찾아내는 원시적 코드 분석 기법\n② 소스 코드를 실행해 프로그램의 동작이나 반응을 추적하고, 코드에 존재하는 메모리 누수·스레드 결함 등을 분석","options":["ㄱ. Static Analysis","ㄴ. Running Analysis","ㄷ. Requirements Analysis","ㄹ. Dynamic Analysis","ㅁ. React Analysis"],"answers":[{"label":"①","accept":["ㄱ","Static Analysis","Static","정적 분석"]},{"label":"②","accept":["ㄹ","Dynamic Analysis","Dynamic","동적 분석"]}],"hint":"Running은 함정. '정지된' ↔ '움직이는'에 해당하는 영단어","explain":"정답: ① ㄱ Static Analysis(정적 분석) ② ㄹ Dynamic Analysis(동적 분석)\n- 'Running'은 '실행'이라는 말에 끌리게 만든 함정. 정식 용어는 Dynamic\n- 정적 도구: pmd(자바 등 소스의 버그·데드 코드), cppcheck(C/C++ 메모리 누수·오버플로), SonarQube(소스 품질 통합 플랫폼), checkstyle(자바 코딩 표준 검사), ccm(코드 복잡도), cobertura(테스트 커버리지 측정, 교재 분류상 정적)\n- 동적 도구: Avalanche(Valgrind 기반 버그·취약점 탐지), Valgrind(메모리·스레드 결함 탐지)\n- 복원본마다 보기가 다르다(choitaeyang11 판 기준)"},{"id":"dev-050","subject":"dev","topic":"코드 품질","sub":"리팩토링","type":"essay","past":"2020-3","level":2,"q":"리팩토링(Refactoring)의 목적을 약술하시오.","answers":[{"label":"답","accept":[],"model":"외부 동작(기능)은 바꾸지 않고 내부 구조를 개선해, 복잡한 코드를 단순화하고 가독성을 높인다. 이로써 유지보수성·생산성·품질을 높이고 유연한 시스템을 만든다."}],"hint":"기능은 그대로, 구조만","explain":"채점 핵심어: 기능(외부 동작) 유지, 구조 개선, 단순화·가독성 → 유지보수성·생산성·품질 향상\n- 리팩토링 대상(코드 스멜): 중복 코드, 긴 메서드, 큰 클래스, 의미 없는 이름 등\n- 배드 코드 예: 스파게티 코드(로직이 얽힘), 외계인 코드(오래되고 문서·개발자가 없어 유지보수가 어려움)\n- 클린 코드 원칙: 가독성 · 단순성 · 의존성 배제 · 중복성 최소화 · 추상화"},{"id":"dev-051","subject":"dev","topic":"코드 품질","sub":"코딩 표기법","type":"essay","past":"2020-3","level":2,"q":"헝가리안 표기법(Hungarian Notation)에 대해 약술하시오.","answers":[{"label":"답","accept":[],"model":"식별자(변수·함수 이름)를 표기할 때 앞에 자료형을 나타내는 접두어를 붙이는 표기법이다. 예) int형 nCount, 문자열 strName, bool형 bFlag"}],"hint":"이름 앞에 타입 표시","explain":"채점 핵심어: 식별자, 접두어(앞), 자료형\n\n| 표기법 | 규칙 | 예 |\n|---|---|---|\n| 카멜(Camel) | 첫 단어 소문자, 이후 단어 첫 글자 대문자 | userName |\n| 파스칼(Pascal) | 모든 단어 첫 글자 대문자 | UserName |\n| 스네이크(Snake) | 단어를 밑줄로 연결 | user_name |\n| 헝가리안(Hungarian) | 자료형 접두어 | strUserName |\n- 케밥(kebab-case): 하이픈 연결(user-name). URL·CSS에서 쓴다"},{"id":"dev-053","subject":"dev","topic":"코드 품질","sub":"소스 코드 품질 분석 도구","type":"choice","level":2,"q":"다음 \u003c보기>는 소스 코드 품질 분석 도구다. 이 중 동적 분석 도구를 모두 골라 기호로 쓰시오.","options":["ㄱ. pmd","ㄴ. cppcheck","ㄷ. SonarQube","ㄹ. Avalanche","ㅁ. checkstyle","ㅂ. Valgrind","ㅅ. ccm","ㅇ. cobertura"],"anyOrder":true,"answers":[{"label":"①","accept":["ㄹ","Avalanche"]},{"label":"②","accept":["ㅂ","Valgrind"]}],"hint":"2개다. 하나가 다른 하나 위에 만들어졌다","explain":"정답: ㄹ Avalanche, ㅂ Valgrind\n\n| 도구 | 분류 | 특징 |\n|---|---|---|\n| pmd | 정적 | 자바 등 소스의 버그, 미사용 변수·데드 코드 탐지 |\n| cppcheck | 정적 | C/C++ 메모리 누수, 오버플로 분석 |\n| SonarQube | 정적 | 소스 품질 통합 관리 플랫폼, 플러그인 확장 |\n| checkstyle | 정적 | 자바 코드가 코딩 표준을 따르는지 검사 |\n| ccm | 정적 | 여러 언어의 코드 복잡도 분석 |\n| cobertura | 정적(교재 분류) | jcoverage 기반 테스트 커버리지 측정 |\n| Avalanche | 동적 | Valgrind 프레임워크·STP 기반, 버그·취약점 탐지 |\n| Valgrind | 동적 | 메모리 누수·스레드 결함 탐지 |\n- 외우는 법: 동적은 'Valgrind와 그 위에 만든 Avalanche' 둘뿐\n- cobertura는 실행하며 커버리지를 재지만 교재 목록이 정적에 넣는다. 그래서 답에서 뺐다"},{"id":"dev-054","subject":"dev","topic":"코드 품질","sub":"클린 코드·배드 코드","type":"blank","level":1,"q":"다음은 코드 가독성에 따른 코드 유형이다. ①~③에 알맞은 용어를 쓰시오.","box":"- ( ① ) 코드: 아주 오래되었거나 참고 문서·개발자가 없어 유지보수 작업이 아주 어려운 코드\n- ( ② ) 코드: 소스 코드가 복잡하게 얽혀 있어, 정상 작동하지만 동작을 파악하기 어려운 코드\n- ( ③ ) 코드: 누구나 쉽게 이해하고 수정·추가할 수 있게 단순·명료하게 작성한 코드. 작성 원칙은 가독성, 단순성, 의존성 배제, 중복성 최소화, 추상화다.","answers":[{"label":"①","accept":["외계인","외계인 코드","Alien","Alien Code"]},{"label":"②","accept":["스파게티","스파게티 코드","Spaghetti","Spaghetti Code"]},{"label":"③","accept":["클린","클린 코드","Clean","Clean Code"]}],"hint":"① 다른 별에서 온 ② 면발처럼 엉킨","explain":"정답: ① 외계인 ② 스파게티 ③ 클린\n\n| 클린 코드 원칙 | 뜻 |\n|---|---|\n| 가독성 | 누구나 읽기 쉽게(들여쓰기, 이름) |\n| 단순성 | 한 번에 한 가지, 작은 단위 |\n| 의존성 배제 | 다른 모듈에 미치는 영향 최소화 |\n| 중복성 최소화 | 중복 코드 제거, 공통 코드 사용 |\n| 추상화 | 상위는 간략히, 상세는 하위에서 |\n- 두음 '가단의중추'\n- 배드 코드 원인: 오염, 문서 부족, 의미 없는 이름, 높은 결합도, 아키텍처 침식\n- 배드 코드를 클린 코드로 바꾸는 작업이 리팩토링"},{"id":"dev-055","subject":"dev","topic":"코드 품질","sub":"코딩 표기법","type":"blank","level":2,"q":"다음은 식별자 표기법의 예다. ①~③에 알맞은 표기법을 쓰시오.","box":"| 예 | 표기법 |\n|---|---|\n| `totalPrice`, `getUserName()` | ( ① ) 표기법 |\n| `TotalPrice`, `GetUserName()` | ( ② ) 표기법 |\n| `total_price`, `get_user_name()` | ( ③ ) 표기법 |\n| `nTotalPrice`, `strUserName` | 헝가리안 표기법 |","answers":[{"label":"①","accept":["카멜","카멜 표기법","카멜 케이스","Camel","Camel Case"]},{"label":"②","accept":["파스칼","파스칼 표기법","파스칼 케이스","Pascal","Pascal Case"]},{"label":"③","accept":["스네이크","스네이크 표기법","스네이크 케이스","Snake","Snake Case"]}],"hint":"① 낙타 혹 ② 언어 이름 ③ 밑줄로 기어간다","explain":"정답: ① 카멜 ② 파스칼 ③ 스네이크\n- 카멜 vs 파스칼: 첫 글자가 소문자면 카멜, 대문자면 파스칼\n- 관례: Java 변수·메서드 = 카멜, 클래스 = 파스칼 / Python 변수·함수 = 스네이크, 클래스 = 파스칼 / 상수 = 대문자 스네이크(MAX_SIZE)\n- 헝가리안: 자료형 접두어(n = int, str = 문자열, b = bool). 2020년 3회 서술형 기출(dev-051)"},{"id":"dev-056","subject":"dev","topic":"코드 품질","sub":"알고리즘 복잡도","type":"order","level":1,"q":"다음 \u003c보기>의 시간 복잡도를, n이 충분히 클 때 실행 시간이 짧은 것부터 순서대로 기호를 나열하시오.","options":["ㄱ. O(n²)","ㄴ. O(1)","ㄷ. O(n log n)","ㄹ. O(2ⁿ)","ㅁ. O(log n)","ㅂ. O(n)"],"answers":[{"label":"답","accept":["ㄴ-ㅁ-ㅂ-ㄷ-ㄱ-ㄹ"]}],"hint":"n = 1,024를 넣고 대략 값을 비교해 본다","explain":"정답: ㄴ → ㅁ → ㅂ → ㄷ → ㄱ → ㄹ\n\n| 복잡도 | 이름 | 대표 알고리즘 |\n|---|---|---|\n| O(1) | 상수 | 배열 인덱스 접근, 해시 탐색(평균) |\n| O(log n) | 로그 | 이진 탐색 |\n| O(n) | 선형 | 순차 탐색 |\n| O(n log n) | 선형 로그 | 퀵 정렬(평균)·힙 정렬·합병 정렬 |\n| O(n²) | 제곱 | 버블·선택·삽입 정렬 |\n| O(2ⁿ) | 지수 | 피보나치 단순 재귀 |\n- 퀵 정렬 최악은 O(n²). 삽입 정렬은 이미 정렬된 입력이면 O(n)"},{"id":"dev-057","subject":"dev","topic":"인터페이스","sub":"데이터 형식","type":"short","past":"2020-1","level":2,"q":"다음 설명에 해당하는 용어를 쓰시오.","box":"W3C(World Wide Web Consortium)에서 개발했고, 웹 브라우저 간 호환이 되지 않는 문제와 SGML(Standard Generalized Markup Language)의 복잡함을 해결하려고 만든 다목적 마크업 언어다.","answers":[{"label":"답","accept":["XML","eXtensible Markup Language"]}],"hint":"확장 가능한 마크업","explain":"정답: XML(eXtensible Markup Language)\n\n| 형식 | 특징 | 주 사용처 |\n|---|---|---|\n| XML | 사용자 정의 태그 `\u003cname>`, 트리 구조, DTD·XSD로 스키마 정의, 주석 가능 | SOAP 웹 서비스, 문서 구조 |\n| JSON | 속성-값(키-값) 쌍, `{}` `[]`, 가볍고 파싱 빠름, 주석 없음 | REST API, AJAX |\n| YAML | 들여쓰기로 계층 표현, 사람이 읽기 쉬움, `#` 주석 | 설정 파일(Docker·Kubernetes) |\n| CSV | 쉼표로 구분한 표 형태 텍스트 | 표 데이터 주고받기 |\n- HTML은 정해진 태그로 '표시', XML은 태그를 정의해 '데이터 구조'를 표현"},{"id":"dev-058","subject":"dev","topic":"인터페이스","sub":"데이터 형식","type":"short","past":"2020-1","level":2,"q":"다음 설명에 해당하는 기술을 쓰시오.","box":"속성-값 쌍(Attribute-Value Pair)으로 이루어진 데이터 오브젝트를 전달하려고 사용하는 개방형 표준 포맷이다. AJAX(Asynchronous JavaScript and XML)에서 많이 사용되고, XML을 대체하는 주요 데이터 포맷이다. 언어 독립형 데이터 포맷으로 다양한 프로그래밍 언어에서 사용한다.","answers":[{"label":"답","accept":["JSON","JavaScript Object Notation"]}],"hint":"자바스크립트 객체 표기","explain":"정답: JSON(JavaScript Object Notation)\n- 단서: 속성-값 쌍, AJAX에서 많이 사용, XML 대체, 언어 독립\n- 예: `{\"name\": \"kim\", \"age\": 25, \"tags\": [\"a\", \"b\"]}`\n- XML과 비교: JSON은 태그가 없어 가볍고 파싱이 빠르다. 대신 주석·스키마 내장이 없다\n- AJAX 이름의 X는 XML이지만 요즘 AJAX 응답은 대부분 JSON"},{"id":"dev-059","subject":"dev","topic":"인터페이스","sub":"AJAX","type":"short","past":"2020-2","level":3,"q":"다음 설명에 해당하는 기술명을 쓰시오.","box":"브라우저가 가진 XMLHttpRequest 객체를 이용해 전체 페이지를 새로 고치지 않고도 페이지 일부분에 필요한 데이터만 로드하는 기법이다. HTML만으로는 어려운 다양한 작업을 웹 페이지에서 구현해, 이용자가 웹 페이지와 자유롭게 상호작용할 수 있게 한다.","answers":[{"label":"답","accept":["AJAX","Asynchronous JavaScript and XML"]}],"hint":"비동기 + 자바스크립트 + XML","explain":"정답: AJAX(Asynchronous JavaScript and XML)\n- 핵심 단서: XMLHttpRequest, 전체 페이지 새로 고침 없이 일부만, 비동기\n- 기출 3회(2020-2, 2023-1, 2025-2) — SW 개발 인터페이스에서 가장 자주 나온 용어\n\n| 기술 | 핵심 |\n|---|---|\n| AJAX | 비동기 요청으로 화면 일부만 갱신하는 기법 |\n| Fetch API | XMLHttpRequest를 대체한 Promise 기반 브라우저 API |\n| WebSocket | 한 번 연결 후 유지, 양방향 실시간, 서버 푸시 |\n| REST | URI로 자원, HTTP 메서드로 행위 |\n| SOAP | XML 메시지를 주고받는 웹 서비스 프로토콜 |"},{"id":"dev-060","subject":"dev","topic":"인터페이스","sub":"AJAX","type":"blank","past":"2023-1","level":3,"q":"다음 괄호( )에 공통으로 들어갈 용어의 영문 약어 ①과 Full Name ②를 쓰시오.","box":"( )은/는 비동기 웹 애플리케이션을 만들려고 JavaScript와 XML을 이용하는 비동기 정보 교환 기법이다. 필요한 데이터만 웹 서버에 요청해 받은 뒤 클라이언트에서 데이터를 처리할 수 있다. 웹 서버의 응답을 처리하려고 클라이언트 쪽에서는 자바스크립트를 쓴다. Google Map과 Google Pages에서 사용한 기술을 바탕으로 만들어졌다.","answers":[{"label":"①","accept":["AJAX"]},{"label":"②","accept":["Asynchronous JavaScript and XML","Asynchronous JavaScript & XML"]}],"hint":"Google Map, 비동기","explain":"정답: ① AJAX ② Asynchronous JavaScript and XML\n- 실제 시험은 '약자 또는 Full Name'으로 답하게 했다. 풀네임 철자까지 연습해 둔다: **A**synchronous **J**ava**S**cript **a**nd **X**ML\n- 단서: Google Map(지도를 끌어도 페이지 전체가 다시 뜨지 않는다), 비동기, 필요한 데이터만\n- 동기 vs 비동기: 동기는 응답이 올 때까지 기다리고, 비동기는 요청을 보낸 뒤 다른 일을 하다가 응답이 오면 처리한다"},{"id":"dev-061","subject":"dev","topic":"인터페이스","sub":"웹 통신 기술","type":"blank","past":"2025-2","level":3,"q":"다음은 웹 데이터 교환 기술에 대한 설명이다. ①~③에 해당하는 기술을 \u003c보기>에서 골라 쓰시오.","box":"① 웹 페이지 전체를 다시 불러오지 않고 JavaScript와 XML 또는 JSON을 이용해 일부 콘텐츠만 비동기로 갱신하는 웹 개발 기법\n② HTTP URI로 자원을 명시하고, HTTP 메서드(GET·POST·PUT·DELETE)로 그 자원에 대한 처리를 표현하는 아키텍처 스타일\n③ 한 번 연결을 맺으면 계속 유지하면서 서버와 클라이언트가 양방향으로 실시간 데이터를 주고받는 프로토콜. 서버가 요청 없이도 데이터를 보낼 수 있다.","options":["ㄱ. SOAP","ㄴ. REST","ㄷ. AJAX","ㄹ. WebSocket","ㅁ. UDDI","ㅂ. JSON"],"answers":[{"label":"①","accept":["ㄷ","AJAX","Asynchronous JavaScript and XML"]},{"label":"②","accept":["ㄴ","REST","RESTful","Representational State Transfer"]},{"label":"③","accept":["ㄹ","WebSocket","웹소켓"]}],"hint":"② 자원 + 메서드 ③ 끊기지 않는 양방향","explain":"정답: ① ㄷ AJAX ② ㄴ REST ③ ㄹ WebSocket\n- 2025년 2회 실제 문항은 ①만 영문 약어로 쓰는 단답이었다\n- REST(Representational State Transfer): 자원(URI) + 행위(HTTP 메서드) + 표현(JSON 등). POST = 생성, GET = 조회, PUT = 수정, DELETE = 삭제\n- SOAP vs REST: SOAP은 XML 메시지 프로토콜(엄격, WSDL·UDDI와 함께), REST는 HTTP를 그대로 쓰는 설계 스타일(가볍고 주로 JSON)\n- UDDI(ㅁ)는 웹 서비스 등록·검색 저장소, JSON(ㅂ)은 데이터 형식"},{"id":"dev-062","subject":"dev","topic":"인터페이스","sub":"웹 서비스","type":"short","past":"2020-2","level":2,"q":"다음 설명의 괄호( )에 공통으로 들어갈 용어를 쓰시오.","box":"HTTP, HTTPS, SMTP 등을 이용해 XML 기반의 메시지를 주고받는 프로토콜로, 웹 서비스 방식에서 HTTP 기반의 ( )을/를 사용해 송수신한다. ( ) 대신 레스트풀(RESTful) 방식으로 대체할 수 있다.","answers":[{"label":"답","accept":["SOAP","Simple Object Access Protocol"]}],"hint":"XML 메시지 규약. 영어로 '비누'","explain":"정답: SOAP(Simple Object Access Protocol)\n\n| 웹 서비스 요소 | 역할 | 비유 |\n|---|---|---|\n| SOAP | XML 메시지로 서비스를 호출하는 통신 규약 | 정해진 양식의 주문서 |\n| WSDL | 서비스 이름·위치·메시지 형식·프로토콜을 XML로 기술 | 메뉴판 |\n| UDDI | 웹 서비스 정보를 등록·검색하는 저장소(레지스트리) | 전화번호부 |\n- 단서 'RESTful로 대체' → SOAP. 반대로 'URI + HTTP 메서드' → REST"},{"id":"dev-063","subject":"dev","topic":"인터페이스","sub":"웹 서비스","type":"short","past":"2021-1","level":2,"q":"다음 설명에 해당하는 언어를 쓰시오.","box":"웹 서비스명, 제공 위치, 메시지 포맷, 프로토콜 정보 등 웹 서비스에 대한 상세 정보를 XML 형식으로 기술한 언어다.","answers":[{"label":"답","accept":["WSDL","Web Services Description Language","Web Service Description Language"]}],"hint":"웹 서비스를 '기술(Description)'하는 언어","explain":"정답: WSDL(Web Services Description Language)\n- 단서: 상세 정보를 '기술', XML 형식\n- SOAP(메시지 규약) · WSDL(서비스 명세) · UDDI(등록·검색 저장소) 셋을 짝으로 기억\n- 흐름: 제공자가 WSDL로 서비스를 기술해 UDDI에 등록 → 이용자가 UDDI에서 찾아 WSDL을 읽음 → SOAP 메시지로 호출\n- 이 셋은 간접 연계 방식 중 '웹 서비스'에 해당한다"},{"id":"dev-064","subject":"dev","topic":"인터페이스","sub":"EAI","type":"blank","past":"2020-3","level":3,"q":"다음 설명의 ①, ②에 알맞은 EAI 구축 유형을 쓰시오.","box":"EAI 구축 유형에는 메시지 버스(Message Bus), 하이브리드(Hybrid), ( ① ), ( ② ) 4가지가 있다.\n- ( ① ): 애플리케이션을 1:1로 직접 연결하는 가장 단순한 방식. 변경과 재사용이 어렵다.\n- ( ② ): 단일 접점인 허브 시스템을 거쳐 데이터를 전송하는 중앙 집중형 방식. 허브 장애가 전체에 영향을 준다.","answers":[{"label":"①","accept":["Point-to-Point","포인트 투 포인트","Point to Point"]},{"label":"②","accept":["Hub & Spoke","Hub and Spoke","허브 앤 스포크"]}],"hint":"① 집집마다 직접 놓은 전화선 ② 바퀴 중심과 바퀴살","explain":"정답: ① Point-to-Point ② Hub & Spoke\n\n| 유형 | 구조 | 장단점 |\n|---|---|---|\n| Point-to-Point | 1:1 직접 연결 | 단순·빠름 / 연결 수 폭증, 변경·재사용 어려움 |\n| Hub & Spoke | 중앙 허브 경유 | 확장·유지보수 쉬움 / 허브 장애 시 전체 마비 |\n| Message Bus(ESB 방식) | 애플리케이션 사이에 미들웨어(버스) | 확장성·대용량 처리 우수 |\n| Hybrid | 그룹 안은 Hub & Spoke, 그룹 사이는 Message Bus | 유연함 / 구축 복잡 |\n- EAI: 기업 안의 서로 다른 애플리케이션을 연계·통합하는 솔루션(dev-065)\n- 실제 2020년 3회는 설명 없이 이름 두 개만 묻는 빈칸이었다"},{"id":"dev-065","subject":"dev","topic":"인터페이스","sub":"EAI","type":"short","past":"2021-1","level":3,"q":"다음 설명에 해당하는 솔루션을 쓰시오.","box":"시스템 통합에 쓰는 솔루션으로, 구축 유형에는 Point-to-Point, Hub & Spoke, Message Bus 등이 있다. 기업에서 운영되는 서로 다른 플랫폼과 애플리케이션 사이의 정보를 전달·연계·통합할 수 있게 해 준다.","answers":[{"label":"답","accept":["EAI","Enterprise Application Integration","기업 애플리케이션 통합"]}],"hint":"Enterprise로 시작하는 세 글자 약어","explain":"정답: EAI(Enterprise Application Integration)\n\n| 구분 | EAI | ESB |\n|---|---|---|\n| 통합 대상 | 기업 내부 애플리케이션 | 기업 내·외부 서비스 |\n| 중심 | 애플리케이션 통합 | 서비스(SOA) 중심, 버스 |\n| 결합도 | 상대적으로 높음 | 느슨함(Loose Coupling) |\n| 연결 | 시스템별 어댑터 | 표준 인터페이스(웹 서비스) |\n- 연계 방식 분류에서 EAI·ESB·웹 서비스·소켓은 간접 연계(dev-073)"},{"id":"dev-066","subject":"dev","topic":"인터페이스","sub":"인터페이스 구현 검증 도구","type":"short","past":"2022-1","level":2,"q":"다음 설명에 해당하는 테스트 프레임워크를 쓰시오.","box":"자바(Java) 프로그래밍 언어를 이용한 xUnit 계열 테스트 도구로, 숨겨진 단위 테스트를 끌어내 정형화해 단위 테스트를 쉽게 해 주는 테스트용 프레임워크다.","answers":[{"label":"답","accept":["JUnit"]}],"hint":"xUnit의 x 자리에 언어 첫 글자","explain":"정답: JUnit\n\n| xUnit 계열 | 대상 |\n|---|---|\n| JUnit | Java |\n| CppUnit | C++ |\n| NUnit | .NET(C#) |\n| PyUnit(unittest) | Python |\n| HttpUnit | 웹 애플리케이션 |\n- xUnit은 인터페이스 구현 검증 도구 목록의 첫 번째: xUnit, STAF, FitNesse, NTAF, Selenium, watir\n- 단위 테스트는 V 모델에서 상세(모듈) 설계에 대응"},{"id":"dev-067","subject":"dev","topic":"인터페이스","sub":"ESB","type":"short","level":2,"q":"다음 설명에 해당하는 솔루션을 영문 약어로 쓰시오.","box":"애플리케이션 통합 측면에서 EAI와 비슷하지만, 애플리케이션보다 서비스 중심의 통합을 지향한다. 버스를 중심으로 각 애플리케이션을 표준 기반 인터페이스(웹 서비스)로 연결하고 메시징·데이터 변환·지능형 라우팅을 결합한다. 애플리케이션 사이의 결합도를 약하게(Loose Coupling) 유지한다.","answers":[{"label":"답","accept":["ESB"]}],"hint":"EAI의 Message Bus 유형과 구조가 같다","explain":"정답: ESB(Enterprise Service Bus)\n- 단서: 서비스 중심, 버스, 표준 인터페이스, 느슨한 결합 → SOA(서비스 지향 아키텍처)의 핵심 기반\n- EAI의 Message Bus 유형과 구조가 같아 'Message Bus(ESB 방식)'으로 쓰기도 한다\n- EAI 4유형: Point-to-Point · Hub & Spoke · Message Bus · Hybrid\n- 미들웨어 종류: DB, RPC, MOM(메시지 지향), TP-Monitor, ORB, WAS"},{"id":"dev-068","subject":"dev","topic":"인터페이스","sub":"데이터 형식","type":"blank","level":2,"q":"다음은 인터페이스에서 쓰는 데이터 표현 형식이다. ①, ②에 알맞은 형식을 쓰시오.","box":"① 들여쓰기로 데이터의 계층 구조를 표현해 사람이 읽고 쓰기 쉽다. `#`으로 주석을 달 수 있고, JSON의 상위 집합이라 대부분의 파서가 JSON도 읽는다. Docker Compose, Kubernetes 같은 설정 파일에 많이 쓴다.\n② 각 줄이 레코드 하나이고 필드를 쉼표로 구분하는 단순한 텍스트 형식이다. 스프레드시트·데이터베이스의 표 데이터를 주고받을 때 쓴다.","answers":[{"label":"①","accept":["YAML","YAML Ain't Markup Language"]},{"label":"②","accept":["CSV","Comma-Separated Values","Comma Separated Values"]}],"hint":"① 들여쓰기 ② 쉼표로 나눈 값","explain":"정답: ① YAML ② CSV\n- YAML 예: `server:` 다음 줄에 `  port: 8080  # 주석` — 들여쓰기가 곧 계층\n- 4형식 구분 단서: 태그 → XML / 중괄호 키-값 → JSON / 들여쓰기 → YAML / 쉼표 줄 → CSV\n- 인터페이스 데이터 표준을 정할 때 송수신 양쪽이 같은 형식을 쓰도록 맞춘다"},{"id":"dev-069","subject":"dev","topic":"인터페이스","sub":"웹 서비스","type":"short","level":1,"q":"다음 설명에 해당하는 웹 서비스 구성 요소를 영문 약어로 쓰시오.","box":"인터넷에서 전 세계 비즈니스 업체 목록에 자신을 등록하고 검색하기 위한 XML 기반 규격이다. 웹 서비스 제공자가 서비스 정보를 등록하고, 이용자가 필요한 웹 서비스를 찾아볼 수 있는 저장소(레지스트리) 역할을 한다.","answers":[{"label":"답","accept":["UDDI"]}],"hint":"웹 서비스의 전화번호부","explain":"정답: UDDI(Universal Description, Discovery and Integration)\n- 단서: 등록·검색, 저장소(레지스트리)\n- SOAP = 통신 규약(주문서), WSDL = 서비스 명세(메뉴판), UDDI = 등록·검색(전화번호부)\n- 셋 다 XML 기반. 기출은 SOAP(2020-2), WSDL(2021-1)이 나왔고 UDDI는 아직 나오지 않았다"},{"id":"dev-070","subject":"dev","topic":"인터페이스","sub":"인터페이스 보안","type":"blank","level":2,"q":"다음은 인터페이스 보안 기술이다. ①~⑤에 알맞은 용어를 \u003c보기>에서 골라 쓰시오.","box":"- 네트워크 계층: ( ① )은/는 IP 패킷 단위로 인증과 암호화를 제공한다. 무결성과 인증만 제공하고 암호화는 하지 않는 ( ② ) 프로토콜과, 메시지 암호화까지 제공하는 ( ③ ) 프로토콜로 동작한다.\n- 전송 계층: ( ④ )은/는 TCP 위에서 서버·클라이언트 인증과 데이터 암호화를 제공하며 HTTPS의 기반이다.\n- 응용 계층: ( ⑤ )은/는 웹에서 클라이언트와 서버 사이에 오가는 개별 메시지를 암호화한다.","options":["ㄱ. IPSec","ㄴ. AH","ㄷ. ESP","ㄹ. SSL/TLS","ㅁ. S-HTTP","ㅂ. IKE","ㅅ. SSH"],"answers":[{"label":"①","accept":["ㄱ","IPSec","IP Security"]},{"label":"②","accept":["ㄴ","AH","Authentication Header"]},{"label":"③","accept":["ㄷ","ESP","Encapsulating Security Payload"]},{"label":"④","accept":["ㄹ","SSL/TLS","SSL","TLS"]},{"label":"⑤","accept":["ㅁ","S-HTTP","Secure HTTP"]}],"hint":"계층을 아래에서 위로: 3계층 → 4계층 → 7계층","explain":"정답: ① IPSec ② AH ③ ESP ④ SSL/TLS ⑤ S-HTTP\n\n| 계층 | 기술 | 핵심 |\n|---|---|---|\n| 네트워크(3) | IPSec | AH(인증·무결성, 암호화 X), ESP(암호화 + 선택적 인증·무결성), IKE(키 교환) |\n| 전송(4) | SSL/TLS | 핸드셰이크로 세션 수립, HTTPS(443)의 기반 |\n| 응용(7) | S-HTTP | 메시지 단위 선택적 암호화. HTTPS가 채널 전체를 암호화하는 것과 다르다 |\n- IPSec 모드: 전송 모드(IP 페이로드만 보호, 호스트 간) / 터널 모드(패킷 전체를 새 IP 헤더로 감쌈, VPN 게이트웨이 간)\n- 인터페이스 보안 적용 영역: 네트워크 영역(위 프로토콜), 애플리케이션 영역(시큐어 코딩), 데이터베이스 영역(접근 권한, 민감 데이터 암호화)\n- SSH(ㅅ)는 원격 접속 보안(22번 포트), IKE(ㅂ)는 IPSec의 키 교환 프로토콜"},{"id":"dev-071","subject":"dev","topic":"인터페이스","sub":"인터페이스 구현 검증 도구","type":"blank","level":2,"q":"다음은 인터페이스 구현 검증 도구에 대한 설명이다. ①~④에 알맞은 도구를 \u003c보기>에서 골라 쓰시오.","box":"① 서비스 호출, 컴포넌트 재사용 등 다양한 환경을 지원하는 테스트 프레임워크. 각 테스트 대상 분산 환경에 데몬을 두고 테스트를 수행·통합해 자동화한다.\n② 웹 기반 테스트 케이스 설계·실행·결과 확인을 지원하는 테스트 프레임워크\n③ ②의 장점인 협업 기능과 ①의 장점인 재사용·확장성을 통합한 NHN의 테스트 자동화 프레임워크\n④ 루비(Ruby) 기반의 웹 애플리케이션 테스트 프레임워크","options":["ㄱ. xUnit","ㄴ. STAF","ㄷ. FitNesse","ㄹ. NTAF","ㅁ. Selenium","ㅂ. watir"],"answers":[{"label":"①","accept":["ㄴ","STAF","Software Testing Automation Framework"]},{"label":"②","accept":["ㄷ","FitNesse"]},{"label":"③","accept":["ㄹ","NTAF"]},{"label":"④","accept":["ㅂ","watir"]}],"hint":"③ = ② + ① / ④ 루비","explain":"정답: ① ㄴ STAF ② ㄷ FitNesse ③ ㄹ NTAF ④ ㅂ watir\n\n| 도구 | 핵심 |\n|---|---|\n| xUnit | 여러 언어의 단위 테스트 프레임워크(Java = JUnit, C++ = CppUnit, .NET = NUnit) |\n| STAF | 서비스 호출·컴포넌트 재사용, 분산 환경 데몬 |\n| FitNesse | 웹 기반 테스트 케이스 설계·실행·결과 확인 |\n| NTAF | FitNesse(협업) + STAF(재사용·확장), NHN |\n| Selenium | 여러 브라우저·개발 언어를 지원하는 웹 애플리케이션 테스트 |\n| watir | Ruby 기반 웹 애플리케이션 테스트 |\n- Selenium vs watir: 둘 다 웹 테스트. '루비'가 나오면 watir\n- 구현 뒤 동작 상태 감시는 APM(스카우터, 제니퍼)이 맡는다(dev-072)"},{"id":"dev-072","subject":"dev","topic":"인터페이스","sub":"인터페이스 감시 도구","type":"short","level":1,"q":"다음 설명에 해당하는 도구 유형을 영문 약어로 쓰시오.","box":"인터페이스가 구현된 뒤 애플리케이션의 동작 상태를 감시(모니터링)하는 도구다. 리소스 사용량, 트랜잭션 수행 시간, DB 호출, 인터페이스 호출 등을 추적해 성능 저하 원인을 찾는다. 오픈 소스인 스카우터(Scouter), 제니퍼(Jennifer)가 대표적이다.","answers":[{"label":"답","accept":["APM"]}],"hint":"애플리케이션 성능 관리, 세 글자","explain":"정답: APM(Application Performance Management/Monitoring)\n- 종류: 리소스 방식(Nagios, Zabbix, Cacti) / 엔드투엔드 방식(VisualVM, 제니퍼, 스카우터)\n- 스카우터: 애플리케이션 모니터링 + DB Agent로 오픈 소스 DB 모니터링, 인터페이스 감시\n- 제니퍼: 개발·테스트·오픈·운영·안정화 전 생애주기 성능 모니터링\n- 검증 도구(xUnit, STAF, FitNesse, NTAF, Selenium, watir)와 감시 도구(APM)를 구분"},{"id":"dev-073","subject":"dev","topic":"인터페이스","sub":"연계 메커니즘","type":"blank","level":1,"q":"다음은 시스템 연계에 대한 설명이다. ①~④에 알맞은 용어를 쓰시오.","box":"연계 시스템은 ( ① ), 수신 시스템, ( ② )(으)로 구성된다.\n- ( ① ): 운영 DB나 애플리케이션에서 연계할 데이터를 추출해 인터페이스 테이블 또는 파일(XML, CSV, TEXT)로 변환해 보낸다.\n- 수신 시스템: 받은 인터페이스 테이블이나 파일을 데이터로 변환해 운영 DB에 반영한다.\n- ( ② ): 송수신 시스템 사이에서 데이터를 주고받고 송수신 현황을 모니터링한다. 보안이 중요하거나 송수신 시스템의 네트워크가 서로 다를 때 둔다.\n\n연계 방식은 ( ③ ) 연계(DB Link, DB Connection, JDBC, API/Open API, 하이퍼링크)와 ( ④ ) 연계(EAI, ESB, 웹 서비스, 소켓)로 나뉜다.","answers":[{"label":"①","accept":["송신 시스템","송신"]},{"label":"②","accept":["중계 서버","중계 시스템","중계"]},{"label":"③","accept":["직접","직접 연계"]},{"label":"④","accept":["간접","간접 연계"]}],"hint":"보내는 쪽 / 가운데 / 바로 붙나, 무언가를 거치나","explain":"정답: ① 송신 시스템 ② 중계 서버 ③ 직접 ④ 간접\n\n| 구분 | 직접 연계 | 간접 연계 |\n|---|---|---|\n| 방식 | 중간 매개 없이 바로 연결 | 연계 솔루션(미들웨어)을 거침 |\n| 예 | DB Link, DB Connection(Pool), JDBC, API/Open API, 하이퍼링크 | EAI, ESB, 웹 서비스(WSDL·UDDI·SOAP), 소켓 |\n| 장점 | 구현 단순, 개발 비용·기간 적음, 빠름 | 서로 다른 네트워크·프로토콜 연계, 변경에 유연, 보안 처리 쉬움 |\n| 단점 | 결합도 높음, 보안 처리 어려움 | 구성 복잡, 성능 저하 가능, 개발·테스트 기간 김 |\n- 연계 솔루션(EAI)은 EAI 서버와 송·수신 쪽 어댑터(클라이언트)를 거쳐 데이터를 넘기므로 간접 연계다\n- 인터페이스 처리 유형: 실시간 · 지연 처리 · 배치 / 통신 유형: 단방향 · 동기 · 비동기\n- 인터페이스 명세서에는 송신·수신 시스템, 연계 방식, 통신 유형, 처리 유형, 발생 주기, 데이터 항목 등을 적는다"},{"id":"dev-074","subject":"dev","topic":"형상·배포","sub":"릴리스 노트","type":"short","past":"2020-1","level":2,"q":"다음은 제품 소프트웨어 릴리스 노트의 어떤 작성 항목에 해당하는지 쓰시오.","box":"문서 이름(릴리스 노트 이름), 제품 이름, 버전 번호, 릴리스 날짜, 참고 날짜, 노트 버전 등의 정보","answers":[{"label":"답","accept":["헤더","Header","머리말"]}],"hint":"문서 맨 위","explain":"정답: 헤더(Header)\n\n| 릴리스 노트 항목(순서대로) | 내용 |\n|---|---|\n| 헤더 | 문서 이름, 제품 이름, 버전 번호, 릴리스 날짜, 참고 날짜, 노트 버전 |\n| 개요 | 제품과 변경 사항의 간략한 개요 |\n| 목적 | 버그 수정·새 기능 등 이번 릴리스의 목적 |\n| 이슈(문제) 요약 | 버그 설명 또는 릴리스 추가 항목 요약 |\n| 재현 항목 | 버그 발견 과정 |\n| 수정/개선 내용 | 수정·개선 내용의 간단한 설명 |\n| 사용자 영향도 | 버전 변경이 최종 사용자에게 미치는 영향 |\n| SW 지원 영향도 | 버전 변경이 SW 지원 프로세스에 미치는 영향 |\n| 노트 | SW·HW 설치 항목, 업그레이드, 문서화 참고 |\n| 면책 조항 | 회사·표준 제품 관련 메시지, 프리웨어·불법 복제 금지 등 |\n| 연락처 | 사용자 지원·문의 연락처 |\n- 두음 '헤개목이 재수사소 노면연'\n- 릴리스 노트: 개발 과정에서 정리한 릴리스 정보를 고객에게 제공하는 문서. '릴리즈 노트'로도 쓴다"},{"id":"dev-075","subject":"dev","topic":"형상·배포","sub":"형상 관리","type":"short","past":"2020-2","level":3,"q":"다음 설명의 괄호( )에 공통으로 들어갈 용어를 쓰시오.","box":"소프트웨어 개발 과정에서 변경 사항을 관리하는 기법을 ( ) 기법이라 하며, ( ) 기법을 활용한 도구로는 CVS, SVN, Git 등이 있다.","answers":[{"label":"답","accept":["형상 관리","소프트웨어 형상 관리","SCM","Software Configuration Management"]}],"hint":"Configuration의 번역어. 베이스라인을 지킨다","explain":"정답: 형상 관리(SCM, Software Configuration Management)\n- 소프트웨어 개발 전 단계(유지보수 포함)에서 산출물의 변경을 식별·통제·추적하는 활동\n- 형상 관리 절차: 형상 식별 → 형상 통제 → 형상 감사 → 형상 기록(상태 보고) — 두음 '식통감기'\n- 베이스라인(Baseline, 기준선): 공식 검토·합의를 거친 산출물 기준점. 이후 변경은 형상 통제를 거쳐야 한다\n- 형상 항목 예: 요구사항 명세서, 설계서, 소스 코드, 테스트 케이스, 매뉴얼"},{"id":"dev-076","subject":"dev","topic":"형상·배포","sub":"형상 통제","type":"essay","past":"2020-3","level":2,"q":"형상 관리 절차 중 형상 통제(Configuration Control)를 약술하시오.","answers":[{"label":"답","accept":[],"model":"식별된 형상 항목에 대한 변경 요구를 검토·승인해 현재의 기준선(베이스라인)에 반영되도록 조정하고, 변경 여부와 변경 활동을 통제하는 작업이다. 형상 통제 위원회(CCB)가 변경 요청을 검토하고 승인한다."}],"hint":"변경 요청 → 검토·승인 → 베이스라인 반영","explain":"채점 핵심어: 변경 요구 검토·승인, 기준선(베이스라인) 반영, 변경 통제(+ CCB)\n\n| 절차 | 하는 일 |\n|---|---|\n| 형상 식별 | 관리 대상에 이름·관리 번호를 붙이고 계층 구조로 구분 |\n| 형상 통제 | 변경 요구를 검토·승인해 베이스라인에 반영(CCB) |\n| 형상 감사 | 베이스라인의 무결성을 확인·검증·검열해 공식 승인 |\n| 형상 기록(상태 보고) | 식별·통제·감사 결과를 기록·관리하고 보고서 작성 |\n- 교재에 따라 '버전 제어'를 기능으로 하나 더 넣기도 한다"},{"id":"dev-077","subject":"dev","topic":"형상·배포","sub":"형상 관리 도구","type":"choice","past":"2022-3","level":2,"q":"다음 \u003c보기> 중 형상 관리 도구를 3가지 골라 기호로 쓰시오.","options":["ㄱ. ATM","ㄴ. CVS","ㄷ. OLAP","ㄹ. DDoS","ㅁ. SVN","ㅂ. Cyber Kill Chain","ㅅ. OLTP","ㅇ. Git"],"anyOrder":true,"answers":[{"label":"①","accept":["ㄴ","CVS"]},{"label":"②","accept":["ㅁ","SVN","Subversion"]},{"label":"③","accept":["ㅇ","Git"]}],"hint":"버전 관리 도구 세 가지","explain":"정답: ㄴ CVS, ㅁ SVN, ㅇ Git\n\n| 도구 | 방식 | 특징 |\n|---|---|---|\n| CVS | 중앙 집중(클라이언트/서버) | 오래된 오픈 소스 버전 관리 도구 |\n| SVN(Subversion) | 중앙 집중 | CVS 개선, trunk·branches, 커밋마다 리비전 1 증가 |\n| Git | 분산 저장소 | 리누스 토발즈 개발, 로컬 저장소에 커밋 후 원격에 push |\n- 나머지 보기: ATM(비동기 전송 모드), OLAP(다차원 분석 처리), OLTP(온라인 트랜잭션 처리), DDoS(분산 서비스 거부 공격), Cyber Kill Chain(공격 단계 모델)\n- 공유 폴더 방식 도구: RCS, SCCS, PVCS, QVCS"},{"id":"dev-078","subject":"dev","topic":"형상·배포","sub":"형상 관리 절차","type":"order","level":2,"q":"다음 \u003c보기>의 형상 관리 활동을 수행 순서대로 나열하시오.","options":["ㄱ. 형상 감사","ㄴ. 형상 기록","ㄷ. 형상 식별","ㄹ. 형상 통제"],"answers":[{"label":"답","accept":["ㄷ-ㄹ-ㄱ-ㄴ"]}],"hint":"무엇을 관리할지 정해야 바꿀 수 있고, 바꾼 뒤 검사하고, 마지막에 남긴다","explain":"정답: ㄷ → ㄹ → ㄱ → ㄴ (식별 → 통제 → 감사 → 기록)\n- 식별: 무엇을 관리할지 정하고 이름·번호 부여, 베이스라인 설정\n- 통제: 변경 요청 검토·승인(CCB)\n- 감사: 베이스라인 무결성 검증. 기능 감사(FCA: 요구 기능을 실제로 하는가)·물리 감사(PCA: 산출물이 기록과 일치하는가)\n- 기록: 결과를 기록하고 보고(상태 보고, Status Accounting)\n- 시나공 계열은 '형상 관리 기능' 5가지(식별 · 버전 제어 · 통제 · 감사 · 기록)로 정리한다. '절차'를 물으면 4단계, '기능'을 물으면 버전 제어까지 쓴다\n- Git으로 비유: 식별 = 무엇을 저장소에 넣고 태그를 붙일지 / 통제 = Pull Request 리뷰·승인 / 감사 = 머지 전 테스트·배포 태그 점검 / 기록 = git log"},{"id":"dev-079","subject":"dev","topic":"형상·배포","sub":"형상 통제","type":"short","level":1,"q":"형상 통제 과정에서 변경 요청을 받아 영향도·일정·비용을 검토하고, 변경을 승인하거나 기각하는 조직을 영문 약어로 쓰시오.","answers":[{"label":"답","accept":["CCB"]}],"hint":"변경 통제 + 위원회","explain":"정답: CCB(Change Control Board 또는 Configuration Control Board, 형상(변경) 통제 위원회)\n- 형상 통제 흐름: 변경 요청(CR) → CCB 검토 → 승인/기각 → 승인된 변경만 베이스라인에 반영\n- 지문에 '변경 요구를 검토·승인해 베이스라인에 반영'이 보이면 형상 통제, 그 주체를 물으면 CCB\n- 베이스라인: 정식으로 검토·합의돼 이후 변경을 통제받는 산출물 기준점"},{"id":"dev-080","subject":"dev","topic":"형상·배포","sub":"버전 관리 용어","type":"blank","level":1,"q":"다음은 소프트웨어 버전 관리 도구의 주요 용어다. ①~④에 알맞은 용어를 쓰시오.","box":"- 저장소(Repository): 최신 버전 파일과 변경 내역 정보가 저장된 곳\n- ( ① ): 버전 관리가 되고 있지 않은 빈 저장소에 처음으로 파일을 복사한다.\n- ( ② ): 프로그램을 수정하려고 저장소에서 파일을 받아 온다.\n- 체크인(Check-In): 체크아웃한 파일의 수정을 마치고 저장소의 파일을 새 버전으로 갱신한다.\n- ( ③ ): 체크인할 때 이전에 갱신된 내용이 있으면 충돌을 알리고, diff 도구로 수정한 뒤 갱신을 완료한다.\n- ( ④ ): 저장소의 최신 버전으로 자신의 작업 공간을 맞춘다.","answers":[{"label":"①","accept":["임포트","가져오기","Import"]},{"label":"②","accept":["체크아웃","인출","Check-Out","Checkout"]},{"label":"③","accept":["커밋","예치","Commit"]},{"label":"④","accept":["동기화","업데이트","Update"]}],"hint":"처음 넣기 / 꺼내기 / 확정 / 맞추기","explain":"정답: ① 임포트(가져오기) ② 체크아웃 ③ 커밋 ④ 동기화(Update)\n- 버전 등록 과정: 가져오기(Import) → 인출(Check-Out) → 예치(Commit) → 동기화(Update) → 차이(Diff)\n- 익스포트(Export): 버전 관리 정보를 뺀 순수 소스 파일만 받아 오는 것(SVN export)\n- 체크인 vs 커밋: 체크인은 수정본을 저장소에 올려 새 버전으로 갱신하는 것, 커밋은 충돌을 해결하고 갱신을 확정하는 것(교재 정의)\n- Git 명령 흐름: init → remote add → add → commit(로컬 저장소) → push(원격 저장소). fetch는 원격 이력만 가져오고, clone은 원격 전체를 복제"},{"id":"dev-081","subject":"dev","topic":"형상·배포","sub":"버전 관리 방식","type":"essay","level":1,"q":"버전 관리 방식 중 클라이언트/서버(중앙 집중) 방식과 분산 저장소 방식의 차이를 대표 도구와 함께 약술하시오.","answers":[{"label":"답","accept":[],"model":"클라이언트/서버 방식은 버전 관리 자료를 중앙 서버 한 곳에 저장하고, 개발자는 서버에서 받아 작업한 뒤 서버에 반영한다. 서버에 문제가 생기면 협업과 버전 관리가 멈춘다(CVS, SVN). 분산 저장소 방식은 원격 저장소와 각 개발자의 로컬 저장소에 함께 저장해, 로컬에 먼저 커밋한 뒤 원격에 반영(push)한다. 원격 저장소에 문제가 있어도 로컬에서 작업할 수 있고 처리 속도가 빠르다(Git)."}],"hint":"서버가 멈추면 일할 수 있나","explain":"채점 핵심어: 중앙 = 서버 한 곳, 서버 장애 시 작업 중단, CVS·SVN / 분산 = 로컬 저장소에 전체 이력, 로컬 commit 후 원격 push, 오프라인 작업 가능, Git\n\n| 방식 | 저장 위치 | 도구 |\n|---|---|---|\n| 공유 폴더 | 로컬 공유 폴더(매일 복사) | RCS, SCCS, PVCS, QVCS |\n| 클라이언트/서버 | 중앙 서버 | CVS, SVN |\n| 분산 저장소 | 원격 + 개발자별 로컬 | Git, Bitkeeper(Mercurial도 분산형) |"},{"id":"dev-082","subject":"dev","topic":"형상·배포","sub":"빌드 자동화 도구","type":"blank","level":1,"q":"다음은 빌드 자동화 도구에 대한 설명이다. ①~④에 알맞은 도구를 \u003c보기>에서 골라 쓰시오.","box":"① 아파치 소프트웨어 재단에서 만든 자바 프로젝트 빌드 도구. XML 기반 빌드 스크립트를 쓰며, 정해진 규칙이나 표준이 없어 개발자가 모든 것을 정의한다.\n② ①의 대안으로 아파치에서 만들었다. 규칙과 표준이 있어 예외 사항만 기록하면 되고, 의존성(Dependency)을 설정해 라이브러리를 관리한다.\n③ 그루비(Groovy) 기반 빌드 스크립트를 쓰며 안드로이드 스튜디오의 공식 빌드 도구다. 처리 명령을 태스크(Task)로 만들어 실행하고 빌드 캐시로 속도를 높인다.\n④ 자바 기반 오픈 소스로, 서블릿 컨테이너에서 실행되는 서버 기반 도구다. SVN·Git 등 형상 관리 도구와 연동되고 Web GUI와 분산 빌드를 지원한다.","options":["ㄱ. Ant","ㄴ. Maven","ㄷ. Gradle","ㄹ. Jenkins","ㅁ. Make","ㅂ. Eclipse"],"answers":[{"label":"①","accept":["ㄱ","Ant","Another Neat Tool"]},{"label":"②","accept":["ㄴ","Maven","메이븐"]},{"label":"③","accept":["ㄷ","Gradle","그레이들"]},{"label":"④","accept":["ㄹ","Jenkins","젠킨스"]}],"hint":"① XML·규칙 없음 ② 의존성 ③ Groovy ④ 서블릿 컨테이너","explain":"정답: ① Ant ② Maven ③ Gradle ④ Jenkins\n- 헷갈리는 쌍: Maven도 Gradle도 의존성 관리를 한다. 'Groovy·안드로이드·태스크'면 Gradle\n- Jenkins는 지속적 통합(CI) 서버. 나머지 셋은 빌드 스크립트 도구\n- Make(ㅁ): 유닉스 계열 C/C++ 빌드 도구(Makefile)\n- Eclipse(ㅂ)는 빌드 도구가 아니라 IDE. IDE 예: Eclipse, IntelliJ IDEA, Visual Studio, Xcode, Android Studio\n- 협업 도구 예: 일정(구글 캘린더), 프로젝트 관리(Jira, Trello), 커뮤니케이션(Slack, Jandi), 디자인(Sketch, Zeplin)"},{"id":"dev-083","subject":"dev","topic":"형상·배포","sub":"릴리스 노트","type":"blank","level":1,"q":"다음은 릴리스 노트 작성 항목에 대한 설명이다. ①~③에 알맞은 항목을 쓰시오.","box":"- ( ① ): 버그가 발견된 과정을 설명한다.\n- 수정/개선 내용: 버그를 수정하거나 개선한 내용을 간단히 설명한다.\n- ( ② ): 버전 변경이 최종 사용자에게 미치는 영향을 설명한다.\n- SW 지원 영향도: 버전 변경이 소프트웨어 지원 프로세스에 미치는 영향을 설명한다.\n- ( ③ ): 회사·표준 제품과 관련된 메시지, 프리웨어·불법 복제 금지 등 법적 고지를 적는다.","answers":[{"label":"①","accept":["재현 항목","재현"]},{"label":"②","accept":["사용자 영향도"]},{"label":"③","accept":["면책 조항","Disclaimer"]}],"hint":"① 버그를 다시 일으키는 법 ③ 법적 고지","explain":"정답: ① 재현 항목 ② 사용자 영향도 ③ 면책 조항\n- 11항목 순서: 헤더 → 개요 → 목적 → 이슈 요약 → 재현 항목 → 수정/개선 내용 → 사용자 영향도 → SW 지원 영향도 → 노트 → 면책 조항 → 연락처 (두음 '헤개목이 재수사소 노면연')\n- 영향도 짝: 사용자 영향도(최종 사용자) vs SW 지원 영향도(지원 프로세스)\n- 릴리스 노트 작성 프로세스: 모듈 식별 → 릴리스 정보 확인 → 릴리스 노트 개요 작성 → 영향도 체크 → 정식 릴리스 노트 작성 → 추가 개선 항목 식별\n- 헤더는 2020년 1회 기출(dev-074)"},{"id":"dev-084","subject":"dev","topic":"형상·배포","sub":"DRM 구성 요소","type":"blank","level":1,"q":"다음은 디지털 저작권 관리(DRM)의 구성 요소다. ①~④에 알맞은 용어를 쓰시오.","box":"- 콘텐츠 제공자(Contents Provider): 콘텐츠를 제공하는 저작권자\n- 콘텐츠 분배자(Contents Distributor): 암호화된 콘텐츠를 유통하는 곳이나 사람\n- 콘텐츠 소비자(Customer): 콘텐츠를 구매해서 사용하는 주체\n- ( ① ): 저작권에 대한 사용 권한, 라이선스 발급, 사용량에 따른 결제 관리 등을 수행하는 곳\n- ( ② ): 콘텐츠를 메타데이터와 함께 배포 가능한 형태로 묶어 암호화하는 프로그램\n- ( ③ ): 배포된 콘텐츠의 이용 권한을 통제하는 프로그램\n- ( ④ ): 콘텐츠 원본을 안전하게 유통하기 위한 전자적 보안 장치","answers":[{"label":"①","accept":["클리어링 하우스","Clearing House"]},{"label":"②","accept":["패키저","Packager"]},{"label":"③","accept":["DRM 컨트롤러","DRM Controller"]},{"label":"④","accept":["보안 컨테이너","Security Container"]}],"hint":"① 정산소 ② 포장 ③ 통제 ④ 금고","explain":"정답: ① 클리어링 하우스 ② 패키저 ③ DRM 컨트롤러 ④ 보안 컨테이너\n- 흐름: 제공자 → 패키저(암호화·포장) → 분배자(유통) → 소비자. 소비자가 열 때 DRM 컨트롤러가 클리어링 하우스에서 라이선스를 받아 권한을 확인한다\n- 두음 '콘패클컨보': 콘텐츠(제공자·분배자·소비자) · 패키저 · 클리어링 하우스 · DRM 컨트롤러 · 보안 컨테이너\n- 헷갈리는 쌍: 클리어링 하우스(라이선스·결제를 관리하는 '곳') vs DRM 컨트롤러(사용자 쪽에서 권한을 통제하는 '프로그램')\n- 제품 SW 패키징 도구는 저작권 보호를 위해 이 DRM 기술을 쓴다(출제기준 12.1)"},{"id":"dev-085","subject":"dev","topic":"형상·배포","sub":"DRM 기술","type":"blank","level":1,"q":"다음은 디지털 저작권 관리(DRM)의 기술 요소다. ①~③에 알맞은 기술을 \u003c보기>에서 골라 쓰시오.","box":"① 크랙에 의해 콘텐츠가 무단으로 사용되는 것을 막는 기술\n② 콘텐츠를 암호화한 키를 저장하고 분배하는 기술\n③ 라이선스의 내용(권한)을 표현하는 기술","options":["ㄱ. 암호화(Encryption)","ㄴ. 키 관리(Key Management)","ㄷ. 암호화 파일 생성(Packager)","ㄹ. 식별 기술(Identification)","ㅁ. 저작권 표현(Right Expression)","ㅂ. 정책 관리(Policy Management)","ㅅ. 크랙 방지(Tamper Resistance)","ㅇ. 인증(Authentication)"],"answers":[{"label":"①","accept":["ㅅ","크랙 방지","Tamper Resistance"]},{"label":"②","accept":["ㄴ","키 관리","Key Management"]},{"label":"③","accept":["ㅁ","저작권 표현","Right Expression"]}],"hint":"① 크랙에 버틴다 ② 열쇠 ③ 라이선스의 '내용'(정책과 구분)","explain":"정답: ① ㅅ 크랙 방지 ② ㄴ 키 관리 ③ ㅁ 저작권 표현\n\n| 기술 | 내용 |\n|---|---|\n| 암호화 | 콘텐츠·라이선스 암호화, 전자 서명 |\n| 키 관리 | 암호화 키 저장·분배 |\n| 암호화 파일 생성 | 콘텐츠를 암호화된 콘텐츠로 생성(패키저) |\n| 식별 기술 | 콘텐츠 식별 체계 표현 |\n| 저작권 표현 | 라이선스 내용 표현 |\n| 정책 관리 | 라이선스 발급·사용 정책 표현·관리 |\n| 크랙 방지 | 크랙에 의한 콘텐츠 사용 방지 |\n| 인증 | 라이선스 발급·사용의 기준이 되는 사용자 인증 |\n- 두음 '암키식저 파정크인'\n- 헷갈리는 쌍: 저작권 표현(라이선스 '내용') vs 정책 관리(발급·사용 '정책')"},{"id":"dev-086","subject":"dev","topic":"형상·배포","sub":"제품 SW 패키징","type":"order","level":1,"q":"다음은 사용자 중심의 모듈 패키징 작업 단계다. 순서대로 기호를 나열하시오.","options":["ㄱ. 빌드 진행","ㄴ. 패키징 적용 시험","ㄷ. 기능 식별","ㄹ. 사용자 환경 분석","ㅁ. 모듈화","ㅂ. 패키징 변경 개선"],"answers":[{"label":"답","accept":["ㄷ-ㅁ-ㄱ-ㄹ-ㄴ-ㅂ"]}],"hint":"무엇을 → 나누고 → 만들고 → 어디서 쓰나 → 시험 → 고친다","explain":"정답: ㄷ → ㅁ → ㄱ → ㄹ → ㄴ → ㅂ (기능 식별 → 모듈화 → 빌드 진행 → 사용자 환경 분석 → 패키징 적용 시험 → 패키징 변경 개선)\n- 패키징: 개발이 끝난 제품 SW를 고객에게 전달할 형태로 포장하는 것. 개발자가 아니라 **사용자 중심**으로 진행\n- 패키징 도구 고려사항: 암호화·보안, 이기종 콘텐츠·단말 연동, 사용자 편의성, 적합한 암호화 알고리즘\n- 설치 매뉴얼: 사용자가 설치 과정을 따라 할 수 있게 쓴 문서. 목차·개요, 문서 이력, 설치 매뉴얼 주석, 설치 도구 구성, 설치 절차 등\n- 사용자 매뉴얼: 제품의 기능과 사용 방법을 설명한 문서\n- 설치 파일과 매뉴얼은 배포용 미디어로 만들어 배포한다\n- 교재에 따라 마지막에 '배포'를 붙여 7단계로 쓰기도 한다"},{"id":"dev-087","subject":"dev","topic":"품질 표준·프로세스","sub":"비용 산정(LoC) 역산","type":"calc","level":1,"q":"다음은 LoC 기법으로 비용을 산정하는 상황이다. ( ① )~( ③ )에 알맞은 값을 숫자로 쓰시오.","box":"- 완료된 프로젝트 A: 총 24,000 라인을 개발자 4명이 10개월에 걸쳐 개발했다.\n- 새 프로젝트 B: 총 36,000 라인으로 추정한다. 프로젝트 A와 같은 생산성으로 6개월 안에 끝내려 한다.\n\n( ① ) 프로젝트 A의 노력(MM, 인월)\n( ② ) 프로젝트 A의 생산성(라인/MM)\n( ③ ) 프로젝트 B에 투입해야 할 개발자 수(명)","answers":[{"label":"①","accept":["40","40MM","40인월"]},{"label":"②","accept":["600","600라인","600라인/MM"]},{"label":"③","accept":["10","10명"]}],"hint":"노력(MM) = 투입 인원 × 개발 기간. 공식을 거꾸로 쓴다","explain":"정답: ① 40 ② 600 ③ 10\n1. A의 노력 = 투입 인원 × 개발 기간 = 4 × 10 = 40 MM\n2. A의 생산성 = LoC ÷ 노력 = 24,000 ÷ 40 = 600 라인/MM\n3. B의 노력 = 36,000 ÷ 600 = 60 MM → 인원 = 노력 ÷ 기간 = 60 ÷ 6 = **10명**\n- 생산성(LoC ÷ MM)은 1인당 월 평균 생산 라인 수와 같은 값이다: 24,000 ÷ 4 ÷ 10 = 600\n- 함정: B에 A와 같은 4명을 넣으면 60 ÷ 4 = 15개월이 걸린다. 이 문제는 기간(6개월)을 고정하고 인원을 구한다\n- 같은 공식을 정방향으로 쓰는 문항: 개발 기간(2020-1 기출, design-070), 예측 LoC·비용(design-071)\n\nLoC 공식 묶음\n- 예측 LoC = (낙관치 + 4 × 기대치 + 비관치) ÷ 6\n- 노력(MM) = LoC ÷ 1인당 월 평균 생산 라인 수 = 투입 인원 × 개발 기간\n- 개발 기간 = 노력 ÷ 투입 인원\n- 개발 비용 = 노력 × 1인당 월 평균 인건비\n- 생산성 = LoC ÷ 노력\n- 비용 산정 기법: 하향식(전문가 감정, 델파이) / 상향식(LoC, 개발 단계별 인월수, 수학적 산정 COCOMO·Putnam·FP)\n- COCOMO 유형: 조직형(organic, 5만 라인 이하) · 반분리형(semi-detached, 30만 라인 이하) · 내장형(embedded, 30만 라인 초과)"},{"id":"dev-088","subject":"dev","topic":"품질 표준·프로세스","sub":"ISO/IEC 9126","type":"blank","level":2,"q":"다음은 ISO/IEC 9126의 소프트웨어 품질 특성과 부특성이다. ①~⑥에 알맞은 품질 특성을 쓰시오.","box":"| 품질 특성 | 부특성 |\n|---|---|\n| ( ① ) | 적합성, 정확성, 상호 운용성, 보안성, 준수성 |\n| ( ② ) | 성숙성, 고장 허용성, 회복성 |\n| ( ③ ) | 이해성, 학습성, 운용성, 친밀성 |\n| ( ④ ) | 시간 효율성, 자원 효율성 |\n| ( ⑤ ) | 분석성, 변경성, 안정성, 시험성 |\n| ( ⑥ ) | 적응성, 설치성, 대체성, 공존성 |","answers":[{"label":"①","accept":["기능성","Functionality"]},{"label":"②","accept":["신뢰성","Reliability"]},{"label":"③","accept":["사용성","Usability"]},{"label":"④","accept":["효율성","Efficiency"]},{"label":"⑤","accept":["유지보수성","Maintainability"]},{"label":"⑥","accept":["이식성","Portability"]}],"hint":"성숙·고장 허용·회복은 '믿을 만한가', 적응·설치·대체는 '옮길 수 있나'","explain":"정답: ① 기능성 ② 신뢰성 ③ 사용성 ④ 효율성 ⑤ 유지보수성 ⑥ 이식성\n- 두음 '기신사효유이'\n- 헷갈리는 부특성\n- 고장 허용성 vs 회복성(둘 다 신뢰성): 결함이 있어도 성능 유지 / 고장 뒤 데이터와 성능 회복\n- 안정성(유지보수성): 수정 뒤 예기치 못한 영향이 없는 정도 — 신뢰성이 아니다\n- 적응성·공존성(이식성): 다른 환경에 맞추기 / 같은 환경에서 다른 SW와 자원 공유\n- 운용성(사용성) vs 상호 운용성(기능성)\n- 9126은 ISO/IEC 25010으로 대체됐다(기능 적합성·성능 효율성·호환성·사용성·신뢰성·보안성·유지보수성·이식성 8가지)\n- 표기 차이: 적합성/적절성, 정확성/정밀성, 적응성/적용성 — 교재마다 다르다"},{"id":"dev-089","subject":"dev","topic":"품질 표준·프로세스","sub":"국제 표준","type":"blank","level":1,"q":"다음 설명에 해당하는 국제 표준을 쓰시오.","box":"① 소프트웨어 생명 주기 프로세스 표준. 기본 생명 주기 프로세스(획득, 공급, 개발, 운영, 유지보수), 지원 생명 주기 프로세스(품질 보증, 검증, 확인, 활동 검토, 감사, 문서화, 형상 관리, 문제 해결), 조직 생명 주기 프로세스(관리, 기반 구조, 훈련, 개선)로 나눈다.\n② ISO/IEC 9126을 대체한 소프트웨어 제품 품질 표준. 기능 적합성, 성능 효율성, 호환성, 사용성, 신뢰성, 보안성, 유지보수성, 이식성을 품질 특성으로 정의한다.\n③ 소프트웨어 품질과 생산성을 높이려고 소프트웨어 프로세스를 평가·개선하는 국제 표준. 공식 명칭은 ISO/IEC 15504다.","answers":[{"label":"①","accept":["ISO/IEC 12207","12207","ISO 12207"]},{"label":"②","accept":["ISO/IEC 25010","25010","ISO 25010"]},{"label":"③","accept":["SPICE","Software Process Improvement and Capability dEtermination"]}],"hint":"① 생명 주기 ② 9126의 후속 ③ 15504의 별칭, 영어로 '향신료'","explain":"정답: ① ISO/IEC 12207 ② ISO/IEC 25010 ③ SPICE\n\n| 표준 | 대상 |\n|---|---|\n| ISO/IEC 9126 | 제품 품질 특성 6가지(기신사효유이) |\n| ISO/IEC 25010 | 9126 후속, 품질 특성 8가지 |\n| ISO/IEC 12119 | 패키지 소프트웨어 품질 요구사항·테스트 |\n| ISO/IEC 14598 | 제품 품질 평가 절차 |\n| ISO/IEC 12207 | 소프트웨어 생명 주기 프로세스 |\n| ISO/IEC 15504(SPICE) | 프로세스 평가·개선, 능력 수준 6단계 |\n| CMMI | 프로세스 성숙도 5단계(카네기멜런 SEI) |\n- 25010은 2023년 개정판에서 9가지로 바뀌었지만 수험서는 2011년판 8가지를 쓴다"},{"id":"dev-090","subject":"dev","topic":"품질 표준·프로세스","sub":"CMMI·SPICE","type":"blank","level":1,"q":"다음은 소프트웨어 프로세스 성숙도·능력 수준 모델이다. ①~④에 알맞은 단계 이름을 쓰시오.","box":"- CMMI 성숙도 5단계: 초기(Initial) → ( ① ) → 정의(Defined) → ( ② ) → 최적화(Optimizing)\n- SPICE 능력 수준 6단계: 0 불완전(Incomplete) → 1 수행(Performed) → 2 관리(Managed) → 3 ( ③ ) → 4 ( ④ ) → 5 최적화(Optimizing)","answers":[{"label":"①","accept":["관리","관리됨","Managed"]},{"label":"②","accept":["정량적 관리","Quantitatively Managed"]},{"label":"③","accept":["확립","Established"]},{"label":"④","accept":["예측","Predictable","Predicted"]}],"hint":"CMMI 4단계는 '숫자로 잰다'. SPICE 3·4단계는 CMMI와 이름이 다르다","explain":"정답: ① 관리 ② 정량적 관리 ③ 확립 ④ 예측\n\n| 단계 | CMMI(성숙도) | SPICE(능력 수준) |\n|---|---|---|\n| 0 | — | 불완전(Incomplete) |\n| 1 | 초기 | 수행(Performed) |\n| 2 | 관리 | 관리(Managed) |\n| 3 | 정의 | 확립(Established) |\n| 4 | 정량적 관리 | 예측(Predictable) |\n| 5 | 최적화 | 최적화(Optimizing) |\n- 두음: CMMI '초관정정최', SPICE '불수관확예최'\n- 함정: CMMI 3 = 정의, SPICE 3 = 확립 / CMMI 4 = 정량적 관리, SPICE 4 = 예측\n- 출처마다 SPICE 0단계를 '불안정'으로 적기도 한다"},{"id":"dev-091","subject":"dev","topic":"품질 표준·프로세스","sub":"테일러링 기준","type":"choice","level":1,"q":"다음은 개발 방법론 테일러링(Tailoring) 때 고려하는 기준이다. \u003c보기>에서 외부 기준 2가지를 골라 기호로 쓰시오.","box":"테일러링은 프로젝트의 상황과 특성에 맞게, 이미 정의된 개발 방법론의 절차·기법·산출물을 수정하고 보완하는 작업이다. 고려 기준은 내부 기준과 외부 기준으로 나눈다.","options":["ㄱ. 목표 환경","ㄴ. 법적 제약사항","ㄷ. 요구사항","ㄹ. 프로젝트 규모","ㅁ. 표준 품질 기준","ㅂ. 보유 기술"],"anyOrder":true,"answers":[{"label":"①","accept":["ㄴ","법적 제약사항"]},{"label":"②","accept":["ㅁ","표준 품질 기준"]}],"hint":"프로젝트 팀이 바꿀 수 없고 밖에서 정해진 것","explain":"정답: ㄴ 법적 제약사항, ㅁ 표준 품질 기준\n- 외부 기준: 프로젝트 밖에서 정해져 팀이 바꿀 수 없는 것 → 법적 제약사항, 표준 품질 기준\n- 내부 기준: 프로젝트 안 사정 → 목표 환경, 요구사항, 프로젝트 규모, 보유 기술\n- 테일러링 정의를 보고 용어를 쓰는 문항은 design-081 ④\n- 같은 단원에서 나오는 것: 소프트웨어 개발 프레임워크 특성(모듈화 · 재사용성 · 확장성 · 제어의 역흐름, dev-096)\n- 개발 방법론 예: 구조적, 정보공학, 객체지향, CBD(컴포넌트 기반), 애자일, 제품 계열"},{"id":"dev-092","subject":"dev","topic":"서버·배치","sub":"배치 프로그램 필수 요소","type":"blank","level":1,"q":"다음은 배치 프로그램이 갖춰야 할 필수 요소다. ①~⑤에 알맞은 요소를 쓰시오.","box":"- ( ① ): 대량의 데이터를 가져오고, 전달하고, 계산하고, 저장할 수 있어야 한다.\n- ( ② ): 심각한 오류 상황 외에는 사용자의 개입 없이 동작해야 한다.\n- ( ③ ): 잘못된 데이터나 데이터 중복 같은 비정상 상황에서도 비정상 종료 없이 수행되어야 한다.\n- ( ④ ): 오류가 생기면 어디서, 언제 발생했는지 추적할 수 있어야 한다.\n- ( ⑤ ): 다른 응용 프로그램의 수행을 방해하지 않고, 지정된 시간 안에 처리를 끝내야 한다.","answers":[{"label":"①","accept":["대용량 데이터","대용량 데이터 처리"]},{"label":"②","accept":["자동화","Automation"]},{"label":"③","accept":["견고성","Robustness"]},{"label":"④","accept":["안정성/신뢰성","안정성","신뢰성","안정성과 신뢰성"]},{"label":"⑤","accept":["성능","Performance"]}],"hint":"① 양 ② 사람 손 ③ 튼튼함 ④ 추적 ⑤ 시간 안에","explain":"정답: ① 대용량 데이터 ② 자동화 ③ 견고성 ④ 안정성·신뢰성 ⑤ 성능\n- 배치 프로그램: 사용자와 상호작용 없이 일련의 작업을 묶어 정기적으로 반복하거나, 정해진 규칙에 따라 일괄 처리하는 프로그램\n- 견고성 vs 안정성·신뢰성: 견고성은 '잘못된 데이터가 와도 멈추지 않는다', 안정성·신뢰성은 '오류가 나면 언제·어디서인지 추적된다'\n- 배치 유형: 이벤트 · 온디맨드 · 정기(dev-093)"},{"id":"dev-093","subject":"dev","topic":"서버·배치","sub":"배치 유형","type":"blank","level":1,"q":"다음은 배치 프로그램의 유형이다. ①~③에 알맞은 유형을 쓰시오.","box":"- ( ① ) 배치: 정해진 시점(주로 야간)이나 일·주·월 같은 주기에 맞춰 실행한다.\n- ( ② ) 배치: 사전에 정의해 둔 조건이 충족되면 자동으로 실행한다.\n- ( ③ ) 배치: 사용자가 명시적으로 요구할 때마다 실행한다.","answers":[{"label":"①","accept":["정기","정기 배치"]},{"label":"②","accept":["이벤트","이벤트성","이벤트 배치","이벤트성 배치","Event"]},{"label":"③","accept":["온디맨드","온디맨드 배치","On-Demand","On Demand"]}],"hint":"시계 / 조건 / 요청","explain":"정답: ① 정기 ② 이벤트 ③ 온디맨드\n- 두음 '이온정': 이벤트 · 온디맨드 · 정기\n- 배치 스케줄러: Spring Batch(스프링 기반 배치 프레임워크), Quartz(작업과 실행 시점을 분리한 오픈 소스 스케줄링 라이브러리), cron(유닉스·리눅스 crontab)\n- 인터페이스 처리 유형의 '배치 방식'(대량 데이터를 모아 한 번에 처리)과 같은 맥락"},{"id":"dev-094","subject":"dev","topic":"서버·배치","sub":"배치 스케줄러","type":"blank","level":1,"q":"다음은 배치 스케줄러에 대한 설명이다. ①~③에 알맞은 것을 \u003c보기>에서 골라 쓰시오.","box":"① 스프링 소스와 액센추어가 함께 만든 오픈 소스 배치 프레임워크. 스프링 프레임워크의 기능을 그대로 쓰며 대용량 처리, 트랜잭션 관리, 재시작 기능을 제공한다. Job, Step, ItemReader, ItemProcessor, ItemWriter로 구성된다.\n② 스프링 기반 응용 프로그램의 일괄 처리에 쓰는 오픈 소스 스케줄링 라이브러리. 수행할 작업과 수행 시간(트리거)을 관리하는 요소를 분리해 유연성을 준다. Scheduler, Job, JobDetail, Trigger로 구성된다.\n③ 유닉스·리눅스 계열의 기본 작업 스케줄러. `분 시 일 월 요일 명령` 형식으로 crontab에 등록한다.","options":["ㄱ. Spring Batch","ㄴ. Quartz","ㄷ. cron","ㄹ. Jenkins","ㅁ. Maven"],"answers":[{"label":"①","accept":["ㄱ","Spring Batch","스프링 배치"]},{"label":"②","accept":["ㄴ","Quartz","쿼츠","Quartz Scheduler"]},{"label":"③","accept":["ㄷ","cron","크론","crontab"]}],"hint":"① Job·Step·ItemReader ② 트리거를 따로 둔다 ③ 유닉스 기본 도구","explain":"정답: ① Spring Batch ② Quartz ③ cron\n- cron 표현식: 리눅스는 `분 시 일 월 요일` (예: `0 2 * * *` → 매일 02:00) / Quartz는 `초 분 시 일 월 요일 [연도]`로 초가 앞에 붙는다\n- Jenkins(ㄹ)는 빌드 자동화·CI 서버, Maven(ㅁ)은 빌드 도구 — 스케줄러가 아니다\n- Spring Batch는 '무엇을 어떻게 처리할지'(배치 로직), Quartz·cron은 '언제 실행할지'(스케줄). 함께 쓰는 경우가 많다"},{"id":"dev-095","subject":"dev","topic":"서버·배치","sub":"개발 환경 구성","type":"blank","level":1,"q":"다음은 소프트웨어 개발 환경의 하드웨어(서버) 구성이다. ①~④에 알맞은 서버를 쓰시오.","box":"- ( ① ): 클라이언트의 요청을 직접 받아 HTML·이미지 같은 정적 파일을 처리한다. 예) Apache, Nginx, IIS\n- ( ② ): 사용자 요청에 맞는 동적 콘텐츠(서비스)를 처리한다. 예) Tomcat, JEUS, WebLogic, Resin\n- ( ③ ): 데이터의 수집·저장을 맡는다. 예) MySQL, Oracle, MS-SQL\n- ( ④ ): 사용자가 쓰는 파일을 HDD·SSD 같은 물리 저장 장치에 저장하고 공유한다.","answers":[{"label":"①","accept":["웹 서버","Web Server"]},{"label":"②","accept":["WAS","웹 애플리케이션 서버","웹 어플리케이션 서버","Web Application Server"]},{"label":"③","accept":["DB 서버","데이터베이스 서버","DB Server","Database Server"]},{"label":"④","accept":["파일 서버","File Server"]}],"hint":"정적 / 동적 / 데이터 / 파일","explain":"정답: ① 웹 서버 ② WAS(웹 애플리케이션 서버) ③ DB 서버 ④ 파일 서버\n- 웹 서버 vs WAS: 웹 서버는 정적 콘텐츠, WAS는 프로그램을 실행해 동적 콘텐츠를 만든다. 보통 웹 서버 → WAS → DB 서버 순으로 요청이 흐른다\n- 개발 환경 = 하드웨어(클라이언트 + 위 서버들) + 소프트웨어(운영체제, 미들웨어(JVM·웹 서버), DBMS, 개발 도구)\n- 개발 도구: 요구사항 관리, 설계/모델링, 구현(IDE), 빌드(Ant·Maven·Gradle), 테스트(xUnit), 형상 관리(Git·SVN)\n- WAS는 미들웨어 종류(DB·RPC·MOM·TP-Monitor·ORB·WAS)에도 들어간다"},{"id":"dev-096","subject":"dev","topic":"서버·배치","sub":"프레임워크 특성","type":"blank","level":1,"q":"소프트웨어 개발 프레임워크의 주요 특성 4가지를 쓰시오.","box":"프레임워크는 소프트웨어 개발에 공통으로 쓰이는 기능을 미리 만들어 제공하는 반제품 형태의 소프트웨어 시스템이다. 예) 스프링(Spring), 전자정부 표준 프레임워크, 닷넷(.NET)","anyOrder":true,"answers":[{"label":"①","accept":["모듈화","Modularity"]},{"label":"②","accept":["재사용성","Reusability"]},{"label":"③","accept":["확장성","Extensibility"]},{"label":"④","accept":["제어의 역흐름","제어의 역전","IoC","Inversion of Control"]}],"hint":"캡슐화 / 다시 쓰기 / 다형성 / 할리우드 원칙('먼저 연락하지 마세요, 우리가 연락합니다')","explain":"정답: 모듈화, 재사용성, 확장성, 제어의 역흐름(IoC)\n\n| 특성 | 뜻 |\n|---|---|\n| 모듈화 | 캡슐화로 모듈화를 강화하고 설계·구현 변경의 영향을 줄인다 |\n| 재사용성 | 재사용 가능한 모듈을 제공해 생산성을 높인다 |\n| 확장성 | 다형성으로 인터페이스를 확장해 여러 형태·기능을 갖게 한다 |\n| 제어의 역흐름 | 객체의 흐름을 개발자가 아니라 프레임워크가 제어한다(IoC) |\n- 라이브러리 vs 프레임워크: 라이브러리는 개발자 코드가 호출하고, 프레임워크는 프레임워크가 개발자 코드를 호출한다 — 이것이 제어의 역흐름\n- 테일러링(dev-091)과 같은 단원(개발 방법론·프레임워크)에서 나온다"},{"id":"dev-097","subject":"dev","topic":"코드 품질","sub":"코드 설계","type":"blank","level":1,"q":"다음은 코드 설계에서 쓰는 코드의 종류다. ①~④에 알맞은 코드 종류를 쓰시오.","box":"- ( ① ) 코드: 자료가 발생한 순서나 일정 기준에 따라 처음부터 차례로 일련번호를 부여한다. 예) 1, 2, 3, 4\n- ( ② ) 코드: 공통성이 있는 것끼리 블록으로 구분하고, 각 블록 안에서 일련번호를 부여한다. 예) 1001~1100 총무부, 1101~1200 영업부\n- ( ③ ) 코드: 0~9로 10진 분할하고, 각각을 다시 10진 분할하는 방법을 필요한 만큼 반복한다(도서 분류식). 예) 1000 공학, 1100 소프트웨어 공학, 1110 소프트웨어 설계\n- ( ④ ) 코드: 길이·넓이·부피·지름·높이 같은 물리적 수치를 그대로 코드에 적용한다. 예) 120-720-1500 (두께 120, 폭 720, 길이 1500인 강판)","answers":[{"label":"①","accept":["순차","순차 코드","순서 코드","일련번호 코드","Sequence Code"]},{"label":"②","accept":["블록","블록 코드","구분 코드","Block Code"]},{"label":"③","accept":["10진","10진 코드","십진 코드","도서 분류식 코드","Decimal Code"]},{"label":"④","accept":["표의 숫자","표의 숫자 코드","유효 숫자 코드","Significant Digit Code"]}],"hint":"① 하나씩 ② 묶음 ③ 도서관 ④ 치수 그대로","explain":"정답: ① 순차 ② 블록 ③ 10진 ④ 표의 숫자\n\n| 코드 | 방식 | 예 |\n|---|---|---|\n| 순차(순서) | 차례로 일련번호 | 1, 2, 3 |\n| 블록(구분) | 블록별로 묶고 그 안에서 일련번호 | 1001~1100 총무부 |\n| 10진(도서 분류식) | 10진 분할 반복 | 1000 → 1100 → 1110 |\n| 그룹 분류 | 대·중·소분류 후 일련번호 | 1-01-001 본사-총무부-인사계 |\n| 연상(기호) | 명칭·약호와 관계있는 문자·숫자 | TV-40 (40인치 TV) |\n| 표의 숫자(유효 숫자) | 물리적 수치를 그대로 | 120-720-1500 |\n| 합성 | 2개 이상 조합 | KE-711 (연상 + 순차) |\n- 코드의 주요 기능: 식별, 분류, 배열, 표준화, 간소화(+ 연상, 암호화, 오류 검출)\n- 헷갈리는 쌍: 블록(구간으로 나눔) vs 그룹 분류(대·중·소 계층) / 연상(의미를 떠올리게) vs 표의 숫자(수치를 그대로)"},{"id":"dev-098","subject":"dev","topic":"코드 품질","sub":"자료구조","type":"blank","level":1,"q":"다음은 자료구조에 대한 설명이다. ①~④에 알맞은 용어를 쓰시오.","box":"- ( ① ): 한쪽 끝(top)에서만 삽입(push)과 삭제(pop)가 일어나는 후입선출(LIFO) 구조. 함수 호출, 후위 표기식 계산에 쓴다.\n- ( ② ): 한쪽 끝(rear)에서 삽입하고 다른 끝(front)에서 삭제하는 선입선출(FIFO) 구조. 운영체제의 작업 스케줄링, 버퍼에 쓴다.\n- ( ③ ): 양쪽 끝 모두에서 삽입과 삭제가 가능한 구조\n- 스택·큐·데크·선형 리스트는 선형 구조이고, ( ④ )와 그래프는 비선형 구조다. ( ④ )는 사이클이 없는 계층 구조로, 전위·중위·후위 순회를 한다.","answers":[{"label":"①","accept":["스택","Stack"]},{"label":"②","accept":["큐","Queue"]},{"label":"③","accept":["데크","덱","Deque"]},{"label":"④","accept":["트리","Tree"]}],"hint":"① 접시 쌓기 ② 줄 서기 ③ 양쪽 출입구 ④ 나무","explain":"정답: ① 스택 ② 큐 ③ 데크 ④ 트리\n\n| 구조 | 삽입·삭제 위치 | 원칙 | 쓰임 |\n|---|---|---|---|\n| 스택 | top 한쪽 | LIFO | 함수 호출(재귀), 후위 표기식 계산, 되돌리기 |\n| 큐 | rear 삽입, front 삭제 | FIFO | 작업 스케줄링, 버퍼, BFS |\n| 데크 | 양쪽 끝 | — | 스택·큐 겸용 |\n- 선형 구조: 배열, 선형 리스트(연결 리스트), 스택, 큐, 데크 / 비선형 구조: 트리, 그래프\n- 트리 순회: 전위(Root-L-R), 중위(L-Root-R), 후위(L-R-Root)\n- 출제기준 '데이터 입출력 구현'의 필기 세세항목(스택, 큐, 리스트)에 해당. 실기에서는 코드 문제의 스택·큐 추적으로 자주 나온다"},{"id":"dev-201","subject":"dev","topic":"인터페이스","sub":"EAI","type":"blank","level":2,"q":"다음은 EAI(Enterprise Application Integration) 구축 유형에 대한 설명이다. ( ① ), ( ② )에 들어갈 유형을 쓰시오.","box":"- Point-to-Point: 애플리케이션끼리 1:1로 직접 연결한다. 변경과 재사용이 어렵다.\n- Hub & Spoke: 가운데 허브를 두고 모든 애플리케이션이 허브를 거쳐 통신한다. 확장은 쉽지만 허브가 멈추면 전체가 멈춘다.\n- ( ① ): 애플리케이션 사이에 미들웨어(버스)를 두어 처리한다. 확장성이 뛰어나고 대용량 처리가 가능하다.\n- ( ② ): 그룹 안에서는 Hub & Spoke, 그룹 사이에서는 ( ① ) 방식을 쓴다. 데이터 병목을 줄일 수 있다.","answers":[{"label":"①","accept":["Message Bus","메시지 버스","Message Bus(ESB)","ESB 방식"]},{"label":"②","accept":["Hybrid","하이브리드"]}],"hint":"① 모두가 타는 탈것 ② 섞은 것","explain":"정답: ① Message Bus ② Hybrid\n- 2020년 3회 기출은 Point-to-Point와 Hub & Spoke를 물었다. 네 유형을 한 묶음으로 외운다\n\n| 유형 | 핵심 |\n|---|---|\n| Point-to-Point | 1:1 직접 연결, 가장 단순, 재사용 어려움 |\n| Hub & Spoke | 허브 중심 단일 접점, 허브 장애가 전체 장애 |\n| Message Bus(ESB 방식) | 미들웨어 버스, 확장성·대용량 |\n| Hybrid | 그룹 안 Hub & Spoke + 그룹 간 Message Bus |\n- EAI vs ESB: EAI는 애플리케이션 통합(허브 중심), ESB는 서비스(SOA) 중심 버스로 느슨한 결합과 표준 인터페이스를 쓴다"},{"id":"dev-202","subject":"dev","topic":"인터페이스","sub":"EAI","type":"blank","level":1,"q":"다음은 EAI 구성 요소에 대한 설명이다. ①~⑤에 해당하는 것을 \u003c보기>에서 골라 기호로 쓰시오.","box":"① 이기종 시스템 사이의 데이터 통합을 지원하는 EAI의 기반 소프트웨어\n② 각 패키지·애플리케이션을 EAI에 연결해 주는 모듈\n③ 데이터 형식과 코드를 변환해 주는 중개자\n④ 메시지를 비동기로 쌓아 두었다가 전달하는 구성 요소\n⑤ 미리 정의한 업무 프로세스에 따라 업무를 처리하는 흐름 관리 기능","options":["ㄱ. 브로커(Broker)","ㄴ. 어댑터(Adapter)","ㄷ. 플랫폼(Platform)","ㄹ. 메시지 큐(Message Queue)","ㅁ. 비즈니스 워크플로(Business Workflow)","ㅂ. 허브(Hub)"],"answers":[{"label":"①","accept":["ㄷ","플랫폼","Platform","EAI 플랫폼"]},{"label":"②","accept":["ㄴ","어댑터","Adapter"]},{"label":"③","accept":["ㄱ","브로커","Broker"]},{"label":"④","accept":["ㄹ","메시지 큐","Message Queue"]},{"label":"⑤","accept":["ㅁ","비즈니스 워크플로","비즈니스 워크플로우","Business Workflow"]}],"hint":"바탕 → 연결 → 변환 → 대기열 → 업무 흐름","explain":"정답: ① ㄷ 플랫폼 ② ㄴ 어댑터 ③ ㄱ 브로커 ④ ㄹ 메시지 큐 ⑤ ㅁ 비즈니스 워크플로\n- 헷갈리는 쌍: 어댑터(시스템을 EAI에 '꽂는' 연결 모듈) vs 브로커(오가는 데이터의 형식·코드를 '바꾸는' 중개자)\n- 허브는 Hub & Spoke 구축 유형의 중심 장비 이름이지 구성 요소 목록에는 없다\n- 연계 방식: 직접 연계(DB Link, DB Connection, API, JDBC, 하이퍼링크) / 간접 연계(EAI, ESB, 웹 서비스, 소켓)"},{"id":"dev-203","subject":"dev","topic":"인터페이스","sub":"감시 도구","type":"blank","level":1,"q":"다음은 인터페이스 동작을 감시하는 APM(Application Performance Management) 도구에 대한 설명이다. ( ① ), ( ② )에 들어갈 도구를 \u003c보기>에서 골라 쓰시오.","box":"- ( ① ): LG CNS가 공개한 오픈소스 APM. 애플리케이션 응답 시간, 서비스 실행 정보, 메모리·CPU 사용량을 실시간으로 본다.\n- ( ② ): 제니퍼소프트가 만든 상용 APM. 개발부터 운영까지 애플리케이션 성능을 실시간으로 모니터링하고 장애를 진단한다.","options":["ㄱ. 스카우터(Scouter)","ㄴ. 제니퍼(Jennifer)","ㄷ. Selenium","ㄹ. FitNesse","ㅁ. Valgrind"],"answers":[{"label":"①","accept":["ㄱ","스카우터","Scouter"]},{"label":"②","accept":["ㄴ","제니퍼","Jennifer"]}],"hint":"① 정찰병 ② 사람 이름","explain":"정답: ① 스카우터 ② 제니퍼\n- 인터페이스 '감시' 도구(APM): 스카우터, 제니퍼 — 동작 상태를 실시간 모니터링\n- 인터페이스 '구현 검증' 도구: xUnit, STAF, FitNesse, NTAF, Selenium, watir — 테스트를 실행해 결과를 확인\n- Valgrind는 메모리 누수 같은 문제를 찾는 동적 소스 코드 분석 도구"},{"id":"db-001","subject":"db","topic":"DB 설계","sub":"설계 순서","type":"order","past":"2023-2","level":3,"q":"다음은 데이터베이스 설계 단계를 나열한 것이다. 수행 순서대로 기호를 나열하시오.","options":["ㄱ. 물리적 설계","ㄴ. 구현","ㄷ. 요구조건 분석","ㄹ. 논리적 설계","ㅁ. 개념적 설계"],"answers":[{"label":"답","accept":["ㄷ-ㅁ-ㄹ-ㄱ-ㄴ","요구조건 분석-개념적 설계-논리적 설계-물리적 설계-구현"]}],"hint":"추상(무엇을 담나)에서 구체(어떻게 저장하나)로 내려가고, 마지막은 실제로 만드는 단계","explain":"정답: ㄷ → ㅁ → ㄹ → ㄱ → ㄴ (요구조건 분석 → 개념적 → 논리적 → 물리적 → 구현)\n- 암기: **요개논물구**. 추상적인 것(무엇을 담나)에서 구체적인 것(어떻게 저장하나)으로 내려간다\n- 4단계로 물으면 구현을 빼고 '요개논물'로 답한다\n- 헷갈리는 산출물: 테이블 **명세서**(논리, 어떤 속성이 필요한가) vs 테이블 **정의서**(물리, 타입·길이·키·기본값까지)\n- 2023년 2회, 2026년 1회에 5단계 그대로 나왔다\n\n| 단계 | 하는 일 | 대표 산출물 |\n|---|---|---|\n| 요구조건 분석 | 사용자 요구 수집·분석 | 요구조건 명세서 |\n| 개념적 설계 | DBMS와 무관하게 현실 세계를 추상화, 트랜잭션 모델링 | E-R 다이어그램(개념 스키마) |\n| 논리적 설계 | 목표 DBMS 모델(관계형 등)로 변환, 정규화, 트랜잭션 인터페이스 설계 | 논리 스키마(테이블 명세서) |\n| 물리적 설계 | 저장 레코드 양식, 레코드 집중, 인덱스·접근 경로, 트랜잭션 세부 설계 | 물리 스키마(테이블 정의서) |\n| 구현 | DDL로 스키마 생성, 트랜잭션 작성 | 실제 데이터베이스 |"},{"id":"db-002","subject":"db","topic":"DB 설계","sub":"설계 순서","type":"order","past":"2026-1","level":3,"q":"다음은 데이터베이스 설계 흐름이다. ( ㄱ )~( ㅁ )에 들어갈 단계를 \u003c보기>에서 골라 ㄱ부터 순서대로 기호를 나열하시오.","box":"( ㄱ ) → ( ㄴ ) → ( ㄷ ) → ( ㄹ ) → ( ㅁ )","options":["① 구현","② 개념적 설계","③ 논리적 설계","④ 요구사항 분석","⑤ 물리적 설계","⑥ 정규화","⑦ 운영 및 유지보수"],"answers":[{"label":"답","accept":["④-②-③-⑤-①","요구사항 분석-개념적 설계-논리적 설계-물리적 설계-구현"]}],"hint":"보기 중 두 개는 단계가 아니다","explain":"정답: ④ → ② → ③ → ⑤ → ① (요구사항 분석 → 개념적 설계 → 논리적 설계 → 물리적 설계 → 구현)\n- 함정 보기: **정규화**는 별도 단계가 아니라 논리적 설계 안에서 하는 작업이다. 운영·유지보수는 설계 단계에 들어가지 않는다\n- 단계와 대표 작업 짝: 개념 = E-R 다이어그램, 논리 = 정규화·스키마 변환, 물리 = 인덱스·저장 구조·접근 경로, 구현 = DDL로 스키마 생성\n- 개념적 설계만 **DBMS와 무관**하다. 논리적 설계부터 특정 DBMS의 데이터 모델(관계형 등)에 맞춘다"},{"id":"db-003","subject":"db","topic":"DB 설계","sub":"단계별 작업","type":"blank","past":"2021-1","level":3,"q":"다음은 데이터베이스 설계 단계에 대한 설명이다. ①~③에 해당하는 단계를 \u003c보기>에서 골라 쓰시오.","box":"① 논리적 구조로 표현된 데이터를 디스크 등의 저장 장치에 저장할 수 있는 구조로 바꾼다. 사용할 DBMS의 특성을 고려해 저장 레코드 형식, 접근 경로, 인덱스를 설계한다.\n② 현실 세계의 정보를 추상화해 사용자 요구에 맞는 개념 구조를 만든다. 특정 DBMS와 무관하게 E-R 다이어그램으로 표현한다.\n③ 목표 DBMS가 처리할 수 있는 스키마를 설계하고, 이 단계에서 정규화를 수행한다.","options":["ㄱ. 구현","ㄴ. 개념적 설계","ㄷ. 논리적 설계","ㄹ. 요구조건 분석","ㅁ. 물리적 설계"],"answers":[{"label":"①","accept":["물리적 설계","ㅁ"]},{"label":"②","accept":["개념적 설계","ㄴ"]},{"label":"③","accept":["논리적 설계","ㄷ"]}],"hint":"E-R은 어디서, 정규화는 어디서, 접근 경로는 어디서","explain":"정답: ① 물리적 설계 ② 개념적 설계 ③ 논리적 설계\n- ① 단서: 저장 장치, 접근 경로, 인덱스, DBMS 특성 → **물리적**\n- ② 단서: 현실 세계 추상화, E-R 다이어그램, DBMS와 무관 → **개념적**\n- ③ 단서: 목표 DBMS 스키마, 정규화 → **논리적**\n- 헷갈리는 점: '특정 DBMS에 맞춘다'는 논리·물리 둘 다 해당한다. 저장 구조·성능까지 가면 물리, 테이블 구조·정규화에서 멈추면 논리\n\n| 단계 | 하는 일 | 대표 산출물 |\n|---|---|---|\n| 요구조건 분석 | 사용자 요구 수집·분석 | 요구조건 명세서 |\n| 개념적 설계 | DBMS와 무관하게 현실 세계를 추상화, 트랜잭션 모델링 | E-R 다이어그램(개념 스키마) |\n| 논리적 설계 | 목표 DBMS 모델(관계형 등)로 변환, 정규화, 트랜잭션 인터페이스 설계 | 논리 스키마(테이블 명세서) |\n| 물리적 설계 | 저장 레코드 양식, 레코드 집중, 인덱스·접근 경로, 트랜잭션 세부 설계 | 물리 스키마(테이블 정의서) |\n| 구현 | DDL로 스키마 생성, 트랜잭션 작성 | 실제 데이터베이스 |"},{"id":"db-004","subject":"db","topic":"DB 설계","sub":"단계별 작업","type":"blank","level":3,"q":"다음 작업이 수행되는 데이터베이스 설계 단계를 \u003c보기>에서 골라 기호로 쓰시오.","box":"① 트랜잭션 모델링\n② 트랜잭션 인터페이스 설계\n③ 레코드 집중(Record Clustering)의 분석·설계\n④ 정규화\n⑤ DBMS의 DDL로 스키마를 기술하고 빈 데이터베이스 파일을 생성","options":["ㄱ. 요구조건 분석","ㄴ. 개념적 설계","ㄷ. 논리적 설계","ㄹ. 물리적 설계","ㅁ. 구현"],"answers":[{"label":"①","accept":["ㄴ","개념적 설계"]},{"label":"②","accept":["ㄷ","논리적 설계"]},{"label":"③","accept":["ㄹ","물리적 설계"]},{"label":"④","accept":["ㄷ","논리적 설계"]},{"label":"⑤","accept":["ㅁ","구현"]}],"hint":"트랜잭션은 단계마다 이름을 바꿔 나온다","explain":"정답: ① ㄴ 개념적 ② ㄷ 논리적 ③ ㄹ 물리적 ④ ㄷ 논리적 ⑤ ㅁ 구현\n- 함정: **트랜잭션 작업은 모든 단계에 있다**. 이름 뒤의 말로 단계를 가른다\n- ① 트랜잭션 모델링은 개념적 설계에서 개념 스키마 모델링과 **병행**한다\n- ⑤ DDL로 스키마를 **기술**하고 컴파일해 빈 DB 파일을 만드는 것은 구현이다. 물리적 설계는 저장 구조·접근 경로를 설계까지만 한다\n\n| 단계 | 스키마 쪽 작업 | 트랜잭션 쪽 작업 |\n|---|---|---|\n| 개념적 설계 | 개념 스키마 모델링(E-R) | 트랜잭션 **모델링** |\n| 논리적 설계 | 논리 스키마 설계, 정규화 | 트랜잭션 **인터페이스** 설계 |\n| 물리적 설계 | 저장 레코드 양식, 레코드 집중(클러스터링), 접근 경로 설계 | 트랜잭션 **세부** 설계 |\n| 구현 | DDL로 스키마 기술, 빈 DB 파일 생성 | 트랜잭션 **작성** |\n- 물리적 설계는 성능을 본다(응답 시간, 저장 공간 효율, 트랜잭션 처리량)"},{"id":"db-005","subject":"db","topic":"DB 설계","sub":"데이터 모델링 절차","type":"order","past":"2020-2","level":3,"q":"다음은 데이터 모델링 절차이다. 요구사항 분석 다음에 수행하는 단계를 \u003c보기>에서 골라 순서대로 기호를 나열하시오.","box":"요구사항 분석 → ( ① ) → ( ② ) → ( ③ )","options":["ㄱ. 물리적 데이터 모델링","ㄴ. 개념적 데이터 모델링","ㄷ. 논리적 데이터 모델링"],"answers":[{"label":"답","accept":["ㄴ-ㄷ-ㄱ","개념적 데이터 모델링-논리적 데이터 모델링-물리적 데이터 모델링"]}],"hint":"추상 → 구체","explain":"정답: ㄴ 개념적 → ㄷ 논리적 → ㄱ 물리적 데이터 모델링\n- 설계 순서 '요개논물'과 같은 흐름이다. 모델링이라는 말만 붙었을 뿐 순서는 같다\n\n| 데이터 모델 | 무엇을 표현 | 예 |\n|---|---|---|\n| 개념적 데이터 모델 | 현실 세계를 사람이 이해하기 쉽게 추상화, DBMS 무관 | E-R 모델 |\n| 논리적 데이터 모델 | 컴퓨터가 처리할 수 있는 구조로 변환 | 관계·계층·네트워크 모델 |\n| 물리적 데이터 모델 | 실제 저장 방식(타입, 인덱스, 저장 공간) | 테이블 정의서 |"},{"id":"db-006","subject":"db","topic":"DB 설계","sub":"데이터 모델 구성 요소","type":"blank","past":"2021-1","level":2,"q":"다음은 데이터 모델의 구성 요소에 대한 설명이다. ①~③에 들어갈 알맞은 용어를 쓰시오.","box":"- ( ① ): 데이터베이스에 표현된 실제 데이터를 처리하는 작업에 대한 명세로, 데이터베이스를 조작하는 기본 도구이다.\n- ( ② ): 논리적으로 표현된 개체 타입들 간의 관계로, 데이터의 구성과 정적 성질을 나타낸다.\n- ( ③ ): 데이터베이스에 저장될 수 있는 실제 데이터의 논리적인 제약이다. 개체 무결성, 참조 무결성이 여기에 속한다.","answers":[{"label":"①","accept":["연산","Operation","Operations"]},{"label":"②","accept":["구조","Structure"]},{"label":"③","accept":["제약 조건","Constraint","Constraints"]}],"hint":"정적인 것 하나, 동적인 것 하나, 규칙 하나","explain":"정답: ① 연산 ② 구조 ③ 제약 조건\n- 단서: '처리 작업 명세, 조작 도구' → 연산 / '개체 타입 간 관계, 정적 성질' → 구조 / '무결성' → 제약 조건\n- 데이터 모델에 표시할 3요소 = **구조(Structure) + 연산(Operation) + 제약 조건(Constraint)**\n- 헷갈리는 묶음: 개체(Entity)·속성(Attribute)·관계(Relationship)도 '데이터 모델 구성 요소'라 부른다. 교재는 이 셋을 '구성 요소', 구조·연산·제약 조건을 '표시할 요소'로 나누기도 한다. 2021년 1회는 '구성 요소'라는 말로 구조·연산·제약 조건을 물었다\n\n| 요소 | 뜻 | 예 |\n|---|---|---|\n| 구조 | 데이터 구성과 개체 간 관계(정적) | 테이블, 속성, 관계 |\n| 연산 | 저장된 데이터를 처리하는 방법(동적) | SELECT, INSERT, 관계대수 |\n| 제약 조건 | 저장될 수 있는 데이터의 논리적 제약 | 개체·참조 무결성 |"},{"id":"db-007","subject":"db","topic":"DB 설계","sub":"E-R 다이어그램","type":"blank","past":"2022-3","level":2,"q":"다음은 E-R 다이어그램(피터 첸 표기법)의 구성 요소이다. ①~⑤를 나타내는 기호를 \u003c보기>에서 골라 기호로 쓰시오.","box":"학생 개체와 과목 개체가 '수강' 관계로 이어지는 E-R 다이어그램이다.\n\n① 학생, 과목 같은 개체 집합(Entity Set)\n② 수강 같은 관계 집합(Relationship Set)\n③ 학생의 학번처럼 개체를 유일하게 식별하는 기본키 속성\n④ 학생의 전화번호처럼 값을 여러 개 가질 수 있는 다중값 속성\n⑤ 개체 집합과 관계 집합을 잇는 연결","options":["ㄱ. 사각형","ㄴ. 마름모","ㄷ. 타원","ㄹ. 이중 타원","ㅁ. 밑줄 친 타원","ㅂ. 선","ㅅ. 이중 사각형"],"answers":[{"label":"①","accept":["ㄱ","사각형"]},{"label":"②","accept":["ㄴ","마름모"]},{"label":"③","accept":["ㅁ","밑줄 친 타원","밑줄 타원"]},{"label":"④","accept":["ㄹ","이중 타원"]},{"label":"⑤","accept":["ㅂ","선","실선"]}],"hint":"개체는 네모, 관계는 다이아몬드","explain":"정답: ① ㄱ 사각형 ② ㄴ 마름모 ③ ㅁ 밑줄 친 타원 ④ ㄹ 이중 타원 ⑤ ㅂ 선\n- 헷갈리는 쌍: 이중 **타원** = 다중값 속성 / 이중 **사각형** = 약한 개체 집합\n- 2022년 3회 기출은 학생-수강-과목 그림에서 기호 위치를 고르는 형태였다. 그 그림처럼 관계 집합과 '관계의 속성'(성적 등)을 잇는 선을 점선으로 그리는 표기(Silberschatz)도 있다\n\n| 기호 | 의미 |\n|---|---|\n| 사각형 | 개체 집합(Entity) |\n| 이중 사각형 | 약한 개체 집합 |\n| 마름모 | 관계 집합(Relationship) |\n| 이중 마름모 | 식별 관계(약한 개체와 잇는 관계) |\n| 타원 | 속성 |\n| 밑줄 친 타원 | 기본키 속성 |\n| 이중 타원 | 다중값 속성 |\n| 점선 타원 | 유도(파생) 속성 |\n| 타원에 타원이 달림 | 복합 속성 |\n| 선 | 개체·관계·속성 연결, 1:1·1:N·N:M 표시 |\n- 까마귀발(Crow's Foot) 표기: 관계선 끝이 세 갈래면 N(多), 세로선이면 1, 원이면 0(선택)"},{"id":"db-008","subject":"db","topic":"DB 설계","sub":"3단계 스키마","type":"blank","past":"2023-1","level":3,"q":"다음은 데이터베이스 스키마에 대한 설명이다. ①~③에 들어갈 스키마를 \u003c보기>에서 골라 쓰시오.","box":"- ( ① ) 스키마: 사용자나 응용 프로그래머가 각자 필요로 하는 데이터베이스의 논리적 구조를 정의한다. 서브 스키마라고도 하며, 하나의 데이터베이스에 여러 개가 있을 수 있다.\n- ( ② ) 스키마: 데이터베이스 전체를 조직 관점에서 정의한 논리적 구조다. 개체 간 관계, 제약 조건, 접근 권한, 보안 정책을 포함하며 데이터베이스마다 하나만 존재한다.\n- ( ③ ) 스키마: 물리적 저장 장치 관점에서 본 구조다. 실제로 저장될 레코드 형식, 데이터 항목의 표현 방법, 내부 레코드의 물리적 순서를 나타낸다.","options":["ㄱ. 외부","ㄴ. 개념","ㄷ. 내부","ㄹ. 논리","ㅁ. 물리"],"answers":[{"label":"①","accept":["외부","ㄱ","외부 스키마","External"]},{"label":"②","accept":["개념","ㄴ","개념 스키마","Conceptual"]},{"label":"③","accept":["내부","ㄷ","내부 스키마","Internal"]}],"hint":"사용자 → 전체 → 저장 장치","explain":"정답: ① 외부 ② 개념 ③ 내부\n- 단서: '서브 스키마, 여러 개' → 외부 / '조직 전체, 하나' → 개념 / '레코드 형식, 물리적 순서' → 내부\n- 함정 보기: 논리·물리는 **설계 단계** 이름이다. 3단계 스키마는 외부·개념·내부로 답한다\n\n| 스키마 | 관점 | 개수 | 다른 이름·특징 |\n|---|---|---|---|\n| 외부 | 사용자·응용 프로그래머 | 여러 개 | 서브 스키마, 사용자 뷰 |\n| 개념 | 조직 전체(DBA) | 1개 | 전체 논리 구조, 관계·제약 조건·권한·보안 정의 |\n| 내부 | 물리 저장 장치 | 1개 | 레코드 형식, 저장 순서, 인덱스 |\n- 3단계로 나누는 목적 = 데이터 독립성. 외부/개념 사상 → 논리적 독립성, 개념/내부 사상 → 물리적 독립성"},{"id":"db-009","subject":"db","topic":"DB 설계","sub":"데이터 독립성","type":"blank","level":2,"q":"다음은 3단계 스키마 구조가 보장하는 데이터 독립성에 대한 설명이다. ①~④에 들어갈 알맞은 용어를 쓰시오.","box":"- ( ① ) 독립성: ( ② ) 스키마가 바뀌어도 외부 스키마와 응용 프로그램은 영향을 받지 않는다. 테이블에 속성을 추가해도 기존 뷰를 쓰는 프로그램은 고치지 않아도 된다.\n- ( ③ ) 독립성: ( ④ ) 스키마가 바뀌어도 개념 스키마는 영향을 받지 않는다. 인덱스를 새로 만들거나 저장 장치를 바꿔도 테이블 구조는 그대로다.","answers":[{"label":"①","accept":["논리적","논리","Logical"]},{"label":"②","accept":["개념","Conceptual"]},{"label":"③","accept":["물리적","물리","Physical"]},{"label":"④","accept":["내부","Internal"]}],"hint":"이름은 바뀌는 층에서 온다","explain":"정답: ① 논리적 ② 개념 ③ 물리적 ④ 내부\n- **논리적 독립성**: 개념 스키마 변경 → 외부 스키마·응용 프로그램 영향 없음 (외부/개념 사상이 흡수)\n- **물리적 독립성**: 내부 스키마 변경 → 개념 스키마 영향 없음 (개념/내부 사상이 흡수)\n- 헷갈리는 점: 이름은 '바뀌는 쪽'에서 온다. 인덱스·저장 장치(내부)가 바뀌면 물리적, 테이블 구조(개념)가 바뀌면 논리적\n- 뷰는 논리적 독립성을 제공하는 대표 수단이다\n\n| 스키마 | 관점 | 개수 | 다른 이름·특징 |\n|---|---|---|---|\n| 외부 | 사용자·응용 프로그래머 | 여러 개 | 서브 스키마, 사용자 뷰 |\n| 개념 | 조직 전체(DBA) | 1개 | 전체 논리 구조, 관계·제약 조건·권한·보안 정의 |\n| 내부 | 물리 저장 장치 | 1개 | 레코드 형식, 저장 순서, 인덱스 |"},{"id":"db-010","subject":"db","topic":"DB 설계","sub":"스키마","type":"essay","past":"2020-3","level":3,"q":"데이터베이스 스키마(Schema)가 무엇인지 간략히 서술하시오.","answers":[{"label":"답","accept":[],"model":"데이터베이스의 구조와 제약 조건(개체, 속성, 관계, 데이터 조작 시 지켜야 할 조건)에 관한 전반적인 명세를 기술한 것이다. 데이터 사전에 저장되는 메타데이터이며, 관점에 따라 외부·개념·내부 스키마로 나뉜다."}],"hint":"구조 + 제약 조건 + 명세","explain":"- 채점 핵심어: **구조**, **제약 조건**, **명세(정의)**. 세 단어가 들어가면 된다\n- 스키마 vs 인스턴스: 스키마는 틀(시간이 지나도 거의 안 변함, 내포), 인스턴스는 어느 시점의 실제 데이터(계속 변함, 외연)\n- 스키마는 데이터 사전(시스템 카탈로그)에 메타데이터로 저장된다\n\n| 스키마 | 관점 | 개수 | 다른 이름·특징 |\n|---|---|---|---|\n| 외부 | 사용자·응용 프로그래머 | 여러 개 | 서브 스키마, 사용자 뷰 |\n| 개념 | 조직 전체(DBA) | 1개 | 전체 논리 구조, 관계·제약 조건·권한·보안 정의 |\n| 내부 | 물리 저장 장치 | 1개 | 레코드 형식, 저장 순서, 인덱스 |"},{"id":"db-011","subject":"db","topic":"DB 설계","sub":"DBMS 기능","type":"blank","level":1,"q":"다음은 DBMS의 필수 기능에 대한 설명이다. ①~③에 해당하는 기능을 \u003c보기>에서 골라 쓰시오.","box":"① 모든 응용 프로그램이 요구하는 데이터 구조를 지원하도록, 데이터베이스에 저장될 데이터의 형(Type)과 구조, 이용 방식, 제약 조건 등을 명시한다.\n② 사용자와 데이터베이스 사이의 인터페이스로, 데이터를 검색·갱신·삽입·삭제할 수 있게 한다.\n③ 데이터의 무결성을 유지하고, 보안·권한을 검사하며, 여러 사용자가 동시에 접근해도 처리 결과가 항상 정확하도록 병행 제어를 한다.","options":["ㄱ. 정의 기능(Definition)","ㄴ. 조작 기능(Manipulation)","ㄷ. 제어 기능(Control)","ㄹ. 회복 기능(Recovery)","ㅁ. 저장 기능(Storage)"],"answers":[{"label":"①","accept":["정의 기능","ㄱ","정의","Definition"]},{"label":"②","accept":["조작 기능","ㄴ","조작","Manipulation"]},{"label":"③","accept":["제어 기능","ㄷ","제어","Control"]}],"hint":"DDL·DML·DCL과 짝을 이룬다","explain":"정답: ① 정의 ② 조작 ③ 제어\n- 짝: 정의 기능 ↔ DDL, 조작 기능 ↔ DML, 제어 기능 ↔ DCL\n- 함정 보기: 회복·저장은 필수 3기능 이름이 아니다. 회복·병행 제어는 '제어 기능' 안에 들어간다\n- DB 정의 4가지(통저운공): **통**합된 데이터(중복 최소), **저**장된 데이터(저장 매체에 저장), **운**영 데이터(조직 업무에 꼭 필요), **공**용 데이터(여러 응용이 함께 씀)\n- DB 특징: 실시간 접근, 계속적 변화, 동시 공용, 내용에 의한 참조\n- DB 종류(논리 모델 기준): 계층형, 네트워크형(CODASYL), 관계형, 객체지향형, 객체관계형 / NoSQL"},{"id":"db-012","subject":"db","topic":"DB 설계","sub":"시스템 카탈로그","type":"short","level":1,"q":"다음 설명에 해당하는 용어를 쓰시오.","box":"- 시스템 자신이 필요로 하는 여러 객체(테이블, 뷰, 인덱스, 사용자, 권한 등)에 관한 정보를 담은 시스템 데이터베이스이다.\n- 여기에 저장된 정보를 메타데이터(Metadata)라고 한다.\n- 사용자는 SQL로 내용을 검색할 수 있지만 INSERT·UPDATE·DELETE로 직접 갱신할 수는 없다. DDL이 실행되면 DBMS가 스스로 갱신한다.","answers":[{"label":"답","accept":["시스템 카탈로그","System Catalog","카탈로그","데이터 사전","Data Dictionary"]}],"hint":"DBMS가 스스로 관리하는 '데이터에 대한 데이터' 저장소","explain":"정답: 시스템 카탈로그(System Catalog) = 데이터 사전(Data Dictionary)\n- 저장 내용: 테이블·속성·인덱스·뷰·제약 조건·사용자·권한 같은 **메타데이터**\n- 사용자: SELECT로 **검색만** 가능. 직접 INSERT·UPDATE·DELETE 불가\n- 갱신: CREATE·ALTER·DROP 같은 DDL이 실행되면 **DBMS가 자동으로** 갱신\n- 헷갈리는 것: 데이터 디렉터리 = 데이터 사전에 있는 데이터에 실제로 접근하는 데 필요한 위치 정보를 관리하며, 시스템만 접근한다\n- 뷰의 정의, 분산 DB의 위치 정보도 카탈로그에 저장된다"},{"id":"db-013","subject":"db","topic":"DB 설계","sub":"CRUD 매트릭스","type":"short","level":1,"q":"다음 설명에 해당하는 용어를 쓰시오.","box":"- 프로세스(또는 트랜잭션)를 행에, 엔티티(테이블)를 열에 놓고, 각 프로세스가 엔티티에 하는 연산을 생성·조회·수정·삭제의 머리글자로 표시한 2차원 표이다.\n- 아무 프로세스도 생성하지 않는 엔티티나 아무 프로세스도 쓰지 않는 엔티티를 찾아 데이터 모델의 누락과 중복을 검증한다.","answers":[{"label":"답","accept":["CRUD 매트릭스","CRUD Matrix","CRUD 행렬","CRUD 분석","CRUD"]}],"hint":"기본 연산 4가지의 영문 머리글자","explain":"정답: CRUD 매트릭스(CRUD 분석)\n- C = Create(INSERT), R = Read(SELECT), U = Update(UPDATE), D = Delete(DELETE)\n- 쓰임: 프로세스와 엔티티의 상관관계를 한눈에 보고 모델을 검증한다\n- 점검 규칙 예: 모든 엔티티에 C가 최소 하나 있어야 한다(만드는 프로세스 없는 테이블 = 누락), R도 최소 하나 있어야 한다(아무도 안 읽는 테이블 = 불필요)\n- 출제기준(응용 SW 기초 기술 활용)에 'CRUD로 기본 연산 구분' 문장이 그대로 있다\n- 같은 '모델 검증' 묶음: 데이터 모델 품질 기준 = 정확성, 완전성, 준거성, 최신성, 일관성, 활용성"},{"id":"db-014","subject":"db","topic":"관계 모델","sub":"차수·카디널리티","type":"calc","past":"2021-1","level":3,"q":"다음 \u003c학생> 릴레이션의 카디널리티(Cardinality)와 디그리(Degree)를 쓰시오.","box":"| 학번 | 이름 | 학년 | 학과 |\n|---|---|---|---|\n| 20201 | 김정미 | 1 | 컴퓨터 |\n| 20202 | 홍길동 | 2 | 전자 |\n| 20203 | 강은미 | 3 | 컴퓨터 |\n| 20204 | 김정미 | 4 | 경영 |\n| 20205 | 이순신 | 1 | 전자 |","answers":[{"label":"카디널리티","accept":["5","5개"]},{"label":"디그리","accept":["4","4개"]}],"hint":"행 수와 열 수. 머리글 행은 세지 않는다","explain":"정답: 카디널리티 5, 디그리 4\n- 카디널리티 = **튜플(행) 수** = 5. 머리글(속성 이름) 줄은 튜플이 아니다\n- 디그리(차수) = **속성(열) 수** = 학번·이름·학년·학과 = 4\n- 외우는 법: Degree는 열(세로 칸) 개수, Cardinality는 행 개수. 'Ca'rdinality = '줄 수'로 묶는다\n\n| 용어 | 뜻 | 다른 이름 |\n|---|---|---|\n| 릴레이션 | 2차원 표 | 테이블 |\n| 튜플 | 행 | 레코드 |\n| 속성(Attribute) | 열 | 필드, 컬럼 |\n| 도메인(Domain) | 한 속성이 가질 수 있는 원자값의 집합 | |\n| 차수(Degree) | **속성 수** | |\n| 카디널리티(Cardinality) | **튜플 수** | 기수, 대응수 |\n| 릴레이션 스키마 | 릴레이션 이름 + 속성 이름의 틀 | 내포(Intension) |\n| 릴레이션 인스턴스 | 어느 시점에 실제 저장된 튜플의 집합 | 외연(Extension) |"},{"id":"db-015","subject":"db","topic":"관계 모델","sub":"차수·카디널리티","type":"calc","past":"2024-2","level":3,"q":"다음 릴레이션의 ① 카디널리티와 ② 차수를 쓰시오.","box":"| 이름 | 나이 | A | B |\n|---|---|---|---|\n| 민준 | 24 | X | 10 |\n| 서연 | 22 | X | 10 |\n| 도윤 | 24 | Y | 20 |\n| 하은 | 23 | X | 30 |\n| 지호 | 22 | Y | 10 |","answers":[{"label":"①","accept":["5","5개"]},{"label":"②","accept":["4","4개"]}],"hint":"값이 겹치는 것과 튜플이 겹치는 것은 다르다","explain":"정답: ① 5 ② 4\n- 카디널리티는 **행을 그대로 센다**. A 열 값이 X, Y 두 종류뿐이어도 튜플은 5개다\n- 컬럼별 고유값 개수(A = 2, B = 3)는 **릴레이션의** 카디널리티가 아니다. 릴레이션은 '튜플 전체'가 겹치지 않을 뿐, 속성 값은 겹쳐도 된다\n- 주의: 인덱스·튜닝에서는 '컬럼의 카디널리티' = 그 컬럼의 고유값 개수로도 쓴다. 2023년 1회는 카디널리티를 '특정 데이터 집합의 유니크한 값의 개수'로 설명했다. 표를 주고 릴레이션의 카디널리티를 물으면 튜플 수로 답한다\n- 차수 = 이름·나이·A·B = 4\n- 헷갈리는 것: E-R 다이어그램의 카디널리티(1:1, 1:N, N:M)는 관계의 대응 수를 뜻하는 다른 개념이다"},{"id":"db-016","subject":"db","topic":"관계 모델","sub":"관계 모델 용어","type":"blank","past":"2023-1","level":3,"q":"다음은 관계 데이터 모델의 용어에 대한 설명이다. ①~③에 해당하는 용어를 \u003c보기>에서 골라 쓰시오.","box":"① 릴레이션을 구성하는 각각의 행으로, 속성 값들의 모임이다. 파일 구조의 레코드에 해당한다.\n② 어느 한 시점에 릴레이션에 실제로 저장된 튜플들의 집합이다. 릴레이션 외연(Extension)이라고도 하며 삽입·삭제·갱신에 따라 계속 바뀐다.\n③ 특정 데이터 집합의 유니크(Unique)한 값의 개수다. 전체 행에 대해 특정 컬럼 값이 얼마나 중복되는지를 나타내는 지표로도 쓴다.","options":["ㄱ. 튜플","ㄴ. 속성","ㄷ. 도메인","ㄹ. 릴레이션 스키마","ㅁ. 릴레이션 인스턴스","ㅂ. 차수(Degree)","ㅅ. 카디널리티(Cardinality)"],"answers":[{"label":"①","accept":["튜플","ㄱ","Tuple"]},{"label":"②","accept":["릴레이션 인스턴스","ㅁ","인스턴스","Relation Instance"]},{"label":"③","accept":["카디널리티","ㅅ","Cardinality","기수","대응수"]}],"hint":"행 하나 / 지금 들어 있는 데이터 전체 / 서로 다른 값이 몇 개인가","explain":"정답: ① 튜플 ② 릴레이션 인스턴스 ③ 카디널리티\n- ② 단서: '어느 한 시점', '외연', '계속 바뀐다' → 인스턴스. 틀(이름·속성)만 말하면 스키마\n- ③ 단서: '유니크한 값의 개수' → 카디널리티. 릴레이션은 튜플이 모두 서로 달라 고유한 튜플 수 = 튜플 수다. 속성 개수면 차수\n- 2023년 1회 실제 지문은 ①을 '셀 수 있는 수량의 순서 있는 열거, 테이블의 행', ③을 '특정 데이터 집합의 유니크한 값의 개수'로 냈다. 표현이 낯설어도 행 = 튜플, 개수 = 카디널리티로 고른다\n- 2023년 1회와 2025년 3회에 같은 세 용어가 나왔다\n\n| 용어 | 뜻 | 다른 이름 |\n|---|---|---|\n| 릴레이션 | 2차원 표 | 테이블 |\n| 튜플 | 행 | 레코드 |\n| 속성(Attribute) | 열 | 필드, 컬럼 |\n| 도메인(Domain) | 한 속성이 가질 수 있는 원자값의 집합 | |\n| 차수(Degree) | **속성 수** | |\n| 카디널리티(Cardinality) | **튜플 수** | 기수, 대응수 |\n| 릴레이션 스키마 | 릴레이션 이름 + 속성 이름의 틀 | 내포(Intension) |\n| 릴레이션 인스턴스 | 어느 시점에 실제 저장된 튜플의 집합 | 외연(Extension) |"},{"id":"db-017","subject":"db","topic":"관계 모델","sub":"관계 모델 용어","type":"blank","past":"2025-3","level":3,"q":"다음 \u003c회원> 릴레이션을 보고 ①~③에 해당하는 용어를 \u003c보기>에서 골라 쓰시오.","box":"**회원**(회원번호, 이름, 등급)\n\n| 회원번호 | 이름 | 등급 |\n|---|---|---|\n| M01 | 한결 | 골드 |\n| M02 | 보람 | 실버 |\n| M03 | 슬기 | 골드 |\n\n① (M02, 보람, 실버)처럼 표의 한 행\n② 지금 표에 저장된 세 행 전체. 내일 새 회원이 가입하면 달라진다\n③ 표의 행 개수인 3","options":["ㄱ. 스키마","ㄴ. 속성","ㄷ. 튜플","ㄹ. 차수","ㅁ. 인스턴스","ㅂ. 카디널리티"],"answers":[{"label":"①","accept":["튜플","ㄷ","Tuple"]},{"label":"②","accept":["인스턴스","ㅁ","릴레이션 인스턴스","Instance","Relation Instance"]},{"label":"③","accept":["카디널리티","ㅂ","Cardinality","기수"]}],"hint":"틀과 내용물을 구분한다","explain":"정답: ① 튜플 ② 인스턴스 ③ 카디널리티\n- '회원(회원번호, 이름, 등급)'이라는 틀 = 릴레이션 **스키마**(내포). 내일도 같다\n- 지금 저장된 세 행 전체 = 릴레이션 **인스턴스**(외연). 가입·탈퇴가 생기면 바뀐다\n- 행 하나 = 튜플, 행 개수 = 카디널리티(3), 열 개수 = 차수(3)\n- 함정: ③이 3이라 차수(속성도 3개)와 헷갈리게 만들었다. '행의 개수'라는 말에서 카디널리티로 고른다"},{"id":"db-018","subject":"db","topic":"관계 모델","sub":"관계 모델 용어","type":"blank","past":"2025-1","level":3,"q":"다음은 관계 데이터 모델에 대한 설명이다. ①~④에 들어갈 용어를 \u003c보기>에서 골라 영문으로 쓰시오.","box":"- ( ① ): 릴레이션을 구성하는 속성(Attribute)의 개수\n- ( ② ): 릴레이션을 구성하는 튜플(Tuple)의 개수\n- ( ③ ) key: 다른 릴레이션의 기본키를 참조하는 속성 또는 속성들의 집합\n- ( ④ ): 하나의 속성이 가질 수 있는 원자값들의 집합으로, 값의 유형과 범위를 정한다","options":["ㄱ. domain","ㄴ. primary","ㄷ. degree","ㄹ. candidate","ㅁ. cardinality","ㅂ. attribute","ㅅ. foreign"],"answers":[{"label":"①","accept":["degree","ㄷ"]},{"label":"②","accept":["cardinality","ㅁ"]},{"label":"③","accept":["foreign","ㅅ","foreign key"]},{"label":"④","accept":["domain","ㄱ"]}],"hint":"개수 두 개, 키 하나, 값의 범위 하나","explain":"정답: ① degree ② cardinality ③ foreign ④ domain\n- 함정 보기: attribute는 '속성 그 자체', degree는 '속성의 개수'. primary·candidate는 다른 릴레이션을 참조하지 않는다\n- 영문으로 쓰라고 하면 한글(차수, 카디널리티)로 쓰면 틀린다\n\n| 용어 | 뜻 | 다른 이름 |\n|---|---|---|\n| 릴레이션 | 2차원 표 | 테이블 |\n| 튜플 | 행 | 레코드 |\n| 속성(Attribute) | 열 | 필드, 컬럼 |\n| 도메인(Domain) | 한 속성이 가질 수 있는 원자값의 집합 | |\n| 차수(Degree) | **속성 수** | |\n| 카디널리티(Cardinality) | **튜플 수** | 기수, 대응수 |\n| 릴레이션 스키마 | 릴레이션 이름 + 속성 이름의 틀 | 내포(Intension) |\n| 릴레이션 인스턴스 | 어느 시점에 실제 저장된 튜플의 집합 | 외연(Extension) |"},{"id":"db-019","subject":"db","topic":"관계 모델","sub":"관계 모델 용어","type":"choice","past":"2025-2","level":3,"q":"다음 설명에 해당하는 용어를 \u003c보기>에서 골라 쓰시오.","box":"- 릴레이션의 열(Column)을 가리킨다.\n- 개체가 가진 특성이나 상태를 나타내는 데이터의 가장 작은 논리적 단위다.\n- 도메인에서 값을 가져오며, 파일 구조의 필드(Field)에 해당한다.","options":["ㄱ. Cardinality","ㄴ. Domain","ㄷ. Attribute","ㄹ. Degree","ㅁ. Schema","ㅂ. Tuple"],"answers":[{"label":"답","accept":["Attribute","ㄷ","속성","애트리뷰트"]}],"hint":"열(Column)","explain":"정답: Attribute(속성)\n- 단서: 열, 데이터의 가장 작은 논리적 단위, 파일 구조의 필드\n- 헷갈리는 쌍: Attribute는 열 자체, Degree는 열의 **개수**, Domain은 그 열에 들어갈 수 있는 **값의 범위**\n\n| 용어 | 뜻 | 다른 이름 |\n|---|---|---|\n| 릴레이션 | 2차원 표 | 테이블 |\n| 튜플 | 행 | 레코드 |\n| 속성(Attribute) | 열 | 필드, 컬럼 |\n| 도메인(Domain) | 한 속성이 가질 수 있는 원자값의 집합 | |\n| 차수(Degree) | **속성 수** | |\n| 카디널리티(Cardinality) | **튜플 수** | 기수, 대응수 |\n| 릴레이션 스키마 | 릴레이션 이름 + 속성 이름의 틀 | 내포(Intension) |\n| 릴레이션 인스턴스 | 어느 시점에 실제 저장된 튜플의 집합 | 외연(Extension) |"},{"id":"db-020","subject":"db","topic":"관계 모델","sub":"릴레이션 특징","type":"blank","level":3,"q":"다음은 릴레이션의 특징이다. ①~④에 들어갈 알맞은 말을 \u003c보기>에서 골라 쓰시오.","box":"- 튜플의 ( ① ): 한 릴레이션에 모든 속성 값이 똑같은 튜플이 두 개 이상 있을 수 없다.\n- 튜플의 ( ② ): 튜플 사이에는 순서가 없다. 행의 순서를 바꿔도 같은 릴레이션이다.\n- 속성의 ( ③ ): 속성 값은 더 이상 나눌 수 없는 값이어야 한다.\n- 속성의 ( ④ ): 속성 사이에도 순서가 없다. 열의 순서를 바꿔도 같은 릴레이션이다.","options":["ㄱ. 유일성","ㄴ. 무순서성","ㄷ. 원자성","ㄹ. 최소성","ㅁ. 종속성"],"answers":[{"label":"①","accept":["유일성","ㄱ"]},{"label":"②","accept":["무순서성","ㄴ"]},{"label":"③","accept":["원자성","ㄷ"]},{"label":"④","accept":["무순서성","ㄴ"]}],"hint":"보기 하나는 두 번 쓰인다","explain":"정답: ① 유일성 ② 무순서성 ③ 원자성 ④ 무순서성\n- 튜플: **유일성**(똑같은 튜플 없음), **무순서성**(행 순서 의미 없음), 삽입·삭제로 계속 변한다\n- 속성: **원자성**(더 쪼갤 수 없는 값), **무순서성**(열 순서 의미 없음), 이름은 릴레이션 안에서 유일하다\n- 연결: 속성의 원자성 = 제1정규형 조건. 튜플의 유일성 때문에 모든 릴레이션에는 키가 반드시 하나 이상 있다\n- 함정 보기: 최소성은 **후보키**의 성질이다(유일성 + 최소성)"},{"id":"db-021","subject":"db","topic":"관계 모델","sub":"키","type":"blank","past":"2022-1","level":3,"q":"다음은 키(Key)에 대한 설명이다. ①, ②에 들어갈 알맞은 용어를 쓰시오.","box":"- 슈퍼키는 릴레이션의 모든 튜플을 유일하게 식별할 수 있는 속성 또는 속성의 집합으로, ( ① )은 만족하지만 ( ② )은 만족하지 않을 수 있다.\n- 후보키는 ( ① )과 ( ② )을 모두 만족한다. 즉, 키를 이루는 속성 중 하나라도 빼면 튜플을 유일하게 식별할 수 없다.","answers":[{"label":"①","accept":["유일성","Uniqueness"]},{"label":"②","accept":["최소성","Minimality"]}],"hint":"슈퍼키에는 없고 후보키에만 있는 성질","explain":"정답: ① 유일성 ② 최소성\n- 유일성: 키 값 하나로 튜플 하나만 식별된다\n- 최소성: 키를 이루는 속성 중 하나라도 빼면 유일성이 깨진다. 다른 후보키의 속성 개수와 비교하는 것이 아니다\n- 예: {학번}은 후보키, {학번, 이름}은 이름을 빼도 식별되므로 슈퍼키(최소성 X)\n\n| 키 | 유일성 | 최소성 | 설명 |\n|---|---|---|---|\n| 슈퍼키 | O | X | 튜플을 유일하게 식별하는 속성(집합) |\n| 후보키 | O | O | 더 뺄 속성이 없는 슈퍼키 |\n| 기본키 | O | O | 후보키 중 선택한 하나. NULL·중복 불가 |\n| 대체키(보조키) | O | O | 기본키로 뽑히지 않은 나머지 후보키 |\n| 외래키 | - | - | 다른 릴레이션의 기본키를 참조 |\n- 포함 관계: 기본키 + 대체키 = 후보키 ⊂ 슈퍼키"},{"id":"db-022","subject":"db","topic":"관계 모델","sub":"키","type":"blank","past":"2024-3","level":3,"q":"다음은 키의 종류에 대한 설명이다. ①~④에 해당하는 키를 \u003c보기>에서 골라 쓰시오.","box":"① 한 릴레이션의 속성 중 다른 릴레이션의 기본키를 참조하는 속성. 릴레이션 간의 관계를 표현한다.\n② 튜플을 유일하게 식별할 수 있는 속성의 최소 집합. 유일성과 최소성을 모두 만족한다.\n③ ②에 해당하는 키가 둘 이상일 때, 기본키로 선택되지 않고 남은 키.\n④ 유일성은 만족하지만 최소성은 만족하지 않을 수 있는 키.","options":["ㄱ. 슈퍼키","ㄴ. 외래키","ㄷ. 대체키","ㄹ. 후보키","ㅁ. 기본키"],"answers":[{"label":"①","accept":["외래키","ㄴ","Foreign Key","FK","외부키"]},{"label":"②","accept":["후보키","ㄹ","Candidate Key"]},{"label":"③","accept":["대체키","ㄷ","Alternate Key","보조키"]},{"label":"④","accept":["슈퍼키","ㄱ","Super Key","수퍼키"]}],"hint":"유일성과 최소성을 둘 다 갖췄는지, 하나만 갖췄는지로 가른다. 다른 테이블을 가리키는 키는 따로 논다","explain":"정답: ① 외래키 ② 후보키 ③ 대체키 ④ 슈퍼키\n- 함정 보기: 기본키는 '후보키 중 **선택된 하나**'. 남은 것이 대체키다\n- 외래키 값은 참조하는 기본키 값 중 하나이거나 NULL이어야 한다(참조 무결성)\n\n| 키 | 유일성 | 최소성 | 설명 |\n|---|---|---|---|\n| 슈퍼키 | O | X | 튜플을 유일하게 식별하는 속성(집합) |\n| 후보키 | O | O | 더 뺄 속성이 없는 슈퍼키 |\n| 기본키 | O | O | 후보키 중 선택한 하나. NULL·중복 불가 |\n| 대체키(보조키) | O | O | 기본키로 뽑히지 않은 나머지 후보키 |\n| 외래키 | - | - | 다른 릴레이션의 기본키를 참조 |\n- 포함 관계: 기본키 + 대체키 = 후보키 ⊂ 슈퍼키"},{"id":"db-023","subject":"db","topic":"관계 모델","sub":"키","type":"calc","level":2,"q":"다음 \u003c사원> 릴레이션에서 사번과 이메일은 각각 값이 겹치지 않도록 관리되고, 이름과 부서는 값이 겹칠 수 있다. ①~③에 답하시오.","box":"| 사번 | 이메일 | 이름 | 부서 |\n|---|---|---|---|\n| E1 | kim1@co.kr | 김철수 | 개발 |\n| E2 | lee@co.kr | 이영희 | 영업 |\n| E3 | kim2@co.kr | 김철수 | 개발 |\n| E4 | park@co.kr | 박민지 | 영업 |\n\n① 이 릴레이션의 후보키 개수\n② {사번, 이름}은 슈퍼키, 후보키, 기본키, 대체키 중 무엇인가\n③ 사번을 기본키로 정했을 때 이메일은 무엇인가","answers":[{"label":"①","accept":["2","2개"]},{"label":"②","accept":["슈퍼키","Super Key","수퍼키"]},{"label":"③","accept":["대체키","Alternate Key","보조키"]}],"hint":"속성을 하나 빼 봤을 때도 식별되는지 본다","explain":"정답: ① 2 ② 슈퍼키 ③ 대체키\n- ① 후보키 = {사번}, {이메일} → 2개. {이름, 부서}는 (김철수, 개발)이 두 번 나와 유일성부터 깨진다\n- ② {사번, 이름}: 이름을 빼도 사번만으로 식별된다 → 유일성 O, 최소성 X → **슈퍼키**\n- ③ 사번이 기본키가 되면 남은 후보키 이메일은 **대체키**\n- 함정: '속성이 하나뿐인 키만 후보키'가 아니다. 복합 속성도 최소성을 만족하면 후보키다\n\n| 키 | 유일성 | 최소성 | 설명 |\n|---|---|---|---|\n| 슈퍼키 | O | X | 튜플을 유일하게 식별하는 속성(집합) |\n| 후보키 | O | O | 더 뺄 속성이 없는 슈퍼키 |\n| 기본키 | O | O | 후보키 중 선택한 하나. NULL·중복 불가 |\n| 대체키(보조키) | O | O | 기본키로 뽑히지 않은 나머지 후보키 |\n| 외래키 | - | - | 다른 릴레이션의 기본키를 참조 |\n- 포함 관계: 기본키 + 대체키 = 후보키 ⊂ 슈퍼키"},{"id":"db-024","subject":"db","topic":"관계 모델","sub":"무결성","type":"short","past":"2024-3","level":3,"q":"다음 \u003c학생> 릴레이션의 기본키는 StudentID이다. 이 릴레이션이 위반한 무결성 제약 조건을 쓰시오.","box":"| StudentID | Name | Major |\n|---|---|---|\n| 101 | Kim | CS |\n| 102 | Lee | EE |\n| 101 | Park | ME |\n| NULL | Choi | CS |","answers":[{"label":"답","accept":["개체 무결성","Entity Integrity","개체"]}],"hint":"기본키 칸만 본다","explain":"정답: 개체 무결성\n- 단서: 기본키 StudentID에 101이 **중복**되고, 마지막 튜플은 기본키가 **NULL**이다\n- 개체 무결성 = 기본키는 NULL도 중복도 안 된다\n- 헷갈리는 것: 참조 무결성은 **외래키** 문제다. 이 표에는 다른 테이블을 참조하는 속성이 없다\n- 키 무결성(같은 키 값 중복 금지)과 겹쳐 보이지만, 기본키의 NULL까지 함께 금지하는 규칙은 개체 무결성이다. 기출 정답도 개체 무결성\n\n| 무결성 | 규칙 | SQL 구현 |\n|---|---|---|\n| 개체 | 기본키는 NULL·중복 불가 | PRIMARY KEY |\n| 참조 | 외래키는 참조 대상 기본키 값이거나 NULL | FOREIGN KEY |\n| 도메인 | 속성 값은 정의된 도메인(타입·범위) 안 | CHECK, DOMAIN, DEFAULT |\n| 사용자 정의 | 업무 규칙(사용자가 정한 제약)을 지킨다 | 트리거, CHECK |\n| 키 | 한 릴레이션에 키가 적어도 하나 있어야 하고, 같은 키 값을 가진 튜플은 허용하지 않는다 | UNIQUE |\n| NULL | 특정 속성은 NULL 불가 | NOT NULL |\n| 고유 | 특정 속성
