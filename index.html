)\nprint(②(g), ②(g))\nrest = [x for x in g]\nprint(rest)\nprint(list(g))"},"answers":[{"label":"①","accept":["yield"]},{"label":"②","accept":["next"]}],"hint":"함수를 끝내지 않고 값을 하나씩 내보내는 키워드, 그 값을 하나 꺼내는 내장 함수","explain":"- ① `yield`: 값을 내보내고 그 자리에서 함수 실행을 멈춰 둔다. 다음 요청이 오면 멈춘 곳부터 이어서 실행\n  - return이면 첫 값에서 함수가 끝나고 제너레이터가 되지 않는다\n- ② `next(g)`: 다음 yield까지 실행해 값 하나를 받는다 → 2, 3\n- for-else: 나누어떨어지는 d가 없으면(break 없음) else가 실행 → 소수만 yield\n  - n = 2는 range(2, 2)가 비어 있어 바로 else\n- 리스트 컴프리헨션이 남은 값 5, 7, 11, 13, 17, 19를 모두 꺼낸다 → 제너레이터 소진\n- 소진된 g로 list(g) → []\n- **함정 요약**: 제너레이터는 한 번 다 꺼내면 처음부터 다시 돌지 않는다.\n- 일반 규칙\n  - 제너레이터 함수를 호출하면 본문은 실행되지 않고 제너레이터 객체만 만들어진다\n  - 소진된 뒤 next()는 StopIteration\n  - `(x * 2 for x in data)` 제너레이터 식도 같은 규칙"},{"id":"code-p019","subject":"code","topic":"Python","sub":"strip·split·join","type":"blank","past":"2023-3","level":3,"q":"다음 Python 프로그램이 \u003c실행 결과>처럼 출력되도록 ①~③에 들어갈 문자열 메서드 이름을 쓰시오.","box":"**\u003c실행 결과>**\n```\n['12', '7', ' 30 ', '5']\n[12, 7, 30, 5] 54\n5\u003c7\u003c12\u003c30\n```\n- ①~③은 모두 str 메서드 이름이다.","code":{"lang":"python","src":"raw = \"  12,7, 30 ,5  \"\nparts = raw.①().②(\",\")\nnums = [int(p) for p in parts]\nprint(parts)\nprint(nums, sum(nums))\nline = \"\u003c\".③(str(n) for n in sorted(nums))\nprint(line)"},"answers":[{"label":"①","accept":["strip"]},{"label":"②","accept":["split","rsplit"]},{"label":"③","accept":["join"]}],"hint":"양쪽 공백 지우기 → 구분자로 자르기 → 구분자로 잇기","explain":"- ① `strip()`: 양쪽 공백 제거 → \"12,7, 30 ,5\"\n  - lstrip이면 끝에 '5  ', rstrip이면 앞에 '  12'가 남아 첫 줄과 달라진다\n- ② `split(\",\")`: 쉼표에서만 자르고 조각 안의 공백은 그대로 → ' 30 '이 남는다 (rsplit(\",\")도 결과 같음)\n- `int(\" 30 \")`은 앞뒤 공백을 무시해 30 → 합 54\n- ③ `\"\u003c\".join(...)`: `구분자.join(문자열 묶음)`. 원소가 문자열이어야 해서 str(n)으로 바꿔 넘긴다\n- **함정 요약**: join은 리스트가 아니라 구분자 문자열의 메서드다.\n- 일반 규칙\n  - `split()` (인자 없음): 공백 덩어리 기준, 빈 문자열 안 생김\n  - `split(\",\")`: 그 문자 기준, 연속이면 빈 문자열이 생김\n  - 기출(2023-3)은 `num1, num2 = input().split()`의 split을 빈칸으로 냈다"},{"id":"code-p020","subject":"code","topic":"Python","sub":"진법 변환 재귀·연산자","type":"blank","level":2,"q":"다음 Python 프로그램이 \u003c실행 결과>처럼 출력되도록 ①, ②에 들어갈 연산자를 쓰시오.","box":"**\u003c실행 결과>**\n```\n11111101010 / 3752 / 7EA\n2026 45\n```\n- ①, ②에는 각각 산술 연산자 하나가 들어간다.","code":{"lang":"python","src":"DIGITS = \"0123456789ABCDEF\"\n\ndef to_base(n, b):\n    if n \u003c b:\n        return DIGITS[n]\n    return to_base(n // b, b) + DIGITS[n ① b]\n\ndef from_base(s, b):\n    total = 0\n    for k, ch in enumerate(s[::-1]):\n        total += DIGITS.index(ch) * b ② k\n    return total\n\nresult = []\nfor base in (2, 8, 16):\n    result.append(to_base(2026, base))\nprint(*result, sep=\" / \")\nprint(from_base(result[2], 16), from_base(\"101101\", 2))"},"answers":[{"label":"①","accept":["%"]},{"label":"②","accept":["**"]}],"hint":"나머지가 그 자리 글자가 되고, 자리 번호만큼 밑을 거듭 곱한다","explain":"- to_base: 몫(n // b)으로 재귀하고, 나머지(① `%`)가 맨 끝 자리 글자가 된다. 재귀 결과 뒤에 붙이므로 높은 자리부터 이어진다\n\n| 진법 | 2026 변환 |\n|---|---|\n| 2 | 11111101010 |\n| 8 | 3752 |\n| 16 | 7EA (7 × 256 + 14 × 16 + 10) |\n\n- `print(*result, sep=\" / \")`: 리스트를 풀어 인자 3개로 넘긴다\n- from_base: 문자열을 뒤집어 k = 0(일의 자리)부터 `자릿값 × b의 k제곱`을 더한다 → ② 거듭제곱 연산자\n  - \"7EA\" → 10 × 1 + 14 × 16 + 7 × 256 = 2026\n  - \"101101\" → 32 + 8 + 4 + 1 = 45\n- **함정 요약**: `^`는 거듭제곱이 아니라 XOR이다. ①에 `//`를 넣으면 몫이 붙어 틀린다.\n- 일반 규칙\n  - 진법 변환은 나머지를 거꾸로 읽는다 (재귀면 뒤에 붙이면 된다)\n  - 거듭제곱은 연산자 또는 pow(b, k)\n  - `DIGITS.index(ch)`는 글자의 위치 = 그 자리 값"}]</script>
<script id="cdata" type="application/json">[{"key":"overview","title":"정보처리기사 실기 이론 압축본","intro":"⭐ 핵심 / 🔥 보조 / 🤔 후순위 (정처기 감자 2026년 3회 압축 범위 기준).\n과목별 예상 문제 수: DB 1~2 · 네트워크/OS 2~4 · SW 개발 1~2 · SW 설계 1~3 · 보안 1~3.\n기출 표기 `(23-2)` = 2023년 2회에 나옴.","sections":[{"title":"0. 반복 출제 (2023 ~ 2026년 2회, 11회차)","short":"반복 출제","level":0,"md":"\n| 주제 | 횟수 | 최근 |\n|---|---|---|\n| 디자인 패턴 | 9 | 26-2 Abstract Factory, 26-1 Bridge·Observer, 25-2 Proxy |\n| 테스트 커버리지 | 7 | 25-3 조건, 25-2 분기 경로 |\n| 서브넷·IP 계산 | 6 | 26-2 프리픽스 /28·라우터 IP, 26-1 /23 |\n| 응집도·결합도 | 6 | 26-2 내용 결합도, 26-1 절차·교환·기능 응집도 |\n| 관계 모델 용어 | 5 | 25-3 튜플·릴레이션 인스턴스·카디널리티 |\n| 보안 프로토콜·VPN | 5 | 25-2 SSH, 24-3 VPN, 23-1 L2TP |\n| 관계대수·조인 | 4 | 25-3 ÷ 결과, 25-2 π 결과, 24-1 세타·동등·자연 조인 |\n| 라우팅 프로토콜 | 4 | 26-2 OSPF, 24-2 RIP 경로 |\n| 스케줄링 계산 | 4 | 26-2 SRT 6.5, 25-2 RR 11.75 |\n| 무결성 · 오류 제어 · 교환 방식 · 인증 · 악성코드 · DoS | 각 3 | |\n\n- 수치·그림까지 그대로 다시 나온다: 26-2 SRT ← 24-2, 26-2 라우터 IP·3NF ← 24-1, 26-1 HDLC ← 23-2, 25-3 오류 제어 ← 23-2.\n- 최근 경향: 계산형 증가(서브넷 5회 중 4회), SQL 결과 추적 매회 2문항, 코드는 7문항으로 줄고 Python 2~3문항.","topics":[]},{"title":"출처","short":"출처","level":0,"md":"\n- 우선순위와 과목별 출제 수: [정처기 감자 이론 압축 공부법](https://jeongcheogi.edugamja.com/theory/theory-expected-questions) (2026년 3회 기준)\n- 회차 출제 예: [문어CBT 2025년 3회 복원](https://www.sqldpass.com/blog/past-exam/engineer-2025-3)\n- 개념 내용: AI 정리. 헷갈리는 항목은 기출 해설로 확인\n- 보완 대조 자료 (2026-10-19)\n  - 기출 2020 ~ 2026년 2회 21회차: [문어CBT](https://www.sqldpass.com/past-exams?cert=ENGINEER_PRACTICAL), [chobopark](https://chobopark.tistory.com/561), 정처기 감자 회차 리뷰, velog 복원 글\n  - [Q-Net 2026 출제기준](https://www.q-net.or.kr) 정보처리기사 실기\n  - 정답 논란: 26-1 비기능 요구사항 ①(운영 / 이식성), 21-2 럼바우 ③(Object / Information), 20-4 회복 기법(즉시 갱신 / 로그 기반)","topics":[]}]},{"key":"design","title":"SW 설계 (1~3문제, 다 맞추기)","intro":"⭐ 핵심 / 🔥 보조 / 🤔 후순위 · 기출 표기 `(23-2)` = 2023년 2회에 나옴","sections":[{"title":"⭐ 디자인 패턴 (GoF 23)","short":"디자인 패턴","level":3,"md":"\n설명을 읽고 패턴 이름이나 분류(생성, 구조, 행위)를 쓴다\n\n**생성 (5)**: 객체를 어떻게 만들지\n\n| 패턴 | 뜻 |\n|---|---|\n| **Singleton** | 인스턴스 하나만, 전역 접근점 |\n| **Factory Method** | 생성을 서브클래스에 맡김 (가상 생성자) |\n| **Abstract Factory** | 관련 객체 묶음(제품군)을 구체 클래스 없이 생성 |\n| **Builder** | 복잡한 객체를 단계별로 조립, 같은 과정으로 다른 표현 |\n| **Prototype** | 원본을 복제(clone)해서 생성 |\n\n**구조 (7)**: 클래스·객체를 어떻게 조합할지\n\n| 패턴 | 뜻 |\n|---|---|\n| **Adapter** | 호환 안 되는 인터페이스를 맞춰 줌 |\n| **Bridge** | 기능 계층과 구현 계층을 분리해 따로 확장 |\n| **Composite** | 부분-전체 트리, 단일·복합 객체를 똑같이 다룸 |\n| **Decorator** | 객체에 기능을 동적으로 덧붙임 |\n| **Facade** | 복잡한 서브시스템에 단순한 창구 하나 |\n| **Flyweight** | 공유로 메모리 절약 (같은 객체 재사용) |\n| **Proxy** | 대리 객체가 접근 제어·지연 로딩 |\n\n**행위 (11)**: 객체끼리 책임·통신\n\n| 패턴 | 뜻 |\n|---|---|\n| **Chain of Responsibility** | 요청을 처리할 수 있을 때까지 다음 객체로 넘김 |\n| **Command** | 요청을 객체로 캡슐화 (실행 취소, 큐잉) |\n| **Interpreter** | 언어 문법을 클래스로 표현해 해석 |\n| **Iterator** | 내부 구조 노출 없이 순차 접근 |\n| **Mediator** | 객체 간 통신을 중재자 하나로 모음 |\n| {{nx}}**Memento** | 상태를 저장했다가 복원 (Undo) |\n| **Observer** | 상태가 바뀌면 의존 객체들에 자동 통지 (1:N) |\n| **State** | 상태마다 행동을 다른 객체로, 상태에 따라 행위 변경 |\n| **Strategy** | 알고리즘군을 캡슐화해 바꿔 끼움 |\n| **Template Method** | 골격은 상위 클래스, 세부 단계는 하위 클래스 |\n| **Visitor** | 구조는 그대로 두고 새 연산을 외부에서 추가 |\n\n> [!warning] 헷갈리는 것\n> - 바꿔 끼우기\n>   - **Strategy**: 알고리즘 자체를 골라 교체\n>   - **State**: 상태 객체가 바뀌면서 행위가 따라 바뀜\n>   - **Template Method**: 골격은 고정, 일부 단계만 하위 클래스가 채움\n> - 감싸기\n>   - **Adapter**: 인터페이스를 바꿔서 맞춤\n>   - **Decorator**: 인터페이스는 그대로, 기능을 덧붙임\n>   - **Proxy**: 인터페이스는 그대로, 접근을 막거나 미룸\n> - 생성\n>   - **Factory Method**: 객체 하나, 무엇을 만들지 서브클래스가 정함\n>   - **Abstract Factory**: 관련 객체 묶음(제품군)을 한 벌로 생성\n> - 통신\n>   - **Observer**: 1:N, 바뀌면 의존 객체에 자동 통지\n>   - **Mediator**: 얽힌 객체 간 통신을 중재자 하나가 맡음\n> - 되돌리기\n>   - **Command**: 요청을 객체로 남겨 실행 취소\n>   - **Memento**: 상태를 저장해 두었다 복원\n\n기출: (24-2) 설명 → Iterator, (24-3) 분류 → 행위, (25-1) 설명 → Adapter, (25-2) 설명 → Proxy, (26-1) 빈칸 두 개 → Bridge·Observer","topics":["디자인 패턴"]},{"title":"⭐ 응집도·결합도","short":"응집도·결합도","level":3,"md":"\n응집도는 강할수록, 결합도는 약할수록 좋은 모듈\n\n응집도 강 → 약: **기능 → 순차 → 교환(통신) → 절차 → 시간 → 논리 → 우연**\n\n| 단계 | 뜻 | 판별 단서 |\n|---|---|---|\n| **기능** | 하나의 기능만 | 단일 문제, 단일 기능 |\n| **순차** | 앞 출력이 다음 입력 | 출력 → 입력으로 이어짐 |\n| **교환(통신)** | 같은 입력·출력 데이터를 씀 | 동일 입출력, 서로 다른 기능 |\n| **절차** | 정해진 순서대로 | 순서대로 수행 |\n| **시간** | 같은 시점에 실행 | 초기화, 특정 시간 |\n| **논리** | 비슷한 성격끼리 묶음 | 유사한 성격, 같은 형태로 분류 |\n| **우연** | 관계없음 | 서로 관련 없는 요소 |\n\n결합도 약 → 강: **자료 → 스탬프 → 제어 → 외부 → 공통 → 내용**\n\n| 단계 | 뜻 | 판별 단서 |\n|---|---|---|\n| **자료** | 값만 넘김 | 자료 요소(값)만 전달 |\n| **스탬프** | 자료구조(배열·레코드) 넘김 | 배열, 레코드 |\n| **제어** | 제어 플래그로 상대 흐름 조정 | 제어 신호, 권리 전도 |\n| **외부** | 외부에 선언된 데이터·형식 참조 | 다른 모듈이 선언한 데이터 참조 |\n| **공통** | 전역 변수 공유 | 전역, 공유 데이터 영역 |\n| **내용** | 다른 모듈 내부를 직접 참조·수정 | 내부를 직접 건드림 |\n\n> [!tip] 외우기\n> 응집도 강 → 약: 기순교절시논우\n> 결합도 약 → 강: 자스제외공내\n\n> [!warning] 헷갈리는 것\n> - **순차**: 출력 데이터가 다음 활동의 입력으로 넘어감\n> - **절차**: 순서만 정해짐, 데이터는 안 넘김\n>\n> - **팬인**(fan-in): 나를 호출하는 모듈 수\n> - **팬아웃**(fan-out): 내가 호출하는 모듈 수","topics":["응집도·결합도"]},{"title":"⭐ UML","short":"UML","level":3,"md":"\n다이어그램 분류와 관계 표기(선, 마름모, 삼각형)를 맞힌다\n\n| 분류 | 다이어그램 |\n|---|---|\n| **구조(정적)** | 클래스, 객체, 컴포넌트, 배치, 복합체 구조, **패키지** |\n| **행위(동적)** | 유스케이스, **시퀀스**, 커뮤니케이션, **상태**, **활동**, 타이밍, 상호작용 개요 |\n\n| 관계 | 표기 | 뜻 |\n|---|---|---|\n| **연관** | 실선 | 서로 관련 있음 |\n| **집합**(aggregation) | 빈 마름모 | 부분이 따로 존재 가능 |\n| **포함**(composition) | 채운 마름모 | 전체와 생명주기 같음 |\n| **일반화** | 실선 + 빈 삼각형 | 상속 |\n| **실체화** | 점선 + 빈 삼각형 | 인터페이스 구현 |\n| **의존** | 점선 화살표 | 잠깐 사용 |\n\n![](data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAb0AAAGHCAYAAAAkz4yPAAAAAXNSR0IArs4c6QAAAERlWElmTU0AKgAAAAgAAYdpAAQAAAABAAAAGgAAAAAAA6ABAAMAAAABAAEAAKACAAQAAAABAAABvaADAAQAAAABAAABhwAAAAD17LW2AABAAElEQVR4Aey9B3hdx3E2/KJ3gOiNaAR7772KXZWierMkdznuLU7yfN+f5EvixIntJC6SLVmyJMuqlCiJEin23nuvIAgQJAhW9I77v7Pn7sXB5QUIXBAgQeySB2fP7uzs7GyZ3dnZvT4OOhhnOGA4YDhgOGA40A044NsNymiKaDhgOGA4YDhgOKA4YISeaQiGA4YDhgOGA92GA0bodZuqNgU1HDAcMBwwHDBCz7QBwwHDAcMBw4FuwwEj9LpNVZuCGg4YDhgOGA4YoWfagOGA4YDhgOFAt+GAEXrdpqpNQQ0HDAcMBwwHjNAzbcBwwHDAcMBwoNtwwN/bkuoz7T4+PhB/Q0M9Hwfk2+7c4ezx7nE6ncYp3+5+CfOUTsO1hN8TjOATp3FaX1a+7uH29AJvz0vDN
